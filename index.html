{d:49,wk:9,ph:'지휘 언어',t:'지휘=언어 + 문법 전통',lead:'지휘는 약속된 코드예요. 유창해야 연주자가 알아들어요.',concept:'<p>지휘는 연주자와 <b>공유된 코드(약속)</b>예요. 이 언어가 유창해야 연주자가 망설임 없이 알아들어요.</p><table class="ctbl"><tr><th>요소</th><th>뜻</th></tr><tr><td>예비박</td><td>첫 소리 한 박 전 예고 (들숨+템포·세기)</td></tr><tr><td>익투스(ictus)</td><td>박이 떨어지는 점 = 최저점</td></tr><tr><td>반동(rebound)</td><td>익투스 후 튀어 올라 다음 박 성격 예고</td></tr><tr><td>커트오프</td><td>소리를 끊는 작은 고리</td></tr><tr><td>데드 제스처</td><td>소리 없이 쉬는 동작</td></tr></table><svg class="cdia" viewBox="0 0 320 116"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">한 박의 흐름 — 예비 · 익투스 · 반동</text><line x1="16" y1="92" x2="305" y2="92" stroke="#75818b" stroke-width="1"/><path d="M30,40 C60,55 80,86 105,88 C130,86 150,52 185,42" fill="none" stroke="#6fe9cd" stroke-width="2.4"/><circle cx="105" cy="88" r="4.5" fill="#ff8575"/><circle cx="30" cy="40" r="4" fill="#a2b3de"/><circle cx="185" cy="42" r="4" fill="#f5d18f"/><text x="30" y="30" text-anchor="middle" font-size="9" fill="#a2b3de">예비박</text><text x="105" y="108" text-anchor="middle" font-size="9.5" fill="#ff8575" font-weight="700">익투스(최저점)</text><text x="200" y="34" font-size="9" fill="#f5d18f">반동 → 다음 박</text></svg><p><b>해석 · </b>막스 루돌프는 박자 도형·예비박·커트오프를 <b>문법</b>처럼 체계화했고, 엘리자베스 그린은 "<b>박의 명료함이 아니라 의도의 명료함</b>"을 모토로 삼았어요. 어휘가 몸에 배어야 음악에 집중할 수 있습니다.</p><div class="cnote"><b>지휘 함의 · </b>익투스(최저점)를 또렷이 찍고, 반동 크기로 다음 박을 예고하세요. 이 기초는 <b>참고사전 → 지휘 언어 탭</b>에서 매일 확인할 수 있어요.</div><p class="warn">박자표\u00b7겹박자 같은 기본은 <b>19일차</b>에서 다뤘어요. 여기서는 그 위에 얹히는 <b>지휘 언어</b>를 봅니다.</p>',think:['지휘가 언어라면 방언·억양도 있을까 — 지휘자마다 다른 몸의 억양을 어디까지 허용해야 할까?','예비박 없는 시작(무예고)이 필요한 음악적 순간이 있을까?'],listen:['카를로스 클라이버 「박쥐」 서곡 영상','몸이 말이 되는 순간 — 소리를 끄고 한 번, 켜고 한 번 보세요.'],read:[
'박자 도형·예비박·큐 = 연주자와 공유된 코드','막스 루돌프 『지휘의 문법』: 박자 도형·예비박·커트오프를 문법처럼','엘리자베스 그린: "박의 명료함이 아니라 의도의 명료함"','공유 어휘: 예비박·익투스(박점)·반동·데드 제스처'],
q:[mc('그린의 지휘 모토는?',['빠른 박','의도의 명료함','큰 동작','정확한 박만'],1,'Clarity of intent, not just clarity of beat.'),
sa('박이 떨어지는 정확한 점을 뭐라 하나?','익투스 (ictus, 박점)','연주자가 여기에 맞춤.'),
mc('『지휘의 문법』을 쓴 사람은?',['그린','막스 루돌프','말코','라반'],1,'박자 도형을 문법처럼 체계화.')],
task:'거울 앞에서 4박 도형을 천천히 그려보고 익투스가 또렷한지 확인.',hand:'같은 악구를 "말하듯" 지휘 — 문장 끝에서 손을 내려 마침표를 찍기.'},

{d:50,wk:9,ph:'지휘 언어',t:'제스처 기호학',lead:'지휘 동작이 뜻을 전하는 세 갈래 — 상징·지표·도상.',concept:'<p>지휘 동작이 뜻을 전하는 <b>세 갈래</b>예요. 좋은 지휘는 이 셋을 겹쳐 씁니다.</p><table class="ctbl"><tr><th>기호</th><th>설명</th><th>예</th></tr><tr><td>상징(symbolic)</td><td>자의적 약속</td><td>4박 도형</td></tr><tr><td>지표(indexical)</td><td>무언가를 가리킴</td><td>큐(시선+손)</td></tr><tr><td>도상(iconic)</td><td>소리의 모양을 닮음</td><td>레가토 곡선·스타카토 점</td></tr></table><p><b>해석 · </b>4박 도형은 모양에 필연성 없는 <b>약속(상징)</b>이고, 큐는 특정 주자를 <b>가리키는(지표)</b> 동작이며, 레가토의 이어진 곡선은 소리 형태를 <b>닮은(도상)</b> 동작이에요. 셋이 겹칠수록 전달이 풍부해집니다.</p><div class="cnote"><b>지휘 함의 · </b>레가토·스타카토·크레셴도를 <b>도상적</b>으로(소리 모양대로) 그리면 말보다 빠르게 전해져요.</div>',think:['도상(소리를 닮은 동작)이 강력한 이유 — 말보다 빠른 소통의 조건은 무엇일까?','같은 큐를 시선으로만·손으로만·둘 다로 줄 때 연주자의 반응은 어떻게 다를까? 직접 실험해보기.'],listen:['번스타인 지휘 영상 (아무 곡이나)','눈썹으로 지휘하는 순간 찾기 — 손이 아닌 곳에서 나오는 음악.'],read:[
'상징(symbolic): 자의적 약속 — 4박 도형','지표(indexical): 가리킴 — 큐(시선+손), 다이내믹 방향','도상(iconic): 음악 모양 그리기 — 레가토 곡선·스타카토 점','좋은 지휘는 셋을 겹쳐 씀'],
q:[mc('4박 도형은 어떤 기호에 해당?',['상징','지표','도상','없음'],0,'모양에 필연성 없는 자의적 약속.'),
sa('특정 주자에게 시선+손을 향하는 큐는 어떤 기호?','지표(indexical)','무언가를 가리킴.'),
mc('레가토의 이어진 곡선처럼 소리 모양을 닮은 동작은?',['상징','지표','도상','반동'],2,'iconic. 동작이 소리 형태를 닮음.')],
task:'레가토·스타카토·크레셴도를 각각 도상적 동작으로 손으로 그려보기.',hand:'제스처 하나를 골라 뜻이 전달되는지 확인 — 옆 사람이 무엇을 요구하는지 맞히게.'},

{d:51,wk:9,ph:'지휘 언어',t:'라반 에포트',lead:'음악 의도를 몸의 문법으로 옮기는 틀. 무게·시간·공간·흐름.',concept:'<p>음악 의도를 <b>몸의 문법</b>으로 옮기는 틀이에요. 네 요소의 조합으로 동작의 성격이 정해집니다.</p><table class="ctbl"><tr><th>요소</th><th>양극</th></tr><tr><td>무게</td><td>가벼움 ↔ 강함</td></tr><tr><td>시간</td><td>지속 ↔ 급격</td></tr><tr><td>공간</td><td>간접 ↔ 직접</td></tr><tr><td>흐름</td><td>자유 ↔ 억제</td></tr></table><svg class="cdia" viewBox="0 0 320 138"><text x="160" y="15" text-anchor="middle" font-size="10" fill="#a7b4bc">라반 에포트 — 4요소의 양극</text><text x="10" y="40" font-size="9" fill="#6fe9cd" font-weight="700">무게</text><line x1="66" y1="36" x2="248" y2="36" stroke="#75818b" stroke-width="1.4"/><circle cx="66" cy="36" r="3" fill="#a2b3de"/><circle cx="248" cy="36" r="3" fill="#a2b3de"/><text x="70" y="32" font-size="8.5" fill="#a7b4bc">가벼움</text><text x="244" y="32" text-anchor="end" font-size="8.5" fill="#a7b4bc">강함</text><text x="10" y="66" font-size="9" fill="#6fe9cd" font-weight="700">시간</text><line x1="66" y1="62" x2="248" y2="62" stroke="#75818b" stroke-width="1.4"/><circle cx="66" cy="62" r="3" fill="#a2b3de"/><circle cx="248" cy="62" r="3" fill="#a2b3de"/><text x="70" y="58" font-size="8.5" fill="#a7b4bc">지속</text><text x="244" y="58" text-anchor="end" font-size="8.5" fill="#a7b4bc">급격</text><text x="10" y="92" font-size="9" fill="#6fe9cd" font-weight="700">공간</text><line x1="66" y1="88" x2="248" y2="88" stroke="#75818b" stroke-width="1.4"/><circle cx="66" cy="88" r="3" fill="#a2b3de"/><circle cx="248" cy="88" r="3" fill="#a2b3de"/><text x="70" y="84" font-size="8.5" fill="#a7b4bc">간접</text><text x="244" y="84" text-anchor="end" font-size="8.5" fill="#a7b4bc">직접</text><text x="10" y="118" font-size="9" fill="#6fe9cd" font-weight="700">흐름</text><line x1="66" y1="114" x2="248" y2="114" stroke="#75818b" stroke-width="1.4"/><circle cx="66" cy="114" r="3" fill="#a2b3de"/><circle cx="248" cy="114" r="3" fill="#a2b3de"/><text x="70" y="110" font-size="8.5" fill="#a7b4bc">자유(파시브)</text><text x="244" y="110" text-anchor="end" font-size="8.5" fill="#a7b4bc">억제(악티브)</text><text x="160" y="132" text-anchor="middle" font-size="8.5" fill="#75818b">앞 셋의 조합 = 8 기본 에포트</text></svg><p><b>해석 · </b>무게·시간·공간의 조합이 <b>8 기본 에포트</b>(펀치·글라이드·대브 등)를 만들고, <b>흐름</b>(억제↔자유)이 악티브/파시브를 가릅니다. 점이 또렷하면 악티브(억제), 흐리면 파시브(자유)예요.</p><div class="cnote"><b>지휘 함의 · </b>추상적인 "표현"을 <b>무게·시간·공간·흐름</b>의 좌표로 옮기면 막연함이 사라져요. "이건 가볍고 지속되며 점이 흐린 동작" 식으로.</div>',think:['라반의 네 요소로 내 평소 걸음걸이를 분석해보기 — 내 몸의 기본 에포트는?','같은 포르테도 펀치와 프레스는 달라요. 곡에서 두 포르테를 구별해 쓰는 기준은?'],listen:['발레 「백조의 호수」 2막 한 장면','무게·시간·공간·흐름을 무용수의 몸에서 읽기 — 지휘의 스승은 무용이에요.'],read:[
'4요소: 무게(가벼움↔강함)·시간(지속↔급격)·공간(간접↔직접)·흐름(자유↔억제)','8 기본 에포트: 무게·시간·공간의 조합','흐름(억제↔자유)=악티브/파시브를 가름','점 또렷=악티브(억제), 흐림=파시브(자유)'],
q:[mc('악티브/파시브를 가르는 라반 요소는?',['무게','시간','공간','흐름'],3,'흐름 억제(bound)=악티브, 자유(free)=파시브.'),
sa('라반 에포트의 네 요소를 쓰시오.','무게·시간·공간·흐름','앞 셋의 조합이 8 기본 에포트.'),
mc('강·급격의 조합인 "펀치" 에포트에 해당하는 지휘는?',['레가토','마르카토','테누토','파시브'],1,'바닥서 꽝, 점 크고 또렷.')],
task:'"마르카토=펀치", "레가토=글라이드"를 손으로 각각 재현해보기.',hand:'라반 에포트 네 요소를 각각 한 마디씩 — 무게·시간·공간·흐름을 손으로 분리.'},

{d:52,wk:9,ph:'지휘 언어',t:'에포트 번역표',lead:'의도→느낌→동작→에포트로 옮기면 막연함이 사라져요.',concept:'<p>의도 → 느낌 → 동작 → 에포트로 옮기면 표현이 <b>구체적인 동작</b>이 돼요.</p><table class="ctbl"><tr><th>주법</th><th>느낌</th><th>에포트</th></tr><tr><td>마르카토</td><td>못 박듯, 점 또렷</td><td>펀치(강·급격·직접)</td></tr><tr><td>스타카토</td><td>콕 찍고 멈춤</td><td>대브(가벼움·급격)</td></tr><tr><td>테누토</td><td>눌러 끌기</td><td>프레스(강·지속)</td></tr><tr><td>레가토</td><td>미끄러지듯</td><td>글라이드(가벼움·지속·자유)</td></tr></table><p><b>해석 · </b>순서는 <b>비유 → 점이 또렷한가 → 무게·시간</b>이에요. "이 악구는 레가토(가볍고 지속, 점 흐림)" 하고 에포트 좌표로 적으면 손이 저절로 따라옵니다. <b>예비박</b>도 받을 박의 에포트를 한 박 먼저 담는 거예요.</p><div class="cnote"><b>지휘 함의 · </b>한 악구를 정해 "마르카토=펀치 / 레가토=글라이드"처럼 에포트로 번역해 손으로 재현해보세요.</div>',think:['번역표를 뒤집어 동작에서 소리를 상상하는 연습은 지휘에 어떤 힘을 줄까?','언어로 표현이 안 되는 음악적 의도를 몸이 먼저 아는 경험이 있었다면 떠올려보기.'],listen:['좋아하는 연주 영상 하나','소리를 끄고 지휘자의 동작만으로 음악을 상상 — 그다음 소리를 켜서 대조해보세요.'],read:[
'마르카토: 못 박듯, 점 또렷(악티브)=펀치','스타카토: 콕 찍고 멈춤=대브 / 테누토: 눌러 끌기=프레스','레가토: 미끄러지듯, 점 흐림(파시브)=글라이드','예비박: 받을 박 성격을 한 박 먼저 = 받을 박 에포트를 미리'],
q:[mc('테누토에 해당하는 에포트는?',['펀치','대브','프레스(눌러 끌기)','글라이드'],2,'강·지속. 무거운 문 천천히 밀듯.'),
sa('점을 콕 찍고 즉시 멈추는 스타카토의 에포트는?','대브(dab)','가벼움·급격.'),
mc('의도를 동작으로 옮기는 3단계 순서는?',['동작→느낌→에포트','느낌→동작→에포트','에포트→느낌→동작','동작→에포트→느낌'],1,'비유→점이 또렷한가→무게·시간.')],
task:'한 악구를 "이건 레가토(가볍고 지속, 점 흐림)"식으로 에포트 좌표로 적기.',hand:'에포트 조합 두 가지를 같은 악구에 적용해 비교.'},

{d:53,wk:9,ph:'지휘 언어',t:'유창성',lead:'도형이 자동화돼야 음악에 머리를 쓸 수 있어요.',concept:'<p>박자 도형이 <b>자동화</b>돼야 음악 표현에 머리를 쓸 수 있어요.</p><table class="ctbl"><tr><th>단계</th><th>내용</th></tr><tr><td>인지</td><td>생각하며 하나씩 (피츠-포스너 1단계)</td></tr><tr><td>연합</td><td>연결되며 부드러워짐</td></tr><tr><td>자동</td><td>생각 안 해도 나옴 — 여기 올라야 함</td></tr></table><p><b>해석 · </b>도형이 <b>자동 단계</b>에 있어야 표현에 인지 자원을 쓸 수 있어요. 외국어 유창성과 같은 메커니즘 — 핵심 어휘가 몸에 배어 무의식적으로 나오는 상태를 <b>체화된 인지</b>라 합니다.</p><div class="cnote"><b>지휘 함의 · </b>4박 도형을 <b>메트로놈에 맞춰 "생각 없이"</b> 나올 때까지 반복하세요. 매일 비팅 연습이 바로 이 자동화 훈련이에요.</div>',think:['자동화와 무의식적 습관의 차이는 무엇일까 — 자동화가 굳으면 표현이 죽을까?','유창해진 뒤에 일부러 서툶을 연출해야 하는 음악적 순간이 있을까?'],listen:['임윤찬 라흐마니노프 협주곡 3번','기술이 사라지고 음악만 남는 순간이란 무엇인가.'],read:[
'운동학습 3단계: 인지→연합→자동(피츠-포스너)','도형이 자동 단계여야 표현에 인지 자원','체화된 인지: 의미가 몸의 움직임에 담김','핵심 어휘가 몸에 배어 무의식적으로 나오는 상태'],
q:[mc('박자 도형이 올라야 하는 운동학습 단계는?',['인지','연합','자동','없음'],2,'생각 안 해도 나오는 단계.'),
sa('동작이 인지→연합→자동으로 가는 모델의 이름은?','피츠-포스너 모델','외국어 유창성과 같은 메커니즘.'),
mc('유창성이란?',['많은 동작을 아는 것','핵심 어휘가 몸에 배어 무의식적으로 나옴','빠른 동작','큰 동작'],1,'그래야 연주자가 망설임 없이 읽음.')],
task:'4박 도형을 메트로놈에 맞춰 "생각 없이" 나올 때까지 반복.',hand:'8마디를 멈추지 않고 지휘 — 실수해도 되돌아가지 않기.'},

{d:54,wk:9,ph:'지휘 언어',t:'실증 + 익히는 법 + 복습',lead:'"명료할수록 잘 맞춘다"는 측정된 사실.',concept:'<p>"명료할수록 잘 맞춘다"는 <b>측정된 사실</b>이에요. 그리고 9주차를 정리합니다.</p><table class="ctbl"><tr><th>실증</th><th>내용</th></tr><tr><td>동기화 지점</td><td>연주자는 수직 최저점·최대 감속에 박을 맞춤 (r≈0.6)</td></tr><tr><td>매끄러움</td><td>저크 낮은 제스처에 더 잘 동기화 (마르카토&gt;레가토)</td></tr><tr><td>예비박</td><td>"한 음절 앞선 발화" — 늦으면 진입이 무너짐</td></tr></table><p><b>해석 · </b>익히는 법의 순서는 <b>어휘 자동화 → 의도를 에포트로 → 명료·매끄럽게 → 한 박 먼저</b>예요. 연주자는 예측으로 맞추기 때문에, 명료하고 매끄러운 예비박이 앙상블의 진입을 좌우합니다.</p><div class="cnote"><b>9주 복습 · </b>지휘=언어(문법·기호) → 라반 에포트(4요소) → 번역표 → 유창성(자동화) → 실증. 추상적 의도를 <b>몸의 문법</b>으로 옮기는 흐름이에요.</div>',think:['연주자가 예측으로 맞춘다면, 지휘의 본질은 지금이 아니라 다음을 보여주는 일일까?','명료함과 표현이 충돌할 때 무엇을 우선할지, 장면별 기준을 세워보기.'],listen:['오자와 세이지 지휘 영상','예비박 하나로 오케스트라 전체가 숨을 쉰다 — 그 한 박을 여러 번 돌려보세요.'],read:[
'연주자는 수직 속도 최대점·최대 감속 지점에 박을 맞춤(r≈0.6)','저크 낮은(매끄러운) 제스처에 더 잘 동기화, 마르카토가 레가토보다 쉬움','익히는 법: 어휘 자동화→의도를 에포트로→명료·매끄럽게→한 박 먼저','예비박 = "한 음절 앞선 발화"'],
q:[mc('연주자가 박을 맞추는 지휘 동작 지점은?',['최고점','최저점·최대 감속','중간','시작'],1,'실증: r≈0.60.'),
sa('예비박이 하는 일을 한마디로.','받을 박의 템포·세기·성격을 한 박 먼저 예고','늦으면 진입이 무너짐.'),
mc('동기화가 더 쉬운 제스처는?',['저크 높은','매끄럽고 예측 가능','불명료한','느린'],1,'명료·매끄러울수록 잘 맞물림.')],
task:'녹음에 맞춰 지휘하며 예비박이 늦지 않는지 영상으로 점검.',hand:'오늘 배운 것 중 하나만 골라 100번 반복.'},

// ── 10주: 신체별 역할 ──
{d:55,wk:10,ph:'신체별 역할',t:'오른손 — 시간',lead:'오른손은 시계. 박·템포·구획을 명확히. 명료함이 우선.',concept:'<p>오른손은 <b>시계</b>예요. 박·템포·구획을 명확히 하는 게 1순위 — 표현·색은 왼손에 넘기고, 여기선 <b>명료함</b>에 집중해요.</p><table class="ctbl"><tr><th>기능</th><th>내용</th></tr><tr><td>박자 도형</td><td>자동화 (흔들리면 언어가 무너짐)</td></tr><tr><td>익투스</td><td>최저점·최대 감속점 = 소리 나는 순간</td></tr><tr><td>반동</td><td>튀어 올라 다음 박 성격 예고</td></tr><tr><td>예비박</td><td>첫 소리 한 박 전 예고 호흡</td></tr><tr><td>세분·데드 제스처</td><td>느린 곳 잘게 / 소리 없는 쉬는 동작</td></tr></table><svg class="cdia" viewBox="0 0 320 100"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">양손 분업 — 오른손은 시계, 왼손은 화가</text><rect x="12" y="28" width="142" height="52" rx="10" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.6"/><text x="83" y="50" text-anchor="middle" font-size="12" font-weight="800" fill="#6fe9cd">오른손 = 시간</text><text x="83" y="68" text-anchor="middle" font-size="8.5" fill="#a7b4bc">박·템포·구획 (명료)</text><rect x="166" y="28" width="142" height="52" rx="10" fill="rgba(162,179,222,.14)" stroke="#a2b3de" stroke-width="1.6"/><text x="237" y="50" text-anchor="middle" font-size="12" font-weight="800" fill="#a2b3de">왼손 = 색</text><text x="237" y="68" text-anchor="middle" font-size="8.5" fill="#a7b4bc">표현·다이내믹·큐</text></svg><p><b>해석 · </b>오른손의 1번 임무는 <b>명료한 시간</b>이에요. 익투스가 매번 또렷하고, 반동으로 다음 박을 예고하며, 예비박이 진입을 이끌어요. 여기에 표현까지 섞으면 시간이 흐려지니, <b>표현은 왼손</b>에 맡깁니다.</p><div class="cnote"><b>지휘 함의 · </b>느린 악구는 <b>세분</b>(2분박)으로 안정시키고, 정확한 익투스로 앙상블의 시간을 지키세요. 매일 트레이너의 익투스 연습이 이 기초예요.</div>',think:['시계가 잠시 멈춰도 되는 순간은 언제일까 — 박을 놓아주는 용기에 대해.','명료한 익투스가 오히려 방해가 되는 음악에서 오른손은 무엇을 해야 할까?'],listen:['아바도의 브람스 교향곡 영상','최소의 동작, 최대의 음악 — 시계가 거의 안 보일 때 무엇이 음악을 끌고 가나.'],read:[
'박자 도형 자동화(흔들리면 언어가 무너짐)','익투스: 최저점·최대 감속점 / 반동: 다음 박 성격 예고','예비박: 첫 소리 한 박 전 예고 호흡 / 커트오프: 작은 고리','세분(느린 템포·rit)·데드 제스처(소리 없는 쉬는 동작)'],
q:[mc('오른손의 1번 임무는?',['표현','명료한 시간(박·템포·구획)','색','큐'],1,'표현은 왼손에 넘김.'),
sa('익투스 직후 튀어 올라 다음 박 성격을 예고하는 것은?','반동(rebound)','크기·속도가 다음 박 정보.'),
mc('느린 템포·리타르단도에서 박을 잘게 쪼개 안정시키는 것은?',['커트오프','세분(subdivide)','데드 제스처','반동'],1,'박을 잘게 쪼갬.')],
task:'느린 악구를 세분(2분박) 넣어 지휘해보기.',hand:'오른손만으로 4박을 100회 — 익투스 높이가 흔들리지 않는지 거울로 확인.'},

{d:56,wk:10,ph:'신체별 역할',t:'왼손 — 색',lead:'왼손은 화가. 표현·다이내믹·큐. 핵심은 독립성.',concept:'<p>왼손은 <b>화가</b>예요. 표현·다이내믹·큐를 맡아요. 핵심 난관은 오른손을 따라 하지 않는 <b>독립성</b>입니다.</p><table class="ctbl"><tr><th>역할</th><th>내용</th></tr><tr><td>독립성</td><td>미러링하면 정보 절반 → 다른 메시지 동시에</td></tr><tr><td>다이내믹</td><td>손바닥 높이=음량 은유 (위=크게, 눌러=작게)</td></tr><tr><td>큐</td><td>진입 주자에 미리 손+시선 → 그 박에 줌</td></tr><tr><td>발란스</td><td>층을 끌어올리거나 눌러 음향 무게중심 조정</td></tr><tr><td>함정</td><td>끊임없이 움직여 의미 희석 → 할 말 없으면 중립</td></tr></table><p><b>해석 · </b>왼손의 가장 큰 함정은 "<b>항상 뭔가 해야</b>"라는 강박이에요. 할 말이 없으면 중립 위치에서 쉬는 것이 오히려 강한 메시지. 발란스로 특정 층을 끌어올리거나 눌러 음향의 무게중심을 조정합니다.</p><div class="cnote"><b>지휘 함의 · </b>오른손 4박을 유지하며 왼손으로만 크레셴도 후 정지 — 매일 비팅의 <b>왼손 분리 연습</b>이 이 독립성을 길러요.</div>',think:['왼손의 침묵(중립)이 강한 메시지가 되는 이유 — 말과 침묵의 관계로 설명해보기.','왼손이 절대 따라하지 않는 지휘와 자주 함께 움직이는 지휘 — 각각 어떤 음악에 맞을까?'],listen:['번스타인 말러 2번 피날레 영상','왼손이 하늘을 여는 순간 — 그 손은 박이 아니라 무엇을 젓고 있나.'],read:[
'독립성: 미러링하면 정보 절반 → 다른 메시지 동시에','다이내믹: 손바닥 높이=음량 은유(위=크게, 눌러=작게)','큐: 진입 주자에 미리 손+시선→그 박에 줌','발란스: 층을 끌어올리거나 눌러 무게중심 조정','함정: "항상 뭔가 해야" 강박 → 할 말 없으면 쉼(중립)'],
q:[mc('왼손의 가장 큰 난관은?',['빠르기','독립성(미러링 탈피)','음량','방향'],1,'오른손을 따라 하면 정보 절반.'),
sa('왼손이 특정 층을 끌어올리거나 눌러 음향 무게중심을 조정하는 것은?','발란스','제1편 관현악 층과 직결.'),
mc('왼손의 흔한 함정은?',['너무 안 움직임','끊임없이 움직여 의미 희석','너무 낮음','너무 빠름'],1,'할 말 없으면 중립 위치.')],
task:'오른손 4박 유지하며 왼손으로 4마디 크레셴도 후 정지 연습.',hand:'왼손만으로 셈여림 곡선 그리기 — 오른손은 무릎에 두고.'},

{d:57,wk:10,ph:'신체별 역할',t:'시선·얼굴 + 호흡',lead:'눈맞춤은 가장 강한 큐. 호흡은 보이지 않는 박.',concept:'<p>눈맞춤은 <b>가장 강한 큐</b>, 호흡은 <b>보이지 않는 박</b>이에요.</p><table class="ctbl"><tr><th>요소</th><th>내용</th></tr><tr><td>눈맞춤</td><td>손보다 빠른 직접 큐 (악보에 코 박으면 죽음)</td></tr><tr><td>표정</td><td>성격(affect) 전염 — 긴장·평온·격정</td></tr><tr><td>호흡</td><td>예비박과 한 몸 — 들숨이 템포·세기를 실어 나름</td></tr><tr><td>통일</td><td>앙상블 호흡을 모아 시작·정점·끝을 함께</td></tr></table><p><b>해석 · </b>눈맞춤은 손동작보다 빠르고 정확한 큐라 "지금 너"를 전해요. 그래서 <b>암보·내청</b>이 실전에서 중요합니다 — 악보에 시선을 뺏기면 이 채널이 죽어요. 관·성악과 함께 들이쉬는 호흡이 진입을 하나로 묶습니다.</p><div class="cnote"><b>지휘 함의 · </b>짧은 악구를 암보해 가상의 주자에게 <b>눈으로 큐</b> 주는 연습을 하세요. 예비박에 들숨을 실어 앙상블 호흡을 모으고요.</div>',think:['시선을 아끼는 것도 표현일까 — 어디를 안 볼지 설계해보기.','호흡이 예비박과 한 몸이라면, 숨을 참는 지휘는 연주에 어떤 흔적을 남길까?'],listen:['클라이버 영상 다시 한 번','눈으로 큐를 주는 순간을 세 번 찾기 — 시선이 닿는 곳에 소리가 피어요.'],read:[
'눈맞춤: 손보다 빠른 직접 큐 → 악보에 코 박으면 죽음(암보·내청)','표정: 성격(affect) 전염 — 긴장·평온·격정','호흡=예비박과 한 몸: 들숨이 템포·세기 실어 나름','통일: 앙상블 호흡을 모아 시작·정점·끝을 함께'],
q:[mc('손보다 빠르고 정확한 큐는?',['반동','눈맞춤','커트오프','세분'],1,'"지금 너"를 전함.'),
sa('예비박과 한 몸이 되어 템포·세기를 실어 나르는 것은?','호흡(들숨)','관·성악이 함께 들이쉼.'),
mc('암보·내청이 실전에서 중요한 이유는?',['멋있어서','시선(눈맞춤) 채널을 살리려고','빠르려고','악보가 없어서'],1,'악보에 코 박으면 큐 채널이 죽음.')],
task:'짧은 악구를 암보해 가상의 주자에게 눈으로 큐 주는 연습.',hand:'시선을 세 방향으로 옮기며 지휘 — 손은 흔들리지 않게.'},

{d:58,wk:10,ph:'신체별 역할',t:'몸통·자세 + 팔 메커니즘',lead:'안정·규모는 몸이, 크기는 관절 위계가 정해요.',concept:'<p>안정·규모는 <b>몸</b>이, 동작 크기는 <b>관절 위계</b>가 정해요.</p><table class="ctbl"><tr><th>관절</th><th>특성</th><th>쓰임</th></tr><tr><td>손목</td><td>관성 작음 · 섬세 · 빠름</td><td>pp · 빠른 잔결</td></tr><tr><td>팔뚝</td><td>중간</td><td>보통 다이내믹</td></tr><tr><td>어깨(팔 전체)</td><td>크고 강함</td><td>f · 넓은 레가토</td></tr></table><svg class="cdia" viewBox="0 0 320 128"><text x="160" y="15" text-anchor="middle" font-size="10" fill="#a7b4bc">관절 위계 — 필요한 만큼만(경제성)</text><circle cx="60" cy="66" r="14" fill="rgba(111,233,205,.2)" stroke="#6fe9cd"/><text x="60" y="70" text-anchor="middle" font-size="8" font-weight="700" fill="#6fe9cd">손목</text><text x="60" y="98" text-anchor="middle" font-size="8.5" fill="#a7b4bc">섬세·빠름</text><text x="60" y="110" text-anchor="middle" font-size="8" fill="#75818b">pp·잔결</text><circle cx="160" cy="62" r="21" fill="rgba(162,179,222,.2)" stroke="#a2b3de"/><text x="160" y="66" text-anchor="middle" font-size="8.5" font-weight="700" fill="#a2b3de">팔뚝</text><text x="160" y="98" text-anchor="middle" font-size="8.5" fill="#a7b4bc">중간</text><circle cx="262" cy="56" r="29" fill="rgba(255,133,117,.2)" stroke="#ff8575"/><text x="262" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#ff8575">어깨</text><text x="262" y="100" text-anchor="middle" font-size="8.5" fill="#a7b4bc">크고 강함</text><text x="262" y="112" text-anchor="middle" font-size="8" fill="#75818b">f·넓은 레가토</text><path d="M78,66 L139,62" stroke="#75818b" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M183,60 L233,57" stroke="#75818b" stroke-width="1.2" stroke-dasharray="3 2"/></svg><p><b>해석 · </b>발 어깨너비·무게중심 낮게가 안정의 기본이고, <b>부동(멈춤)</b>도 강한 메시지예요(고요=긴장). 다운비트는 능동적 내리침이 아니라 <b>팔의 무게로 낙하 → 반동</b>으로 회복합니다. 필요한 최소 관절만 쓰는 <b>경제성</b>이 원칙 — 큰 동작을 아껴야 정점에서 효과가 삽니다.</p><div class="cnote"><b>지휘 함의 · </b>같은 악구를 손목만 / 어깨까지로 각각 지휘해 <b>크기 차이</b>를 몸으로 느껴보세요. 무게 낙하와 반동의 감각을 익히고요.</div>',think:['큰 동작을 아낀 지휘자가 정점에서 얻는 것은 무엇일까?','무게 낙하와 능동적 내리침의 차이를 연주자는 소리로 구별할 수 있을까?'],listen:['첼리비다케 브루크너 영상','큰 몸이 만드는 큰 시간 — 느림이 지루하지 않은 이유를 몸에서 찾기.'],read:[
'안정: 발 어깨너비·무게중심 낮게. 부동도 강한 메시지(고요=긴장)','규모: 큰 포르테=몸·팔 전체, 섬세한 피아노=작게','관절 위계: 손목(섬세)→팔뚝(중간)→어깨(크게·강함)','원리: 무게로 낙하→반동, 필요한 최소 관절(경제성)'],
q:[mc('가장 섬세한 피아니시모·빠른 결에 쓰는 관절은?',['어깨','팔뚝','손목','허리'],2,'관성이 가장 작아 빠르고 또렷한 익투스.'),
sa('다운비트를 능동적 내리침이 아니라 무엇으로 떨어뜨리나?','팔의 자연 무게(낙하)','→ 반동으로 회복.'),
mc('경제성(Ökonomie) 원칙이 뜻하는 것은?',['항상 크게','필요한 최소 관절만','항상 작게','손목만'],1,'큰 동작을 아껴야 정점에서 효과.')],
task:'같은 악구를 손목만 / 어깨까지로 각각 지휘해 크기 차이를 몸으로 느끼기.',hand:'어깨를 내린 채 4박 — 팔꿈치가 몸에서 얼마나 떨어지는지 확인.'},

{d:59,wk:10,ph:'신체별 역할',t:'양손 협응 + 분리',lead:'두 손이 다른 메시지를 동시에. 붙이고 뗄 수 있는 통제가 목표.',concept:'<p>두 손이 <b>다른 메시지를 동시에</b> — 붙이고 뗄 수 있는 통제가 목표예요. 완전 독립이 아니라 유연한 협응입니다.</p><table class="ctbl"><tr><th>단계</th><th>연습</th></tr><tr><td>1</td><td>각 손 도형·동작 자동화</td></tr><tr><td>2</td><td>왼손을 중립에 멈춰 버티기</td></tr><tr><td>3</td><td>한 번에 한 과제씩(왼손 크레셴도 등)</td></tr><tr><td>4</td><td>다른 결·타이밍 동시(오른손 마르카토+왼손 레가토)</td></tr><tr><td>5</td><td>실제 음악에 적용</td></tr></table><p><b>해석 · </b>미러링에는 <b>두 얼굴</b>이 있어요 — 강조용 의도된 미러링은 정답이고, 없애야 할 건 <b>습관성 무의식 미러링</b>뿐이에요. 목표는 완전 독립이 아니라 필요할 때 <b>붙이고 뗄 통제</b>. 전문가도 일부러 미러링합니다.</p><div class="cnote"><b>지휘 함의 · </b><b>쉬는 훈련</b>(왼손 정지)이 다르게 움직이는 훈련만큼 중요해요. 오른손 마르카토 ↔ 왼손 레가토를 동시에 그려보세요.</div>',think:['완전 독립이 아니라 붙였다 뗄 통제가 목표인 이유 — 자유는 통제에서 나온다는 역설을 음악으로 설명해보기.','오른손 마르카토 + 왼손 레가토 같은 이중 메시지가 필요한 실제 악구를 상상해보기.'],listen:['두다멜 「말람보」 영상','양손이 각자 춤추는 축제 — 통제와 자유가 동시에 있는 몸.'],read:[
'분업: 오른손=시간, 왼손=색','미러링 두 얼굴: 강조용 의도된 미러링=정답 / 습관성 무의식 미러링만 탈피','5단계: ①각 손 자동화 ②왼손 정지 ③한 과제씩 ④다른 결·타이밍 ⑤실제 음악','목표: 완전 독립 X → 필요할 때 붙이고 뗄 통제'],
q:[mc('없애야 할 미러링은?',['강조용 의도된 미러링','습관성 무의식 미러링','모든 미러링','다운비트 미러링'],1,'강조용은 오히려 정답.'),
sa('분리 연습 2단계에서 왼손은 무엇을 하나?','중립에 멈춰 버티기(정지)','쉬는 훈련이 다르게 움직이는 훈련만큼 중요.'),
mc('양손 협응의 목표는?',['완전 독립','필요할 때 붙이고 뗄 수 있는 통제','항상 미러링','항상 분리'],1,'전문가도 일부러 미러링함.')],
task:'오른손 마르카토 ↔ 왼손 레가토 긴 아치를 동시에(4단계) 연습.',hand:'오른손 4박 + 왼손 크레셴도를 동시에 — 미러링이 나오면 즉시 멈추고 다시.'},

{d:60,wk:10,ph:'신체별 역할',t:'복습 — 지휘·신체',lead:'문제로 다지기.',concept:'<p><b>10주차 정리.</b> 신체 각 부분이 하는 일 — 지휘는 <b>온몸의 언어</b>예요.</p><table class="ctbl"><tr><th>부위</th><th>역할</th></tr><tr><td>오른손</td><td>시간 (박·템포·구획, 명료함)</td></tr><tr><td>왼손</td><td>색 (표현·다이내믹·큐, 독립성)</td></tr><tr><td>시선·호흡</td><td>가장 빠른 큐 / 보이지 않는 박</td></tr><tr><td>몸통·팔</td><td>안정·규모 / 관절 위계로 크기</td></tr><tr><td>양손 협응</td><td>붙이고 뗄 통제 (유연한 협응)</td></tr></table><div class="cnote"><b>복습법 · </b>한 악구에 "오른손=무엇, 왼손=무엇, 시선=무엇, 호흡=무엇"을 배분표로 적어보세요. 온몸이 하나의 메시지를 향하게.</div>',think:['몸의 각 부위가 다른 말을 할 때 오케스트라는 어느 부위를 가장 믿고 따라올까?','내 몸에서 가장 서툰 채널 하나를 골라 남은 기간 집중 훈련 계획 세우기.'],listen:['내가 닮고 싶은 지휘자 영상 하나','무엇이 나를 끌어당기는지 한 줄로 적어보기 — 그게 내 지휘의 씨앗이에요.'],read:['오른손·왼손·시선·호흡·몸통·팔·양손 점검','핵심: 오른손=시간, 왼손=색, 한 번에 한 메시지'],
q:[mc('반동의 크기·속도가 예고하는 것은?',['조성','다음 박의 세기·템포','종지','음색'],1,'다음 박 정보를 나름.'),
sa('큰 다이내믹·넓은 레가토에 쓰는 관절은?','어깨(팔 전체)','가장 크고 강함.'),
mc('예비박이 늦으면?',['더 정확','진입이 무너짐','음량 증가','상관없음'],1,'연주자는 예측으로 맞춤.'),
sa('오른손과 왼손의 기본 분업을 쓰시오.','오른손=시간, 왼손=색','섞지 않음.')],
task:'한 악구에 "오른손=무엇, 왼손=무엇, 시선=무엇, 호흡=무엇" 배분표 작성.',hand:'이번 주 항목을 하나씩 점검하며 8마디 지휘.'},

// ── 11주: 비팅 + 종합 ──
{d:61,wk:11,ph:'비팅',t:'세코 + 악티브 vs 파시브',lead:'세코는 비팅의 최소 단위. 점을 얼마나 보여주나가 기준 축.',concept:'<p><b>세코</b>(마른 박)는 비팅의 최소 단위예요. 모든 박자 도형은 세코의 확대·축소입니다. 기준 축은 "<b>점을 얼마나 보여주나</b>" — 악티브와 파시브예요.</p><table class="ctbl"><tr><th>박</th><th>속도 곡선</th><th>성격</th></tr><tr><td>세코</td><td>짧고 건조</td><td>명료한 최소 박</td></tr><tr><td>악티브</td><td>가속 → 최저점 급감속</td><td>익투스 또렷 (억제)</td></tr><tr><td>파시브</td><td>도착까지 등속</td><td>면으로 흐름 (자유)</td></tr></table><svg class="cdia" viewBox="0 0 320 118"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">악티브 vs 파시브 — 점을 얼마나 보여주나</text><line x1="16" y1="92" x2="305" y2="92" stroke="#75818b" stroke-width="1"/><path d="M22,34 C50,50 68,88 78,90 C88,88 106,50 134,34" fill="none" stroke="#6fe9cd" stroke-width="2.4"/><circle cx="78" cy="90" r="4" fill="#ff8575"/><text x="78" y="110" text-anchor="middle" font-size="9" fill="#6fe9cd" font-weight="700">악티브 (점 또렷)</text><path d="M186,36 Q244,104 300,36" fill="none" stroke="#a2b3de" stroke-width="2.4"/><text x="243" y="110" text-anchor="middle" font-size="9" fill="#a2b3de" font-weight="700">파시브 (등속·점 흐림)</text></svg><p><b>해석 · </b>악티브는 최대 속도가 드러나며 <b>익투스가 콕</b> 찍히고, 파시브는 등속 궤적으로 점을 숨겨요. 중요한 건 점을 흐리든 찍든 <b>박 위치는 정확</b>해야 한다는 것 — 파시브의 정확성은 등속의 균질함과 도착 타이밍에서 나옵니다.</p><div class="cnote"><b>지휘 함의 · </b>같은 박을 악티브(콕)와 파시브(미끄러지듯)로 번갈아 그려보세요. 매일 트레이너의 악티브↔파시브 연습이 이 감각이에요.</div><h4>박을 세는 방식</h4><p>같은 악보라도 <b>몇 박으로 묶어 젓는가</b>는 음악의 호흡이 정합니다. 표기가 아니라 흐름이 기준이에요.</p><table class="ctbl"><tr><th>방식</th><th>쓰임</th></tr><tr><td><b>인 원</b> in one</td><td>한 마디를 한 박으로. 빠른 왈츠\u00b7스케르초. 마디가 큰 박이 됩니다.</td></tr><tr><td><b>인 투</b> in two</td><td>두 박으로 묶기. 알라 브레베, 빠른 6/8.</td></tr><tr><td><b>쪼개 젓기</b> subdivision</td><td>한 박을 둘\u00b7셋으로. 느린 악장, 리타르단도, 앙상블이 흔들릴 때.</td></tr><tr><td>큰박\u00b7작은박</td><td>6/8의 점4분이 큰박, 8분이 작은박. <b>손은 큰박, 귀는 작은박</b>.</td></tr></table><table class="ctbl"><tr><th>용어</th><th>뜻</th></tr><tr><td>템포 주스토 tempo giusto</td><td>정확한 속도로. 루바토를 거두고 제자리로.</td></tr><tr><td>루바토 rubato</td><td>훔친 시간. 밀면 당겨 갚아 <b>마디 총량을 지켜요</b>.</td></tr><tr><td>아 템포 a tempo</td><td>원래 속도로 복귀.</td></tr><tr><td>체수라 caesura //</td><td>흐름을 <b>짧게 끊는</b> 자리. 길이는 지휘자 재량.</td></tr><tr><td>게네랄파우제 G.P.</td><td><b>전원 쉼</b>. 마디 전체가 비는 것. 컷을 주고 다시 예비박으로 들어가요.</td></tr></table>',think:['악티브·파시브의 대비가 사라진 지휘는 무엇을 잃을까?','점을 숨기면서도 정확한 파시브 — 모호함과 부정확함의 경계를 몸으로 정의해보기.'],listen:['프로코피예프 고전 교향곡 1악장','마른 박과 젖은 박 — 소리의 자음과 모음을 혀끝으로 구별하듯.'],read:[
'세코(마른 박): 짧고 건조한 명료한 박 → 도형은 세코의 확대·축소','악티브: 박점으로 가속→최저점 급감속, 익투스 또렷(억제)','파시브: 도착까지 등속, 면으로 흐름(자유)','공통: 점을 흐리든 찍든 박 위치는 정확'],
q:[mc('빠른 3/4 왈츠를 한 마디에 한 번 젓는 방식은?',['인 투','인 원','쪼개 젓기','알라 브레베'],1,'마디 자체가 큰 박이 됩니다.'),
mc('앙상블이 흔들릴 때 지휘자가 쓰는 방식은?',['인 원','인 투','쪼개 젓기','센차 미주라'],2,'한 박을 둘·셋으로 나눠 저어 기준을 촘촘히 줍니다.'),
mc('비팅의 최소 단위는?',['도형','세코','반동','예비박'],1,'모든 도형은 세코의 확대·축소.'),
sa('도착까지 등속으로 움직여 점을 숨기는 박은?','파시브','자유(free) 흐름. 등속 궤적+도착 타이밍으로 예측.'),
mc('악티브 박의 속도 곡선은?',['등속','가속→최저점 급감속','감속만','일정'],1,'최대 속도가 드러나며 익투스 또렷.')],
task:'같은 박을 악티브(콕)와 파시브(미끄러지듯)로 번갈아 그려보기.',hand:'세코와 레가토를 번갈아 4마디씩 — 전환에서 템포가 흔들리지 않게.'},

{d:62,wk:11,ph:'비팅',t:'강세 위계 + 레가토',lead:'점의 또렷함·크기로 강-약-중강-약. 선율이 얹히면 면으로.',concept:'<p>점의 또렷함·크기로 <b>강-약-중강</b>을 만들고, 선율이 얹히면 점을 잇는 <b>면</b>이 돼요.</p><table class="ctbl"><tr><th>요소</th><th>내용</th></tr><tr><td>4박 강세</td><td>강(악티브)-약(파시브)-중강-약, 점 차등</td></tr><tr><td>악/파 ≠ 강/약</td><td>표현 수단이지 등호 아님 (여린내기 업=악티브)</td></tr><tr><td>레가토</td><td>점 중심 분절 → 점을 잇는 면</td></tr><tr><td>비유</td><td>세코=자음, 레가토=모음(이어 부르기)</td></tr></table><p><b>해석 · </b>악티브/파시브는 강/약과 <b>등호가 아니에요</b> — 여린내기(업비트)를 악티브로 치거나, 강박을 파시브로 눌러 표현하기도 해요. 레가토에서는 익투스를 흐리고 궤적을 이어 <b>호흡을 그립니다</b>.</p><div class="cnote"><b>지휘 함의 · </b>4박을 강-약-중강-약 크기 차등으로 그린 뒤, 같은 4박을 레가토(면)로 연결해보세요. 자음과 모음의 차이처럼.</div>',think:['여린 악티브·강한 파시브가 어울리는 악구를 각각 떠올려보기.','자음(세코)–모음(레가토) 비유를 밀고 가면, 음악의 문장·구두점·억양은 각각 무엇일까?'],listen:['브람스 교향곡 3번 3악장','레가토의 강물에 몸을 맡기기 — 어디에도 모서리가 없는 시간.'],read:[
'4박 강세: 강(악티브)-약(파시브)-중강-약, 점 차등','악티브/파시브 ≠ 강/약 (수단이지 등호 아님)','레가토: 점 중심 분절 → 점을 잇는 면. 세코=자음, 레가토=모음','익투스 흐리고 궤적 이어 호흡을 그림'],
q:[mc('악티브/파시브와 강/약의 관계는?',['1:1 등호','표현 수단이지 등호 아님','무관','반대'],1,'여린내기 업=악티브, 강박을 파시브로 누르기도.'),
sa('세코가 자음이라면 레가토는 무엇에 비유되나?','모음(이어 부르기)','점 사이를 잇는 면.'),
mc('레가토에서 익투스는?',['더 또렷','흐리고 궤적을 이음','사라짐','2배'],1,'파시브에 가깝게, 호흡을 그림.')],
task:'4박을 강-약-중강-약 크기 차등으로, 그다음 레가토(면)로 연결해 그리기.',hand:'강세 위계를 크기로 — 1박 크게, 3박 중간, 나머지 작게.'},

{d:63,wk:11,ph:'비팅',t:'다운/업비트 + 박의 두 얼굴',lead:'내려가 바닥 찍고, 튕겨 올라 예비. 모든 박은 다음 박의 예비.',concept:'<p>내려가 바닥을 찍고(다운), 튕겨 올라 예비하는(업) 것 — 그리고 <b>모든 박은 다음 박의 예비</b>라는 통찰이에요.</p><table class="ctbl"><tr><th>구분</th><th>내용</th></tr><tr><td>다운비트</td><td>내려가 최저점 급감속·전환 = 익투스(소리 나는 순간)</td></tr><tr><td>업비트</td><td>바닥 찍고 튕겨 오르는 반동 = 다음 박 예비</td></tr><tr><td>기본형</td><td>다운=악티브 / 업=파시브 (여린내기는 업이 악티브)</td></tr><tr><td>박의 두 얼굴</td><td>받는 얼굴(강/약박) + 주는 얼굴(다음 예비)</td></tr></table><p><b>해석 · </b>익투스(박점)는 최고 속도점이 아니라 <b>최저점의 감속·전환점</b>이에요 — 최대 속도는 바닥 직전에 지나갑니다. 지휘는 박의 <b>주는 얼굴</b>(다음 예비)을 우선해요. 익투스 순간 이미 다음을 향해 반동합니다.</p><div class="cnote"><b>지휘 함의 · </b>4박에서 각 박의 반동 크기(1작·2중·3작·4큼)를 의식하며 그려, 4박의 큰 반동이 다음 강박을 끌어오게 하세요.</div>',think:['모든 박이 다음 박의 예비라면, 마지막 박은 무엇을 예비할까 — 끝의 지휘에 대해.','받는 얼굴보다 주는 얼굴을 우선하는 이유를 연주자의 입장에서 설명해보기.'],listen:['빈 신년음악회 「아름답고 푸른 도나우」','업비트가 끌어올리는 춤 — 왈츠는 내려오는 게 아니라 떠오르는 것.'],read:[
'다운: 내려가 최저점 급감속·전환=익투스(소리 나는 순간)','업: 바닥 찍고 튕겨 오르는 반동=다음 박 예비(곡 시작=예비박)','기본형: 다운=악티브 / 업=파시브 (여린내기는 업이 악티브)','박의 두 얼굴: 받는 얼굴(강/약박)+주는 얼굴(다음 예비), 지휘는 주는 얼굴 우선'],
q:[mc('익투스(박점)는 어디인가?',['최고 속도점','최저점의 감속·전환점','중간','시작점'],1,'최대 속도는 바닥 직전에 지남.'),
sa('4/4에서 동작이 가장 커지는(악티브) 박은?','4박','약박이지만 다음 강박을 끌어와야 반동이 큼.'),
mc('지휘가 우선하는 박의 "얼굴"은?',['받는 얼굴','주는 얼굴(다음 예비)','둘 다 무시','강박만'],1,'익투스 순간 이미 다음을 향해 반동.')],
task:'4박에서 각 박의 반동 크기(1작·2중·3작·4큼)를 의식하며 그려보기.',hand:'다운비트와 업비트의 무게를 반대로 해보고 어떤 음악에 맞는지 판단.'},

{d:64,wk:11,ph:'비팅',t:'4박 도형 + 종합',lead:'방향+강세+반동의 합성. 그리고 네 개의 손잡이로 종합.',concept:'<p>방향 + 강세 + 반동을 합성한 것이 <b>4박 도형</b>이에요. 그리고 네 개의 손잡이로 비팅을 종합합니다.</p><table class="ctbl"><tr><th>요소</th><th>내용</th></tr><tr><td>도형 방향</td><td>1↓ 2← 3→ 4↑ — 각 익투스는 방향 끝의 도착점</td></tr><tr><td>반동</td><td>약박 4박의 큰 반동(위)이 다음 강박을 끌어옴</td></tr><tr><td>네 손잡이</td><td>점(질감) × 크기 × 방향 × 강세</td></tr></table><svg class="cdia" viewBox="0 0 300 168"><defs><marker id="b4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a7b4bc"/></marker></defs><text x="150" y="15" text-anchor="middle" font-size="10" fill="#a7b4bc">4박 도형 — 1↓ 2← 3→ 4↑</text><path d="M150,150 L66,96" stroke="#a7b4bc" stroke-width="1.6" marker-end="url(#b4)"/><path d="M66,96 L234,96" stroke="#a7b4bc" stroke-width="1.6" marker-end="url(#b4)"/><path d="M234,96 L150,42" stroke="#ff8575" stroke-width="1.8" marker-end="url(#b4)"/><path d="M150,42 L150,142" stroke="#a7b4bc" stroke-width="1.2" stroke-dasharray="3 3" opacity=".5"/><circle cx="150" cy="150" r="15" fill="rgba(255,133,117,.2)" stroke="#ff8575"/><text x="150" y="155" text-anchor="middle" font-size="12" font-weight="800" fill="#ff8575">1</text><circle cx="60" cy="96" r="14" fill="rgba(162,179,222,.2)" stroke="#a2b3de"/><text x="60" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#a2b3de">2</text><circle cx="240" cy="96" r="14" fill="rgba(162,179,222,.2)" stroke="#a2b3de"/><text x="240" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#a2b3de">3</text><circle cx="150" cy="42" r="15" fill="rgba(111,233,205,.2)" stroke="#6fe9cd"/><text x="150" y="47" text-anchor="middle" font-size="12" font-weight="800" fill="#6fe9cd">4</text><text x="150" y="164" text-anchor="middle" font-size="8.5" fill="#75818b">4박(위)의 큰 반동이 다음 강박(1)을 끌어옴</text></svg><p><b>해석 · </b>비팅은 <b>네 축</b>의 조합이에요 — 점(악티브↔파시브)·크기·방향·강세. 기준 다이얼(질감) 하나에 따로 도는 셋(크기·방향·강세)을 얹어, 기본형에선 정렬되고 표현에선 어긋나게 운용합니다.</p><div class="cnote"><b>지휘 함의 · </b>매일 트레이너의 4박 도형 궤적·반동을 그대로 손으로 재현하며, 네 축을 곡에 맞춰 자유롭게 조합하세요.</div>',think:['점·크기·방향·강세 중 하나를 잃은 지휘를 상상해보기 — 어떤 축의 상실이 가장 치명적일까?','4박 도형을 처음 배우는 사람에게 도형보다 먼저 가르쳐야 할 한 가지는?'],listen:['베토벤 교향곡 7번 2악장','4박이 행렬이 되는 것 — 걸음의 음악을 함께 걸어보세요.'],read:[
'도형(1↓ 2← 3→ 4↑): 각 익투스는 방향 끝의 도착점','약박 4박의 큰 반동(위)이 다음 강박을 끌어옴','네 손잡이: 점(질감)×크기×방향×강세','기준 다이얼 하나(질감)+따로 도는 셋(크기·방향·강세) — 기본형에선 정렬'],
q:[mc('표준 4박 도형에서 2박의 방향은?',['아래','안/왼','바깥/오른','위'],1,'1↓ 2← 3→ 4↑.'),
sa('비팅 설계를 이루는 네 축(손잡이)을 쓰시오.','점(질감)·크기·방향·강세','기준=질감, 나머지 셋은 독립 축.'),
mc('4박 도형에서 반동이 가장 큰 박은?',['1박','2박','3박','4박'],3,'위로 크게=악티브, 다음 강박을 끌어옴.')],
task:'앱 이론탭 4박 도형 SVG를 보고 궤적·반동을 그대로 손으로 재현.',hand:'4박 도형을 눈 감고 20회 — 익투스 위치가 유지되는지.'},

{d:65,wk:11,ph:'비팅',t:'복습 — 비팅 종합',lead:'비팅 전체를 문제로 다지기.',concept:'<p><b>11주차 정리.</b> 비팅 전체 — "<b>점을 얼마나 × 얼마나 크게 × 어디로 × 어느 박</b>"의 조합이에요.</p><table class="ctbl"><tr><th>개념</th><th>핵심</th></tr><tr><td>세코·악/파</td><td>점을 얼마나 보여주나 (기준 축)</td></tr><tr><td>강세·레가토</td><td>점 차등 / 점을 잇는 면</td></tr><tr><td>다운/업·두 얼굴</td><td>익투스=최저점 / 주는 얼굴 우선</td></tr><tr><td>4박 도형·네 축</td><td>점·크기·방향·강세</td></tr></table><div class="cnote"><b>복습법 · </b>한 악구를 정해 점(질감)·크기·방향·강세 네 축을 각각 정해 지휘해보세요. 내일은 <b>최종 종합시험</b>이에요.</div>',think:['규칙을 다 익힌 뒤의 자유는 처음의 자유와 무엇이 다를까?','84일 중 내 비팅이 가장 크게 변한 지점은 언제였고, 무엇이 계기였나?'],listen:['말러 교향곡 9번 4악장 마지막 5분','음악이 사라지는 방식 — 마지막 음 이후의 침묵까지가 음악이에요.'],read:['세코·악티브/파시브·강세·레가토·다운업·두얼굴·4박도형 점검','핵심: 점을 얼마나 보여줄까 × 얼마나 크게 × 어디로 × 어느 박'],
q:[mc('파시브 박의 정확성은 어디서 나오나?',['감속 바닥','등속 궤적의 균질함+도착 타이밍','최고점','반동'],1,'연주자는 등속을 보고 도착을 예측.'),
sa('도형은 무엇의 확대·축소인가?','세코','같은 문법을 크기만 바꿔 운용.'),
mc('기본형에서 다운비트의 질감은?',['파시브','악티브','테누토','없음'],1,'다운=악티브, 업=파시브(기본형).'),
sa('점을 얼마나 보여주나 = 비팅의 무슨 축?','기준 축(질감)','악티브↔파시브.')],
task:'한 악구를 정해 점(질감)·크기·방향·강세 네 축을 각각 정해 지휘해보기.',hand:'이번 주 요소를 한 악구에 모두 넣어 지휘하고 녹화.'},

{d:66,wk:11,ph:'모의고사',t:'중간 종합시험 — 이론·비팅',lead:'여기까지가 이론과 기본 비팅이에요. 다음 3주는 이것을 손으로 옮깁니다.',concept:'<p><b>1~11주 종합.</b> 화성·분석·지휘·비팅 전 범위에서 출제돼요. <b>70% 이상</b>이면 다음 단계로 넘어갑니다.</p><table class="ctbl"><tr><th>영역</th><th>핵심 갈무리</th></tr><tr><td>화성</td><td>화음의 질 · T-S-D · 종지 · 전조 · 신리만 PLR</td></tr><tr><td>선율·리듬</td><td>동기 전개 · 비화성음 · 대위 · 헤미올라 · 짜임새</td></tr><tr><td>표현·형식·의미</td><td>다이내믹 아치 · 쉥커 Ursatz · 음형론 · 기대이론</td></tr><tr><td>지휘·비팅</td><td>익투스·예비박 · 오른손/왼손 · 악/파 · 4박 도형</td></tr></table><div class="cnote"><b>여기까지가 절반이에요 · </b>지금까지는 <b>무엇을 아는가</b>였고, 12~14주는 <b>손으로 무엇을 하는가</b>예요. 정서어로 말을 정하고(12주), 왼손으로 실행하고(13주), 복합박 위에서 종합합니다(14주).</div>',think:['지금까지 배운 이론 중 아직 손으로 옮기지 못한 것은 무엇인가?','다음 84일을 스스로 설계한다면 무엇을 넣고 무엇을 뺄까 — 나만의 커리큘럼 초안 잡아보기.'],listen:['베토벤 교향곡 9번 4악장','66일의 끝에서 환희를 — 오늘만은 분석을 완전히 내려놓고, 처음 음악을 사랑하게 된 마음으로.'],read:['화성·분석·지휘·비팅 전 범위','틀린 건 해당 날로 돌아가 마무리'],
q:[mc('T→S→D→T가 뜻하는 것은?',['빠르기','집→떠남→긴장→귀가','조표','박자'],1,'조성음악의 엔진.'),
sa('계류음의 3단계를 순서대로.','준비→걸림→해결','강박 불협에서 순차 하행.'),
mc('쉥커 기본선율의 전형은?',['1-2-3','3-2-1 하행','5-8','반음계'],1,'Urlinie. I-V-I 위에 얹힘.'),
sa('그린의 지휘 모토를 쓰시오.','박의 명료함이 아니라 의도의 명료함','Clarity of intent.'),
mc('익투스(박점)의 위치는?',['최고 속도점','최저점의 감속·전환점','중간','반동'],1,'연주자가 여기에 맞춤.'),
sa('비팅 설계의 네 축을 쓰시오.','점(질감)·크기·방향·강세','기준=질감.')],
task:'66일 완주 축하! 가장 약했던 주제 3개를 골라 나만의 요약 노트 한 장 만들기.',hand:'중간 시험에서 약했던 영역을 4마디 지휘로 표현.'}

{d:67,wk:12,ph:'정서어',t:'정서어란 무엇인가 — 세 축',lead:'어제까지 도형과 손을 익혔어요. 오늘부터는 그 손에 무엇을 담을지 정하는 말을 배웁니다.',
concept:'<p>연습에서 "슬프게"라고 말하면 각자 다른 것을 합니다. <b>정서어</b>는 그 모호함을 없애려고 만든 지시어예요. 형용이 아니라 <b>좌표</b>입니다.</p><h4>세 축</h4><table class="tb"><tr><th>축</th><th>값</th><th>손에서</th></tr><tr><td>밝기</td><td>어둠 · 중간 · 밝음</td><td>음색 요구 — 어느 성부를 앞세울지</td></tr><tr><td>긴장</td><td>이완 · 중간 · 긴장</td><td>박 사이를 잇는가 끊는가</td></tr><tr><td>에너지</td><td>고요 · 중간 · 격동</td><td>동작의 크기</td></tr></table><p>여기에 <b>밀당</b>(없음·조금·많이)이 더해져 <b>크기 등급 r1~r5</b>가 정해져요. 세 축이 같아도 밀당이 다르면 크기가 달라집니다.</p><p class="warn"><b>주의</b> — 정서어는 감정의 이름이 아니라 <b>동작의 처방</b>이에요. "슬픔"이 아니라 "애잔"인 이유는, 애잔이 <b>뒤무겁 · 무르게 · r2</b>라는 구체적 지시를 담기 때문입니다.</p><h4>왜 이 말이 필요한가</h4><p>연습에서 흔한 실패는 지시가 <b>검증 불가능</b>하다는 데 있어요. "더 슬프게"는 맞았는지 틀렸는지 판정할 수 없습니다. 반면 "왼손을 낮게 유지하고 익투스를 흐리게"는 즉시 확인돼요. 정서어는 <b>감정어를 검증 가능한 지시로 바꾸는 사전</b>입니다.</p><p>이 말은 총보 준비에도 씁니다. 악보 여백에 "애잔"이라고 적으면, 그것은 <b>뒤무겁 · 무르게 · r2</b>를 적은 것과 같아요. 다음에 그 페이지를 다시 폈을 때 같은 손이 나옵니다.</p><p class="warn">거꾸로도 쓸 수 있어요 — 연주가 마음에 안 들면 어느 축이 어긋났는지 물으세요. 밝기인가 긴장인가 에너지인가. 원인이 축으로 좁혀지면 고칠 지점이 하나로 정해집니다.</p>',
think:['같은 악구에 "애잔"과 "처연"을 각각 적용하면 무엇이 달라지는가?','내가 지금까지 쓴 지시어 중 좌표가 없는 말은 무엇이었나?'],
listen:['말러 5번 4악장 아다지에토 도입 — 밝기·긴장·에너지를 각각 0~2로 매겨보기','베토벤 5번 1악장 첫 8마디 — 같은 방식으로'],
read:['정서어 = 밝기·긴장·에너지 + 밀당 → 크기 등급 r1~r5','형용이 아니라 좌표. 같은 계열이라도 축이 다르면 다른 손'],
q:[mc('정서어에서 크기 등급(r)을 정하는 요소가 아닌 것은?',['긴장','에너지','밀당','밝기'],3,'크기는 긴장·에너지·밀당으로 산출돼요. 밝기는 음색 축이라 크기와 무관합니다.'),
mc('"슬프게" 대신 정서어를 쓰는 이유로 가장 적절한 것은?',['더 예술적이어서','동작 지시가 구체적으로 정해져서','전통 용어라서','악보에 적혀 있어서'],1,'정서어는 프레이즈 모양·접촉·크기를 함께 지정해요.'),
sa('밝기·긴장·에너지 세 축의 이름을 순서대로 쓰세요.',['밝기','긴장','에너지'],'세 축이 정서어의 골격이에요.')],
task:'앱의 정서어 사전에서 계열 하나를 골라, 그 안의 단어들이 세 축에서 어떻게 갈리는지 표로 적기.',hand:'좋아하는 악구 하나에 정서어 한 단어를 적고, 그 단어대로 4마디 지휘.'},

{d:68,wk:12,ph:'정서어',t:'프레이즈 모양 — 왼손의 곡선',lead:'정서어의 절반은 모양이에요. 마디 안에서 무게를 어디에 두는가.',
concept:'<p><b>프레이즈 모양</b>은 한 마디(또는 한 악구) 안에서 <b>음량의 무게가 어디에 실리는가</b>입니다. 왼손 게이지가 그리는 곡선이 곧 이것이에요.</p><table class="tb"><tr><th>모양</th><th>곡선</th><th>손</th><th>대표어</th></tr><tr><td>앞무겁</td><td>시작이 최대 → 덜어냄</td><td>먼저 눌러 두고 놓아줌</td><td>호령 · 장엄 · 울분</td></tr><tr><td>뒤무겁</td><td>끝이 최대 → 실어감</td><td>뒤로 갈수록 끌어올림</td><td>애잔 · 질주 · 음산</td></tr><tr><td>산모양</td><td>가운데 정점</td><td>부풀렸다 거둠</td><td>애절 · 격정 · 숭고</td></tr><tr><td>평평</td><td>변화 없음</td><td>높이 고정 · 개입 최소</td><td>침울 · 유장 · 의연</td></tr></table><p>모양은 <b>큐 자리</b>도 정해요. 앞무겁이면 1박, 뒤무겁이면 마지막 박, 산모양이면 가운데 박이 신호 지점이 됩니다. 평평은 큐가 없어요 — 개입하지 않는 것이 지시입니다.</p><h4>모양이 곧 계획</h4><p>프레이즈 모양은 <b>악구 전체의 계획</b>이에요. 마디 하나가 아니라 4마디·8마디에 걸쳐 적용할 수도 있습니다. 8마디 뒤무겁이면 마지막 마디가 가장 크고, 그 앞 7마디는 참는 구간이에요.</p><p>14일에서 배운 <b>악구 구조</b>가 여기서 손이 됩니다. 문장(sentence)은 대개 뒤무겁이고, 악절(period)은 두 개의 산모양이 이어진 형태예요. 앞악절의 정점과 뒷악절의 정점 크기가 달라야 대비가 생깁니다.</p><p class="warn">평평을 두려워하지 마세요. 34일의 쉥커 배경 구조처럼, <b>움직이지 않는 것도 구조</b>예요. 계속 부풀리면 정점이 사라집니다.</p>',
think:['같은 "긴장" 계열인데 초조는 평평, 질주는 뒤무겁이다. 무엇이 다른가?','평평에 큐가 없다는 것은 연주자에게 무엇을 요구하는가?'],
listen:['브람스 4번 1악장 첫 주제 — 앞무겁인가 뒤무겁인가','드뷔시 목신 도입부 — 산모양의 예'],
read:['모양 4종: 앞무겁 · 뒤무겁 · 산모양 · 평평','모양이 왼손 곡선과 큐 자리를 동시에 정함'],
q:[mc('뒤무겁 프레이즈의 큐 자리는?',['1박','가운데 박','마지막 박','없음'],2,'뒤로 무게가 가니 마지막 박이 신호 지점이에요.'),
mc('평평 모양의 지시로 옳은 것은?',['가운데를 부풀린다','끝에서 최대로','높이를 고정하고 개입을 줄인다','앞을 강하게'],2,'평평은 개입하지 않는 것 자체가 지시예요.'),
mc('"호령"의 프레이즈 모양은?',['뒤무겁','앞무겁','산모양','평평'],1,'앞에 무게를 다 싣고 내리꽂습니다.')],
task:'앱 왼손을 정서어 모드로 두고, 네 모양을 하나씩 골라 게이지 곡선의 차이를 눈으로 확인하기.',hand:'네 가지 모양을 각각 4마디씩 지휘 — 옆에서 본 사람이 어느 모양인지 맞히는지 확인.'},

{d:69,wk:12,ph:'정서어',t:'접촉 — 오른손의 익투스',lead:'모양이 왼손이면 접촉은 오른손이에요. 점을 어떻게 찍는가.',
concept:'<p><b>접촉</b>은 익투스에서 손이 소리를 만나는 방식이에요. 9주에 배운 <b>악티브·파시브</b>가 여기서 세 단계로 정밀해집니다.</p><table class="tb"><tr><th>접촉</th><th>익투스</th><th>예비박</th><th>대표어</th></tr><tr><td>무르게</td><td>점을 흐리고 미끄러짐</td><td>길고 느리게, 점 없이</td><td>애잔 · 유장 · 숭고</td></tr><tr><td>곧게</td><td>또렷하되 과하지 않게</td><td>또렷하게, 점을 남기고</td><td>경쾌 · 장엄 · 비장</td></tr><tr><td>찌르게</td><td>콕 찍어 소리를 끌어냄</td><td>짧고 단호하게</td><td>호령 · 질주 · 익살</td></tr></table><p>접촉은 <b>도형의 물리</b>를 바꿔요. 찌르게는 도착 가속이 커지고 반동이 작아집니다. 무르게는 반대로 아치가 넓어지고 감속이 완만해져요. 앱의 도형이 실제로 그렇게 움직입니다.</p><p>여기에 <b>긴장 축</b>이 겹칩니다. 긴장이 높으면 박 사이에서 손이 잠깐 멈춰요(세코). 긴장이 낮으면 멈추지 않고 흐릅니다(레가토).</p><h4>접촉과 소리의 관계</h4><p>익투스는 <b>연주자가 활을 놓거나 혀를 떼는 시점</b>이에요. 손이 그 지점에 어떻게 도달하느냐가 소리의 시작을 정합니다.</p><ul class="lesson-ul"><li><b>찌르게</b> — 도착이 급하니 어택이 또렷해져요. 스타카토·마르카토·금관 진입에</li><li><b>곧게</b> — 도착은 분명하되 여유가 있어요. 대부분의 기본값</li><li><b>무르게</b> — 도착이 흐려 소리의 시작이 부드러워요. 현의 레가토·저역 지속에</li></ul><p>27~28일의 관현악법이 여기서 연결돼요. 같은 접촉이라도 <b>악기군마다 반응이 다릅니다</b>. 현은 무르게에 잘 반응하고, 금관은 찌르게가 아니면 뭉쳐요. 그래서 큐를 줄 때 대상 악기군에 맞춰 접촉을 바꾸는 것이 실전이에요.</p>',
think:['찌르게 + 레가토는 가능한 조합인가? 어떤 소리인가?','무르게인데 크기가 최대(r5)인 자리는 무엇을 요구하는가?'],
listen:['스트라빈스키 봄의 제전 서주 — 접촉을 바꿔가며 상상하기','바그너 트리스탄 전주곡 — 무르게의 극단'],
read:['접촉 3종: 무르게 · 곧게 · 찌르게','접촉은 익투스의 물리를 바꿈 — 가속·반동·눌림'],
q:[mc('찌르게 접촉의 익투스 특징은?',['아치가 넓고 감속이 완만','도착 가속이 크고 반동이 작음','점이 흐려짐','움직이지 않음'],1,'콕 찍는 만큼 급하게 도착하고 덜 튑니다.'),
mc('박 사이에서 손이 잠깐 멈추게 만드는 축은?',['밝기','긴장','에너지','밀당'],1,'긴장이 높을수록 세코가 됩니다.'),
sa('접촉 세 종류를 강도가 약한 순서로 쓰세요.',['무르게','곧게','찌르게'],'무르게 → 곧게 → 찌르게')],
task:'같은 4박 도형에서 접촉만 바꿔 세 번 지휘하고, 소리가 어떻게 달라질지 말로 적기.',hand:'같은 4박을 세 접촉으로 반복 — 찌르게·곧게·무르게 사이 익투스 깊이 차이를 거울로 확인.'},

{d:70,wk:12,ph:'정서어',t:'계열 여덟 — 지도 읽기',lead:'37개 단어가 여덟 계열로 묶여요. 계열은 방향, 단어는 좌표입니다.',
concept:'<p>정서어는 <b>8계열 37단어</b>예요. 계열은 큰 방향이고, 그 안의 단어들이 축으로 갈립니다.</p><table class="tb"><tr><th>계열</th><th>단어</th></tr><tr><td>슬픔</td><td>애잔 애절 처연 침울 울분</td></tr><tr><td>흥</td><td>경쾌 흥겹 화사 벅참</td></tr><tr><td>고요</td><td>잔잔 그윽 청아 담백</td></tr><tr><td>긴장</td><td>초조 위태 비장 격정 질주 숨죽임</td></tr><tr><td>장중</td><td>장엄 유장 의연 근엄 호령 숭고</td></tr><tr><td>애틋</td><td>간절 아련 다정 부유</td></tr><tr><td>신비</td><td>몽롱 서늘 아득 음산</td></tr><tr><td>해학</td><td>익살 능청 앙증 짓궂</td></tr></table><p>같은 계열이라도 손은 크게 달라요. <b>장중</b> 계열의 호령(앞무겁·찌르게·r5)과 숭고(산모양·무르게·r5)는 크기만 같고 나머지가 정반대입니다.</p><p class="warn">계열로 고르고 <b>단어로 확정</b>하세요. 계열까지만 정하면 아직 손이 정해지지 않아요.</p><h4>계열 사이의 거리</h4><p>계열은 서로 <b>이웃</b>이 있어요. 슬픔과 애틋은 붙어 있고, 흥과 해학도 가깝습니다. 반면 고요와 긴장은 멀어요. 곡 안에서 정서어가 이동할 때 <b>이웃으로 가면 자연스럽고 멀리 뛰면 사건</b>이 됩니다.</p><p>40일의 <b>기대 이론</b>이 여기 붙어요. 청중은 다음 정서어를 예측하고, 그 예측이 빗나갈 때 놀랍니다. 잔잔에서 격정으로 한 번에 가면 그것이 곧 형식적 사건이에요.</p><p class="warn">한 곡에 정서어를 너무 많이 쓰지 마세요. 악장 하나에 <b>서너 개</b>면 충분해요. 많아지면 각각이 묽어집니다.</p>',
think:['긴장 계열이 6개로 가장 많은 이유는 무엇일까?','내가 자주 지휘하는 곡은 어느 계열에 몰려 있나?'],
listen:['쇼스타코비치 5번 3악장 — 어느 계열의 어느 단어인가','차이콥스키 6번 1악장 2주제 — 애틋인가 슬픔인가'],
read:['8계열 37단어','계열 = 방향 / 단어 = 좌표. 단어까지 가야 손이 정해짐'],
q:[mc('호령과 숭고의 공통점은?',['프레이즈 모양','접촉','크기 등급','밝기'],2,'둘 다 r5 최대 크기지만 모양·접촉은 정반대예요.'),
mc('계열까지만 정했을 때의 문제는?',['크기를 모른다','모양과 접촉이 정해지지 않는다','조성을 모른다','템포를 모른다'],1,'계열은 방향일 뿐이에요.'),
sa('정서어의 계열은 모두 몇 개인가?',['8'],'슬픔·흥·고요·긴장·장중·애틋·신비·해학')],
task:'앱 사전에서 한 계열을 골라, 그 안 단어들을 크기 등급 순으로 나열하기.',hand:'한 계열 안의 단어 넷을 연달아 지휘하고, 무엇이 공통이고 무엇이 다른지 한 줄로.'},

{d:71,wk:12,ph:'정서어',t:'악보에서 정서어 고르기',lead:'거꾸로 갑니다. 악보를 보고 어느 단어인지 정하는 훈련이에요.',
concept:'<p>실전은 반대 방향이에요. 악보가 먼저 있고, 그것을 어느 정서어로 읽을지 정해야 합니다. 근거는 <b>지금까지 배운 이론</b>에서 나와요.</p><h4>악보 → 축 읽기</h4><table class="tb"><tr><th>악보에서</th><th>축</th></tr><tr><td>장·단조, 음역, 배음이 두꺼운가</td><td>밝기</td></tr><tr><td>불협화 밀도, 해결 지연, 반음계</td><td>긴장</td></tr><tr><td>음가·화성 리듬·성부 수</td><td>에너지</td></tr><tr><td>루바토 여지, 아고긱 표시</td><td>밀당</td></tr><tr><td>셈여림 방향(&lt; &gt;), 악구 정점 위치</td><td>프레이즈 모양</td></tr><tr><td>아티큘레이션(스타카토·테누토·레가토)</td><td>접촉</td></tr></table><p>이게 22일(화성 리듬)·25일(셈여림)·26일(아고긱)에서 배운 것이 손으로 이어지는 지점이에요. <b>이론은 정서어를 고르기 위한 근거</b>였습니다.</p><h4>충돌할 때의 우선순위</h4><p>축이 서로 다른 말을 하면 순서가 있어요.</p><ol class="lesson-ul"><li><b>화성과 구조</b>가 먼저예요 — 종지가 어디인지, 정점이 어디인지는 협상 대상이 아닙니다</li><li>다음이 <b>작곡가의 지시</b> — dolce, con fuoco 같은 말은 정서어로 번역할 수 있어요</li><li>마지막이 <b>연주 전통</b>과 개인 해석</li></ol><p>43일의 해석사가 여기서 쓰여요. 같은 악보라도 시대마다 다른 정서어를 골랐고, 그것이 연주 전통의 실체입니다.</p>',
think:['같은 악보를 두 정서어로 읽을 수 있다면, 무엇으로 판단을 가르는가?','작곡가의 지시(dolce, con fuoco)와 정서어는 어떻게 대응하는가?'],
listen:['모차르트 40번 1악장 — 축 6개를 모두 매겨보기','바르톡 현·타·첼 1악장 — 같은 방식으로'],
read:['악보 → 축 → 단어의 순서','근거는 화성 리듬·셈여림·아티큘레이션에서'],
q:[mc('악구의 정점 위치가 알려주는 것은?',['접촉','프레이즈 모양','밝기','조성'],1,'정점이 어디냐가 앞무겁/산모양/뒤무겁을 가릅니다.'),
mc('아티큘레이션이 주로 정하는 것은?',['크기','접촉','밝기','밀당'],1,'스타카토=찌르게, 레가토=무르게 쪽이에요.'),
mc('불협화 밀도와 해결 지연이 알려주는 축은?',['에너지','긴장','밝기','밀당'],1,'긴장 축의 직접 근거예요.')],
task:'가지고 있는 총보에서 한 악구를 골라 축 6개를 매기고, 정서어 하나로 확정하기.',hand:'총보 한 악구에 축 여섯을 매기고 정서어를 확정한 뒤 그대로 지휘.'},

{d:72,wk:12,ph:'정서어',t:'복습 — 정서어 종합',lead:'말에서 손까지의 경로를 한 번에 점검해요.',
concept:'<p><b>12주차 정리.</b> 정서어는 <b>말 → 좌표 → 손</b>의 변환기예요.</p><ul class="lesson-ul"><li><b>축</b> 밝기·긴장·에너지 + 밀당 → 크기 r1~r5</li><li><b>모양</b> 앞무겁·뒤무겁·산모양·평평 → 왼손 곡선 + 큐 자리</li><li><b>접촉</b> 무르게·곧게·찌르게 → 오른손 익투스 물리</li><li><b>계열</b> 8개로 방향을 잡고 단어로 확정</li></ul><p>다음 주는 이 지시를 <b>왼손이 실제로 실행하는 법</b>을 배웁니다.</p>',
think:['정서어 없이 지휘하던 때와 비교해 무엇이 달라졌나?','아직 손에 안 잡히는 단어는 무엇이고 왜인가?'],
listen:['이번 주 들은 곡 중 하나를 다시 — 정서어를 바꿔 상상하기'],
read:['말 → 좌표 → 손','모양=왼손 / 접촉=오른손 / 축=크기와 성격'],
q:[mc('정서어에서 오른손을 직접 규정하는 항목은?',['프레이즈 모양','접촉','밝기','밀당'],1,'접촉이 익투스를 정합니다.'),
mc('왼손 곡선을 정하는 항목은?',['접촉','프레이즈 모양','긴장','밝기'],1,'모양이 곧 왼손 게이지 곡선이에요.'),
mc('크기 등급 r5인데 접촉이 무르게인 단어는?',['호령','격정','숭고','질주'],2,'숭고 — 크되 점이 없습니다.'),
mc('평평 모양에 큐가 없는 이유는?',['크기가 작아서','무게 이동이 없어서','긴장이 낮아서','밝아서'],1,'신호할 지점 자체가 없어요.')],
task:'정서어 6개를 골라 각각 4박 한 마디씩 지휘하고, 옆에서 본 사람이 어느 단어인지 맞히는지 확인.',hand:'정서어 여섯을 무작위로 뽑아 각각 4마디 — 준비 없이 즉시 손이 나오는지.'}
,

{d:73,wk:13,ph:'왼손 실행',t:'왼손의 네 가지 일',lead:'왼손은 박을 세지 않아요. 그럼 무엇을 하나 — 네 가지로 정리합니다.',
concept:'<p>56일에 "왼손=색"이라고 했어요. 이제 그 색을 <b>네 가지 실행 단위</b>로 쪼갭니다.</p><table class="tb"><tr><th>일</th><th>무엇</th><th>미터에서</th></tr><tr><td>크기 유지</td><td>지금 셈여림을 손 높이로 지킴</td><td>초록 게이지 높이</td></tr><tr><td>크기 변화</td><td>크레셴도·디크레셴도</td><td>게이지가 오르내림 + 흰 목표원</td></tr><tr><td>신호</td><td>큐 — 진입 예고</td><td>위쪽 원 + 남은 박 숫자</td></tr><tr><td>지속과 끊기</td><td>음을 붙들고 컷</td><td>금색 선 상승 → 붉은 원</td></tr></table><p class="warn">네 가지는 <b>동시에</b> 일어나요. 크레셴도 중에 큐를 주고, 그 뒤 컷을 하는 일이 한 악구 안에서 벌어집니다. 그래서 왼손이 어려운 거예요.</p><p>오늘은 앱 왼손 미터의 네 요소가 각각 무엇을 가리키는지 눈에 익히는 것이 목표입니다.</p><h4>왼손을 쓰지 않아야 할 때</h4><p>왼손의 가장 어려운 기술은 <b>가만히 있는 것</b>이에요. 지시할 것이 없는데 움직이면 연주자는 무엇을 요구받는지 몰라 혼란해집니다.</p><p>기준은 하나예요 — <b>말할 것이 있을 때만 움직인다</b>. 크기가 바뀌지 않고, 큐도 없고, 지속도 없으면 왼손은 내려두거나 중립에 둡니다.</p><p>59일에서 배운 분리가 여기서 시험돼요. 왼손을 내려두면 오른손이 커지기 쉬워요. 오른손 도형은 왼손과 무관하게 유지되어야 합니다.</p>',
think:['오른손이 왼손 일을 대신하면 무엇이 무너지는가?','네 가지 중 내가 가장 자주 빠뜨리는 것은?'],
listen:['말러 2번 5악장 — 왼손이 몇 번 개입해야 하는지 세어보기'],
read:['왼손의 네 일: 크기 유지 · 크기 변화 · 신호 · 지속과 끊기','미터: 게이지=크기 / 흰 원=목표 / 위 원=큐 / 금색 선=지속'],
q:[mc('왼손 미터에서 흰 원이 뜻하는 것은?',['현재 크기','도달할 목표 크기','큐 시점','컷 시점'],1,'게이지가 흰 원에 닿으면 깜빡여요.'),
mc('금색 선이 꼭대기에 닿으면?',['크레셴도 완료','컷','큐','정지'],1,'붉은 원이 점멸하며 컷을 알립니다.'),
mc('왼손의 네 가지 일에 해당하지 않는 것은?',['크기 변화','신호','박 세기','지속과 끊기'],2,'박은 오른손의 일이에요.')],
task:'앱 왼손 미터를 켜고 네 요소를 손가락으로 짚어가며 이름 말하기.',hand:'8마디 동안 왼손을 완전히 내려두고 오른손만 — 왼손이 올라오려 하는 순간을 기록.'},

{d:74,wk:13,ph:'왼손 실행',t:'크레셴도와 디크레셴도',lead:'가장 흔하고 가장 자주 실패하는 일. 길이를 미리 정해야 해요.',
concept:'<p>크레셴도의 실패는 대개 <b>너무 일찍 커지는 것</b>입니다. 4마디짜리 크레셴도를 1마디에 다 써버리면 남은 3마디가 평평해져요.</p><h4>세 가지 결정</h4><ul class="lesson-ul"><li><b>어디서 시작</b> — 몇 번째 마디부터</li><li><b>몇 마디에 걸쳐</b> — 2·4·8마디</li><li><b>어디까지</b> — 도달할 크기(흰 목표원)</li></ul><p>앱에서 이 셋을 설정하면 게이지가 그 속도로만 올라가요. <b>남은 마디 수</b>가 실시간으로 표시되니, 지금 속도가 맞는지 눈으로 확인할 수 있습니다.</p><p>디크레셴도는 대칭이지만 심리적으로 더 어려워요. 줄이는 동작은 <b>안 하는 것</b>처럼 보이기 쉬워서, 손을 적극적으로 내려야 합니다. 25일(셈여림)에서 배운 "줄임도 능동"이 여기서 손으로 실현돼요.</p><p class="warn">준비는 반대로 — 크레셴도 직전에는 <b>먼저 작아져야</b> 올릴 자리가 생겨요.</p><h4>크레셴도의 세 실패</h4><ul class="lesson-ul"><li><b>일찍 다 씀</b> — 남은 구간이 평평해진다</li><li><b>계단식</b> — 마디마다 툭툭 커져 연속성이 없다</li><li><b>오른손 동반</b> — 왼손만 커져야 하는데 도형까지 커져 템포가 흔들린다</li></ul><p>25일의 다이내믹 아치가 근거예요. 크레셴도는 <b>목적지가 있는 여정</b>이고, 그 목적지는 대개 악구의 정점이나 종지 직전입니다. 목적지를 모르면 배분이 불가능해요.</p><p>디크레셴도는 <b>끝을 정하는 것</b>이 더 중요해요. 어디까지 줄일지 정하지 않으면 소리가 사라져버립니다.</p>',
think:['4마디 크레셴도에서 2마디째의 적정 크기는 얼마인가?','디크레셴도가 소극적으로 보이지 않으려면?'],
listen:['시벨리우스 2번 4악장 종결 크레셴도 — 몇 마디에 걸치는지','라벨 볼레로 — 극단적 장기 크레셴도의 배분'],
read:['크레셴도 3결정: 시작 마디 · 길이 · 도달 크기','준비는 반대로 — 크게 전에 작게'],
q:[mc('4마디 크레셴도에서 흔한 실패는?',['너무 늦게 커짐','1마디에 다 써버림','시작을 크게 함','끝을 작게 함'],1,'남은 마디가 평평해져요.'),
mc('크레셴도 직전에 해야 할 일은?',['미리 크게','먼저 작게','정지','큐'],1,'올릴 자리를 만들어야 해요.'),
mc('앱에서 크레셴도 진행을 확인하는 표시는?',['위쪽 원','남은 마디 수와 게이지 높이','금색 선','붉은 원'],1,'남은 마디가 실시간으로 줄어듭니다.')],

{d:75,wk:13,ph:'왼손 실행',t:'큐 — 위치와 예비',lead:'큐는 주는 순간이 아니라 준비하는 과정이에요.',
concept:'<p>큐가 늦는 이유는 대개 <b>예비가 없어서</b>입니다. 큐도 박이므로 <b>한 박 전의 준비 동작</b>이 있어야 해요. 앱 미터의 위쪽 원이 <b>0.75박 전부터 금색 점선</b>으로 바뀌는 게 그 지점입니다.</p><h4>큐의 3단계</h4><ul class="lesson-ul"><li><b>예비</b> — 손을 살짝 내려 자리를 만든다(직전 박 후반)</li><li><b>큐</b> — 시선과 함께 정확히 그 박에</li><li><b>되돌림</b> — 준 뒤 곧바로 중립으로. 남아 있으면 다음 큐가 죽는다</li></ul><p>큐 <b>위치</b>는 프레이즈 모양이 정해요(68일). 앞무겁이면 1박, 뒤무겁이면 마지막 박. 다만 실제 총보에서는 <b>진입하는 성부</b>가 우선입니다 — 모양은 기본값, 악보가 최종.</p><p>57일에 배운 시선이 여기서 결합해요. <b>손보다 시선이 먼저</b> 갑니다.</p><h4>큐를 주지 않아야 할 때</h4><p>모든 진입에 큐를 주면 아무것도 강조되지 않아요. 큐는 <b>필요한 곳에만</b> 줍니다.</p><ul class="lesson-ul"><li>오래 쉰 뒤 들어오는 성부</li><li>독주·솔리</li><li>박이 애매한 자리에서의 진입(당김음·여린내기)</li><li>음량이 작아 놓치기 쉬운 진입</li></ul><p>17일의 모방 진입이 좋은 연습이에요. 푸가 주제가 네 번 들어오면 네 번 다 큐를 줄 수도, 첫 번째만 줄 수도 있어요. <b>무엇을 들려주고 싶은가</b>가 판단 기준입니다.</p>',
think:['큐를 준 뒤 손이 남아 있으면 무엇이 문제인가?','시선과 손 중 무엇이 먼저인가, 왜인가?'],
listen:['베토벤 9번 4악장 성악 진입 — 큐가 몇 박 전부터 준비되어야 하는지'],
read:['큐 3단계: 예비 → 큐 → 되돌림','위치는 모양이 기본값, 총보의 진입 성부가 최종'],
q:[mc('큐의 예비 동작은 언제 시작하나?',['같은 박에','직전 박 후반','두 박 전','필요 없다'],1,'앱에서는 0.75박 전부터 점선으로 표시돼요.'),
mc('큐를 준 뒤 반드시 해야 할 것은?',['크게 유지','중립으로 되돌림','정지','컷'],1,'되돌리지 않으면 다음 큐가 죽어요.'),
mc('큐 위치의 최종 근거는?',['프레이즈 모양','총보의 진입 성부','템포','조성'],1,'모양은 기본값이고 악보가 최종이에요.')],
task:'앱에서 큐 위치를 1박·중간·마지막으로 바꿔가며, 예비→큐→되돌림 3단계를 손으로 반복.',hand:'큐를 네 방향으로 각각 — 정면·왼쪽·오른쪽·아래. 시선이 먼저 가는지 확인.'},

{d:76,wk:13,ph:'왼손 실행',t:'지속음과 컷',lead:'붙들고 있다가 끊는 일. 길이를 손에 담아야 해요.',
concept:'<p>지속은 <b>가만히 있는 것이 아니라</b> 붙들고 있는 것이에요. 손이 멈추면 소리도 죽습니다. 높이를 유지하되 <b>미세한 장력</b>이 남아 있어야 해요.</p><h4>컷의 문법</h4><ul class="lesson-ul"><li>컷도 <b>예비가 있는 박</b>이다 — 갑자기 끊으면 소리가 지저분해진다</li><li>컷의 방향이 잔향을 정한다 — 위로 걷으면 열리고, 아래로 닫으면 마른다</li><li>페르마타 뒤 컷은 <b>다음 진입의 예비</b>를 겸한다</li></ul><p>앱에서는 <b>시작 박</b>과 <b>음가</b>를 정할 수 있어요. 3박부터 2분음표를 붙들면 금색 선이 그만큼 올라가고, 꼭대기에서 붉은 원이 점멸합니다. <b>복합박에서는 박마다 길이가 달라</b> 시작 박이 바뀌면 컷 시점도 달라져요.</p><h4>컷의 종류</h4><ul class="lesson-ul"><li><b>닫는 컷</b> — 아래로 모으며 끝. 잔향을 짧게. 종지에</li><li><b>여는 컷</b> — 위로 걷으며 끝. 잔향을 남김. 페르마타 뒤·악장 끝에</li><li><b>이어지는 컷</b> — 끊자마자 다음 예비로. 총휴지 없이 진행할 때</li></ul><p>컷의 <b>타이밍</b>은 음가로 정해집니다. 온음표를 4박째 끝에서 끊을지 다음 마디 첫 박에서 끊을지는 악보가 정해요. 앱에서 음가와 시작 박을 설정하면 그 지점이 계산돼 표시됩니다.</p>',
think:['컷을 위로 걷을 때와 아래로 닫을 때 홀의 잔향은 어떻게 달라지는가?','지속 중 손이 완전히 멈추면 무엇이 사라지는가?'],
listen:['브루크너 교향곡의 총휴지 — 컷 방향을 상상하기','베르디 레퀴엠 Dies irae 뒤 정적'],
read:['지속=붙들기, 멈춤이 아님','컷도 예비가 있는 박. 방향이 잔향을 정함'],
q:[mc('지속 중 손이 완전히 멈추면?',['정확해진다','소리가 죽는다','커진다','빨라진다'],1,'미세한 장력이 남아야 해요.'),
mc('페르마타 뒤 컷의 추가 역할은?',['템포 제시','다음 진입의 예비','조성 제시','셈여림 제시'],1,'컷이 곧 다음의 예비가 됩니다.'),
mc('복합박에서 지속음 시작 박을 바꾸면?',['컷 시점이 달라진다','크기가 달라진다','템포가 달라진다','변화 없다'],0,'박마다 길이가 달라 끝 지점이 이동해요.')],
task:'앱에서 7/8을 고르고 지속음 시작 박을 1·2·3박으로 바꿔가며 컷 시점 차이를 확인.',hand:'닫는 컷·여는 컷을 각각 다섯 번 — 잔향이 다르게 상상되는지.'},

{d:77,wk:13,ph:'왼손 실행',t:'정서어를 왼손으로',lead:'12주의 말과 13주의 실행이 만나는 날이에요.',
concept:'<p>정서어를 고르면 <b>왼손 곡선이 자동으로 정해집니다</b>. 앱의 정서어 모드가 그것을 그려줘요. 하지만 손은 자동이 아니에요 — 그 곡선을 <b>몸으로 재현</b>해야 합니다.</p><h4>단어 → 왼손</h4><table class="tb"><tr><th>단어</th><th>왼손</th></tr><tr><td>애잔(뒤무겁·r2)</td><td>낮게 시작해 마디 끝으로 조금씩 끌어올림</td></tr><tr><td>호령(앞무겁·r5)</td><td>첫 박에 최대로 눌러 두고 놓아줌</td></tr><tr><td>숭고(산모양·r5)</td><td>크게 부풀렸다 거둠 — 점 없이</td></tr><tr><td>숨죽임(평평·r1)</td><td>아주 낮게 고정. 개입하지 않음</td></tr></table><p>여기서 <b>오른손은 계속 박을 유지</b>해야 해요. 59일에 배운 분리가 시험되는 지점입니다. 왼손이 곡선을 그리는 동안 오른손 도형이 흔들리면 실패예요.</p><h4>손이 곡선을 재현하는 법</h4><p>화면의 곡선을 그대로 따라 하려 하지 마세요. 곡선은 <b>결과</b>이고, 손은 <b>원인</b>이에요. 원인 쪽을 다뤄야 합니다.</p><ul class="lesson-ul"><li><b>앞무겁</b> — 시작에서 팔 전체를 쓰고, 뒤로 갈수록 손목만 남긴다</li><li><b>뒤무겁</b> — 손목에서 시작해 팔뚝·어깨로 점점 커진다</li><li><b>산모양</b> — 가운데에서만 팔꿈치가 몸에서 떨어진다</li><li><b>평평</b> — 팔의 높이를 고정하고 호흡만 유지한다</li></ul><p>58일의 팔 메커니즘이 여기서 실전이 돼요. 크기는 <b>어느 관절을 쓰느냐</b>로 정해집니다.</p>',
think:['왼손 곡선을 따라가다 오른손이 흔들리는 순간은 언제인가?','r1 단어에서 "개입하지 않음"을 어떻게 능동적으로 보이게 하는가?'],
listen:['말러 9번 1악장 — 한 악구를 골라 정서어를 정하고 왼손 곡선 그리기'],
read:['정서어 → 왼손 곡선은 자동, 재현은 몸의 일','오른손 유지가 전제'],
q:[mc('정서어 모드에서 오른손의 역할은?',['왼손을 따라간다','박 패턴을 유지한다','쉰다','같이 곡선을 그린다'],1,'미러링은 실패예요.'),
mc('"숨죽임"의 왼손은?',['크게 부풀림','아주 낮게 고정','끝에서 최대','앞에서 최대'],1,'평평·r1 — 개입하지 않는 것이 지시예요.'),
mc('"호령"의 왼손 진행은?',['점점 올림','첫 박 최대 후 덜어냄','가운데 정점','변화 없음'],1,'앞무겁이에요.')],
task:'정서어 4개를 골라 각각 4마디씩, 오른손 도형을 유지한 채 왼손 곡선만 재현하기.',hand:'정서어 네 개를 골라 왼손 곡선만 재현. 오른손 도형이 흔들리면 처음부터.'},

{d:78,wk:13,ph:'왼손 실행',t:'복습 — 왼손 종합',lead:'네 가지 일을 한 악구에 겹쳐 넣습니다.',
concept:'<p><b>13주차 정리.</b> 왼손은 <b>크기 유지 · 크기 변화 · 신호 · 지속과 끊기</b>를 동시에 합니다.</p><ul class="lesson-ul"><li>크레셴도는 <b>시작·길이·도달</b> 셋을 미리 정한다</li><li>큐는 <b>예비 → 큐 → 되돌림</b> 3단계</li><li>컷은 예비가 있는 박이고 방향이 잔향을 정한다</li><li>정서어가 곡선을 정하고, 오른손은 흔들리지 않는다</li></ul><p>다음 주는 이 모든 것을 <b>복합박</b> 위에서 합니다. 박 길이가 불규칙해지면 왼손의 계산이 달라져요.</p>',
think:['한 악구에 네 가지를 다 넣으려면 무엇을 먼저 버려야 하는가?','왼손이 과해지는 신호는 무엇인가?'],
listen:['이번 주 곡 하나를 다시 — 왼손 계획을 종이에 적고 지휘'],
read:['네 일의 동시 수행','다음 주: 복합박 위에서의 왼손'],
q:[mc('큐 3단계의 순서는?',['큐→예비→되돌림','예비→큐→되돌림','되돌림→예비→큐','예비→되돌림→큐'],1,'준비가 먼저예요.'),
mc('크레셴도에서 미리 정할 세 가지가 아닌 것은?',['시작 마디','길이','도달 크기','조성'],3,'조성은 무관해요.'),
mc('왼손이 과한지 판단하는 기준으로 적절한 것은?',['크기가 큰가','지시가 없는 구간에도 움직이는가','속도가 빠른가','높이가 높은가'],1,'개입할 이유가 없을 때 움직이면 과한 거예요.'),
mc('지속 중 손의 상태는?',['완전 정지','미세한 장력 유지','흔들기','내리기'],1,'붙들고 있어야 소리가 삽니다.')],
task:'8마디 악구 하나에 크레셴도 + 큐 + 컷을 모두 배치한 계획표를 만들고 지휘.',hand:'8마디에 크레셴도 + 큐 + 컷을 모두 넣고 한 번에 — 녹화해서 셋이 다 보이는지 확인.'}
,

{d:79,wk:14,ph:'복합박',t:'묶음의 원리 — 2와 3',lead:'복합박은 어려운 게 아니라 다른 거예요. 원리는 하나뿐입니다.',
concept:'<p>8분음표 계열의 박자는 <b>2와 3의 조합</b>으로만 묶여요. 4나 5짜리 묶음은 없습니다 — 그건 이미 두 묶음이에요.</p><table class="tb"><tr><th>박자</th><th>묶음</th><th>지휘 박</th></tr><tr><td>5/8</td><td>3+2 또는 2+3</td><td>2박</td></tr><tr><td>7/8</td><td>2+2+3 · 3+2+2 · 2+3+2</td><td>3박</td></tr><tr><td>9/8</td><td>3+3+3 · 2+2+2+3 …</td><td>3박 또는 4박</td></tr><tr><td>11/8</td><td>3+3+3+2 · 2+2+2+2+3 …</td><td>4박 또는 5박</td></tr></table><p class="warn">핵심 — <b>묶음 개수가 곧 지휘 박 수</b>예요. 7/8은 일곱 번 젓는 게 아니라 <b>세 번</b> 젓습니다.</p><p>그리고 <b>박마다 길이가 달라요</b>. 3묶음 박은 2묶음 박보다 1.5배 깁니다. 도형에서 그 박은 더 오래 머물고, 물리적으로 <b>더 높이 튀어요</b> — 체공 시간이 길수록 반동이 커지니까요.</p><h4>왜 2와 3뿐인가</h4><p>사람이 한 덩어리로 느낄 수 있는 최소 단위가 2와 3이기 때문이에요. 4는 2+2로 쪼개져 들리고, 5는 3+2나 2+3으로 갈립니다. 그래서 <b>모든 박은 결국 2와 3의 조합</b>이에요.</p><p>19~20일의 리듬 기법에서 배운 헤미올라가 이 원리의 응용입니다. 3+3을 2+2+2로 다시 묶는 것이 헤미올라예요 — 같은 여섯인데 묶음이 달라 다른 음악이 됩니다.</p><p class="warn">복합박이 어려운 이유는 <b>박이 불규칙해서가 아니라</b>, 우리가 균등한 박에 익숙해서예요. 묶음을 몸에 넣으면 규칙은 오히려 단순합니다.</p><h4>박을 흔드는 장치</h4><table class="tb"><tr><th>장치</th><th>뜻</th></tr><tr><td>아나크루시스 anacrusis</td><td>여린내기<b>의 음</b>. 첫 강박 앞에 놓인 음(들). 그 음이 담긴 <b>마디</b>가 못갖춘마디예요 \u2014 둘은 가리키는 대상이 다릅니다. 예비박이 그만큼 짧아져요.</td></tr><tr><td>당김음 syncopation</td><td>약박에 무게. <b>지휘가 원래 박을 지켜야</b> 당김이 들립니다.</td></tr><tr><td>헤미올라 hemiola</td><td>3박 둘이 2박 셋으로. 3/4 두 마디가 3/2 한 마디처럼.</td></tr><tr><td>폴리리듬 polyrhythm</td><td>같은 마디 안에서 <b>다른 분할</b>이 겹침(3 대 2). 마디선은 공유해요.</td></tr><tr><td>폴리미터 polymeter</td><td><b>다른 박자표</b>가 동시에 진행. 마디선 자체가 어긋납니다.</td></tr><tr><td>메트릭 모듈레이션</td><td>앞 박의 분할값을 새 박으로 삼아 템포를 바꿔요. <b>단순 변박과 다릅니다</b>.</td></tr></table>',
think:['7/8을 일곱 번 저으면 무엇이 무너지는가?','같은 7/8인데 2+2+3과 3+2+2는 무엇이 다르게 들리는가?'],
listen:['바르톡 불가리안 리듬 — 묶음을 귀로 세기','스트라빈스키 봄의 제전 희생의 춤 — 변박의 묶음 추적'],
read:['복합박 = 2와 3의 조합만','묶음 개수 = 지휘 박 수 / 3묶음은 1.5배 길다'],
q:[mc('3박 둘이 2박 셋으로 다시 묶여 들리는 것은?',['당김음','헤미올라','메트릭 모듈레이션','폴리미터'],1,'3+3을 2+2+2로 다시 묶는 것이 헤미올라예요.'),
mc('7/8의 지휘 박 수는?',['7박','3박','2박','4박'],1,'2+2+3 = 세 묶음이에요.'),
mc('복합박에 나올 수 없는 묶음은?',['2','3','4','둘 다 나온다'],2,'4는 이미 2+2예요.'),
mc('3묶음 박이 2묶음 박보다 도형에서 다른 점은?',['더 짧다','더 오래 머물고 더 높이 튄다','같다','더 낮다'],1,'체공 시간이 길수록 반동이 큽니다.')],
task:'앱에서 5/8·7/8·9/8을 각각 켜고, 박마다 점이 머무는 시간 차이를 눈으로 확인.',hand:'5/8·7/8·9/8을 각각 8마디씩 — 긴 박에서 손이 실제로 더 오래 머무는지.'},

{d:80,wk:14,ph:'복합박',t:'묶음 바꿔 넣기',lead:'같은 박자표라도 묶음이 바뀌면 다른 곡이 됩니다.',
concept:'<p>7/8을 <b>2+2+3</b>으로 젓다가 <b>3+2+2</b>로 바꾸면, 긴 박이 끝에서 처음으로 옮겨가요. 도형에서 <b>큰 반동의 위치</b>가 통째로 이동합니다.</p><h4>바꿔 넣기 훈련</h4><ul class="lesson-ul"><li>한 박자표에서 묶음만 바꿔 8마디씩 지휘</li><li>긴 박이 어디인지 <b>몸이 먼저</b> 알 때까지</li><li>바뀌는 순간 오른손이 흔들리지 않는지 확인</li></ul><p>실제 총보에서 묶음은 <b>작곡가가 빔(beam)으로 알려줘요</b>. 19~20일의 리듬 기법에서 배운 빔 읽기가 여기서 실전이 됩니다. 빔이 애매하면 화성 리듬(22일)이 근거예요 — 화음이 바뀌는 자리가 묶음의 시작일 가능성이 높습니다.</p><h4>변박을 준비하는 법</h4><p>마디마다 묶음이 바뀌는 곡은 <b>미리 표시</b>하는 것이 유일한 방법이에요. 총보 위에 각 마디의 묶음을 숫자로 적고(2+2+3 식), 그것을 <b>읽으며</b> 지휘합니다.</p><p>전환에서 흔들리는 이유는 대개 <b>예비박 길이가 바뀌는 것</b>을 잊어서예요. 마지막 묶음이 3에서 2로 줄면 예비박도 그만큼 짧아집니다.</p>',
think:['빔과 화성 리듬이 서로 다른 묶음을 가리키면 무엇을 따르는가?','묶음이 마디마다 바뀌는 곡은 어떻게 준비하는가?'],
listen:['버르토크 미크로코스모스 불가리안 6곡 — 묶음 변화 추적','메시앙 — 비대칭 리듬의 묶음'],
read:['묶음이 바뀌면 긴 박의 위치가 이동','근거: 빔 → 화성 리듬 순'],
q:[mc('7/8을 3+2+2로 바꾸면?',['긴 박이 첫 박으로','긴 박이 사라짐','박 수가 늘어남','템포가 빨라짐'],0,'큰 반동이 앞으로 옮겨가요.'),
mc('묶음 판단의 1차 근거는?',['화성 리듬','작곡가의 빔','템포','조성'],1,'빔이 먼저, 애매하면 화성 리듬이에요.'),
mc('묶음이 바뀔 때 확인할 것은?',['템포 유지','오른손 도형이 흔들리지 않는지','왼손 크기','조성'],1,'전환에서 도형이 무너지기 쉬워요.')],
task:'앱에서 7/8의 세 묶음을 번갈아 설정하며 각 8마디씩, 전환 지점에서 멈추지 않고 이어가기.',hand:'7/8 세 묶음을 4마디씩 번갈아 — 전환에서 멈추지 않기.'},

{d:81,wk:14,ph:'복합박',t:'도형 설계 — 가로축 배분',lead:'박이 많아지면 도형을 직접 설계해야 해요.',
concept:'<p>도형의 원리는 셋뿐이에요.</p><ul class="lesson-ul"><li><b>1박은 최저점</b> — 모든 다운비트는 바닥</li><li><b>마지막 박은 최고점</b> — 다음 마디의 예비</li><li><b>나머지는 좌우로</b> — 안쪽에서 바깥쪽 순서로</li></ul><p>그래서 5박·7박·9박도 새로 외울 것이 없어요. <b>가운데 박들을 왼쪽 몇 개, 오른쪽 몇 개</b>로 나눌지만 정하면 됩니다.</p><table class="tb"><tr><th>박</th><th>기본 배분</th></tr><tr><td>4박</td><td>왼1 · 오1</td></tr><tr><td>5박</td><td>왼1 · 오2</td></tr><tr><td>7박</td><td>왼2 · 오3</td></tr><tr><td>9박</td><td>왼3 · 오4</td></tr></table><p class="warn">한쪽이 0인 배분은 3박에서만 성립해요. 그 외에는 양쪽에 최소 하나씩 있어야 동작이 균형을 잃지 않습니다.</p><p>순서는 항상 <b>안쪽 → 바깥쪽</b>이에요. 손이 중심에서 점점 벌어져 나가는 것이 자연스럽습니다.</p><h4>도형은 정보다</h4><p>도형은 미적 대상이 아니라 <b>연주자에게 주는 정보</b>예요. 배분을 바꾸는 이유도 정보 전달이 쉬워지기 때문입니다.</p><p>판단 기준은 둘이에요 — <b>익투스가 구분되는가</b>(같은 자리에 두 박이 겹치지 않는가), <b>다음 박이 예측되는가</b>. 이 둘이 되면 어떤 배분도 정답이에요.</p><p>55일에서 배운 "오른손=시간"이 여기서 확장돼요. 박이 많아질수록 시간의 <b>공간적 배치</b>가 중요해집니다.</p>',
think:['같은 7박에서 왼2·오3과 왼3·오2 중 어느 쪽이 편한가, 왜인가?','배분을 바꾸면 연주자가 읽는 정보는 어떻게 달라지는가?'],
listen:['거슈윈 — 불규칙 박의 지휘 영상 관찰(가능하면)'],
read:['도형 3원리: 1박 최저 · 끝박 최고 · 나머지는 좌우 안→밖','한쪽 0은 3박에서만'],
q:[mc('도형에서 마지막 박의 위치는?',['최저점','최고점','왼쪽 끝','오른쪽 끝'],1,'다음 마디의 예비예요.'),
mc('가운데 박들의 배치 순서는?',['바깥에서 안으로','안에서 바깥으로','무작위','위에서 아래로'],1,'손이 중심에서 벌어져 나갑니다.'),
mc('7박의 기본 좌우 배분은?',['왼0·오5','왼2·오3','왼5·오0','왼1·오4'],1,'양쪽에 최소 하나씩 두는 것이 원칙이에요.')],
task:'앱 가로축 설정에서 7박의 배분을 모두 시험하고, 가장 손에 맞는 것을 고르기.',hand:'7박 배분을 세 가지로 바꿔 각각 8마디 — 어느 쪽이 익투스가 가장 잘 구분되는지.'},

{d:82,wk:14,ph:'복합박',t:'예비박과 아우프탁트',lead:'시작을 어떻게 여는가 — 첫 소리는 예비박이 결정합니다.',
concept:'<p>예비박은 <b>한 박이지 신호가 아니에요</b>. 그 한 박 안에 템포·셈여림·성격이 전부 담깁니다. 예비박이 흔들리면 첫 소리가 흔들려요.</p><h4>세 가지 원칙</h4><ul class="lesson-ul"><li><b>마지막 박 자리에서 시작</b> — 예비 마디의 1·2박은 정지, 마지막 박에서 손이 움직인다</li><li><b>성격을 미리 담는다</b> — 접촉이 찌르게면 예비도 짧고 단호하게, 무르게면 길고 점 없이</li><li><b>여린내기는 업이 악티브</b> — 다운이 아니라 업에 무게가 실린다</li></ul><p>복합박에서는 <b>마지막 묶음의 길이</b>가 곧 예비박 길이예요. 7/8(2+2+3)이면 예비박이 3묶음만큼 길고, 3+2+2면 2묶음만큼 짧습니다. 같은 곡인데 시작 호흡이 달라져요.</p><p>앱은 예비 한 마디를 세되 <b>마지막 박에서만</b> 점이 움직입니다. 그것이 아우프탁트예요.</p><h4>예비박이 담는 네 가지</h4><ul class="lesson-ul"><li><b>템포</b> — 예비박의 속도가 곧 곡의 속도</li><li><b>셈여림</b> — 예비박의 크기가 첫 소리의 크기</li><li><b>성격</b> — 접촉이 어택을 예고한다</li><li><b>호흡</b> — 관·성악은 예비박에 맞춰 숨을 쉰다</li></ul><p>57일의 호흡이 여기서 결정적이에요. 지휘자가 예비박에서 숨을 쉬지 않으면 연주자도 못 쉽니다. <b>들숨이 예비박</b>이에요.</p>',
think:['예비박에 성격을 담지 않으면 첫 소리는 어떻게 되는가?','여린내기 곡의 예비박은 몇 박인가?'],
listen:['베토벤 5번 1악장 — 예비박의 길이와 성격','브람스 1번 4악장 도입 — 느린 예비'],
read:['예비박은 한 박. 템포·셈여림·성격을 담는다','복합박은 마지막 묶음 길이가 예비박 길이'],
q:[mc('예비 마디에서 손이 움직이기 시작하는 지점은?',['1박','가운데','마지막 박','계속 움직임'],2,'그것이 아우프탁트예요.'),
mc('접촉이 무르게인 곡의 예비박은?',['짧고 단호하게','길고 느리게, 점 없이','없음','두 박'],1,'성격을 미리 담아야 해요.'),
mc('7/8(2+2+3)과 3+2+2의 예비박 차이는?',['없다','길이가 다르다','방향이 다르다','박 수가 다르다'],1,'마지막 묶음 길이가 예비박 길이예요.')],
task:'같은 곡을 묶음 두 가지로 설정해 예비박 길이 차이를 몸으로 비교.',hand:'같은 곡을 예비박만 세 가지 성격으로 시작 — 첫 소리가 달라지는지.'},

{d:83,wk:14,ph:'복합박',t:'실전 종합 — 총보 한 쪽',lead:'배운 전부를 한 쪽에 쏟아붓습니다.',
concept:'<p>총보 한 쪽을 준비하는 <b>순서</b>를 고정합니다. 이것이 84일의 결론이에요.</p><ol class="lesson-ul"><li><b>박자와 묶음</b> — 빔을 보고 묶음, 묶음 개수로 지휘 박, 도형 배분 결정</li><li><b>화성</b> — 기능과 종지 위치. 어디가 도착이고 어디가 통과인가(1~12일)</li><li><b>구조</b> — 악구 경계와 정점(13~14일, 31~36일)</li><li><b>정서어</b> — 축 여섯을 매기고 단어 확정(67~72일)</li><li><b>왼손 계획</b> — 크레셴도 구간·큐 지점·컷 위치를 악보에 표시(73~78일)</li><li><b>예비박</b> — 길이와 성격 결정(82일)</li></ol><p class="warn">순서를 지키는 이유 — <b>앞 단계가 뒤 단계의 근거</b>이기 때문이에요. 정서어를 먼저 정하면 화성이 그것을 부정할 때 되돌아가야 합니다.</p><h4>준비의 결과물</h4><p>여섯 단계를 마치면 총보 위에 이런 것이 남아 있어야 해요.</p><ul class="lesson-ul"><li>마디마다 묶음 숫자(복합박인 경우)</li><li>종지 지점 표시 — 어디가 도착인가</li><li>악구 경계와 정점 표시</li><li>구간별 정서어 3~4개</li><li>크레셴도 구간의 시작·끝, 큐 지점, 컷 위치</li><li>첫 예비박의 길이와 성격</li></ul><p class="warn">이것이 다 적혀 있으면 <b>연습이 짧아집니다</b>. 리허설에서 헤매는 시간은 대개 준비에서 정하지 않은 것을 그 자리에서 정하느라 생겨요.</p>',
think:['이 순서 중 내가 늘 건너뛰던 단계는 무엇인가?','정서어와 화성이 충돌하면 무엇을 따르는가?'],
listen:['직접 준비 중인 곡 한 쪽을 이 순서로 처리하기'],
read:['준비 순서: 박자·묶음 → 화성 → 구조 → 정서어 → 왼손 → 예비박','앞 단계가 뒤 단계의 근거'],
q:[mc('준비 순서에서 정서어를 정하는 시점은?',['가장 먼저','화성과 구조 다음','가장 마지막','아무 때나'],1,'구조를 알아야 근거 있는 정서어가 나와요.'),
mc('순서를 지키는 이유는?',['빠르니까','앞 단계가 뒤 단계의 근거라서','전통이라서','악보에 그렇게 적혀서'],1,'거꾸로 가면 되돌아가게 됩니다.'),
mc('도형 배분을 정하는 단계는?',['1단계 박자와 묶음','정서어 단계','왼손 계획','예비박'],0,'묶음 개수가 박 수를 정하고 배분이 따라옵니다.')],
task:'총보 한 쪽을 여섯 단계로 처리하고, 각 단계 결론을 한 줄씩 적기.',hand:'총보 한 쪽을 여섯 단계로 준비한 뒤 처음부터 끝까지 지휘하고 녹화.'},

{d:84,wk:14,ph:'모의고사',t:'3차 종합시험 — 정서어·왼손·복합박',lead:'12~14주 종합. 다음 주는 이것을 리허설에서 쓰는 법이에요.',
concept:'<p><b>12~14주 종합.</b> 정서어·왼손 실행·복합박 전 범위예요. 앞의 이론도 함께 나옵니다.</p><p>이 과정의 결론은 하나예요 — <b>이론은 손을 위한 근거</b>이고, <b>손은 이론의 실현</b>입니다. 화성을 아는 이유는 어디가 도착인지 알기 위해서고, 도착을 알아야 익투스의 무게가 정해져요. 정서어를 쓰는 이유는 그 무게를 말로 옮겨 연습에서 재현하기 위해서고요.</p><p>70% 이상이면 다음 단계로 넘어갑니다. <b>15주는 리허설</b> — 지금까지 만든 것을 사람들 앞에서 쓰는 법이에요.</p>',
think:['정서어를 쓰기 전과 후, 내 연습 지시는 어떻게 달라졌나?','왼손의 네 가지 일 중 아직 몸에 안 붙은 것은?'],
listen:['처음에 들었던 곡을 다시 — 무엇이 다르게 들리는가'],
read:['이론은 손을 위한 근거, 손은 이론의 실현'],
q:[mc('종지의 기능적 정의는?',['화음이 바뀌는 곳','긴장이 해소되며 악구가 닫히는 곳','음이 높아지는 곳','템포가 느려지는 곳'],1,'도착 지점이에요.'),
mc('7/8(2+3+2)의 지휘 박 수와 긴 박 위치는?',['7박, 없음','3박, 2번째','3박, 3번째','2박, 1번째'],1,'세 묶음 중 가운데가 3묶음이에요.'),
mc('정서어에서 왼손 곡선을 정하는 항목은?',['접촉','프레이즈 모양','밝기','에너지'],1,'모양이 곧 곡선입니다.'),
mc('큐의 3단계는?',['큐→예비→되돌림','예비→큐→되돌림','예비→되돌림→큐','큐→되돌림'],1,'준비가 먼저예요.'),
mc('도형에서 1박의 위치는?',['최고점','최저점','왼쪽','오른쪽'],1,'모든 다운비트는 바닥이에요.'),
mc('크레셴도 직전에 해야 할 것은?',['미리 크게','먼저 작게','정지','큐'],1,'올릴 자리를 만들어야 합니다.'),
sa('총보 준비 순서의 첫 단계는 무엇인가?',['박자','묶음'],'박자와 묶음 — 여기서 지휘 박 수가 나옵니다.')],
task:'정서어·왼손·복합박 중 가장 약한 하나를 골라 다음 주 리허설에서 시험할 계획 세우기.',hand:'가장 자신 있는 악구를 지휘해 녹화하고, 84일 전 영상과 비교.'}

{d:85,wk:15,ph:'리허설',t:'멈추는 법',lead:'리허설의 실력은 멈추는 판단에서 갈려요. 멈춤 자체가 시간을 씁니다.',
concept:'<p>지휘자가 멈추면 <b>수십 명의 시간</b>이 함께 멈춰요. 그러니 멈춤은 값을 치르는 행위입니다. 값을 치를 만한지 먼저 판단하세요.</p><h4>멈춰야 할 때</h4><ul class="lesson-ul"><li>다시 연주하면 <b>확실히 나아질</b> 문제일 때</li><li>여럿이 함께 걸린 문제 — 한 사람 문제는 나중에 개별로</li><li>구조적 오해 — 묶음·박자·형식을 잘못 읽고 있을 때</li></ul><h4>넘어가야 할 때</h4><ul class="lesson-ul"><li>연습으로만 해결되는 개인 기술 문제</li><li>지금 고쳐도 다음 통주에서 되돌아올 문제</li><li>남은 시간이 부족할 때 — 우선순위가 낮은 것</li></ul><h4>멈추는 동작</h4><p>손을 <b>완전히 닫아</b> 멈춥니다. 어정쩡하게 내리면 계속 연주하는 사람이 생겨요. 그리고 <b>소리가 다 죽은 뒤에</b> 말하세요. 잔향 위에 말하면 절반은 안 들립니다.</p><p class="warn">가티가 마스터클래스에서 반복한 말 — <b>지시한 뒤에는 동작을 줄이고 귀를 열어라.</b> 멈춰서 요구했으면 그다음은 그 요구가 지켜지는지 <b>듣는 것</b>이 일이에요.</p>',
think:['오늘 리허설에서 멈춘 횟수 중 값을 치를 만했던 것은 몇 번인가?','넘어간 문제를 나중에 어떻게 관리할 것인가?'],
listen:['가티·라틀 등의 공개 리허설 영상 — 멈추는 지점과 이유를 기록하기'],
read:['멈춤은 수십 명의 시간을 쓰는 일','손을 완전히 닫아 멈추고, 소리가 죽은 뒤 말한다','지시 뒤에는 동작을 줄이고 듣는다'],
q:[mc('멈춘 직후 말하기 전에 기다려야 하는 이유는?',['예의상','잔향 위에서는 말이 절반만 들려서','호흡을 고르려고','악보를 보려고'],1,'소리가 죽은 뒤 말해야 전달돼요.'),
mc('멈추지 않고 넘어가야 할 문제는?',['여럿이 함께 걸린 문제','구조적 오해','개인 연습으로만 해결되는 기술 문제','묶음 오독'],2,'개별로 다루는 것이 효율적이에요.'),
mc('지시한 직후 지휘자가 할 일은?',['더 크게 젓기','동작을 줄이고 듣기','다시 설명하기','다음 구간으로'],1,'요구가 지켜지는지 확인하는 것이 일이에요.')],
task:'다음 리허설에서 멈춘 횟수와 각각의 이유를 기록하고, 값을 치를 만했는지 자평.',
hand:'8마디를 지휘하다 임의 지점에서 손을 완전히 닫아 멈추기 — 거울로 보아 멈춤이 분명한지 확인.'},

{d:86,wk:15,ph:'리허설',t:'말하는 순서',lead:'같은 요구도 순서가 틀리면 전달되지 않아요.',
concept:'<p>순서는 하나예요 — <b>위치 → 무엇 → 왜 → 어떻게</b>.</p><div class="cnote"><b>예 · </b>"62마디 셋째 박, 목관. 화음이 바뀌는데 균형이 그대로예요. 3음이 오보에로 넘어가니까 오보에가 한 단계 올라와 주세요."</div><ul class="lesson-ul"><li><b>위치를 먼저</b> — 악보를 펴놓고 들어야 나머지가 들어옵니다. 마디 번호와 박, 그리고 파트</li><li><b>무엇</b> — 관찰된 사실. 판단이 아니라 사실</li><li><b>왜</b> — 음악적 근거. 화성·구조·성부 관계</li><li><b>어떻게</b> — 실행 가능한 지시 한 가지</li></ul><h4>부정 대신 요구로</h4><p>"너무 크다"는 무엇을 하라는 말이 아니에요. <b>"여기서 첼로가 들려야 해요"</b>가 지시입니다. 같은 결과를 요구하면서 방향이 반대예요 — 앞은 위축시키고 뒤는 목표를 줍니다.</p><p class="warn">한 번에 <b>한 가지</b>만. 세 가지를 말하면 대개 하나도 안 됩니다.</p>',
think:['내가 자주 쓰는 지시 문장을 이 순서로 다시 써보면?','"왜"를 생략해도 되는 경우는 언제인가?'],
listen:['리허설 영상에서 지휘자의 말을 위치·무엇·왜·어떻게로 분해해보기'],
read:['위치 → 무엇 → 왜 → 어떻게','부정 대신 요구로. 한 번에 한 가지'],
q:[mc('지시에서 가장 먼저 말해야 하는 것은?',['왜','위치','어떻게','무엇'],1,'악보를 펴야 나머지가 들려요.'),
mc('"너무 크다" 대신 좋은 표현은?',['조금만 작게','여기서 첼로가 들려야 해요','p로','줄이세요'],1,'목표를 주는 요구가 실행 가능해요.'),
mc('한 번에 여러 지시를 하면?',['효율적이다','대개 하나도 안 된다','시간이 절약된다','기억에 남는다'],1,'한 가지씩이 원칙이에요.')],
task:'지난 리허설에서 했던 지시 다섯 개를 네 단계 순서로 다시 쓰기.',
hand:'거울 앞에서 지시 문장 세 개를 소리 내어 말하고, 말하는 동안 손이 움직이지 않는지 확인.'},

{d:87,wk:15,ph:'리허설',t:'진단 순서',lead:'앙상블이 안 맞을 때 원인을 좁히는 순서가 있어요.',
concept:'<p>층위를 건너뛰면 되돌아옵니다. <b>위층부터</b> 좁히세요.</p><table class="tb"><tr><th>순서</th><th>층</th><th>확인</th></tr><tr><td>1</td><td>템포</td><td>모두 같은 속도로 느끼는가. 묶음·박 해석이 같은가</td></tr><tr><td>2</td><td>밸런스</td><td>들려야 할 성부가 들리는가. 화성 3음·7음이 묻히지 않는가</td></tr><tr><td>3</td><td>아티큘레이션</td><td>길이와 어택이 일치하는가. 보잉·텅잉이 같은가</td></tr><tr><td>4</td><td>인토네이션</td><td>화음 안에서의 음정. 3음은 낮게, 이끔음은 높게</td></tr></table><p>인토네이션이 안 맞는 것처럼 들리는 문제의 상당수는 <b>밸런스 문제</b>예요. 3음이 너무 크면 화음이 탁해져 음정이 나간 것처럼 들립니다. 밸런스를 고치면 음정이 저절로 맞는 경우가 많아요.</p><p>템포가 안 맞는 것처럼 들리는 문제도 종종 <b>아티큘레이션 문제</b>입니다. 음의 길이가 다르면 함께 시작해도 어긋나 들려요.</p><p class="warn">2일의 화성 기능과 28일의 관현악법이 여기서 진단 도구가 돼요. <b>어느 음이 들려야 하는가</b>를 알아야 밸런스를 판단할 수 있습니다.</p>',
think:['최근 "음정이 안 맞는다"고 느낀 지점이 사실은 밸런스 문제는 아니었나?','템포 문제와 아티큘레이션 문제를 어떻게 구별하는가?'],
listen:['같은 곡의 두 녹음 비교 — 밸런스 차이가 화성의 인상을 어떻게 바꾸는지'],
read:['진단 순서: 템포 → 밸런스 → 아티큘레이션 → 인토네이션','인토네이션 문제의 상당수는 밸런스 문제'],
q:[mc('진단의 첫 층위는?',['인토네이션','템포','밸런스','아티큘레이션'],1,'위층부터 좁혀야 되돌아오지 않아요.'),
mc('화음이 탁하게 들릴 때 우선 의심할 것은?',['음정','3음의 밸런스','템포','활 속도'],1,'3음이 크면 음정이 나간 것처럼 들려요.'),
mc('함께 시작했는데 어긋나 들리면?',['템포 문제만','음의 길이(아티큘레이션) 차이','인토네이션','좌석 배치'],1,'길이가 다르면 어긋나 들립니다.')],
task:'한 악구에서 문제를 발견하고 네 층위 중 어디인지 판정한 뒤, 그 층위만 고쳐보기.',

{d:88,wk:15,ph:'리허설',t:'물리적 지시',lead:'추상적 요구를 악기의 물리로 바꾸면 즉시 소리가 변해요.',

function palUn(d){return Math.min(PAL.length,2+Math.floor(d/3));}
function palShuf(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function palWeak(u){var arr=[];for(var i=0;i<u;i++){var m=(ST.cmem&&ST.cmem[PAL[i].q])||{s:0,c:0};var w=1+Math.max(0,m.s-m.c)*3+(m.s===0?4:0);for(var k=0;k<w;k++)arr.push(i);}return arr[rnd(arr.length)];}
function buildColor(d){var u=palUn(d);var fresh=(d%3===0)?u-1:-1;CQ=[];
  for(var i=0;i<3;i++){var ti=(i===0&&fresh>=0)?fresh:palWeak(u);var root=60+rnd(8);
    var notes=PAL[ti].set.map(function(x){return x+root;});
    var pool=[];for(var j=0;j<u;j++)if(j!==ti)pool.push(j);palShuf(pool);
    var ch=palShuf([ti].concat(pool.slice(0,Math.min(3,pool.length))));
    CQ.push({ti:ti,notes:notes,ch:ch});}
  var h2='';
  if(fresh>=0){h2+='<div class="col-new"><i style="background:'+PAL[fresh].c+'"></i><div><b>오늘 새 색 · '+PAL[fresh].n+'</b><br><span>'+PAL[fresh].f+'</span></div><button class="col-hear" onclick="colHear('+fresh+')">▶ 듣기</button></div>';}
  CQ.forEach(function(q,i){h2+='<div class="col-q"><button class="ear-play" onclick="colPlay('+i+')">▶ 재생 '+(i+1)+'</button><div class="col-opts">'+q.ch.map(function(j){return '<button class="col-chip" onclick="colPick('+i+','+j+',this)"><i style="background:'+PAL[j].c+'"></i>'+PAL[j].n+'</button>';}).join('')+'</div><div class="ear-r" id="colr'+i+'"></div></div>';});
  h2+='<button class="col-again" onclick="buildColor('+d+')">↻ 새 문제</button>';
  var w=document.getElementById('colWrap');if(w)w.innerHTML=h2;}

      +'<div class="gs-r"><span class="gs-k">방향</span><span class="gs-v">'+w.gl+'</span></div>'
      +'<div class="gs-r"><span class="gs-k">축</span><span class="gs-v">밝기 '+LEXAX.b.st[w.b]+' · 긴장 '+LEXAX.t.st[w.t]+' · 에너지 '+LEXAX.e.st[w.e]+' · 밀당 '+LEXMD[w.m]+' · 크기 '+SZL[w.r]+'</span></div>'
      +'<div class="gs-r"><span class="gs-k">손</span><span class="gs-v">'+lexShapeText(w)+'</span></div>'
      +'</div></div>';
  });
  document.getElementById('gsBody').innerHTML=h;
}

function openRef(key){btStop();var h='<button class="back" onclick="goHome()">← 학습 지도로</button><div class="l-head"><div class="l-day">참고 사전 · REFERENCE</div><div class="l-t">기호 · 인물 · 구조</div><div class="l-lead">공부 중 언제든 찾아보는 상설 참고. 순서·번호와 무관하게 항상 같은 내용이에요.</div></div><div class="ref-search"><input type="text" placeholder="기호·인물·구조 검색 — 예: sfz, 쉥커, 소나타" oninput="refSearch(this.value)"></div><div class="ref-nav">'+REFTABS.map(function(t){return '<button class="'+(t[0]===key?'on':'')+'" onclick="refSwitch(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div><div id="refBody"></div>';document.getElementById('lessonBody').innerHTML=h;document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';window.scrollTo(0,0);refSwitch(key);}
function refSwitch(key){document.querySelectorAll('.ref-nav button').forEach(function(b,i){b.classList.toggle('on',REFTABS[i][0]===key);});var bd=document.getElementById('refBody');var html='';if(key==='sym'){REF.sym.forEach(function(cat){html+='<div class="ref-cat">'+cat[0]+'</div><ul class="ref-list">'+cat[1].map(function(x){return '<li><span class="term">'+x[0]+'</span><span class="desc">'+x[1]+'</span></li>';}).join('')+'</ul>';});}else{var arr=key==='people'?REF.people:key==='struct'?REF.struct:REF.conduct;html='<ul class="ref-list">'+arr.map(function(x){return '<li><span class="term">'+x[0]+'</span><span class="desc">'+x[1]+'</span></li>';}).join('')+'</ul>';}bd.innerHTML=html;}

function refSearch(q){q=(q||'').trim().toLowerCase();var bd=document.getElementById('refBody');if(!bd)return;if(!q){document.querySelectorAll('.ref-nav button').forEach(function(b,i){if(i===0)b.classList.add('on');else b.classList.remove('on');});refSwitch('sym');return;}
var idx=[];REF.sym.forEach(function(cat){cat[1].forEach(function(x){idx.push(['음악 기호',x[0],x[1]]);});});REF.people.forEach(function(x){idx.push(['인물',x[0],x[1]]);});REF.struct.forEach(function(x){idx.push(['구조',x[0],x[1]]);});REF.conduct.forEach(function(x){idx.push(['지휘 언어',x[0],x[1]]);});
var res=idx.filter(function(it){return (it[1]+' '+it[2]).toLowerCase().indexOf(q)>=0;});
document.querySelectorAll('.ref-nav button').forEach(function(b){b.classList.remove('on');});
bd.innerHTML=res.length?'<ul class="ref-list">'+res.map(function(it){return '<li><span class="term">'+it[1]+'</span><span class="desc"><span style="color:var(--slate);font-size:.72rem;font-weight:700">['+it[0]+'] </span>'+it[2]+'</span></li>';}).join('')+'</ul>':'<div style="padding:20px;text-align:center;color:var(--muted)">검색 결과 없음</div>';}


/* ── 화성 건반 실기 (2옥타브·근음·전위 진행) ── */
var QUAL={triad:[['장3화음',[0,4,7]],['단3화음',[0,3,7]],['증3화음',[0,4,8]],['감3화음',[0,3,6]]],seventh:[['maj7',[0,4,7,11]],['딸림7(7)',[0,4,7,10]],['m7',[0,3,7,10]],['m7♭5',[0,3,6,10]],['dim7',[0,3,6,9]]]};
var NOTENAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
var HARMPLAN={1:'c-tri',2:'c-7th',3:'root-tri',4:'root-7th',5:'inv-tri',6:'inv-7th',7:'roman',8:'roman7',9:['roman','inv-7th'],10:['roman7','roman-min'],11:['roman7','roman-min','inv-7th']};
var HARMDESC={'c-tri':'C 위 3화음 쌓기 (기본기)','c-7th':'C 위 7화음 쌓기','root-tri':'여러 근음의 3화음 (이조)','root-7th':'여러 근음의 7화음','inv-tri':'3화음 전위 — 지정된 자리로','inv-7th':'7화음 전위','roman':'조성 안 로마숫자 화음 (I·IV·V…를 C장조에서 직접)','roman7':'로마숫자 7화음 (V7·ii7…)','roman-min':'단조 로마숫자 (a·e·d단조)'};
var HARM={mode:'c-tri',cur:null,sel:[]};
function noteName(m){return NOTENAMES[m%12];}
function pianoSVG(){var W=336,whitePCs=[0,2,4,5,7,9,11],whiteMidis=[];for(var oct=0;oct<2;oct++)whitePCs.forEach(function(pc){whiteMidis.push(60+oct*12+pc);});var ww=W/whiteMidis.length;var s='<svg viewBox="0 0 '+W+' 132" class="piano">';whiteMidis.forEach(function(m,i){s+='<rect id="pk'+m+'" class="pk pkw" x="'+(i*ww)+'" y="0" width="'+(ww-1)+'" height="130" rx="3" onclick="harmKey('+m+')"/><text x="'+(i*ww+ww/2)+'" y="123" text-anchor="middle" font-size="7.5" fill="#5c6670" pointer-events="none">'+noteName(m)+'</text>';});var lw={1:0,3:2,6:5,8:7,10:9};for(var oct=0;oct<2;oct++){[1,3,6,8,10].forEach(function(pc){var m=60+oct*12+pc;var li=whiteMidis.indexOf(60+oct*12+lw[pc]);var x=(li+1)*ww-ww*0.32;s+='<rect id="pk'+m+'" class="pk pkb" x="'+x+'" y="0" width="'+(ww*0.64)+'" height="82" rx="2" onclick="harmKey('+m+')"/>';});}return s+'</svg>';}
function genHarm(mode){if(mode==='roman'||mode==='roman7'||mode==='roman-min'){var D3={I:[0,4,7],ii:[2,5,9],iii:[4,7,11],IV:[5,9,12],V:[7,11,14],vi:[9,12,16]};var D7={I:[0,4,7,11],ii:[2,5,9,12],IV:[5,9,12,16],V:[7,11,14,17],vi:[9,12,16,19]};var MIN={i:[0,3,7],iv:[5,8,12],V:[7,11,14],V7:[7,11,14,17],VI:[8,12,15],'ii\u00b0':[2,5,8]};var label,notes;if(mode==='roman-min'){var mp=['i','iv','V','V7','VI','ii\u00b0'];var mr=mp[rnd(mp.length)];var MKEYS=[['a',69],['e',64],['d',62]];var mk=MKEYS[rnd(3)];notes=MIN[mr].map(function(x){return x+mk[1];});label=mk[0]+'단조에서 <b>'+mr+'</b>';}else{var KEYS=[['C',60],['G',67],['D',62],['F',65],['B♭',70]];var kk=KEYS[rnd(KEYS.length)];var isR7=mode==='roman7';var pool=isR7?['I','ii','IV','V','vi']:['I','ii','iii','IV','V','vi'];var r=pool[rnd(pool.length)];var ivl=(isR7?D7:D3)[r];notes=ivl.map(function(x){return x+kk[1];});label=kk[0]+'장조에서 <b>'+r+(isR7?'7':'')+'</b>';}while(Math.max.apply(null,notes)>83){notes=notes.map(function(n){return n-12;});}while(Math.min.apply(null,notes)<60){notes=notes.map(function(n){return n+12;});}notes.sort(function(a,b){return a-b;});return{label:label,notes:notes};}var isSev=mode.indexOf('7')>=0;var pool=isSev?QUAL.seventh:QUAL.triad;var q=pool[rnd(pool.length)];var root=60;if(mode.indexOf('root')>=0||mode.indexOf('inv')>=0)root=[60,62,64,65,67][rnd(5)];var notes=q[1].map(function(x){return x+root;});var label=noteName(root)+'음 위 <b>'+q[0]+'</b>';if(mode.indexOf('inv')>=0){var inv=1+rnd(q[1].length-1);for(var k=0;k<inv;k++){var mn=Math.min.apply(null,notes);notes[notes.indexOf(mn)]=mn+12;}label+=' · <b>'+inv+'전위</b>';}notes.sort(function(a,b){return a-b;});while(Math.max.apply(null,notes)>83){notes=notes.map(function(n){return n-12;});}while(Math.min.apply(null,notes)<60){notes=notes.map(function(n){return n+12;});}notes.sort(function(a,b){return a-b;});return{label:label,notes:notes};}
function harmNew(){var _md=Array.isArray(HARM.mode)?HARM.mode[rnd(HARM.mode.length)]:HARM.mode;HARM.cur=genHarm(_md);HARM.sel=[];for(var m=60;m<=83;m++){var k=document.getElementById('pk'+m);if(k)k.classList.remove('sel','ok','no');}var pr=document.getElementById('harmPrompt');if(pr)pr.innerHTML=HARM.cur.label+' 쌓기';var r=document.getElementById('harmR');if(r){r.textContent='';r.className='harm-r';}}
function harmKey(m){var i=HARM.sel.indexOf(m);var k=document.getElementById('pk'+m);if(i>=0){HARM.sel.splice(i,1);if(k)k.classList.remove('sel');}else{HARM.sel.push(m);if(k)k.classList.add('sel');}}
function harmCheck(){if(!HARM.cur)return;var ans=HARM.cur.notes.slice().sort(function(a,b){return a-b;});var sel=HARM.sel.slice().sort(function(a,b){return a-b;});var ok=ans.length===sel.length&&ans.every(function(v,i){return v===sel[i];});for(var m=60;m<=83;m++){var k=document.getElementById('pk'+m);if(!k)continue;k.classList.remove('sel');if(ans.indexOf(m)>=0)k.classList.add('ok');else if(HARM.sel.indexOf(m)>=0)k.classList.add('no');}playChord(ans,1.5);var r=document.getElementById('harmR');if(r){r.textContent=ok?'정답! ('+ans.map(noteName).join(' ')+')':'다시 — 정답은 초록 건반 ('+ans.map(noteName).join(' ')+')';r.className='harm-r '+(ok?'ok':'no');}}renderHome();
</script>
