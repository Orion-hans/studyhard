<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1014">
<title>Logic Training</title>
<style>
:root{
  --ink:#0C1014; --panel:#161C23; --panel2:#11161C; --line:#2A343F; --line2:#3A4653;
  --acc:#E8A33D; --acc2:#5AC8D8; --txt:#EDF1F5; --mut:#93A1B0; --dim:#68788A;
  --ok:#67C98A; --no:#E8646F;
  --lcd:#FFCF6B; --lcd-bg:#1A1206;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--ink);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.62;letter-spacing:-.011em;overscroll-behavior-y:none;}
body.fs1{font-size:18.5px;} body.fs2{font-size:20px;}
b,strong{font-weight:700;color:#fff;}
k{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600;color:var(--txt);
  background:#212C38;border:1px solid var(--line2);border-bottom-width:2px;padding:.05em .45em;
  border-radius:6px;font-size:.86em;white-space:nowrap;letter-spacing:0;display:inline-block;}
v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600;color:var(--lcd);
  background:var(--lcd-bg);border:1px solid #4A340F;padding:.05em .4em;border-radius:6px;
  font-size:.86em;white-space:nowrap;letter-spacing:0;display:inline-block;}

#app{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + var(--sb));}

/* ── 헤더: 트랜스포트 LCD ── */
header{position:sticky;top:0;z-index:30;background:#0C1014f2;backdrop-filter:blur(10px);
  border-bottom:1px solid #1C242E;padding-top:calc(var(--st) + 8px);}
.hin{max-width:680px;margin:0 auto;padding:0 14px;}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 1px 7px;}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em;color:#fff;}
.brand b i{font-style:normal;color:var(--acc);}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.04em;}
.lcd{margin:0 0 8px;background:var(--lcd-bg);border:1px solid #4A340F;border-radius:9px;
  display:flex;align-items:stretch;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff10;}
.lcd .cell{flex:1;padding:4px 3px 5px;text-align:center;border-right:1px solid #3A2A0C;}
.lcd .cell:last-child{border-right:none;}
.lcd .n{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px;font-weight:700;
  color:var(--lcd);line-height:1.15;letter-spacing:.01em;}
.lcd .l{font-size:8.5px;color:#A8813C;letter-spacing:.08em;margin-top:1px;}
.bar{height:4px;background:#1B242E;border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1);}

/* ── 본문 ── */
main{padding:16px 15px 26px;flex:1;width:100%;max-width:680px;margin:0 auto;}
.pane{display:none;} .pane.on{display:block;}

.h1{font-size:13px;letter-spacing:.11em;color:var(--acc);font-weight:700;margin-bottom:5px;}
.h2{font-size:1.42em;font-weight:800;line-height:1.34;letter-spacing:-.022em;margin-bottom:14px;}
.goal{background:linear-gradient(#1B222B,#161C23);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:0 12px 12px 0;padding:14px 15px;margin-bottom:18px;color:#DEE6EE;line-height:1.72;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;margin-bottom:15px;}
.ct{font-size:12px;letter-spacing:.1em;color:var(--acc2);font-weight:700;margin-bottom:11px;
  display:flex;align-items:center;gap:7px;}
.ct::before{content:"";width:14px;height:2px;background:var(--acc2);border-radius:2px;}
.card p{margin-bottom:15px;color:#D6DEE7;line-height:1.78;} .card p:last-child{margin-bottom:0;}
.card p+p{padding-top:1px;}

.step{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;background:var(--panel2);}
.step:last-child{margin-bottom:0;}
.step .sn{font-weight:700;color:#fff;margin-bottom:7px;font-size:15px;}
.step ol{list-style:none;counter-reset:s;}
.step li{counter-increment:s;position:relative;padding-left:27px;margin-bottom:9px;color:#CDD7E1;font-size:.93em;line-height:1.66;}
.step li:last-child{margin-bottom:0;}
.step li::before{content:counter(s);position:absolute;left:0;top:.15em;width:18px;height:18px;
  background:#232F3C;border-radius:5px;color:var(--acc);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;}

ul.dot{list-style:none;} ul.dot li{position:relative;padding-left:18px;margin-bottom:11px;color:#D6DEE7;line-height:1.72;}
ul.dot li:last-child{margin-bottom:0;}
ul.dot li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;
  background:var(--acc);border-radius:50%;}

.krow{display:flex;flex-wrap:wrap;gap:8px;}
.kitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px 6px 7px;font-size:14.5px;color:#C3CDD8;}

/* 체크 */
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #1F2831;cursor:pointer;}
.chk:last-child{border-bottom:none;}
.box{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:2px solid var(--line2);
  background:var(--panel2);position:relative;transition:.16s;margin-top:1px;}
.chk.on .box{background:var(--ok);border-color:var(--ok);}
.chk.on .box::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;
  border:solid #0C1014;border-width:0 2.6px 2.6px 0;transform:rotate(43deg);}
.chk span{flex:1;color:#D4DCE5;} .chk.on span{color:var(--dim);text-decoration:line-through;}

/* 퀴즈 */
.q{margin-bottom:16px;} .q:last-child{margin-bottom:0;}
.qq{font-weight:700;color:#fff;margin-bottom:10px;}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:8px;color:#D4DCE5;font:inherit;font-size:16px;transition:.14s;}
.opt:active{filter:brightness(1.3);}
.opt.right{border-color:var(--ok);background:#12241A;color:#B7E9C9;}
.opt.wrong{border-color:var(--no);background:#241214;color:#F0B6BB;}
.exp{display:none;margin-top:4px;padding:11px 13px;background:#131A22;border:1px solid var(--line);
  border-left:3px solid var(--acc2);border-radius:0 10px 10px 0;font-size:15.5px;color:#BDC8D3;}
.exp.on{display:block;}

/* 이동 */
.nav{display:flex;gap:10px;margin-top:18px;}
.nav button{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:14px 10px;color:var(--txt);font:inherit;font-weight:700;font-size:16px;}
.nav button:active{filter:brightness(1.35);}
.nav button.pri{background:linear-gradient(#E8A33D,#D08D28);border-color:#F0B65E;color:#1A1206;}
.nav button:disabled{opacity:.32;}

/* 과정 목록 */
.sg{margin-bottom:20px;}
.sgh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;padding-left:2px;}
.sgn{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--acc);
  background:var(--lcd-bg);border:1px solid #4A340F;border-radius:5px;padding:1px 6px;}
.sgt{font-weight:800;font-size:18px;letter-spacing:-.01em;}
.sgs{font-size:13px;color:var(--dim);}
.di{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer;}
.di:active{filter:brightness(1.3);}
.di.done{border-color:#2A4A38;background:#131E19;}
.dn{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;
  font-size:13px;font-weight:700;color:var(--mut);}
.di.done .dn{background:var(--ok);border-color:var(--ok);color:#0C1014;}
.di.cur .dn{background:var(--acc);border-color:var(--acc);color:#1A1206;}
.dt{flex:1;font-size:15.5px;color:#D4DCE5;line-height:1.4;}
.di.done .dt{color:var(--dim);}

/* 진도 — 채널 스트립 랙 */
.rack{display:flex;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:16px 11px 12px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.rack::-webkit-scrollbar{display:none;}
.strip{flex:0 0 30px;display:flex;flex-direction:column;align-items:center;gap:7px;}
.pct{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--mut);}
.strip.full .pct{color:var(--ok);}
.slot{width:100%;max-width:26px;height:132px;background:#0A0E12;border:1px solid var(--line);
  border-radius:7px;position:relative;overflow:hidden;}
.slot::before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:3px;margin-left:-1.5px;
  background:#1C242E;border-radius:3px;}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;
  background:linear-gradient(#E8A33D33,#E8A33D11);transition:height .5s cubic-bezier(.4,0,.2,1);}
.cap{position:absolute;left:2px;right:2px;height:13px;bottom:0;background:linear-gradient(#3E4C5A,#232F3C);
  border:1px solid #4E5E6E;border-radius:3px;transition:bottom .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 1px 3px #00000060;}
.cap::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:var(--acc);border-radius:2px;}
.strip.full .cap::after{background:var(--ok);}
.strip.full .fill{background:linear-gradient(#67C98A33,#67C98A11);}
.sl{font-size:10px;color:var(--dim);text-align:center;line-height:1.25;height:24px;overflow:hidden;}
.sno{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--mut);}

.stat{display:flex;gap:10px;margin-bottom:16px;}
.stat div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;}
.stat .n{font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:800;color:var(--acc);line-height:1.1;}
.stat .l{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-top:3px;}

/* 단축키 · 사전 */
.srch{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;
  padding:12px 14px;color:var(--txt);font:inherit;font-size:16px;margin-bottom:14px;}
.srch:focus{outline:none;border-color:var(--acc);}
.grow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #1B232C;}
.grow:last-child{border-bottom:none;}
.grow k{flex:0 0 auto;min-width:78px;text-align:center;}
.grow span{flex:1;color:#C3CDD8;font-size:15.5px;}
.gl{font-weight:700;color:#fff;margin-bottom:3px;}
.gd{color:#B4C0CB;font-size:15.5px;}
.gitem{padding:11px 0;border-bottom:1px solid #1B232C;}
.gitem:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--dim);padding:34px 0;font-size:15px;}

t{color:#fff;border-bottom:1px dashed #5AC8D899;cursor:pointer;}
.eng{color:var(--dim);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.8em;
  font-weight:600;margin-left:7px;letter-spacing:0;}
t:active{background:#5AC8D826;}
.tmi{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #1B232C;align-items:baseline;}
.tmi:last-child{border-bottom:none;}
.tmw{flex:0 0 auto;color:var(--acc2);font-weight:700;font-size:.94em;}
.tmd{flex:1;color:#C6D1DC;font-size:.92em;line-height:1.65;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
  border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:20px 20px calc(24px + var(--sb));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.3,0,.2,1);box-shadow:0 -8px 30px #00000070;}
.sheet.on{transform:translateY(0);}
.sheet .sw{font-size:1.16em;font-weight:800;color:#fff;margin-bottom:8px;}
.sheet .sd{color:#CBD5DF;line-height:1.75;}
.sheet .sx{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:17px;line-height:1;}
.scrim{position:fixed;inset:0;z-index:55;background:#00000080;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.on{opacity:1;pointer-events:auto;}
.fsb{flex:0 0 auto;width:34px;height:22px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line2);color:var(--mut);font:inherit;font-size:12px;font-weight:700;line-height:1;}
.fsb:active{filter:brightness(1.4);}
.rfb{flex:0 0 auto;width:26px;height:22px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line2);color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0;}
.rfb:active{filter:brightness(1.4);}
.rfb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.rfb.spin svg{animation:rf .6s linear;}
@keyframes rf{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hrow{display:flex;align-items:center;gap:10px;margin:0 0 8px;}
.hrow .bar{flex:1;}
.nv{background:var(--lcd-bg);border:1px solid #4A340F;border-radius:8px;padding:2px 9px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;color:var(--lcd);font-size:15px;
  display:inline-block;}
.nw{color:#fff;font-weight:700;font-size:15px;margin-left:8px;}
.nitem{padding:13px 0;border-bottom:1px solid #1B232C;}
.nitem:last-child{border-bottom:none;}
.nf{color:#CBD5DF;margin-top:7px;font-size:15.5px;}
.nm{color:var(--mut);margin-top:5px;font-size:14.5px;padding-left:12px;border-left:2px solid #33404D;}
.nm b{color:#C9D3DD;font-weight:600;}
.tagr{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.tag{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 13px;
  color:var(--mut);font:inherit;font-size:14px;}
.tag.on{background:var(--acc);border-color:var(--acc);color:#1A1206;font-weight:700;}
.mini{font-size:13.5px;color:var(--dim);margin-top:14px;text-align:center;line-height:1.6;}
.rst{margin-top:6px;background:none;border:1px solid var(--line2);border-radius:10px;padding:10px 18px;
  color:var(--no);font:inherit;font-size:14px;}
.rst:active{background:#241214;}

/* 탭바 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0C1014f5;backdrop-filter:blur(12px);
  border-top:1px solid #1C242E;display:flex;padding-bottom:var(--sb);}
nav button{flex:1;background:none;border:none;padding:9px 2px 8px;color:var(--dim);font:inherit;
  font-size:11px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button .ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
nav button.on{color:var(--acc);}
@media(min-width:700px){
  .hin,main{max-width:780px;}
  body{font-size:16.5px;}
  .lcd{max-width:420px;}
  #tabs{justify-content:center;gap:4px;}
  #tabs button{flex:0 1 108px;}
  #p-gloss .card,#p-keys .card{column-count:2;column-gap:30px;}
  .gitem,.grow{break-inside:avoid;}
  .grow{padding:8px 0;}
  #p-num .tagr{max-width:640px;}
  .sg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .sgh,.sgs,.sg>div:not([class]){grid-column:1/-1;}
  .rack{justify-content:center;}
  .sheet{left:50%;right:auto;width:480px;bottom:34px;border-radius:18px;
    transform:translate(-50%,140%);border:1px solid var(--line2);}
  .sheet.on{transform:translate(-50%,0);}
}
@media(min-width:1100px){
  .hin,main{max-width:860px;}
  #p-num .card{column-count:2;column-gap:34px;}
  .nitem{break-inside:avoid;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="hin">
  <div class="brand"><b>Logic <i>Training</i></b><span>로직 프로 트레이너</span></div>
  <div class="lcd">
    <div class="cell"><div class="n" id="lDay">01</div><div class="l">일차</div></div>
    <div class="cell"><div class="n" id="lPct">0%</div><div class="l">진도</div></div>
    <div class="cell"><div class="n" id="lStk">0</div><div class="l">연속</div></div>
    <div class="cell"><div class="n" id="lStg">1/12</div><div class="l">스테이지</div></div>
  </div>
  <div class="hrow"><div class="bar"><i id="bar"></i></div>
    <button class="rfb" id="rfb" aria-label="새로고침" title="새로고침"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-1.6 5.6"/><path d="M20 5v6h-6"/></svg></button>
    <button class="fsb" id="fsb">가</button></div>
 </div>
</header>

<main>
  <section class="pane on" id="p-today"></section>
  <section class="pane" id="p-course"></section>
  <section class="pane" id="p-keys"></section>
  <section class="pane" id="p-gloss"></section>
  <section class="pane" id="p-num"></section>
  <section class="pane" id="p-prog"></section>
</main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="sx" id="sx">✕</button>
  <div class="sw" id="sw"></div><div class="sd" id="sd"></div></div>

<nav id="tabs">
  <button data-p="today" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 8v8M19 8v8"/></svg>오늘</button>
  <button data-p="course"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>과정</button>
  <button data-p="keys"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>단축키</button>
  <button data-p="num"><svg class="ic" viewBox="0 0 24 24"><path d="M4 15c3-9 5-9 8 0s5 9 8 0"/></svg>수치</button>
  <button data-p="gloss"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M9 8h7"/></svg>사전</button>
  <button data-p="prog"><svg class="ic" viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>진도</button>
</nav>

<script>const STAGES=[{"n": 1, "t": "바탕 개념", "sub": "소리와 데이터를 이해한다", "d": [1, 6]}, {"n": 2, "t": "로직 열기", "sub": "화면을 익히고 첫 소리를 낸다", "d": [7, 12]}, {"n": 3, "t": "곡의 뼈대", "sub": "코드와 구조를 먼저 세운다", "d": [13, 18]}, {"n": 4, "t": "리전 다루기", "sub": "화면 위의 덩어리를 옮기고 자른다", "d": [19, 23]}, {"n": 5, "t": "미디 입력과 편집", "sub": "연주를 넣고 다듬는다", "d": [24, 34]}, {"n": 6, "t": "악기 고르고 연주시키기", "sub": "악기별로 사람처럼 만든다", "d": [35, 50]}, {"n": 7, "t": "편곡 쌓기", "sub": "자리를 나누고 층을 얹는다", "d": [51, 55]}, {"n": 8, "t": "외부 음원 들이기", "sub": "서드파티와 샘플 라이브러리를 쓴다", "d": [56, 61]}, {"n": 9, "t": "오디오 녹음", "sub": "마이크로 실제 소리를 담는다", "d": [62, 71]}, {"n": 10, "t": "믹싱 준비", "sub": "듣는 환경과 레벨을 정리한다", "d": [72, 78]}, {"n": 11, "t": "소리 다듬기", "sub": "EQ와 컴프로 각 트랙을 정리한다", "d": [79, 87]}, {"n": 12, "t": "자리와 공간", "sub": "좌우와 앞뒤에 배치한다", "d": [88, 94]}, {"n": 13, "t": "믹스 마무리", "sub": "위상과 폭을 잡고 움직임을 넣는다", "d": [95, 100]}, {"n": 14, "t": "마스터링", "sub": "전체를 하나로 마무리한다", "d": [101, 103]}, {"n": 15, "t": "내보내기와 발매", "sub": "파일로 뽑아 세상에 내놓는다", "d": [104, 111]}, {"n": 16, "t": "작업 흐름", "sub": "반복을 줄이고 버전을 관리한다", "d": [112, 114]}];
const DAYS=[{"d": 1, "s": 1, "t": "소리의 단위: 헤르츠, 데시벨, 밀리초", "goal": "높낮이, 크기, 시간의 단위를 안다.", "con": ["음악을 만드는 프로그램은 소리를 세 가지 숫자로 다룬다. 높낮이, 크기, 시간이다. 이 세 단위는 이후 모든 설명의 기반이 된다.", "높낮이는 주파수(Frequency)로 말하고 단위는 헤르츠(Hz)다. 1초에 공기가 몇 번 떨리는지를 센 숫자다. 많이 떨리면 높은 소리, 적게 떨리면 낮은 소리다. 사람이 듣는 범위는 대략 <v>20</v>헤르츠에서 <v>20000</v>헤르츠 사이다. 1000헤르츠부터는 킬로헤르츠(kHz)로 줄여 쓴다. <v>2000</v>헤르츠와 <v>2</v>킬로헤르츠는 같은 말이다.", "감이 잡히는 기준점 몇 개. 킥 드럼의 무게는 <v>60</v>헤르츠 부근, 사람 목소리의 중심은 <v>200</v>헤르츠에서 <v>4000</v>헤르츠 사이, 하이햇의 반짝임은 <v>8000</v>헤르츠 위에 있다. 낮은 쪽을 저역, 가운데를 중역, 높은 쪽을 고역이라고 부른다.", "크기는 데시벨(dB)로 말한다. 데시벨은 절대적인 크기가 아니라 비교값이다. 그래서 항상 무엇을 기준으로 하는지가 붙는다. 컴퓨터 안에서는 최대치를 <v>0</v>으로 놓고 그 아래를 음수로 센다. 이 단위를 dBFS라고 부른다. <v>-6</v>dBFS는 최대치보다 조금 작은 상태, <v>-40</v>dBFS는 아주 작은 상태다.", "데시벨은 3씩 더해도 두 배가 아니다. 대략 <v>6</v>데시벨이 늘면 진폭이 두 배, <v>10</v>데시벨이 늘면 사람 귀에 두 배쯤 크게 느껴진다. <v>1</v>데시벨 차이는 거의 못 느끼고 <v>3</v>데시벨 차이는 확실히 들린다.", "시간은 밀리초(ms)로 말한다. 1밀리초는 1000분의 1초다. 사람은 <v>10</v>밀리초쯤부터 지연을 느끼기 시작한다. 앞으로 나올 시간 관련 값은 거의 전부 이 단위로 적혀 있다."], "path": [{"n": "실제로 확인해 보기", "s": ["아무 곡이나 열고 <k>X</k>를 눌러 믹서를 연다", "각 채널의 세로 막대(미터)가 위아래로 움직이는 것을 본다. 이 눈금이 dBFS다", "페이더를 내리면 숫자가 음수로 커진다. 0.0이 기준점이다"]}, {"n": "주파수 눈으로 보기", "s": ["채널의 이펙트 자리에 <b>EQ → Channel EQ</b>를 건다", "창 안의 <b>분석기</b> 버튼을 켠다", "재생하면 가로축이 주파수, 세로축이 크기로 움직인다", "가로축 왼쪽 끝이 20헤르츠, 오른쪽 끝이 20킬로헤르츠다"]}], "drill": ["악기 소리 하나를 틀어놓고 분석기에서 어느 쪽이 움직이는지 본다. 킥, 보컬, 하이햇을 각각 확인한다.", "페이더를 3데시벨, 6데시벨, 10데시벨씩 내려보며 귀로 느껴지는 차이를 비교한다.", "20헤르츠에서 20킬로헤르츠까지 훑는 소리를 찾아 들어보고 어디부터 안 들리는지 확인한다."], "keys": [["X", "믹서 열기"], ["스페이스", "재생과 정지"]], "chk": ["헤르츠, 데시벨, 밀리초가 각각 무엇을 재는지 말할 수 있다", "0dBFS가 최대치라는 것을 안다", "저역, 중역, 고역의 대략적인 위치를 안다"], "quiz": [{"q": "소리의 높낮이를 재는 단위는?", "a": ["비트", "데시벨", "헤르츠", "밀리초"], "c": 2, "e": "헤르츠는 1초에 몇 번 떨리는지를 센 숫자다. 많이 떨릴수록 높은 소리다."}, {"q": "컴퓨터 안에서 소리의 최대치는 몇 dBFS인가?", "a": ["0", "100", "1", "-6"], "c": 0, "e": "0을 꼭대기로 놓고 그 아래를 음수로 센다. 그래서 실제 값은 항상 음수다."}, {"q": "2킬로헤르츠는 몇 헤르츠인가?", "a": ["20000", "200", "20", "2000"], "c": 3, "e": "킬로는 1000배다. 2킬로헤르츠는 2000헤르츠다."}]}, {"t": "배음, 마스킹, 다이내믹 레인지", "goal": "뒤의 모든 절이 근거로 삼는 세 가지 개념을 이해한다.", "con": ["앞 절에서 주파수와 크기와 시간을 봤다. 이 절은 그것들이 실제로 어떻게 작동하는지를 다룬다. 세 가지인데, 앞으로 나올 거의 모든 설명이 이 셋 중 하나를 근거로 삼는다.", "<b>배음</b>부터다. 악기가 <v>440</v>헤르츠를 내면 440만 나오는 것이 아니다. 그 위로 <v>880</v>, <v>1320</v>, <v>1760</v>처럼 정수배의 음들이 함께 울린다. 가장 낮은 440을 기음이라 하고 그 위를 배음이라 한다. 우리가 듣는 음높이는 기음이 정하지만, <b>어떤 악기인지를 알아채는 것은 배음의 구성</b>이다.", "같은 도를 피아노와 바이올린이 낼 때 음높이는 같은데 소리가 다른 이유가 이것이다. 배음이 몇 번째까지 얼마나 강하게 나오는지가 다르다. 사인파는 배음이 아예 없어 밋밋하고, 톱니파는 모든 배음이 다 있어 두껍고, 사각파는 홀수 배음만 있어 속이 빈 듯하다.", "<b>배음을 알면 여러 가지가 한 번에 설명된다.</b> EQ로 고역을 올리면 밝아지는 것은 위쪽 배음이 커져서다. 새추레이션이 소리를 두껍게 만드는 것은 없던 배음을 만들어 내기 때문이다. 하이패스로 저역을 걷어내도 악기가 남아 있는 것은 기음보다 배음이 음색을 더 많이 책임지기 때문이다.", "둘째가 <b>마스킹</b>이다. 두 소리가 같은 대역에서 동시에 나면 큰 쪽이 작은 쪽을 덮어 안 들리게 만든다. 조용한 방에서는 들리던 시계 소리가 텔레비전을 켜면 사라지는 것과 같다. 소리가 없어진 것이 아니라 귀가 못 골라내는 것이다.", "마스킹은 가까운 주파수일수록 심하고, 낮은 소리가 높은 소리를 덮는 쪽이 반대보다 강하다. 그래서 저역에 악기를 여럿 두면 전부 뭉개지고, 킥과 베이스가 같은 대역에서 부딪히면 둘 다 흐려진다.", "<b>믹싱의 절반이 마스킹을 푸는 일이다.</b> EQ로 겹치는 대역을 깎는 것도, 팬으로 좌우로 벌리는 것도, 음역을 나눠 배치하는 것도, 사이드체인으로 잠깐 비키게 하는 것도 전부 같은 문제를 다른 방법으로 푸는 것이다. 이 넷 중 무엇을 쓸지는 뒤에서 하나씩 본다.", "셋째가 <b>다이내믹 레인지</b>다. 가장 작은 소리와 가장 큰 소리 사이의 폭이다. 실제 연주에서는 이 폭이 매우 넓다. 오케스트라는 거의 안 들리는 피아니시모에서 귀가 아픈 포르티시모까지 <v>60</v>데시벨 넘게 벌어진다.", "문제는 재생 환경이다. 차 안이나 이어폰에서는 여린 부분이 소음에 묻혀 안 들리고, 큰 부분만 귀에 박힌다. 그래서 녹음물은 이 폭을 좁힌다. <b>컴프레서가 하는 일이 바로 이것</b>이고, 리미터는 위쪽 끝을 막는 것이다.", "다이내믹 레인지는 장비에도 있다. <v>16</v>비트는 약 <v>96</v>데시벨, <v>24</v>비트는 약 <v>144</v>데시벨의 폭을 담는다. 24비트를 쓰는 이유가 이것이다. 폭이 넓으면 작게 녹음해도 잡음에 안 묻히고, 편집 중에 올려도 깨끗하다. 헤드룸을 남기라는 말도 결국 이 폭 안에서 위쪽 여유를 두라는 뜻이다.", "정리하면 이렇다. <b>배음은 음색이 무엇인지</b>, <b>마스킹은 왜 안 들리는지</b>, <b>다이내믹 레인지는 얼마나 넓은지</b>를 설명한다. 뒤에서 EQ나 컴프나 팬 이야기가 나올 때마다 이 셋 중 하나가 바탕에 있다."], "path": [{"n": "배음 들어 보기", "s": ["소프트웨어 악기 트랙에 <b>Retro Synth</b>", "파형을 <b>사인</b>으로 두고 한 음 재생", "<b>톱니</b>로 바꿔 같은 음 재생. 음높이는 같고 두께만 달라진다", "<b>사각</b>으로 바꿔 속이 빈 느낌을 확인"]}, {"n": "마스킹 확인", "s": ["기타와 건반 트랙을 같은 대역에 두고 함께 재생", "하나를 솔로로 들어 보고 다시 함께 듣기", "함께일 때 안 들리던 것이 무엇인지 적는다", "둘을 좌우로 벌려 다시 듣기"]}, {"n": "다이내믹 레인지 재기",  {"d": 6, "s": 1, "t": "장비와 파일 형식 기초", "goal": "장비와 파일 형식의 기본 개념을 안다.", "con": ["로직 같은 프로그램을 통틀어 DAW라고 부른다. 녹음, 편집, 믹싱을 한 곳에서 하는 작업대라는 뜻이다. 로직 외에 큐베이스, 에이블톤, 프로툴스 같은 것들이 있고 원리는 대체로 같다.", "오디오 인터페이스는 컴퓨터와 소리를 주고받는 장치다. 마이크를 꽂아 컴퓨터로 넣고, 컴퓨터의 소리를 스피커로 내보낸다. 맥에는 이미 내장된 것이 있어서 없어도 시작은 할 수 있지만, 녹음을 하려면 따로 있는 편이 훨씬 낫다.", "모니터는 작업용 스피커를 부르는 말이다. 감상용 스피커는 듣기 좋게 소리를 꾸미지만 모니터는 있는 그대로 들려주는 것이 목표다. 헤드폰도 같은 이유로 작업용과 감상용이 나뉜다.", "플러그인은 DAW 안에 끼워 쓰는 작은 프로그램이다. 소리를 만드는 악기 플러그인과 소리를 바꾸는 이펙트 플러그인이 있다.", "소리를 숫자로 바꿀 때 두 가지를 정한다. 샘플레이트(Sample Rate)는 1초를 몇 조각으로 나눠 기록할지다. <v>48</v>킬로헤르츠면 1초를 4만 8천 번 재는 것이다. 잘게 나눌수록 높은 소리까지 담긴다.", "샘플레이트가 왜 <v>48</v>인지에는 이유가 있다. 소리를 제대로 기록하려면 그 소리의 가장 높은 주파수보다 <b>두 배 넘게</b> 잘게 나눠야 한다. 이것을 나이퀴스트 기준이라고 한다. 사람이 듣는 한계가 <v>20</v>킬로헤르츠이므로 최소 <v>40</v>킬로헤르츠가 필요하고, 여유를 둬서 44.1이나 48을 쓴다.", "두 배가 안 되면 에일리어싱이라는 것이 생긴다. 기록하지 못한 높은 음이 엉뚱하게 낮은 음으로 접혀 들어와 원래 없던 소리가 난다. 금속을 긁는 듯한 거슬리는 소리로 나타난다. 왜곡이나 새추레이션처럼 배음을 많이 만드는 플러그인에서 잘 생기는데, 그래서 그런 플러그인에 <b>오버샘플링</b>이나 <b>HQ</b> 같은 옵션이 붙어 있다. 내부에서만 잠깐 샘플레이트를 올려 에일리어싱을 막는 기능이다.", "비트 심도(Bit Depth)는 한 조각의 크기를 몇 단계로 나눠 적을지다. <v>24</v>비트면 아주 잘게 나눠 적는다는 뜻이고, 그만큼 작은 소리와 큰 소리의 차이를 넓게 담을 수 있다. 작업은 <v>48</v>킬로헤르츠 <v>24</v>비트로 하는 것이 기본이다.", "헤드룸(Headroom)은 지금 소리와 최대치 사이에 남은 여유다. 여유가 없으면 소리가 깨진다. 이 깨짐을 클리핑(Clipping)이라고 하고 한 번 깨지면 되돌릴 수 없다. 그래서 항상 여유를 두고 작업한다.", "파일 형식도 두 갈래다. WAV와 AIFF는 압축하지 않아 크고 깨끗하다. MP3와 AAC는 압축해서 작지만 원본보다 정보가 줄어 있다. 작업은 압축하지 않은 쪽으로, 들려주기는 압축한 쪽으로 한다."], "path": [{"n": "내 장비 확인하기", "s": ["<b>Logic Pro → 설정 → 오디오 → 기기</b>를 연다", "<b>출력 장비</b>에 지금 소리가 나가는 장치가 적혀 있다", "<b>입력 장비</b>에 마이크가 연결된 장치가 적혀 있다", "<b>샘플률</b>이 <v>48</v>kHz인지 확인한다"]}, {"n": "헤드룸 확인하기", "s": ["<k>X</k>로 믹서를 연다", "맨 오른쪽 <b>Stereo Out</b>의 미터를 본다", "재생 중 미터 꼭대기가 빨갛게 되면 클리핑이다", "숫자를 클릭하면 초기화된다"]}], "drill": ["설정에서 내 컴퓨터의 출력 장치와 샘플레이트를 확인하고 적어둔다.", "일부러 페이더를 크게 올려 마스터 미터를 빨갛게 만들어 보고, 소리가 어떻게 깨지는지 들은 뒤 되돌린다.", "같은 곡의 WAV 파일과 MP3 파일 용량을 비교한다."], "keys": [["X", "믹서"], ["⌘S", "저장"]], "chk": ["DAW와 플러그인이 무엇인지 안다", "샘플레이트와 비트 심도의 차이를 안다", "클리핑이 무엇이고 왜 피해야 하는지 안다"], "quiz": [{"q": "1초를 몇 조각으로 나눠 기록할지를 정하는 값은?", "a": ["BPM", "샘플레이트", "비트 심도", "헤드룸"], "c": 1, "e": "샘플레이트가 시간을 나누는 조밀함이고, 비트 심도는 크기를 나누는 조밀함이다."}, {"q": "소리가 최대치를 넘어 깨지는 현상은?", "a": ["디더", "클리핑", "헤드룸", "마스킹"], "c": 1, "e": "한 번 깨진 소리는 되돌릴 수 없다. 그래서 여유를 두고 작업한다."}, {"q": "작업용 파일 형식으로 알맞은 것은?", "a": ["MP3", "AAC", "M4A", "WAV"], "c": 3, "e": "WAV와 AIFF는 압축하지 않아 정보가 그대로 남는다."}]}, {"d": 7, "s": 2, "t": "화면 구성 요소의 이름", "goal": "화면 구성 요소의 이름과 역할을 안다.", "con": ["화면 요소의 정확한 이름을 알아야 검색과 질문이 가능하다. 아래 열 개는 사용 빈도가 가장 높다.", "트랙은 가로줄 하나다. 악기 하나가 한 줄을 쓴다. 왼쪽의 이름과 버튼이 모인 부분을 트랙 헤더라고 부른다.", "리전은 트랙 위에 놓인 소리 덩어리다. 이것을 옮기고 자르고 늘이는 것이 편집이다.", "재생 헤드는 지금 어디를 읽고 있는지 알려주는 세로줄이다. 위쪽의 눈금 막대를 눈금자라고 부르고, 여기를 클릭하면 재생 헤드가 그 자리로 간다.", "페이더는 소리 크기를 조절하는 세로 막대다. 팬은 소리를 왼쪽이나 오른쪽으로 보내는 노브다. 가운데면 양쪽에서 같이 나고, 왼쪽으로 돌리면 왼쪽 스피커에서 크게 난다.", "뮤트는 그 트랙을 잠시 꺼두는 것이다. 솔로는 반대로 그 트랙만 남기고 나머지를 다 끄는 것이다. 특정 악기를 자세히 들을 때 솔로를 쓴다.", "인스펙터는 지금 고른 것의 속성을 보여주는 왼쪽 패널이다. 리전을 고르면 리전 정보가, 트랙을 고르면 채널 스트립이 나온다. 고른 것이 바뀌면 내용이 통째로 바뀐다.", "라이브러리는 그 트랙에 얹을 소리를 고르는 목록이다. 믹서는 모든 트랙의 채널 스트립을 한 화면에 모아 보는 창이다.", "플러그인은 소리를 처리하는 작은 프로그램이다. 로직 안에 이미 많이 들어 있고 따로 사서 넣을 수도 있다. 악기 플러그인은 소리를 만들고, 이펙트 플러그인은 있는 소리를 바꾼다."], "path": [{"n": "하나씩 눌러 확인하기", "s": ["트랙 헤더의 <b>M</b>과 <b>S</b> 버튼을 눌러본다. 뮤트와 솔로다", "<k>X</k>로 믹서를 열고 페이더와 팬 노브를 움직여 본다", "<k>I</k>로 인스펙터를 열고 리전과 트랙을 번갈아 클릭하며 내용이 바뀌는 것을 본다", "<k>Y</k>로 라이브러리를 열어 목록을 훑어본다"]}], "drill": ["화면을 보지 않고 열 개 용어를 소리 내어 말하고, 각각이 무엇인지 한 문장으로 설명한다.", "트랙 세 개를 만들고 하나씩 솔로로 들어본다.", "팬을 왼쪽 끝, 가운데, 오른쪽 끝으로 옮겨가며 헤드폰으로 위치 변화를 듣는다."], "keys": [["I", "인스펙터"], ["Y", "라이브러리"], ["X", "믹서"], ["M", "뮤트"], ["S", "솔로"]], "chk": ["트랙, 리전, 재생 헤드를 구별한다", "뮤트와 솔로의 차이를 안다", "플러그인이 두 종류라는 것을 안다"], "quiz": [{"q": "고른 트랙 하나만 남기고 나머지를 끄는 기능은?", "a": ["솔로", "뮤트", "팬", "페이더"], "c": 0, "e": "솔로는 그것만 듣게 해준다. 뮤트는 반대로 그것만 끈다."}, {"q": "트랙 위에 놓인 소리 덩어리를 무엇이라 부르나?", "a": ["패치", "버스", "리전", "존"], "c": 2, "e": "리전을 옮기고 자르고 늘이는 것이 편집 작업의 대부분이다."}]}, {"d": 8, "s": 2, "t": "프로젝트 생성과 화면 구성", "goal": "로직 화면을 여섯 구역으로 나누어 이름을 말할 수 있다.", "con": ["로직 프로의 메인 창은 여섯 구역으로 되어 있다. 왼쪽 위부터 인스펙터, 가운데 위 컨트롤 막대, 가운데 트랙 영역, 왼쪽 트랙 헤더, 오른쪽 라이브러리와 브라우저, 아래 편집기다. 이 여섯 구역의 위치가 화면 탐색의 기준이 된다. 로직 11까지는 <b>설정 → 고급</b>에서 기능을 켜야 메뉴가 다 보였다. 로직 12부터는 이 패널이 사라지고 모든 기능이 항상 켜져 있다. 옛 강좌에서 고급 도구를 켜라는 안내를 보더라도 12에서는 찾을 필요가 없다.", "인스펙터는 지금 선택한 것의 속성을 보여준다. 리전을 선택하면 리전 속성이, 트랙을 선택하면 채널 스트립이 나온다. 선택을 바꾸면 인스펙터 내용이 통째로 바뀐다.", "프로젝트는 폴더 하나로 저장하는 것이 기본이다. 오디오 파일까지 프로젝트 안에 넣어두면 외장 디스크로 옮겨도 소리가 사라지지 않는다."], "path": [{"n": "새 프로젝트 만들기", "s": ["로직 프로 실행 → 프로젝트 선택창에서 <b>새로운 프로젝트</b>", "왼쪽 목록에서 <b>비어 있는 프로젝트</b> 클릭 → <b>선택</b>", "트랙 종류 창이 뜨면 <b>소프트웨어 악기</b> 선택 → <b>생성</b>"]}, {"n": "여섯 구역 열고 닫기", "s": ["인스펙터: <k>I</k>", "라이브러리: <k>Y</k>", "편집기: <k>E</k>", "믹서: <k>X</k>", "스마트 컨트롤: <k>B</k>", "브라우저: <k>F</k>"]}, {"n": "프로젝트 폴더로 저장", "s": ["<b>파일 → 저장</b>", "이름 입력 후 <b>프로젝트 폴더로 정리</b> 체크 확인", "<b>저장</b>"]}], "drill": ["빈 프로젝트를 만들고 여섯 구역을 하나씩 열었다 닫는다. 각 구역이 무엇을 보여주는지 소리 내어 말한다.", "소프트웨어 악기 트랙을 3개 만든다. 트랙 헤더를 클릭할 때마다 인스펙터가 어떻게 바뀌는지 관찰한다.", "프로젝트를 바탕화면에 '연습_01' 이름으로 저장하고 파인더에서 폴더 안을 열어본다."], "keys": [["I", "인스펙터"], ["Y", "라이브러리"], ["E", "편집기"], ["X", "믹서"], ["B", "스마트 컨트롤"], ["⌘S", "저장"]], "chk": ["여섯 구역 이름을 보지 않고 말할 수 있다", "인스펙터가 선택에 따라 바뀌는 것을 확인했다", "프로젝트 폴더 구조를 파인더에서 확인했다"], "quiz": [{"q": "리전을 선택했을 때와 트랙을 선택했을 때, 내용이 통째로 바뀌는 구역은?", "a": ["라이브러리", "인스펙터", "브라우저", "컨트롤 막대"], "c": 1, "e": "인스펙터는 항상 '지금 선택된 것'의 속성을 보여준다. 그래서 선택이 바뀌면 내용이 바뀐다."}, {"q": "믹서를 여는 기본 단축키는?", "a": ["V", "X", "M", "C"], "c": 1, "e": "X가 믹서다. M은 뮤트라서 헷갈리기 쉽다."}]}, {"d": 9, "s": 2, "t": "트랜스포트와 재생 헤드", "goal": "재생 헤드 이동과 사이클 구간 설정을 할 수 있다.", "con": ["트랜스포트는 화면 위쪽 가운데 있는 재생 관련 버튼 묶음이다. 재생, 정지, 녹음, 되감기, 사이클 여섯 개만 쓰면 되고 나머지는 나중에 봐도 된다.", "재생 헤드는 앞에서 본 그 세로줄이다. 눈금자를 클릭하면 그 자리로 옮겨간다. 재생 중에 눈금자를 클릭하면 그 지점부터 이어서 재생한다. 마우스 없이 옮기는 방법도 있다. 쉼표 키는 한 마디 뒤로, 마침표 키는 한 마디 앞으로 재생 헤드를 옮긴다. 재생 중에도 동작하므로 8마디 루프 안에서 위치를 바꿔가며 들을 때 편하다.", "사이클 구간은 눈금자 위쪽 절반을 드래그해서 만든다. 노란 띠가 생기면 그 구간만 무한 반복된다. 작업 시간의 대부분은 사이클을 켜놓고 8마디 정도를 계속 돌리며 보내게 된다.", "LCD 디스플레이는 위치를 두 가지 방식으로 보여준다. 마디·박자와 시간이다. 숫자를 위아래로 드래그하면 그 위치로 바로 점프한다.", "루프 작업에서 자주 쓰는 이동이 둘 더 있다. <k>⇧⌘.</k>와 <k>⇧⌘,</k>는 사이클 길이만큼 앞뒤로 뛴다. 8마디 사이클을 잡아 두면 이 둘로 벌스와 코러스를 오간다. <k>⌥⇧⌘.</k>는 사이클 길이를 두 배로 늘린다. 4마디로 듣다가 8마디로 넓힐 때 끝점을 끌 필요가 없다."], "path": [{"n": "사이클 구간 만들기", "s": ["눈금자 <b>위쪽 절반</b>을 드래그 → 노란 띠 생성", "<k>C</k>로 사이클 켜기와 끄기", "리전을 선택하고 <k>U</k> → 선택한 리전 길이에 맞춰 사이클 자동 설정"]}, {"n": "LCD 표시 바꾸기", "s": ["LCD 오른쪽 끝 작은 삼각형 클릭", "<b>사용자화</b> 선택", "보고 싶은 항목만 체크"]}], "drill": ["Apple Loops를 하나 끌어다 놓고, 그 리전만 사이클로 잡아 10회 반복 재생한다.", "눈금자를 클릭해 5마디, 9마디, 17마디로 재생 헤드를 옮기는 연습을 20회 한다.", "재생 중에 눈금자를 클릭해 다른 지점으로 건너뛰어 본다."], "keys": [["스페이스", "재생과 정지"], ["Return", "처음으로"], ["C", "사이클 켜기와 끄기"], ["U", "선택 영역을 사이클로"], ["R", "녹음"], ["Shift+Return", "사이클 시작점부터 재생"], [", .", "한 마디 뒤·앞 이동"]], "chk": ["사이클 구간을 마디에 딱 맞춰 만들 수 있다", "재생 중 다른 지점으로 이동할 수 있다", "LCD에서 현재 마디를 읽을 수 있다"], "quiz": [{"q": "선택한 리전 길이에 맞춰 사이클 구간을 자동으로 잡는 단축키는?", "a": ["⌘T", "U", "⌘L", "⌘R"], "c": 1, "e": "U는 선택 영역에 맞춰 사이클 구간을 잡는다. 8마디 루프를 만들 때 매번 쓰게 된다."}]}, {"d": 10, "s": 2, "t": "트랙 종류와 라이브러리", "goal": "네 가지 트랙의 차이를 알고 목적에 맞는 트랙을 만든다.", "con": ["트랙은 네 종류다. 소프트웨어 악기는 미디 신호로 가상악기를 울린다. 오디오는 마이크와 라인 입력으로 들어온 소리 파형을 담는다. 드러머는 로직이 연주해주는 가상 드러머다. 외부 미디는 바깥 하드웨어 신디사이저를 제어한다.", "초보 구간에서 실제로 쓰는 것은 소프트웨어 악기와 오디오 두 가지다. 드러머는 악기별 실전 스테이지에서 따로 다룬다.", "라이브러리는 그 트랙에 얹을 소리를 고르는 곳이다. 왼쪽 열에서 큰 분류를 고르고 오른쪽 열에서 세부 음색을 고른다. 트랙을 선택한 상태에서 라이브러리 항목을 클릭하면 채널 스트립이 통째로 교체된다. 플러그인까지 같이 바뀌는 점을 알아둬야 한다.", "패치와 프리셋은 다르다. 패치는 채널 스트립 전체(악기 + 이펙트 + 볼륨)이고, 프리셋은 플러그인 하나의 설정이다.", "트랙을 만드는 단축키는 종류별로 따로 있다. <k>⌘⌥S</k>는 소프트웨어 악기 트랙, <k>⌘⌥A</k>는 오디오 트랙을 바로 만든다. <k>⌥⌘N</k>은 종류를 묻는 창이 뜨므로 종류가 정해져 있으면 앞의 둘이 빠르다. 트랙이 많아지면 <k>H</k>로 선택한 트랙을 숨겨 화면을 정리한다. 소리는 그대로 나고 보이지만 않는다."], "path": [{"n": "트랙 추가", "s": ["<k>⌥⌘N</k> 또는 트랙 헤더 위 <b>+</b> 버튼", "종류 선택 → 하단 <b>세부사항</b>을 열면 입력, 출력, 개수 지정 가능", "<b>생성</b>"]}, {"n": "음색 고르기", "s": ["트랙 헤더 클릭으로 트랙 선택", "<k>Y</k>로 라이브러리 열기", "왼쪽 분류 → 오른쪽 음색 클릭", "위아래 화살표 키로 음색을 하나씩 넘기며 비교"]}, {"n": "트랙 정리", "s": ["트랙 이름 더블 클릭 → 이름 변경", "트랙 헤더 우클릭 → <b>트랙 색상 지정</b>", "<k>⌘D</k> → 선택 트랙 복제"]}], "drill": ["소프트웨어 악기 트랙 5개를 만들고 각각 피아노, 베이스, 스트링, 신스 리드, 패드 음색을 지정한다.", "각 트랙의 이름을 악기명으로 바꾸고 색을 다르게 준다.", "라이브러리에서 화살표 키로 피아노 음색 20개를 연달아 들어보고 마음에 드는 3개를 적어둔다."], "keys": [["⌥⌘N", "새 트랙"], ["⌘D", "트랙 복제"], ["Y", "라이브러리"], ["↑ ↓", "라이브러리 음색 이동"], ["M", "뮤트"], ["S", "솔로"], ["⌘⌥S", "새 악기 트랙"], ["⌘⌥A", "새 오디오 트랙"], ["H", "트랙 숨기기"]], "chk": ["네 가지 트랙 종류를 설명할 수 있다", "라이브러리에서 음색을 바꿔 봤다", "패치와 프리셋의 차이를 말할 수 있다"], "quiz": [{"q": "라이브러리에서 패치를 클릭하면 함께 바뀌는 것은?", "a": ["트랙 순서", "채널 스트립 전체", "리전 내용", "프로젝트 템포"], "c": 1, "e": "패치는 악기, 이펙트, 볼륨, 센드까지 포함한 채널 스트립 전체다."}]}, {"t": "Apple Loops 사용법", "goal": "루프 브라우저에서 소재를 찾아 배치하고 수정한다.", "con": ["로직에는 바로 쓸 수 있는 연주 소재 수만 개가 들어 있다. Apple Loops다. 아직 악기를 못 다뤄도 이것만으로 곡 형태를 만들 수 있어서, 배우는 단계에서 가장 좋은 스케치 도구다.", "루프는 색으로 종류가 나뉜다. 파란 루프는 오디오다. 녹음된 소리라서 그대로 쓰거나 자르는 것까지만 된다. 초록 루프는 미디다. 악기 트랙에 놓으면 음표가 들어 있어서 피아노 롤로 열어 마음대로 고칠 수 있다. 노란 루프는 드러머 연주, 주황 루프는 패턴이다.", "들어 있는 종류를 알면 찾기 쉽다. 드럼과 퍼커션이 가장 많고 장르별로 나뉜다. 그다음이 베이스, 기타, 건반, 신스다. 보컬 루프는 짧은 프레이즈나 애드리브가 들어 있어 훅을 만들 때 쓴다. 효과음 루프에는 라이저, 임팩트, 앰비언스가 있어 앞의 전환 소재 절에서 쓰는 것들이 여기서 나온다. 오케스트라 루프는 스트링 패턴과 브라스 스탭이 있다.", "루프는 팩 단위로 들어 있고, 팩 이름이 장르나 시대를 나타낸다. 처음 로직을 설치할 때 기본 팩만 오고 나머지는 사운드 라이브러리 관리자에서 추가로 받는다. 찾아도 없으면 팩을 안 받은 것이니 <b>Logic Pro → 사운드 라이브러리 → 사운드 라이브러리 관리자</b>에서 원하는 팩을 받는다.", "같은 이름의 루프가 파랑과 초록 둘 다 있는 경우가 많다. 고칠 생각이 있으면 초록을 고른다.", "루프 브라우저는 <k>O</k>로 연다. 위쪽 버튼으로 악기, 장르, 분위기를 걸러 좁히고, 아래 목록에서 클릭하면 프로젝트 템포에 맞춰 미리 들린다. 목록 오른쪽 열에 원래 템포와 조가 적혀 있다. 내 프로젝트와 너무 멀면 늘리거나 줄인 티가 나므로, 템포는 <v>±20</v> 안, 조는 <v>3</v>개 안에서 고르는 편이 자연스럽다.", "로직 12부터는 검색창에 말하듯 적어도 찾아진다. 어두운 피아노, 빠른 드럼처럼 적으면 그에 맞는 루프가 나온다. 즐겨찾기 표시를 해 두면 나중에 즐겨찾기 필터로 모아 볼 수 있다.", "루프의 가장 큰 특징은 프로젝트를 따라온다는 것이다. 원래 다른 템포, 다른 조로 만들어진 루프라도 끌어다 놓으면 내 프로젝트의 템포와 조에 자동으로 맞는다. 그래서 서로 다른 루프를 겹쳐도 어긋나지 않는다.", "루프가 프로젝트를 따라오는 데도 조건이 있다. 파란 오디오 루프는 미리 분석된 템포와 조 정보를 안에 갖고 있어서 따라오는 것이고, 직접 가져온 일반 오디오 파일은 이 정보가 없어 그대로 재생된다. 가져온 파일을 루프처럼 쓰려면 스마트 템포로 분석하거나 플렉스를 켜야 한다. 이건 작업 흐름 부에서 다룬다.", "초록 루프는 훌륭한 교재이기도 하다. 잘 만든 베이스 루프를 피아노 롤로 열어 보면, 음을 어디에 놓고 벨로시티를 어떻게 흔들었는지가 그대로 보인다. 마음에 드 작점과 끝점을 찍고 값 차이를 주면 점진적 변화가 만들어진다."}, {"q": "같은 100BPM인데 더 빠르게 느껴지게 만들려면?", "a": ["템포를 올린다", "박자를 6/8로 바꾼다", "조표를 바꾼다", "16분음표 층을 채워 사건의 수를 늘린다"], "c": 3, "e": "귀는 박의 수가 아니라 단위 시간에 일어나는 사건의 수로 속도를 판단한다."}]}, {"d": 16, "s": 3, "t": "어레인지먼트 마커", "goal": "어레인지먼트 마커로 곡 구간을 만들고 이동한다.", "con": ["어레인지먼트 마커는 곡의 구간에 이름표를 붙이는 기능이다. 인트로, 벌스, 프리코러스, 코러스, 브리지, 아웃트로처럼.", "진짜 힘은 이동에 있다. 마커를 드래그하면 그 구간 안의 모든 트랙 리전이 통째로 따라 움직인다. 코러스를 앞으로 당겨보는 실험을 몇 초 만에 할 수 있다.", "작곡을 시작할 때 마커부터 깔아두는 습관을 권한다. 8마디 벌스, 8마디 코러스처럼 뼈대를 먼저 세우면 소리로 채우는 일이 훨씬 빨라진다. 작업 도중에 표시를 남기고 싶을 때는 <k>⌥'</k>로 마커를 즉석에서 찍는다. 녹음 중에도 동작하므로 좋았던 지점이나 다시 볼 지점을 흐름을 끊지 않고 표시해둘 수 있다.", "마커 길이는 마커 끝을 드래그해 바꾼다. 기본은 8마디다. 대중음악의 구간이 대개 8마디 단위로 짜이기 때문에 이대로 두면 대부분 맞는다."], "path": [{"n": "어레인지먼트 트랙 켜기", "s": ["<k>G</k> → 글로벌 트랙 표시", "글로벌 트랙 헤더 우클릭 → <b>어레인지먼트</b> 체크", "어레인지먼트 트랙의 <b>+</b> 클릭 → 8마디 구간 생성"]}, {"n": "이름과 길이", "s": ["마커 이름 클릭 → 목록에서 선택 또는 <b>이름 변경</b>", "마커 오른쪽 끝 드래그 → 길이 조절", "마커 드래그 → 구간 통째 이동", "마커 우클릭 → <b>복제</b> 또는 <b>삭제하고 이동</b>"]}], "drill": ["인트로 4 / 벌스 8 / 프리 4 / 코러스 8 / 벌스 8 / 코러스 8 / 아웃트로 4마디 구조를 마커로 만든다.", "코러스 마커를 드래그해 벌스보다 앞으로 옮겨보고 곡 인상이 어떻게 달라지는지 듣는다."], "keys": [["G", "글로벌 트랙"], ["⌘R", "선택 마커 반복"], ["⌥'", "마커 추가"]], "chk": ["마커로 곡 구조를 만들 수 있다", "마커 드래그로 구간 전체가 이동하는 것을 확인했다", "구조를 먼저 세우고 작업을 시작해봤다"], "quiz": [{"q": "어레인지먼트 마커를 드래그하면 함께 움직이는 것은?", "a": ["템포만", "아무것도 안 움직임", "모든 트랙의 그 구간 리전", "해당 트랙 리전만"], "c": 2, "e": "구간 안의 모든 트랙 리전이 함께 이동한다. 그래서 구조 실험이 빠르다."}]}, {"t": "구간 연출: 빼기와 멈추기", "goal": "악기를 빼고 멈추고 되돌리는 방법으로 구간 전환에 힘을 준다.", "con": ["소재를 더해서 전환하는 방법은 앞에서 봤다. 그 반대가 더 강할 때가 많다. 있던 것을 빼는 것이다. 듣는 사람은 계속 있던 소리가 사라지는 순간에 가장 크게 반응한다. 그래서 코러스로 들어가기 직전에 무언가를 빼면 코러스가 두 배로 열린다.", "가장 단순한 것이 <b>한 박 비우기</b>다. 코러스 첫 박 바로 앞 한 박, 길면 반 마디를 모든 악기에서 비운다. 리버브 꼬리만 남기고 완전히 조용해졌다가 코러스 첫 박에 전부 들어온다. 이 짧은 침묵이 코러스를 크게 만든다. 팝과 록에서 가장 많이 쓰는 전환이다.", "<b>드럼 빼기</b>는 마지막 코러스나 브리지에서 쓴다. 드럼만 빼고 나머지를 두면 리듬이 사라져 붕 뜬 느낌이 된다. 여기서 드럼이 돌아오는 순간이 절정이 된다. 마지막 코러스 앞 <v>2~4</v>마디를 이렇게 두면 곡의 정점이 만들어진다.", "<b>드럼만 남기기</b>는 그 반대다. 다른 악기를 다 빼고 드럼만 남기면 곡이 잠시 벗겨진 상태가 되고, 악기가 하나씩 돌아오면서 다시 쌓인다. 브리지 시작이나 아웃트로 직전에 쓴다. 두 마디 정도가 적당하고, 길면 지루해진다.", "<b>필터로 닫았다 열기</b>는 EDM과 팝에서 온 방법이다. 코러스 직전 <v>4~8</v>마디에 걸쳐 전체 트랙에 로우패스를 걸어 <v>20</v>kHz에서 <v>500</v>Hz까지 내렸다가 코러스 첫 박에 확 연다. 소리가 물속에 잠겼다가 터져 나오는 느낌이 된다. 스테레오 출력 앞에 Channel EQ를 걸고 로우패스 컷오프를 오토메이션한다.", "<b>보컬만 남기기</b>는 가사가 핵심인 곡에서 쓴다. 코러스 직전 한 마디에서 반주를 전부 빼고 보컬만 남기면 그 가사가 부각되고 코러스가 대답처럼 들어온다. 리버브를 조금 늘리면 공간이 남아 어색하지 않다.", "이런 연출은 뮤트 오토메이션이나 리전 삭제로 만든다. 리전을 자르는 것이 확실하고 되돌리기 쉽다. 트랙 뮤트 오토메이션은 미디 노트가 걸쳐 있을 때 소리가 뚝 끊기는 문제가 있어 오디오 트랙에서만 쓴다.", "한 곡에 이 기법을 두 번 이상 같은 자리에서 쓰면 효과가 준다. 첫 코러스 앞에서 한 박을 비웠으면 두 번째는 드럼을 빼고, 마지막에 필터를 여는 식으로 바꾼다. 같은 것을 반복하면 듣는 사람이 예측해서 놀라지 않는다.", "빼는 것과 더하는 것을 함께 쓴다. 한 박을 비우면서 그 자리에 리버스 심벌을 넣고, 드럼을 뺀 구간에 라이저를 깔면 침묵이 비어 보이지 않고 긴장으로 채워진다. 앞의 전환 소재 절과 이 절은 한 짝이다."], "path": [{"n": "한 박 비우기", "s": ["코러스 첫 박 바로 앞 한 박에 <b>마키</b>로 모든 트랙을 선택", "<k>Delete</k>. 리버브 버스는 남긴다", "재생해 침묵 뒤 코러스가 열리는지 확인", "비는 느낌이 어색하면 그 자리에 리버스 심벌"]}, {"n": "필터로 닫았다 열기", "s": ["<b>Stereo Out</b> 채널에 <b>Channel EQ</b>", "로우패스 켜고 <k>A</k> 오토메이션 레인을 <b>로우패스 주파수</b>로", "코러스 <v>4~8</v>마디 전에 <v>20</v>kHz, 코러스 첫 박 직전에 <v>500</v>Hz", "코러스 첫 박에서 <v>20</v>kHz로 순간 복귀"]}, {"n": "드럼 빼기", "s": ["마지막 코러스 앞 <v>2~4</v>마디의 드럼 리전을 마키로 선택", "<k>Delete</k> 또는 뮤트", "드럼이 돌아오는 첫 박에 크래시나 임팩트"]}], "drill": ["같은 곡의 두 코러스 앞에 각각 한 박 비우기와 드럼 빼기를 넣어 인상 차이를 듣는다.", "필터 닫았다 열기를 4마디와 8마디로 해보고 어느 쪽이 답답하지 않은지 판단한다."], "keys": [["T", "도구 팝업"], ["A", "오토메이션"], ["Delete", "삭제"], ["M", "뮤트"]], "chk": ["빼는 연출 다섯 가지를 안다", "한 곡에서 같은 기법을 반복하지 않는다"], "quiz": [{"q": "코러스 직전 한 박을 비우면?", "a": ["박자가 어긋난다", "리버브가 사라진다", "짧은 침묵이 코러스를 크게 만든다", "코러스가 작게 들린다"], "c": 2, "e": "듣는 사람은 계속 있던 소리가 사라지는 순간에 가장 크게 반응한다."}, {"q": "트랙 뮤트 오토메이션을 오디오에만 쓰는 이유는?", "a": ["오디오가 더 커서", "CPU 때문", "미디에는 뮤트가 없어서", "미디 노트가 걸쳐 있으면 소리가 뚝 끊겨서"], "c": 3, "e": "미디는 리전을 자르는 편이 확실하고 되돌리기 쉽다."}, {"q": "같은 곡에서 한 박 비우기를 세 번 쓰면?", "a": ["문제없다", "더 강해진다", "듣는 사람이 예측해 놀라지 않는다", "코러스가 길어진다"], "c": 2, "e": "첫 코러스 앞은 비우고, 둘째는 드럼을 빼고, 마지막은 필터를 여는 식으로 바꾼다."}], "s": 3, "d": 17}, {"t": "구간별 관습: 당연히 하는 것들", "goal": "각 구간에서 각 악기가 으레 하는 일을 알고 로직에서 구현한다.", "con": ["곡 구조를 알고 전환 기법을 알아도 곡이 밋밋할 때가 있다. 구간마다 당연히 있어야 할 것이 빠져서다. 대중음악을 들어온 귀는 코러스에서 크래시가 울리고 마지막 코러스에서 목소리가 겹치는 것을 기대한다. 이것이 없으면 틀린 건 아니지만 뭔가 부족하게 들린다. 이 절은 그 당연한 것들을 모은다.", "<b>인트로</b>는 코러스 재료를 미리 흘린다. 코러스 코드 진행을 얇은 악기 하나로 치거나 훅 멜로디를 다른 악기로 한 번 들려준다. 듣는 사람은 모른 채 익숙해지고, 코러스가 왔을 때 처음 듣는 것이 아니게 된다. 인트로에 코러스와 무관한 것을 넣으면 곡이 두 개처럼 들린다.", "<b>벌스</b>는 가장 적은 편성이다. 드럼, 베이스, 화성 악기 하나, 보컬이면 충분하다. 벌스 1과 벌스 2는 같은 편성이되 벌스 2에 하나를 더한다. 하이햇 패턴이 촘촘해지거나 기타가 한 층 얹히는 정도다. 벌스 2가 벌스 1과 똑같으면 곡이 제자리에 있는 것처럼 들린다.", "<b>프리코러스</b>는 긴장을 쌓는 자리다. 리듬이 촘촘해지거나 코드가 위로 올라가거나 보컬 음역이 높아진다. 셋 중 하나는 있어야 코러스로 넘어가는 힘이 생긴다. 프리코러스 끝에 앞 절에서 본 한 박 비우기나 필인이 온다.", "<b>코러스</b>는 벌스에 없던 것이 들어온다. 새 악기든 넓어진 패드든 백보컬이든 하나는 새로 나타나야 한다. 그리고 크래시가 첫 박에 울린다. 이 두 가지가 없으면 코러스가 아니라 벌스가 계속되는 것으로 들린다. 첫 코러스는 절제하고 마지막 코러스에서 다 쓴다.", "<b>브리지</b>는 다른 곳으로 간다. 코드 진행이 바뀌거나 조가 바뀌거나 편성이 확 줄어든다. 코러스를 세 번 들은 귀가 지루해질 자리라 낯선 것을 넣는다. 브리지 끝에서 마지막 코러스로 돌아올 때 가장 큰 전환을 둔다.", "<b>마지막 코러스</b>는 첫 코러스 위에 한 층 더 얹는다. 보컬 옥타브 위 더블, 하모니 층, 스트링, 애드리브 중 하나 이상이다. 록에서는 반음이나 온음 위로 전조하기도 한다. 이 층이 없으면 곡이 마지막에 오르지 않고 그냥 끝난다.", "<b>아웃트로</b>는 인트로로 돌아가거나 코러스를 벗겨낸다. 인트로에서 쓴 악기 하나만 남기고 끝내면 곡이 한 바퀴 돈 느낌이 되고, 코러스에서 악기를 하나씩 빼며 페이드하면 서서히 사라지는 느낌이 된다. 갑자기 끝내는 것은 록의 일부 스타일에서만 자연스럽다.", "악기 쪽도 정해진 자리가 있다. <b>드럼</b>은 벌스에서 클로즈 하이햇, 코러스에서 오픈 하이햇이나 라이드로 바꾼다. 이것만으로 구간이 갈린다. 크래시는 구간 첫 박, 필인은 구간 마지막 마디다. <b>베이스</b>는 벌스에서 루트를 짚고 코러스에서 옥타브를 오간다. <b>기타</b>는 벌스에서 팜뮤트나 아르페지오, 코러스에서 오픈 코드 스트럼이다. <b>건반</b>은 벌스에서 왼손 단음이나 오른손 아르페지오, 코러스에서 양손 코드다.", "<b>패드</b>는 벌스에서 얇게 깔렸다가 코러스에서 넓어지거나, 벌스에는 아예 없다가 코러스에서 들어온다. 둘 중 하나이지 처음부터 끝까지 같은 두께로 깔리지는 않는다. <b>백보컬</b>은 코러스에서만, <b>더블</b>은 훅 자리에서만, <b>애드리브</b>는 코러스가 반복될수록 늘어난다.", "장르마다 당연한 것이 조금씩 다르다. 팝은 코러스 첫 박에 크래시와 함께 전 악기가 동시에 들어온다. 록은 코러스 직전 필인이 필수이고 마지막 코러스 전조가 흔하다. EDM은 드롭 전 <v>8~16</v>마디 빌드업과 드롭 첫 박의 킥과 임팩트다. 힙합은 훅에서 808이 슬라이드하고 벌스는 훅보다 비운다. 발라드는 마지막 코러스에 스트링이 들어오고 브리지에서 드럼이 빠진다. 알앤비는 코러스마다 애드리브가 늘고 리듬이 뒤로 눕는다.", "이것들은 규칙이 아니라 기대다. 일부러 깨면 효과가 되고 모르고 빠뜨리면 결함이 된다. 곡을 다 만든 뒤 구간마다 이 목록을 대  안쪽으로 끌면 그 길이만큼 페이드가 생긴다. 페이드 안쪽을 다시 끌면 곡선 모양이 바뀐다.", "페이드가 필요한 이유는 딸깍 소리다. 파형이 0이 아닌 지점에서 소리가 갑자기 시작하거나 끝나면 클릭이 난다. 자른 자리마다 <v>3~10</v>ms의 짧은 페이드를 넣으면 사라진다. 길게 넣는 것은 다른 용도다. 인트로에서 패드가 서서히 들어오거나 아웃트로에서 전체가 사라질 때 <v>2~8</v>마디에 걸쳐 넣는다.", "두 리전이 겹치면 크로스페이드가 된다. 앞 리전이 작아지는 동안 뒤 리전이 커져서 이음매가 안 들린다. 겹친 부분을 페이드 도구로 끌면 만들어지고, 두 리전의 음색이 다를수록 길게 잡는다. 같은 테이크를 이어 붙일 때는 <v>10~30</v>ms, 다른 테이크면 <v>50~100</v>ms 정도다.", "페이드 곡선은 세 가지 느낌이 있다. 직선은 고르게, 바깥으로 볼록한 곡선은 빨리 커졌다 천천히, 안으로 오목한 곡선은 천천히 시작해 끝에 빨리 올라온다. 음악적으로 서서히 들어오는 느낌은 오목한 쪽이 자연스럽다. 리전 인스펙터에서 <b>페이드 인</b>과 <b>곡선</b> 값을 숫자로 넣을 수도 있다."], "path": [{"n": "기본 다섯 동작", "s": ["이동: 리전 몸통을 잡고 드래그", "복사: <k>⌥</k>를 누른 채 드래그", "길이: 리전 좌우 끝 모서리를 잡고 드래그", "분할: 재생 헤드를 놓고 <k>⌘T</k>", "반복: <k>⌘R</k> → 횟수 입력"]}, {"n": "도구 바꾸기", "s": ["<k>T</k>를 누르면 도구 팝업", "포인터, 연필, 지우개, 텍스트, 가위, 접착제, 솔로, 뮤트, 확대", "<k>T</k>를 두 번 빠르게 → 포인터로 복귀"]}, {"n": "페이드 넣기", "s": ["오디오 리전 왼쪽 위 모서리에 포인터 → 페이드 도구로 바뀜", "안쪽으로 <v>3~10</v>ms 끌기", "페이드 안을 다시 끌어 곡선 조정", "여러 리전에 한 번에: 전부 선택 → <k>I</k> 인스펙터 → <b>페이드 인</b> 값 입력"]}], "drill": ["4마디 리전 하나를 만들고 옵션 드래그로 32마디까지 복사한다.", "⌘R로 8회 반복을 한 번에 만들어 본다. 드래그 복사와 시간을 비교한다.", "리전을 재생 헤드 위치에서 잘라 앞뒤를 서로 바꿔 붙인다."], "keys": [["⌘T", "재생 헤드에서 분할"], ["⌘R", "반복"], ["⌥드래그", "복사"], ["T", "도구 팝업"], ["Delete", "삭제"], ["⌘Z", "실행 취소"]], "chk": ["다섯 동작을 손이 기억한다", "⌘R로 반복 횟수를 지정할 수 있다", "도구를 T로 빠르게 바꿀 수 있다", "자른 자리마다 짧은 페이드를 넣는다"], "quiz": [{"q": "리전을 재생 헤드 위치에서 자르는 단축키는?", "a": ["⌘D", "⌘R", "⌘T", "⌘E"], "c": 2, "e": "⌘T가 분할이다. ⌘R은 반복이라 짝으로 외우면 좋다."}, {"q": "자른 자리에 페이드를 안 넣으면?", "a": ["딸깍 소리가 난다", "음정이 바뀐다", "아무 문제 없다", "리전이 사라진다"], "c": 0, "e": "파형이 0이 아닌 지점에서 갑자기 시작하면 클릭이 난다. 3~10ms면 충분하다."}]}, {"t": "인스펙터: 리전과 트랙의 숨은 설정", "goal": "리전 인스펙터와 트랙 인스펙터의 항목이 무엇을 하는지 안다.", "con": ["리전과 트랙에는 화면에 안 보이는 설정이 붙어 있다. 그것을 보여주는 창이 인스펙터이고 <k>I</k>로 열린다. 위쪽이 선택한 리전의 설정, 아래쪽이 그 트랙의 설정이다. 여기 있는 항목을 알면 리전을 자르거나 미디를 고치지 않고도 소리를 바꿀 수 있다.", "리전 인스펙터에서 자주 쓰는 것부터 본다. <b>뮤트</b>는 리전 하나만 끈다. 트랙 뮤트와 달리 다른 리전은 그대로 난다. <b>루프</b>는 리전을 트랙 끝까지 반복시킨다. <b>트랜스포즈</b>는 미디 리전의 음을 반음 단위로 옮기고, 오디오 리전에서는 플렉스가 켜져 있을 때 동작한다. 같은 프레이즈를 다른 조에 놓을 때 리전을 복사해 이 값만 바꾼다.", "<b>딜레이</b>는 리전 전체를 앞뒤로 미는 값이다. 틱이나 ms로 넣는다. 드럼 트랙을 <v>-10</v>ms로 두면 전체가 살짝 앞으로 밀려 곡이 밀어붙이는 느낌이 나고, 패드를 <v>+15</v>ms로 두면 뒤로 물러나 여유가 생긴다. 미디 편집 없이 느낌을 바꾸는 가장 빠른 방법이다.", "<b>게인</b>은 앞에서 본 클립 게인이다. <b>페이드 인·아웃</b>과 <b>곡선</b>도 여기서 숫자로 넣는다. 리전 여러 개를 선택하고 값을 넣으면 한 번에 적용된다.", "미디 리전에는 퀀타이즈 항목이 여러 개 더 있다. <b>Q-스윙</b>과 <b>Q-강도</b>는 앞에서 봤다. <b>Q-범위</b>는 격자에서 얼마나 벗어난 음만 퀀타이즈할지 정한다. <v>0</v>이면 전부, 값을 주면 그 안에 있는 음은 놔둔다. 이미 대체로 맞는 연주에서 크게 벗어난 것만 고칠 때 쓴다. <b>Q-플램</b>은 같은 자리에 겹친 음들을 살짝 벌린다. 코드를 한 번에 친 소리를 스트럼처럼 만든다.", "<b>다이내믹</b>은 벨로시티의 편차를 늘리거나 줄인다. <v>100</v>이 원래대로이고, <v>50</v>이면 편차가 절반이 되어 고르게, <v>150</v>이면 편차가 커져 강약이 뚜렷해진다. 벨로시티를 하나씩 안 만지고 전체 표정을 조절한다. <b>게이트 타임</b>은 음 길이를 비율로 바꾼다. <v>50</v>이면 모든 음이 절반 길이가 되어 스타카토처럼, <v>150</v>이면 늘어나 레가토처럼 된다.", "트랙 인스펙터는 아래쪽에 있고 그 트랙의 모든 리전에 적용된다. <b>트랜스포즈</b>가 여기도 있는데, 트랙 전체를 옮길 때 쓴다. <b>벨로시티</b>는 트랙 전체 벨로시티에 더하거나 뺀다. 악기 음원이 전체적으로 너무 세게 반응할 때 <v>-20</v>을 넣는 식이다. <b>키 리밋</b>과 <b>벨로시티 리밋</b>은 그 범위 밖의 음을 안 나게 한다. 한 미디 트랙을 두 악기에 보내면서 낮은 음은 베이스, 높은 음은 건반이 받게 나눌 때 쓴다.", "<b>노 트랜스포즈</b>는 드럼 트랙에 켠다. 곡의 조를 바꿔 전체를 트랜스포즈할 때 드럼까지 옮겨지면 킥이 스네어 자리로 가 버린다. 이걸 켜 두면 드럼은 제자리에 남는다. <b>딜레이</b>는 트랙 전체를 미는 값이고 리전 딜레이와 겹쳐 적용된다.", "이 항목들은 원본을 건드리지 않는다. 리전 안의 음표나 파형은 그대로이고 재생할 때만 바뀐다. 그래서 값을 지우면 원래대로 돌아온다. 미디를 직접 고치기 전에 인스펙터로 먼저 시험해 보는 습관을 들이면 되돌리기 쉽다."], "path": [{"n": "리전 딜레이로 느낌 바꾸기", "s": ["드럼 리전 선택 → <k>I</k>", "리전 인스펙터 <b>딜레이</b>에 <v>-10</v>ms 입력", "재생해 밀어붙이는 느낌 확인", "패드 리전은 <v>+15</v>ms로 뒤로"]}, {"n": "다이내믹으로 표정 조절", "s": ["미디 리전 선택 → <k>I</k>", "<b>다이내믹</b>을 <v>150</v>으로", "강약이 뚜렷해지는지 확인", "고르게 하려면 <v>50</v>"]}, {"n": "드럼 노 트랜스포즈", "s": ["드럼 트랙 선택 → 트랙 인스펙터", "<b>노 트랜스포즈</b> 체크", "곡 전체 트랜스포즈 후 드럼이 제자리인지 확인"]}], "drill": ["같은 드럼 리전을 딜레이 -10과 +10으로 두고 느낌 차이를 적는다.", "피아노 리전의 다이내믹을 50과 150으로 바꿔 어느 쪽이 곡에 맞는지 판단한다.", "코드 리전에 Q-플램 20을 넣어 스트럼 느낌을 확인한다."], "keys": [["I", "인스펙터"], ["⌥⇧R", "리전 인스펙터 플로트"]], "chk": ["리전 뮤트와 트랙 뮤트의 차이를 안다", "드럼 트랙에 노 트랜스포즈를 켠다", "인스펙터 값은 원본을 안 건드린다는 것을 안다"], "quiz": [{"q": "곡 전체를 트랜스포즈했더니 드럼이 엉뚱하게 났다. 원인은?", "a": ["템포 때문", "벨로시티 때문", "드럼 트랙에 노 트랜스포즈를 안 켜서", "미디가 깨져서"], "c": 2, "e": "킥이 스네어 자리로 가 버린다. 드럼 트랙은 항상 켜 둔다."}, {"q": "벨로시티를 하나씩 안 만지고 전체 강약 편차를 키우려면?", "a": ["Q-범위", "트랜스포즈", "게이트 타임", "다이내믹 150"], "c": 3, "e": "100이 원래대로, 50이면 고르게, 150이면 강약이 뚜렷해진다."}, {"q": "인스펙터 값의 특징은?", "a": ["원본은 그대로고 재생할 때만 바뀐다", "미디에만 있다", "원본을 바꾼다", "되돌릴 수 없다"], "c": 0, "e": "값을 지우면 원래대로 돌아온다. 미디를 고치기 전에 여기서 먼저 시험한다."}], "s": 4, "d": 20}, {"d": 21, "s": 4, "t": "스냅과 그리드", "goal": "스냅 단위를 설정하고 미세 이동을 한다.", "con": ["스냅은 리전을 드래그할 때 어떤 격자에 달라붙을지 정하는 규칙이다. 트랙 영역 오른쪽 위 스냅 메뉴에서 고른다.", "기본값 스마트는 확대 배율에 따라 격자가 자동으로 바뀐다. 편하지만 예측이 어렵다. 정확한 작업을 할 때는 마디나 비트로 고정하는 편이 낫다.", "상대값 스냅은 리전이 이미 격자에서 어긋나 있을 때 그 어긋난 정도를 유지하며 옮기는 옵션이다. 그루브를 일부러 밀어놓은 리전을 옮길 때 필수다.", "<k>⌃</k>를 누른 채 드래그하면 스냅이 잠시 꺼져 아주 미세하게 옮길 수 있다."], "path": [{"n": "스냅 설정", "s": ["트랙 영역 오른쪽 위 <b>스냅</b> 메뉴 클릭", "<b>마디 / 비트 / 디비전 / 틱 / 스마트</b> 중 선택", "<b>상대값 스냅</b> 체크 여부 확인"]}, {"n": "미세 이동", "s": ["<k>⌃</k>+드래그 → 스냅 무시", "리전 선택 후 인스펙터 <b>위치</b> 값 직접 입력"]}], "drill": ["스냅을 마디로 고정하고 리전 8개를 정확히 4마디 간격으로 배치한다.", "스냅을 디비전으로 바꿔 16분음표 단위로 옮겨본다.", "⌃ 드래그로 리전을 아주 조금만 앞으로 밀어 그루브 변화를 듣는다."], "keys": [["⌃드래그", "스냅 무시 미세 이동"], ["⌘←→", "줌 아웃과 줌 인"], ["Z", "선택 영역 확대와 복귀"]], "chk": ["스냅 단위를 상황에 따라 바꿀 수 있다", "상대값 스냅이 무엇인지 설명할 수 있다", "미세 이동으로 그루브를 바꿔봤다"], "quiz": [{"q": "일부러 그리드에서 밀어놓은 리전의 어긋난 정도를 유지하며 옮기려면?", "a": ["틱 스냅", "스냅 끄기", "스마트 스냅", "상대값 스냅"], "c": 3, "e": "상대값 스냅은 원래의 어긋남을 보존한 채 격자 단위로 옮긴다."}]}, {"t": "마키 도구", "goal": "리전 안의 일부를 골라 자르고 옮기고 재생하는 방법을 익힌다.", "con": ["리전 단위로만 편집하면 반드시 막히는 순간이 온다. 리전 중간의 한 소절만 지우고 싶거나, 두 리전에 걸친 구간을 통째로 옮기고 싶을 때다. 이때 쓰는 것이 마키 도구다. 리전 경계와 상관없이 원하는 구간을 사각형으로 고른다.", "마키는 리전이 아니라 시간 범위를 고른다. 그래서 여러 트랙에 걸쳐 한 번에 선택할 수 있고, 리전이 없는 빈 곳도 고를 수 있다. 고른 뒤 삭제하면 그 구간만 사라지고 앞뒤 리전은 자동으로 나뉜다. 그래서 리전을 자르는 가장 빠른 방법이기도 하다.", "재생에도 쓴다. 마키로 구간을 고르고 스페이스를 누르면 사이클 설정과 상관없이 그 구간만 한 번 재생하고 멈춘다. 반복 없이 딱 한 번 들어보고 싶을 때 사이클을 껐다 켤 필요가 없다. 마키로 한 점만 클릭하고 스페이스를 누르면 그 자리부터 재생된다.", "복사와 붙여넣기가 정확해진다. 마디 중간에서 시작하는 리전을 다른 자리에 음하고, 퀀타이즈 강도 80퍼센트로 정리한 뒤 틀린 음 하나를 피아노 롤에서 고친다.", "병합 모드로 사이클을 돌리며 킥, 스네어, 하이햇을 세 바퀴에 나눠 쌓는다.", "녹음 버튼 없이 즉흥으로 치다가 ⇧R로 캡처해 본다."], "keys": [["K", "메트로놈"], ["R", "녹음"], ["⇧R", "캡처 녹음"], ["⌘K", "뮤지컬 타이핑"], ["C", "사이클"], ["⌘Z", "실행 취소"]], "chk": ["메트로놈과 카운트인을 켜고 녹음했다", "반복 녹음의 두 방식을 구분한다", "캡처 녹음을 써 봤다"], "quiz": [{"q": "녹음 버튼을 누르지 않고 친 연주를 가져오는 단축키는?", "a": ["⇧R", "⌃R", "⌘R", "⌥R"], "c": 0, "e": "로직은 재생 중의 미디 입력을 항상 기억한다. ⇧R로 꺼내온다."}, {"q": "드럼을 킥, 스네어, 하이햇 순서로 층층이 쌓기에 알맞은 반복 녹음 방식은?", "a": ["녹음 불가", "테이크 폴더", "병합", "덮어쓰기"], "c": 2, "e": "병합은 회차마다 친 것을 한 리전에 겹쳐 쌓는다."}], "d": 26, "s": 5}, {"d": 27, "s": 5, "t": "레이턴시와 지연 보상", "goal": "레이턴시의 원인을 알고 버퍼와 보상을 설정한다.", "con": ["레이턴시는 소리가 들어와서 나가기까지 걸리는 시간이다. 두 가지에서 생긴다. 하나는 오디오 버퍼, 다른 하나는 플러그인 처리 시간이다.", "버퍼는 한 번에 처리하는 오디오 덩어리 크기다. 크면 컴퓨터가 편하고 지연이 길다. 작으면 반대다. 그래서 녹음할 때 작게, 믹스할 때 크게 두는 것이다. 값 자체는 앞의 녹음 세팅 일차에서 쓴 것과 같다. 이 일차에서 더하는 것은 값이 아니라 그 값이 몇 ms의 지연이 되는지의 계산이다. <v>128</v> 샘플이면 <v>48</v>kHz 기준 약 <v>2.7</v>ms, <v>1024</v> 샘플이면 약 <v>21</v>ms다. 왕복이므로 실제 체감은 두 배에 가깝다.", "연주에 지장이 생기는 지점은 대략 <v>10</v>ms 부근이다. 그 아래면 대부분 느끼지 못하고, <v>20</v>ms를 넘으면 확실히 어긋난다고 느낀다.", "플러그인마다 처리 지연이 다르다. 특히 선형 위상 EQ와 룩어헤드 리미터는 지연이 크다. 로직은 이것을 자동으로 계산해 다른 트랙을 그만큼 늦춰 맞춘다. 이것이 플러그인 지연 보상이다.", "보상 범위를 모두로 두면 정확하지만 전체 지연이 커진다. 녹음할 때 걸리적거리면 저지연 모드를 쓴다. 켜는 곳은 <b>레코드 → 저지연 모드</b>다. 켜면 지연이 큰 플러그인을 우회해 신호 흐름 전체의 지연을 한계값 아래로 유지한다. 소리가 달라지므로 녹음이 끝나면 끈다.", "샘플레이트도 지연에 영향을 준다. 높은 샘플레이트일수록 입력 모니터링 지연이 줄어든다. 다만 파일이 커지고 프로세서와 디스크 부담이 늘며 플러그인도 더 많은 연산을 쓴다. 지연을 줄이려고 샘플레이트를 올리는 것은 그래서 마지막 수단이고, 버퍼를 먼저 조절한다. 프로젝트를 만들 때 정해 두고 나중에 바꾸지 않는 것이 원칙이다.", "블루투스 헤드폰과 스피커는 녹음에 쓸 수 없다. 지연이 크고 그 지연은 버퍼로 줄일 수 없다. 믹싱에도 맞지 않는데 이쪽은 이유가 다르다. 지연이 아니라 신뢰도 문제다. 압축 코덱이 고역을 깎고 기기마다 자체 보정이 들어가서, 여기서 맞춘 균형이 다른 환경에서 그대로 나오지 않는다. 곡을 훑어보거나 남에게 들려줄 때만 쓴다."], "path": [{"n": "버퍼와 보상 설정", "s": ["<b>Logic Pro → 설정 → 오디오 → 기기</b>", "<b>I/O 버퍼 크기</b>: 녹음 <v>64~128</v>, 믹스 <v>512~1024</v>", "<b>플러그인 지연 보상</b>을 <b>모든 것</b>으로", "<b>적용</b>"]}, {"n": "저지연 모드", "s": ["<b>레코드 → 저지연 모드</b>로 켜고 끄기", "한계값 조정: <b>Logic Pro → 설정 → 오디오 → 일반</b>의 <b>플러그인 지연</b> 영역에서 <b>한계</b> 슬라이더", "자주 쓴다면 컨트롤 막대 우클릭 → <b>컨트롤 막대 및 디스플레이 사용자화</b>로 버튼 추가", "녹음 시 켜고 끝나면 끄기"]}], "drill": ["버퍼를 64와 1024로 바꿔가며 건반을 쳐서 지연을 체감한다.", "마스터에 선형 위상 EQ를 걸고 지연 보상이 켜졌을 때와 꺼졌을 때 트랙 간 어긋남을 확인한다.", "저지연 모드를 켜서 어떤 플러그인이 우회되는지 확인한다."], "keys": [["R", "녹음"], ["⌘S", "저장"]], "chk": ["버퍼와 지연의 관계를 안다", "지연 보상 설정 위치를 안다", "저지연 모드를 상황에 맞게 쓴다", "블루투스로는 녹음하지 않는다"], "quiz": [{"q": "연주에 지장을 느끼기 시작하는 지연은 대략?", "a": ["500ms", "100ms", "1ms", "10ms"], "c": 3, "e": "10ms 부근부터 체감되고 20ms를 넘으면 확실히 어긋난다고 느낀다."}, {"q": "녹음할 때 버퍼를 작게 두는 이유는?", "a": ["음질이 좋아져서", "용량을 아끼려고", "플러그인이 많아서", "지연을 줄이려고"], "c": 3, "e": "버퍼가 작을수록 지연이 짧지만 컴퓨터 부담은 커진다."}, {"q": "블루투스 헤드폰의 지연을 줄이려면?", "a": ["버퍼를 낮춘다", "줄일 수 없으므로 녹음에는 유선을 쓴다", "저지연 모드를 켠다", "샘플레이트를 올린다"], "c": 1, "e": "무선 기기의 지연은 로직 설정으로 줄일 수 없다. 믹스 확인이나 감상용으로만 쓴다."}]}, {"d": 28, "s": 5, "t": "벨로시티와 다이내믹", "goal": "벨로시티로 연주의 강약을 조절한다.", "con": ["벨로시티는 건반을 누른 세기다. 1부터 127까지고 대부분의 가상악기에서 음량과 음색이 함께 바뀐다. 세게 치면 크기만 커지는 게 아니라 밝아진다.", "모두 같은 벨로시티로 찍힌 미디가 기계처럼 들리는 가장 큰 이유다. 여기만 손봐도 완성도가 크게 올라간다.", "실전 값의 감각: 아주 여린 부분 <v>40~55</v>, 보통 <v>64~80</v>, 강조 <v>95~110</v>, 최강 <v>115~127</v>. 한 프레이즈 안에서 최소 20 이상 편차를 주는 것을 목표로 한다. 20인 이유는 실제 연주다. 같은 세기로 치려 해도 사람 손은 이 정도 폭으로 흔들리고, 편차가 이보다 작으면 귀가 복사된 반복으로 인식한다. 편차를 주면 같은 음형이 반복돼도 매번 조금씩 다르게 들려 귀가 지루해하지 않는다. 하이햇처럼 촘촘한 층은 이 하나로 기계와 사람이 갈린다.", "박의 위치에 따른 기본 규칙이 있다. 4/4에서 1박이 가장 강하고 3박이 다음, 2박과 4박이 약하다. 이 위계인 이유는 지각이다. 사람은 마디의 시작을 기준점 삼아 리듬을 붙잡는다. 그래서 1박이 무거워야 마디 단위가 들린다. 3박은 마디를 절반으로 나누는 기둥이라 그다음이다. 여기에 프레이즈의 오르내림을 겹치면 자연스러워진다.", "피아노 롤에서 음을 선택하고 위아래로 드래그하면 벨로시티가 바뀐다. 색으로도 구분된다.", "편차를 손으로 다 찍는 대신 로직이 흔들어 주게 할 수도 있다. 휴머나이즈다. 선택한 음들의 벨로시티와 타이밍을 정한 폭 안에서 무작위로 조금씩 바꾼다. 복사해서 붙인 반복 구간에 걸면 매번 조금씩 달라져 사람이 친 것처럼 된다. 벨로시티 <v>±10</v>, 타이밍 <v>±10</v>틱 정도가 무난하고, 더 크게 하면 틀린 연주처럼 들린다."], "path": [{"n": "벨로시티 편집", "s": ["피아노 롤에서 음 선택", "<k>⌃</k>+드래그 위아래 → 벨로시티 변경", "또는 왼쪽 아래 <b>벨로시티</b> 슬라이더 사용", "여러 음 선택 후 조절 → 상대 비율 유지"]}, {"n": "자동으로 흔들기", "s": ["리전 선택 → 인스펙터 <b>리전</b> 영역 열기", "<b>벨로시티</b> 값을 +나 -로 조정 → 전체 이동", "<b>MIDI 변형 → 인간미</b> → 벨로시티 무작위 편차 부여"]}, {"n": "휴머나이즈", "s": ["피아노 롤에서 흔들 음들 선택", "<b>기능 → MIDI 변환 → 휴머나이즈</b>", "벨로시티 <v>±10</v>, 위치 <v>±10</v>틱", "적용 후 들어보고 과하면 되돌리기"]}], "drill": ["같은 음 8개를 16분음표로 찍고 벨로시티를 전부 100으로 둔 뒤 들어본다. 그다음 1박 110, 나머지 70~85로 바꿔 다시 듣고 차이를 적는다.", "피아노 4마디 프레이즈를 만들고 시작 60에서 절정 110까지 서서히 올라가는 크레셴도를 벨로시티만으로 만든다."], "keys": [["⌃드래그", "벨로시티"], ["⌘A", "전체 선택"]], "chk": ["벨로시티 편차를 20 이상 준다", "박별 강약 규칙을 적용할 수 있다", "크레셴도를 벨로시티로 만들 수 있다", "반복 구간에 휴머나이즈를 쓴다"], "quiz": [{"q": "벨로시티가 대부분의 가상악기에서 함께 바꾸는 것은?", "a": ["음높이", "음량과 음색", "길이", "팬"], "c": 1, "e": "세게 칠수록 크고 밝아지도록 샘플이 층으로 나뉘어 있다."}, {"q": "4/4에서 일반적으로 가장 강한 박은?", "a": ["3박", "4박", "2박", "1박"], "c": 3, "e": "1박이 가장 강하고 3박이 그다음이다."}]}, {"d": 29, "s": 5, "t": "퀀타이즈와 그루브", "goal": "퀀타이즈 강도와 스윙을 조절한다.", "con": ["퀀타이즈는 음을 격자에 붙이는 기능이다. 연주가 흔들렸을 때 정리해준다. 그런데 100퍼센트 붙여버리면 생기가 사라진다.", "결과를 가르는 것은 강도 값이다. 강도 <v>100</v>퍼센트는 격자에 완전히 붙이고, <v>70~85</v>퍼센트는 격자 쪽으로 그만큼만 당긴다. 실전에서는 80퍼센트 근처가 자연스럽다. 80인 이유는 연주 오차가 무작위가 아니기 때문이다. 밀고 당김에 연주자의 의도가 담겨 있다. 100퍼센트로 지우면 그 의도까지 사라진다. 80퍼센트는 박을 정리하면서 흔적을 남기는 비율이다. 같은 이유로 퀀타이즈와 인간미(무작위 흔들기)는 겹쳐 쓰지 않는다. 하나는 오차를 줄이고 하나는 오차를 만드는 반대 방향의 처리라 겹치면 서로를 지울 뿐이다. 손으로 친 연주에는 퀀타이즈를, 마우스로 찍은 것에는 인간미를 쓴다.", "스윙 값은 짝수 번째 음을 뒤로 미는 비율이다. 스트레이트가 <v>50</v>, 재즈 계열 스윙이 <v>58~67</v>이다. 힙합의 그루브는 16분음표 스윙 <v>54~58</v> 정도에서 나온다.", "퀀타이즈 격자는 리듬의 성격을 정한다. 1/8은 넓고 1/16은 촘촘하다. 드럼 하이햇에 1/16, 킥과 스네어에 1/8을 따로 걸기도 한다.", "오디오도 퀀타이즈할 수 있다. 플렉스 타임을 켜면 된다. 오디오 스테이지의 플렉스 타임 일차에서 다룬다.", "<k>Q</k>는 새 값을 묻지 않고 이미 설정된 값을 적용한다. 그래서 단축키를 쓰려면 그 값을 먼저 정해 둬야 한다. 리전을 선택하고 인스펙터의 <b>퀀타이즈</b> 항목에서 격자와 강도와 스윙을 지정하면, 그다음부터 <k>Q</k>가 그 설정으로 동작한다.", "기본값을 하나 정해 두면 편하다. 격자 <v>1/16</v>, 강도 <v>80</v>퍼센트, 스윙 <v>50</v>. 대부분의 연주에 무난하고, 필요할 때만 바꾼다. 드럼처럼 촘촘한 것은 <v>1/16</v>, 코드 반주처럼 성긴 것은 <v>1/8</v>로 두면 엉뚱한 자리로 끌려가는 일이 줄어든다.", "격자를 잘못 잡으면 퀀타이즈가 음을 엉뚱한 박으로 옮긴다. 16분음표 연주에 1/4 격자를 걸면 네 개 중 세 개가 사라진 것처럼 뭉친다. 적용 후 이상하면 <k>⌘Z</k>로 되돌리고 격자부터 다시 본다.", "타이밍 말고 음높이를 맞추는 퀀타이즈도 있다. 스케일 퀀타이즈다. 조와 스케일을 정하면 그 안에 없는 음을 가장 가까운 "a": ["곡 구조 편집", "믹스 밸런스 조절", "중요한 파라미터만 모아 빠르게 조절", "오디오 녹음"], "c": 2, "e": "패치에서 자주 만지는 파라미터만 골라 모아둔 패널이다."}]}, {"d": 31, "s": 5, "t": "미디 컨트롤 체인지: CC1과 CC11", "goal": "CC1과 CC11로 음량과 음색을 시간에 따라 조절한다.", "con": ["벨로시티는 음이 시작될 때 한 번만 정해진다. 그래서 긴 음은 시작 이후에 표정을 줄 수 없다. 여기서 컨트롤 체인지가 필요하다.", "실전에서 쓰는 것은 두 개다. CC1 모듈레이션은 대개 음색의 세기와 밝기를, CC11 익스프레션은 음량을 시간에 따라 바꾼다. 스트링과 관악기에서는 이것 없이는 소리가 죽는다.", "오케스트라 계열 음원은 CC1로 다이내믹 레이어를 넘기고 CC11로 미세한 음량을 다듬는 구성이 표준이다. 두 개를 겹쳐 쓰면 자연스러운 스웰이 만들어진다.", "팀파니 롤이나 스트링 크레셴도는 음을 잘게 반복해 찍지 않는다. 긴 음 하나에 CC11 상승 곡선을 그리는 편이 훨씬 자연스럽다.", "CC7 볼륨은 트랙 전체 음량이라 표정용으로는 쓰지 않는다. 믹스용으로 남겨둔다.", "값의 범위는 <v>0</v>에서 <v>127</v>이다. 그런데 양 끝은 잘 쓰지 않는다. <v>0</v>은 소리가 아예 사라지고 <v>127</v>은 최대 레이어라 더 올릴 여지가 없다. 실전에서는 CC1을 <v>40</v>에서 <v>110</v> 사이, CC11을 <v>60</v>에서 <v>110</v> 사이에서 움직인다. 여지를 남겨 두면 나중에 그 구간만 키우고 싶을 때 방법이 생긴다.", "곡선 모양이 결과를 가른다. 직선으로 올리면 기계적으로 들린다. 처음에는 천천히, 중간에서 빠르게, 끝에서 다시 완만해지는 S자 곡선이 사람의 크레셴도에 가깝다. 로직에서는 두 포인트 사이 선의 가운데 핸들을 드래그해 곡선을 만든다.", "실전 스웰의 값. <v>4</v>마디 크레셴도라면 CC11을 <v>50</v>에서 <v>105</v>까지, CC1은 그보다 조금 앞서 <v>45</v>에서 <v>100</v>까지 올린다. CC1을 먼저 올리면 음색이 열린 뒤 음량이 따라와서 자연스럽다. 둘을 완전히 같은 곡선으로 두면 변화가 밋밋해진다.", "값이 뚝뚝 끊겨 들리는 경우가 있다. CC는 <v>0~127</v>의 정수라 느린 구간에서 한 칸씩 넘어가는 것이 들릴 수 있다. 포인트를 적게 찍고 로직이 사이를 채우게 두면 대개 해결된다. 그래도 남으면 음원 쪽에서 CC 부드럽게 하기 설정을 찾아본다.", "긴 음 하나에 CC를 그릴 때는 음이 시작되기 <b>전에</b> 시작 값을 찍어 둔다. 음이 울린 뒤에 첫 CC가 오면 그 순간 값이 튀어 소리가 덜컥거린다."], "path": [{"n": "피아노 롤에서 CC 그리기", "s": ["피아노 롤 왼쪽 아래 <b>오토메이션과 미디 표시</b> 버튼 클릭", "팝업에서 <b>MIDI 컨트롤러 → 1 Modulation</b> 또는 <b>11 Expression</b>", "연필 도구로 선 그리기", "선 위 점을 드래그해 곡선 조절"]}, {"n": "실물 노브로 녹음", "s": ["미디 키보드 모듈레이션 휠 연결", "트랙 녹음 준비 → <k>R</k>", "연주 없이 휠만 움직여도 CC가 기록됨"]}], "drill": ["스트링 패치로 온음표 4개를 찍고 CC11을 30에서 100까지 올라가는 곡선으로 그려 크레셴도를 만든다.", "같은 프레이즈에 CC1도 겹쳐 그려 음색이 함께 열리는지 확인한다.", "CC 없이 벨로시티만 준 버전과 비교해 어느 쪽이 살아 있는지 판단한다.", "같은 4마디 스웰을 직선과 S자 곡선으로 만들어 비교한다."], "keys": [["P", "피아노 롤"], ["A", "오토메이션"]], "chk": ["CC1과 CC11의 차이를 안다", "긴 음에 크레셴도를 만들 수 있다", "팀파니 롤을 긴 음 하나로 처리할 수 있다", "CC 실전 범위와 곡선 모양을 안다"], "quiz": [{"q": "긴 음의 음량을 시간에 따라 바꿀 때 주로 쓰는 컨트롤 체인지는?", "a": ["CC11", "CC7", "CC64", "CC1"], "c": 0, "e": "CC11 익스프레션이 연주 표현용 음량이다. CC7은 믹스용으로 남겨둔다."}, {"q": "팀파니 롤을 만드는 더 자연스러운 방법은?", "a": ["벨로시티를 127로 고정", "리버브를 크게", "긴 음 하나에 CC11 크레셴도", "32분음표를 빽빽하게 찍는다"], "c": 2, "e": "음원이 이미 롤 샘플을 갖고 있는 경우가 많고, 잘게 찍으면 기관총 소리가 난다."}, {"q": "CC1을 0이나 127 같은 양 끝에 두지 않는 이유는?", "a": ["음원이 고장 나서", "더 올리거나 내릴 여지가 없어서", "CPU 때문", "템포 문제"], "c": 1, "e": "40~110 사이에서 움직이면 나중에 그 구간만 키울 방법이 남는다."}, {"q": "크레셴도에서 CC1과 CC11의 관계는?", "a": ["완전히 같은 곡선", "CC1을 조금 앞서 올린다", "CC11만 쓴다", "순서 무관"], "c": 1, "e": "음색이 열린 뒤 음량이 따라와야 자연스럽다."}]}, {"d": 32, "s": 5, "t": "아티큘레이션과 키스위치", "goal": "아티큘레이션을 지정하고 타이밍을 보정한다.", "con": ["실제 악기는 주법마다 소리가 다르다. 바이올린의 활 긋기, 짧게 끊기, 떨기, 뜯기가 전부 다른 소리다. 가상악기는 이것을 아티큘레이션으로 구분한다.", "주법을 바꾸는 방법은 두 가지다. 키스위치는 연주에 쓰지 않는 낮은 음역의 건반을 눌러 전환하는 방식이다. 아티큘레이션 세트는 로직이 이름표로 관리해주는 방식이다.", "로직의 아티큘레이션 세트를 쓰면 피아노 롤에서 음을 선택하고 이름으로 주법을 지정할 수 있다. 낮은 건반 위치를 외울 필요가 없다.", "주법이 바뀌면 음의 앞부분 길이도 달라진다. 레가토 계열은 소리가 늦게 나오는 경우가 많아서, 음을 격자보다 살짝 앞으로 당겨야 박에 맞게 들린다. 보통 <v>20~60</v>ms 정도다.", "스타카토를 쓸 때는 음 길이를 실제로 짧게 만들 필요가 없다. 샘플 자체가 짧다.", "키스위치가 놓이는 자리는 대개 <v>C0</v>에서 <v>B0</v>, 또는 그보다 더 낮은 <v>C-2</v> 부근이다. 연주 음역과 멀리 떨어뜨려 둔 이유가 있다. 가까우면 실제로 연주하는 음이 주법 전환으로 잘못 읽혀서, 낮은 음을 칠 때마다 악기가 엉뚱하게 바뀐다. 음원마다 다르므로 악기를 열어 건반 그림에서 색이 다른 구간을 찾는다. 연주 음역과 겹치지 않는 곳에 놓여 있다.", "주법마다 소리가 나오기까지 걸리는 시간이 다르다. 스타카토와 피치카토는 거의 즉시 나오므로 보정이 필요 없고, 레가토와 서스테인은 <v>40~80</v>ms까지 늦기도 한다. 한 트랙에 여러 주법을 섞어 쓸 때 트랙 지연으로 한꺼번에 보정하면 스타카토가 오히려 빨라진다. 이럴 때는 주법별로 트랙을 나누거나 늦는 음만 피아노 롤에서 앞으로 당긴다.", "아티큘레이션 세트는 직접 만들 수 있다. 트랙 인스펙터의 아티큘레이션 세트 항목에서 새로 만들고, 주법 이름과 그에 대응하는 키스위치 음을 표로 채운다. 한 번 만들어 두면 그 음원을 쓸 때마다 이름으로 주법을 고를 수 있다."], "path": [{"n": "아티큘레이션 지정", "s": ["피아노 롤에서 음 선택", "피아노 롤 인스펙터의 <b>아티큘레이션</b> 항목 클릭", "목록에서 주법 선택"]}, {"n": "트랙 지연 보정", "s": ["<k>I</k>로 인스펙터 → 트랙 영역 열기", "<b>지연</b> 값에 <v>-30</v>ms 정도 입력 → 트랙 전체가 앞당겨짐"]}, {"n": "아티큘레이션 세트 만들기", "s": ["트랙 선택 → <k>I</k> 인스펙터 → 트랙 영역의 <b>아티큘레이션 세트</b> 클릭", "<b>새로운 아티큘레이션 세트</b> 선택", "<b>Switches</b> 탭에서 주법마다 키스위치 음 지정", "<b>Articulations</b> 탭에서 이름 입력", "저장 후 피아노 롤에서 이름으로 선택"]}], "drill": ["스트링 음원으로 같은 4마디를 레가토, 스타카토, 피치카토 세 가지로 만들어 비교한다.", "레가토 트랙에 지연 -30ms를 걸고 드럼과 함께 들어 어느 쪽이 박에 맞는지 확인한다."], "keys": [["P", "피아노 롤"], ["I", "인스펙터"]], "chk": ["아티큘레이션을 바꿔봤다", "트랙 지연으로 타이밍을 보정할 수 있다", "주법에 따른 어택 차이를 들었다", "키스위치 음역을 찾을 수 있다"], "quiz": [{"q": "레가토 계열 샘플이 박보다 늦게 들릴 때 쓰는 설정은?", "a": ["트랙 음량", "트랙 지연", "벨로시티", "퀀타이즈 강도"], "c": 1, "e": "트랙 지연에 음수 값을 주면 트랙 전체가 앞당겨진다."}, {"q": "한 트랙에 레가토와 스타카토를 섞어 쓸 때 트랙 지연을 걸면?", "a": ["소리가 커진다", "스타카토가 오히려 빨라진다", "템포가 바뀐다", "둘 다 맞는다"], "c": 1, "e": "주법마다 늦는 정도가 달라서 한꺼번에 보정할 수 없다. 주법별로 트랙을 나누거나 늦는 음만 당긴다."}]}, {"t": "컨트롤러 할당과 매핑", "goal": "컨트롤러를 로직 파라미터에 할당하고 CC를 실시간 녹음한다.", "con": ["미디 컨트롤러의 노브, 페이더, 패드는 처음엔 아무 데도 연결되어 있지 않다. 무엇을 움직일지는 내가 정해서 로직에 가르쳐야 한다. 이 가르치는 과정이 할당이고, 로직에서는 학습이라고 부른다.", "가장 많이 쓰는 연결은 스마트 컨트롤이다. 화면의 노브를 우클릭해 학습을 켜고, 기기의 노브를 한 번 돌리면 연결이 끝난다. 그때부터 손으로 돌리는 것과 마우스로 돌리는 것이 같아진다.", "학습 중에 주의할 것 하나. 학습이 켜진 동안 움직인 첫 신호가 그대로 할당된다. 다른 노브를 건드리거나 건반을 스치면 엉뚱한 것이 연결된다. 학습을 켜고, 원하는 노브 하나만 움직이고, 바로 학습을 끈다.", "이 연결이 빛나는 곳이 CC 녹음이다. 앞에서 CC1과 CC11을 마우스로 그렸다. 이제 페이더에 CC11을 맡기면, 스트링을 재생하며 페이더를 밀어 올리는 것만으로 크레셴도가 실시간으로 기록된다. 들으면서 조작하기 때문에 마우스로 그린 직선보다 자연스러운 곡선이 기록된다.", "많은 컨트롤러의 노브는 처음부터 CC 번호를 보내도록 설정되어 있다. 제조사 앱에서 노브마다 보낼 CC 번호를 정할 수 있는 제품도 있다. 그렇다면 자주 쓰는 노브 하나를 CC1로, 페이더 하나를 CC11로 정해 둔다. 그렇게 하면 로직 쪽 학습 없이도 악기가 바로 반응한다.", "드럼 패드는 건반과 똑같은 미디 음표를 보낸다. 패드가 여덟 개라면 여덟 개의 음이 배정되어 있는 것이다. 드럼 음원의 킥, 스네어, 하이햇 자리와 패드 배치가 안 맞으면 기기나 음원 쪽에서 음을 다시 배정한다. 패드로 드럼을 치면 마우스로 찍은 것과 달리 벨로시티 편차가 저절로 들어간다.", "할당을 지우거나 고칠 때는 컨트롤러 할당 창을 연다. 지금까지 학습된 연결이 전부 목록으로 보이고, 잘못 붙은 것을 골라 삭제할 수 있다. 노브가 엉뚱한 것을 움직인다면 십중팔구 여기에 예전 할당이 남아 있는 것이다."], "path": [{"n": "스마트 컨트롤에 노브 붙이기", "s": ["트랙을 선택하고 <k>B</k>로 스마트 컨트롤을 연다", "화면의 노브를 <b>우클릭 → 외부 할당 학습</b>", "기기의 노브 <b>하나만</b> 움직인다", "같은 메뉴에서 학습을 끈다", "기기 노브를 돌려 화면 노브가 따라 움직이는지 확인한다"]}, {"n": "페이더로 CC11 녹음", "s": ["스트링 트랙에 온음표 화음 4마디를 만든다", "기기 페이더가 CC11을 보내도록 제조사 앱 또는 학습으로 준비한다", "트랙 녹음 준비 후 <k>R</k>", "연주하지 않고 페이더만 밀어 올리며 크레셴도를 기록한다", "피아노 롤에서 CC11 곡선이 기록됐는지 확인한다"]}, {"n": "할당 정리", "s": ["<b>Logic Pro → 컨트롤 서페이스 → 컨트롤러 할당</b>을 연다", "목록에서 잘못 붙은 할당을 선택한다", "<b>삭제</b>"]}], "drill": ["스마트 컨트롤 노브 하나에 기기 노브를 학습시키고, 신스 필터를 손으로 돌리며 재생해 본다.", "페이더로 CC11 크레셴도를 실시간 녹음하고, 마우스로 그린 곡선과 비교해 어느 쪽이 자연스러운지 듣는다.", "패드로 8비트 드럼을 쳐서 녹음하고, 마우스로 찍은 같은 패턴과 벨로시티 분포를 비교한다."], "keys": [["B", "스마트 컨트롤"], ["R", "녹음"], ["P", "피아노 롤"]], "chk": ["학습으로 노브를 연결할 수 있다", "페이더로 CC를 실시간 녹음했다", "잘못된 할당을 지울 수 있다"], "quiz": [{"q": "학습이 켜진 동안 가장 조심할 것은?", "a": ["저장을 안 하는 것", "소리를 크게 트는 것", "원하는 노브 외에 다른 것을 건드리는 것", "템포 변경"], "c": 2, "e": "학습 중 처음 들어온 신호가 그대로 할당된다. 하나만 움직이고 바로 끈다."}, {"q": "페이더로 CC11을 녹음하면 마우스보다 좋은 점은?", "a": ["용량이 작다", "들으면서 조작해 곡선이 자연스럽다", "퀀타이즈가 필요 없다", "음정이 정확해진다"], "c": 1, "e": "들으면서 만드는 움직임이라 기계적인 직선이 아니라 살아 있는 곡선이 나온다."}], "d": 33, "s": 5}, {"d": 34, "s": 5, "t": "미디 이펙트", "goal": "미디 이펙트로 패턴을 만들고 결과를 확정한다.", "con": ["미디 이펙트는 악기에 도달하기 전의 미디 신호를 가공한다. 오디오가 아니라 음표 자체를 바꾸는 것이다. 악기 슬롯 위에 별도의 슬롯이 있다.", "아르페지에이터가 대표적이다. 코드를 누르고 있으면 음을 하나씩 순서대로 연주한다. 방향, 속도, 옥타브 범위, 그루브를 정할 수 있다. 신스 시퀀스와 반복 패턴을 만들 때 강력하다.", "아르페지에이터에서 실제로 만지는 값은 다섯이다. <b>Rate</b>는 음이 나오는 간격으로 <v>1/16</v>이 기본이고 빠른 곡은 <v>1/8</v>, 촘촘한 신스 시퀀스는 <v>1/32</v>다. <b>Direction</b>은 순서로 Up이 기본이며 Up/Down은 오르내리고 Random은 매번 다르게 나온다. <b>Octave Range</b>는 몇 옥타브에 걸쳐 퍼질지로 <v>1</v>이면 제자리, <v>2</v>가 가장 무난하고 <v>4</v>는 지나치게 흩어진다.", "나머지 둘이 느낌을 정한다. <b>Note Length</b> 또는 Gate는 각 음의 길이 비율로 <v>50</v>퍼센트면 또박또박, <v>90</v>퍼센트면 이어져 흐른다. 신스 플럭은 <v>40~60</v>, 패드 계열 아르페지오는 <v>80~100</v>이 맞는다. <b>Swing</b>은 앞에서 본 값과 같아서 <v>50</v>이 스트레이트, <v>55~60</v>이면 끌리는 느낌이 생긴다.", "<b>Latch</b>를 켜면 건반에서 손을 떼도 계속 연주된다. 코드를 바꿀 때만 건반을 누르면 되므로 편곡 실험이 빨라진다. 다만 켜 둔 채 다른 작업을 하면 소리가 계속 나므로 끝나면 끈다.", "코드 트리거는 건반 하나에 코드 하나를 배정한다. 한 손가락으로 진행을 연주할 수 있어서 편곡 실험이 빨라진다.", "모디파이어는 컨트롤 체인지를 다른 값으로 바꾼다. 모듈레이션 휠 신호를 익스프레션으로 보내는 식이다. 손이 하나뿐일 때 유용하다.", "벨로시티 프로세서는 벨로시티를 자동으로 조정한다. 랜더마이저는 미세한 흔들림을 준다. 둘 다 기계 같은 느낌을 없애는 데 쓴다.", "미디 이펙트의 결과는 리전에 기록되지 않는다. 눈에 보이는 음표와 실제 들리는 음이 다르다. 확정하고 싶으면 결과를 미디로 굳혀야 한다."], "path": [{"n": "아르페지에이터", "s": ["트랙 선택 → <k>I</k> 인스펙터", "악기 슬롯 <b>위쪽</b>의 <b>MIDI FX</b> 슬롯 클릭 → <b>Arpeggiator</b>", "<b>Direction</b>, <b>Rate</b>, <b>Octave Range</b> 조정", "<b>Grid</b>와 <b>Swing</b>으로 그루브"]}, {"n": "결과를 미디로 굳히기", "s": ["아르페지에이터가 걸린 트랙의 리전 선택", "트랙 우클릭 → <b>바운스 후 대치</b> 또는 새 트랙에 재녹음", "이후 피아노 롤에서 직접 편집"]}], "drill": ["코드 하나를 길게 누르고 아르페지에이터의 방향과 속도를 바꿔가며 들어본다.", "코드 트리거로 진행 하나를 한 손가락 연주로 만든다.", "아르페지에이터 결과를 미디로 굳혀 마지막 마디만 손으로 고친다.", "같은 코드에 Rate 1/8과 1/16, Octave Range 1과 2를 조합해 네 가지를 만들어 비교한다."], "keys": [["I", "인스펙터"], ["P", "피아노 롤"]], "chk": ["미디 이펙트 슬롯 위치를 안다", "아르페지에이터로 패턴을 만들 수 있다", "결과를 미디로 굳힐 수 있다", "아르페지에이터 다섯 파라미터를 안다"], "quiz": [{"q": "미디 이펙트가 처리하는 것은?", "a": ["샘플 파일", "마스터 출력", "오디오 신호", "악기에 도달하기 전의 음표 정보"], "c": 3, "e": "음표 자체를 바꾸므로 악기 앞단에 놓인다."}, {"q": "아르페지에이터에서 신스 플럭에 어울리는 Note Length는?", "a": ["40~60퍼센트", "0퍼센트", "80~100퍼센트", "100퍼센트 고정"], "c": 0, "e": "짧게 두면 또박또박 끊긴다. 패드 계열 아르페지오는 80~100이 맞는다."}, {"q": "Octave Range를 4로 두면?", "a": ["소리가 안 난다", "가장 무난", "제자리에서 반복", "지나치게 흩어진다"], "c": 3, "e": "2가 가장 무난하다. 1은 제자리, 4는 음이 너무 넓게 퍼진다."}]}, {"t": "소리 계열 지도 1: 건반과 신스", "goal": "건반·신스 계열의 소리 성격과 어울리는 분위기를 알고, 라이브러리에서 검색으로 찾는다.", "con": ["라이브러리에는 수천 개의 음색이 있지만 계열은 몇 갈래뿐이다. 계열의 성격을 알면 이름을 몰라도 원하는 소리를 찾을 수 있다. 검색창에는 영어 계열명을 넣는다. 라이브러리가 영어 이름으로 정리되어 있기 때문이다.", "느낌 단어부터 성질로 고정한다. 고역 배음이 많으면 밝게 들리고, 고역 배음이 적으면 어둡게 들린다. 고역이 부드럽고 중저역이 두꺼우면 따뜻하게 들리고, 고역이 강조되고 배음이 금속성이면 차갑게 들린다. 중저역이 차 있고 여러 층이 겹치면 두껍게 들리고, 중역만 좁게 남으면 얇게 들린다. 어택이 또렷하고 잔향이 적으면 가깝게 들리고, 잔향이 많고 고역이 줄면 멀게 들린다. 이 장의 모든 설명은 이 여덟 가지 관계로 되어 있다.", "고르는 순서는 역할부터다. 지금 필요한 것이 리듬인지, 저음인지, 화성 반주인지, 선율인지, 배경 공간인지 먼저 정한다. 그다음 계열을 고르고, 마지막에 개별 음색을 듣는다. 음색부터 뒤지면 수천 개 앞에서 길을 잃는다.", "어쿠스틱 피아노 계열. 그랜드(Grand)는 밝고 정직해서 어디에나 서고, 업라이트(Upright)는 조금 어둡고 소박하다. 펠트 피아노(Felt)는 해머에 천을 덧댄 소리다. 어택이 무뎌지고 고역이 줄어 조용하고 가깝게 들린다. 조용한 발라드와 영상 배경 음악에 쓰인다.", "일렉트릭 피아노(Electric Piano) 계열은 두 갈래다. 틴(tine) 계열은 금속 막대를 때리는 소리다. 여리게 치면 어택이 죽어 둥글고, 세게 치면 금속성 배음이 급격히 커져 종처럼 벌어진다. 알앤비와 발라드의 기본 재료다. 리드(reed) 계열은 더 거칠고 컥컥대는 성격이라 세게 칠수록 펑키해진다. 로직에서는 Vintage Electric Piano가 이 계열을 맡는다.", "오르간 계열. 드로우바 오르간(Drawbar Organ)은 막대를 밀고 당겨 배음을 섞는 방식이다. 어택 없이 즉시 최대 음량으로 지속되어 두껍고 힘있게 들리는 소리라, 가스펠과 록에서 큰 음량의 지속 화성을 맡는다. 로직의 Vintage B3가 이것이다. 파이프 오르간(Pipe Organ)은 성당의 장엄함, 콤보 오르간은 얇고 복고적인 소리다. 클라비넷(Clav)은 건반이지만 성격은 타악기에 가까워서 펑크 리듬의 재료가 된다.", "신스는 소리를 만드는 방식이 계열을 가른다. 아날로그(Analog) 계열은 톱니파를 필터로 깎는 방식이다. 중저역이 두껍고 고역이 부드러워 따뜻하게 들린다. 복고, 신스팝, 두꺼운 베이스가 이쪽이다. FM 계열은 파형끼리 서로를 흔들어 금속성 배음을 만든다. 고역이 강조되어 차갑고 반짝이게 들리며, 벨과 일렉트릭 피아노풍 소리가 특기다. 웨이브테이블(Wavetable) 계열은 파형 자체가 시간에 따라 변한다. 움직임이 많아 최근 일렉트로닉의 중심이 됐다. 로직의 Retro Synth 하나에 Analog, Sync, Wavetable, FM 네 방식이 다 들어 있어 계열 비교 학습에 가장 좋다.", "Alchemy는 로직의 만능 신스다. 샘플과 합성을 섞을 수 있고 프리셋이 방대해서, 패드와 텍스처 계열은 여기서 찾는 것이 가장 빠르다. Sculpture는 물리 모델링 방식으로, 현을 활로 긋거나 두드리는 과정을 계산해 실제도 전자도 아닌 중간의 소리를 낸다.", "신스 음색 이름에 붙는 역할어를 알면 검색이 끝난다. Lead는 선율을 맡는 전면의 소리, Pad는 뒤에 깔리는 지속음, Pluck은 짧게 튕기는 소리, Bass는 저음, Arp는 아르페지오용 반복 소리, Stab은 짧게 끊어 치는 코드 타격, Riser는 상승 전환 효과음이다. 검색창에 Pad라고 치면 배경 지속음만 모아 볼 수 있다.", "성질에서 계열로 가는 기준. 어택이 무디고 고역이 적어 조용하고 가깝게 들리는 소리는 펠트 피아노와 틴 일렉트릭 피아노. 중저역이 두껍고 필터가 움직여 따뜻하게 들리는 소리는 아날로그. 금속성 배음으로 차갑고 반짝이게 들리는 소리는 FM. 파형이 계속 변해 움직임이 크게 들리는 소리는 웨이브테이블. 어택 없이 크고 두껍게 지속되는 화성은 드로우바 오르간이다. 정답이 아니라 출발점이다."], "path": [{"n": "역할어로 검색", "s": ["소프트웨어 악기 트랙 선택 → <k>Y</k>", "라이브러리 검색창에 <b>Pad</b> 입력 → 위아래 화살표로 연달아 듣기", "<b>Pluck</b>, <b>Lead</b>, <b>Stab</b>으로 바꿔 같은 방식으로 듣기", "각 역할어의 소리 성격을 한 줄씩 적기"]}, {"n": "계열 비교", "s": ["Retro Synth를 열고 상단 탭 <b>Analog → FM → Table</b>을 오가며 같은 프레이즈 듣기", "Vintage Electric Piano에서 여리게, 세게 쳐서 음색 변화 확인", "Alchemy 프리셋 분류에서 <b>Pads</b> 계열 훑기"]}], "drill": ["같은 코드 진행을 그랜드, 펠트, 틴 일렉트릭 피아노 세 가지로 쳐 보고 분위기 차이를 적는다.", "Retro Synth의 네 방식으로 같은 선율을 재생해 계열 성격을 몸으로 구분한다.", "'어택 무딤, 고역 적음, 움직임 느림' 같은 성질 세 가지를 정하고, 그 조건에 맞는 음색을 계열 감각만으로 세 개 골라 본다."], "keys": [["Y", "라이브러리"], ["↑ ↓", "음색 이동"], ["P", "피아노 롤"]], "chk": ["역할어 일곱 개(Lead, Pad, Pluck, Bass, Arp, Stab, Riser)를 안다", "아날로그, FM, 웨이브테이블의 성격 차이를 말할 수 있다", "성질에서 계열로 가는 출발점이 생겼다"], "quiz": [{"q": "뒤에 깔리는 지속음 계열을 라이브러리에서 찾는 검색어는?", "a": ["Lead", "Pad", "Arp", "Stab"], "c": 1, "e": "Pad가 배경 지속음이다. Lead는 전면의 선율용이다."}, {"q": "유리나 종처럼 반짝이는 차가운 소리가 특기인 합성 방식은?", "a": ["FM", "물리 모델링", "아날로그", "웨이브테이블"], "c": 0, "e": "FM은 파형끼리 서로를 흔들어 금속성 배음을 만든다."}, {"q": "알앤비와 발라드의 기본 재료인 둥근 종 같은 건반 계열은?", "a": ["드로우바 오르간", "클라비넷", "틴 일렉트릭 피아노", "파이프 오르간"], "c": 2, "e": "틴 계열 일렉트릭 피아노가 그 몽글하고 둥근 소리다."}], "d": 35, "s": 6}, {"t": "소리 계열 지도 2: 관현악, 기타, 목소리, 드럼머신", "goal": "오케스트라·기타·보컬·드럼 계열의 성격을 알고 분위기에 맞게 고른다.", "con": ["현악 계열은 인원이 성격을 가른다. 앙상블(Ensemble) 스트링은 여러 명이 함께 켜는 소리라 넓고 매끈해서 곡을 감싸는 배경이 되고, 솔로(Solo) 스트링은 한 명의 소리라 가깝고 감정이 진하다. 앙상블은 여러 명의 미세한 어긋남이 합쳐져 표면이 매끈하고 폭이 넓게 들리므로 배경 화성용이고, 솔로는 비브라토와 활 소리가 그대로 드러나 거리가 가깝게 들리므로 선율 하나를 앞에 세우는 용도다. 로직의 Studio Strings가 앙상블 계열을 맡는다.", "현악의 주법이 곧 분위기다. 레가토(Legato)는 음 사이가 이어지는 지속음이라 배경용이고, 스타카토(Staccato)와 스피카토(Spiccato)는 어택이 강하고 지속이 짧아 리듬용이다. 피치카토(Pizzicato)는 손으로 뜯어 어택 직후 소리가 사라져 가볍고 통통 튀게 들리므로 리듬 요소가 되고, 트레몰로(Tremolo)는 활을 빠르게 반복해 지속음 위에 잔떨림이 얹혀 긴장되게 들리므로 긴장 장면의 배경에 쓰인다. 같은 악기라도 주법 음색을 바꾸면 다른 악기처럼 쓰인다.", "관악 계열. 브라스(Brass)는 트럼펫, 트롬본, 호른의 금관으로, 팡파르의 위엄과 펑크의 스탭 두 얼굴을 갖는다. 호른(French Horn)은 금관 중 어택이 가장 부드럽고 중저역이 두꺼워 부드럽고 웅장하게 들리므로, 영화 음악에서 넓고 느린 선율을 맡는다. 목관(Woodwind)은 플루트가 배음이 적어 맑고, 클라리넷이 고역이 적어 둥글고 어둡고, 오보에가 배음이 좁게 몰려 가늘고 또렷해 느린 단선율에 자주 쓰인다. 로직의 Studio Horns가 브라스 계열이다.", "벨과 말렛(Mallet) 계열은 반짝임의 재료다. 글로켄슈필과 첼레스타는 고역에 배음이 몰린 짧은 금속음이라 반짝이게 들려 장식 선율에 쓰이고, 동화·크리스마스 연출의 관습적 재료이기도 하다. 마림바는 나무의 둥근 어택과 짧은 지속이라 따뜻하고 통통하게 들려 중음역 리듬 선율에 맞고, 비브라폰(Vibraphone)은 금속판의 긴 지속에 모터 떨림이 걸려 몽롱하게 들리는 소리라 재즈와 로파이의 표준 재료다. 검색어는 Bell, Mallet이다.", "기타 계열. 나일론(Nylon)은 고역이 적고 어택이 부드러워 포근하게 들리므로 작은 음량의 반주에 맞다. 스틸 어쿠스틱(Steel String)은 고역 배음이 많아 밝고 넓게 퍼진다. 클린 일렉트릭(Clean)은 어택이 또렷하고 지속이 고르게 유지되어 찰랑이게 들리므로 아르페지오와 커팅에 쓰인다. 드라이브(Driven, Distorted)는 배음이 포화되어 밀도가 높고 거칠고 힘있게 들리므로 록의 리듬과 리드를 맡는다. 같은 코드도 이 네 계열에서 전혀 다른 곡이 된다.", "목소리 계열. 콰이어(Choir)는 다수의 목소리가 합쳐져 개별 발음이 사라진 지속음이라 장엄하게 들린다. 큰 편성의 지속 화성을 만들며, 종교적·서사적 장면의 관습적 재료다. 아(Ah)와 우(Oh) 모음 패드는 사람 목소리를 악기처럼 배경에 까는 소리다. 멜로트론(Mellotron)의 콰이어와 플루트는 테이프 특유의 흔들림이 있는 복고적 목소리로, 로직의 Vintage Mellotron에 들어 있다.", "드럼은 두 세계로 나뉜다. 어쿠스틱 킷(Acoustic Kit)은 실제 드럼을 녹음한 것으로 밴드 사운드의 기본이고, 로직에서는 Drum Kit Designer가 맡는다. 일렉트로닉 킷은 드럼머신 계열로, Drum Machine Designer가 맡는다.", "드럼머신 계열 안에서 숫자 이름 둘만 알면 대화가 된다. 808 계열은 킥이 낮게 붕 하고 길게 울리는 소리로, 이 킥 자체가 베이스 역할까지 하는 것이 힙합과 트랩의 문법이다. 909 계열은 더 단단하고 딱딱 끊어지는 소리로 하우스와 테크노의 표준이다. 라이브러리에서 808, 909로 검색하면 바로 나온다.", "용도에서 계열로 가는 기준. 큰 편성의 지속 화성으로 장엄하게 들리려면 콰이어, 파이프 오르간, 호른. 지속음 위의 잔떨림으로 긴장되게 들리려면 트레몰로 스트링과 라이저. 고역의 짧은 금속음으로 반짝이게 들리려면 첼레스타와 글로켄. 어택이 무디고 지속이 길어 차분하고 몽롱하게 들리려면 비브라폰, 펠트 피아노, 테이프 계열. 테이프 흔들림과 아날로그 질감으로 복고적으로 들리려면 멜로트론과 아날로그 신스. 알앤비·힙합 계열의 표준 조합은 틴 일렉트릭 피아노, 클린 기타, 808이다. 역시 정답이 아니라 출발점이다."], "path": [{"n": "계열 검색으로 훑기", "s": ["<k>Y</k> 라이브러리 검색창에 <b>Ensemble</b>, <b>Solo Violin</b>, <b>Pizzicato</b>를 차례로 입력해 비교", "<b>Bell</b>, <b>Mallet</b>, <b>Choir</b>, <b>Mellotron</b>으로 반복", "<b>808</b>과 <b>909</b>를 검색해 킥 소리 차이 듣기"]}, {"n": "주법 음색 오가기", "s": ["Studio Strings 패치를 열기", "같은 두 마디를 레가토, 스타카토, 피치카토, 트레몰로 음색으로 재생", "분위기가 어떻게 바뀌는지 한 줄씩 적기"]}], "drill": ["같은 네 마디 선율을 솔로 바이올린과 앙상블 스트링으로 재생해 감정의 거리 차이를 듣는다.", "'고역의 짧은 장식 + 지속 화성 + 어택 짧은 리듬' 같은 성질 조합을 정하고, 계열 감각으로 음색 세 개를 골라 8마디 스케치를 만든다.", "808 킥과 909 킥으로 같은 드럼 패턴을 쳐서 장르 인상이 어떻게 갈리는지 확인한다."], "keys": [["Y", "라이브러리"], ["↑ ↓", "음색 이동"], ["M", "뮤트"]], "chk": ["앙상블과 솔로의 용도 차이를 안다", "808과 909의 소리 차이를 말할 수 있다", "용도 여섯 가지의 출발 계열을 안다"], "quiz": [{"q": "킥이 낮게 붕 울려 베이스 역할까지 하는 드럼머신 계열은?", "a": ["어쿠스틱 킷", "말렛", "808", "909"], "c": 2, "e": "808 킥의 긴 저음 울림이 힙합과 트랩에서 베이스를 겸한다."}, {"q": "비브라토와 활 소리가 드러나는, 가까이 들리는 선율용 현악 편성은?", "a": ["스탭", "솔로", "피치카토", "앙상블"], "c": 1, "e": "솔로 스트링은 한 명의 소리라 어택과 비브라토가 그대로 드러나 가깝게 들린다. 앙상블은 매끈하고 넓은 배경용이다."}, {"q": "고역의 짧은 금속음 장식을 만드는 계열의 검색어는?", "a": ["Bell", "Riser", "Clav", "Brass"], "c": 0, "e": "글로켄슈필과 첼레스타가 Bell 계열이다."}], "d": 36, "s": 6}, {"d": 37, "s": 6, "t": "드러머 트랙", "goal": "드러머 트랙으로 구간별 드럼을 만든다.", "con": ["드러머는 로직이 연주해주는 가상 드러머다. 장르와 연주자를 고르고 세기와 복잡도를 조절하면 그럴듯한 드럼이 나온다. 편곡 초안 단계에서 가장 빠른 길이다.", "조작은 XY 패드 하나로 끝난다. 가로가 단순함과 복잡함, 세로가 여림과 셈이다. 벌스는 왼쪽 아래, 코러스는 오른쪽 위로 두는 것이 기본 감각이다.", "필인 노브는 마디 끝 채우기 빈도를, 스윙 노브는 그루브를 정한다. 킥과 스네어 패턴은 오른쪽에서 따로 고를 수 있다.", "드러머 리전은 언제든 미디 리전으로 바꿔 직접 고칠 수 있다. 큰 틀은 드러머에게 맡기고 세부만 손보는 방식이 효율적이다.", "드럼 키트는 별개다. 드러머는 연주를, 드럼 키트는 소리를 담당한다. 같은 연주에 키트만 바꿔도 장르가 달라진다.", "드러머는 세션 플레이어라는 더 큰 묶음의 일부다. 로직이 연주해 주는 가상 연주자가 넷이다. Drummer는 드럼, Bass Player는 베이스, Keyboard Player는 건반, Synth Player는 신스 파트를 맡는다.", "쓰는 방식은 넷 다 같다. 트랙을 만들고 유형과 스타일을 고른 뒤 세션 플레이어 편집기에서 복잡도와 세기를 조절한다. 드러머의 XY 패드에 해당하는 조절기가 각각 있다.", "드럼을 뺀 셋은 코드 트랙을 따라간다. 코드 진행을 먼저 입력해 두면 그 진행에 맞춰 연주한다. 그래서 순서가 정해진다. 코드 트랙에 진행을 넣고, 그다음 세션 플레이어 트랙을 만든다. 진행이 없으면 무엇을 연주할지 알 수 없다.", "Keyboard Player의 Synth Player 스타일에는 모듈레이션된 패드와 리듬감 있는 코드가 들어 있고, Bass Player에는 펌프스 베이스와 808 베이스와 시퀀스 베이스가 있다. 앞에서 본 힙합의 808이나 하우스의 반복 베이스를 손으로 찍지 않고 여기서 시작할 수 있다.", "세션 플레이어 리전도 미디로 바꿀 수 있다. 큰 틀을 맡기고 세부만 손보는 방식은 드러머와 같다. 다만 처음부터 끝까지 맡기면 남이 만든 연주가 되므로, 초안으로 쓰고 자기 것으로 고쳐 나가는 편이 낫다."], "path": [{"n": "드러머 트랙 만들기", "s": ["<k>⌥⌘N</k> → <b>드러머</b> 선택 → <b>생성</b>", "편집기 <k>E</k> → 왼쪽에서 <b>장르</b>와 <b>연주자</b> 선택", "XY 패드에서 점 드래그", "<b>필인</b>과 <b>스윙</b> 노브 조절"]}, {"n": "구간마다 다르게", "s": ["드러머 리전을 구간별로 분할 <k>⌘T</k>", "각 리전 선택 후 XY 위치를 다르게 지정", "코러스는 오른쪽 위, 벌스는 왼쪽 아래"]}, {"n": "미디로 변환", "s": ["드러머 리전 우클릭 → <b>MIDI 리전으로 변환</b>", "피아노 롤에서 직접 편집"]}, {"n": "세션 플레이어 트랙 만들기", "s": ["<k>G</k> → 코드 트랙에 진행을 먼저 입력", "<k>⌥⌘N</k> → <b>세션 플레이어</b> 선택", "<b>Drummer / Bass Player / Keyboard Player</b> 중에서 유형 선택", "<k>E</k> 편집기에서 스타일과 프리셋 고르기", "복잡도와 세기 조절", "미디로 바꾸려면 리전 우클릭 → <b>MIDI 리전으로 변환</b>"]}], "drill": ["8마디 벌스와 8마디 코러스 구조에서 드러머의 XY 위치를 다르게 주고 에너지 차이를 만든다.", "드럼 키트를 어쿠스틱에서 일렉트로닉으로 바꿔 같은 연주가 어떻게 달라지는지 듣는다.", "드러머 리전을 미디로 변환해 코러스 마지막 마디 필인을 직접 고친다."], "keys": [["E", "편집기"], ["⌘T", "분할"], ["⌥⌘N", "새 트랙"]], "chk": ["XY 패드로 에너지를 조절할 수 있다", "구간별로 드럼을 다르게 만들었다", "미디 변환 후 직접 수정해봤다", "세션 플레이어 네 종류를 안다", "코드 트랙을 먼저 입력해야 하는 이유를 안다"], "quiz": [{"q": "드러머 XY 패드에서 오른쪽 위로 갈수록?", "a": ["리버브가 커진다", "템포가 빨라진다", "단순하고 여려진다", "복잡하고 세진다"], "c": 3, "e": "가로가 복잡도, 세로가 세기다."}, {"q": "베이스와 건반 세션 플레이어를 쓰기 전에 반드시 해야 하는 것은?", "a": ["템포 고정", "리버브 설정", "코드 트랙에 진행 입력", "마스터 체인 구성"], "c": 2, "e": "드럼을 뺀 세션 플레이어는 코드 트랙을 따라간다. 진행이 없으면 무엇을 연주할지 알 수 없다."}, {"q": "808 베이스를 손으로 찍지 않고 시작하려면?", "a": ["Keyboard Player", "Bass Player의 Synth Player 스타일", "Drummer", "Quick Sampler"], "c": 1, "e": "Bass Player에 펌프스, 808, 시퀀스 베이스 스타일이 들어 있다."}]}, {"d": 38, "s": 6, "t": "드럼 프로그래밍", "goal": "드럼 패턴을 직접 입력하고 장르별 기본형을 안다.", "con": ["드럼 미디는 음높이가 악기를 뜻한다. 표준 배치에서 킥은 C1, 스네어는 D1, 클로즈 하이햇은 F#1, 오픈 하이햇은 A#1, 라이드는 D#2다. 로직 피아노 롤은 드럼 트랙에서 악기 이름을 함께 보여준다.", "기본 8비트는 킥이 1박과 3박, 스네어가 2박과 4박, 하이햇이 8분음표다. 이 뼈대에서 킥을 하나씩 옮기는 것만으로 수많은 그루브가 나온다.", "장르별 뼈대. 팝 록은 4분 킥에 8분 하이햇, 하우스는 4분음표 킥 네 번에 오프비트 하이햇, 힙합은 킥과 스네어가 성기고 하이햇이 16분 또는 32분으로 촘촘하다.", "고스트 노트가 사람 느낌을 만든다. 스네어의 벨로시티 <v>25~45</v> 짜리 약한 타격을 16분음표 사이에 넣는다.", "하이햇은 벨로시티 편차를 반드시 준다. 강 <v>95</v>, 약 <v>60</v>을 번갈아 두는 것만으로도 크게 달라진다.", "여기까지 만든 드럼은 킥, 스네어, 하이햇이 전부 한 트랙 한 채널에서 나온다. 로직의 소프트웨어 악기는 기본이 그렇다. 그래서 EQ나 컴프를 걸면 드럼 전체에 걸린다. 킥을 살리려고 저역을 올리면 하이햇 밑동까지 올라가고, 하이햇을 정리하려고 하이패스를 걸면 킥이 사라진다.", "한 트랙 상태에서도 할 수 있는 것이 있다. 드럼 전체를 하나의 소리로 보고 <v>30</v>Hz 아래를 걷어내고, <v>200~400</v>Hz의 뭉침을 덜어내고, <v>8</v>kHz 위를 살짝 올려 반짝임을 준다. 세 가지를 하면 킥의 무게는 남고 답답함은 빠지고 하이햇이 살아난다. 킥과 하이햇이 서로 크게 방해받지 않는 선이다. 대부분의 곡은 이 정도로 충분하다.", "나누는 것은 필요가 확인된 뒤다. 판단 기준은 하나다. 서로 반대 방향의 처리가 필요해졌는가. 킥에는 저역을 남기고 하이햇에는 저역을 잘라야 하는데 한 트랙에서는 둘 중 하나만 된다면, 그때가 나눌 때다. 각각 손보고 싶다는 이유만으로 나누면 트랙 여덟 개를 만들어 놓고 시간은 다 쓰고 결과는 한 트랙일 때보다 나빠지는 일이 흔하다.", "나눌 시점은 따로 있다. 편곡 중에는 한 트랙으로 둔다. 곡을 만드는 도중에 트랙 여덟 개를 관리하면 작업 속도가 떨어진다. 믹싱에 들어가서 실제로 막히는 것이 확인되면 그때 나눈다.", "나누는 방법은 두 가지다. 하나는 멀티 아웃풋이고, 다른 하나는 미디를 트랙별로 쪼개는 것이다. Drum Kit Designer는 멀티 아웃풋을 지원하므로 미디를 건드리지 않고 소리만 나눌 수 있다. 미디를 쪼개는 방법은 자원을 더 쓰지만 단순하고 사고가 적으며, 어떤 드럼 악기에서도 통한다.", "멀티 아웃풋으로 나눈 뒤에는 원래 채널에 남는 것이 있는지 확인한다. 출력을 지정하지 않은 부위는 그대로 첫 채널로 나오므로, 나눴다고 생각했는데 소리가 두 곳에서 겹쳐 나는 일이 생긴다. 각 부위를 하나씩 솔로로 들어 어느 채널에서 나오는지 확인하는 것이 확실하다.", "나눈 다음은 버스다. 서밍 스택은 여러 트랙을 하나로 모아 함께 처리하는 묶음이고, 자세한 것은 믹싱 부의 그룹 버스 절에서 다룬다. 여기서는 개별 채널에서 EQ와 컴프로 다듬고, 드럼 전체를 서밍 스택으로 묶어 버스 컴프를 건다는 것만 알아둔다. 개별에서 다듬고 버스에서 묶는 2단 구조이고, 이때 누적 게인 리덕션 상한을 넘지 않도록 본다.", "로직 12에서 스텝 시퀀서가 개선됐다. 행을 고정된 음 대신 코드의 도수에 할당할 수 있어서, 코드가 바뀌면 그 자리의 음도 따라 바뀐다. 패턴이나 개별 행을 무작위로 흔드는 조절기가 생겼고, 5/4와 7/8 박자를 위한 패턴 길이가 추가됐다."], "path": [{"n": "드럼 트랙 준비", "s": ["<k>⌥⌘N</k> → 소프트웨어 악기", "<k>Y</k> 라이브러리 → <b>Drum Kit</b> 또는 <b>Electronic Drum Kit</b> 패치", "<k>⌘</k>+드래그로 빈 미디 리전 생성 → <k>P</k>"]}, {"n": "스텝 시퀀서로 찍기", "s": ["트랙 헤더 우클릭 → <b>패턴 리전 생성</b>", "행마다 악기, 칸마다 스텝", "각 행의 <b>스텝 비율</b>을 다르게 → 하이햇만 16분음표로"]}, {"n": "방법 1: 멀티 아웃풋으로 나누기", "s": ["드럼 트랙 선택 → <k>I</k> 인스펙터 → 악기 슬롯 클릭", "플러그인 이름 옆 <b>멀티 아웃풋</b> 항목으로 다시 불러오기", "<k>X</k> 믹서 → 드럼 채널 스트립 하단 <b>+</b> 버튼을 눌러 필요한 개수만큼 Aux 채널 생성", "악기 창에서 각 부위(킥, 스네어, 하이햇 등)의 <b>Output</b>을 <v>3-4</v>, <v>5-6</v>처럼 다르게 지정", "부위마다 솔로로 들어 어느 채널에서 나오는지 확인. 지정 안 한 것은 첫 채널로 나옴", "각 Aux의 이름을 <b>KICK</b>, <b>SNARE</b>처럼 지정"]}, {"n": "방법 2: 미디를 트랙별로 쪼개기", "s": ["드럼 미디 리전 선택 → 피아노 롤 <k>P</k>", "킥 음(C1)만 선택: 해당 행의 음 하나 클릭 후 <b>편집 → 선택 → 유사한 오브젝트</b>", "<k>⌘X</k>로 오려두기", "새 소프트웨어 악기 트랙을 만들고 같은 드럼 악기 로드", "새 트랙의 같은 위치에 <k>⌘V</k>로 붙여넣기", "스네어, 하이햇도 같은 방식으로 반복", "트랙 이름과 색을 부위별로 지정"]}, {"n": "나눈 뒤 정리", "s": ["각 채널에 필요한 EQ를 건다. 킥은 하이패스를 <v>25~30</v>Hz로 아주 낮게, 하이햇은 <v>300~500</v>Hz로", "드럼 채널 전체 선택 → <k>⇧⌘G</k> → <b>서밍 스택</b>", "스택 트랙에 버스 컴프. 레이시오 <v>4:1</v>, 어택 <v>20~30</v>ms, 게인 리덕션 <v>3~6</v>dB", "개별과 버스와 마스터의 게인 리덕션 합이 <v>8</v>dB를 넘지 않는지 확인"]}], "drill": ["기본 8비트를 손으로 찍는다. 하이햇 벨로시티를 강약 번갈아 준다.", "같은 8비트에서 킥 위치만 바꿔 네 가지 그루브를 만든다.", "하우스 패턴(4분 킥, 오프비트 오픈 하이햇)과 힙합 패턴(성긴 킥, 16분 하이햇)을 각각 2마디씩 만든다.", "한 트랙 드럼에 하이패스를 300Hz로 걸어 킥이 어떻게 되는지 확인한 뒤, 멀티 아웃풋으로 나눠 킥과 하이햇에 각각 다른 하이패스를 걸어 비교한다."], "keys": [["P", "피아노 롤"], ["Q", "퀀타이즈"], ["⌃드래그", "벨로시티"], ["I", "인스펙터"], ["X", "믹서"], ["⇧⌘G", "트랙 스택"]], "chk": ["킥, 스네어, 하이햇 음높이를 안다", "기본 8비트를 손으로 찍을 수 있다", "고스트 노트를 넣어봤다", "한 트랙일 때의 한계를 안다", "나눌 시점과 판단 기준을 안다"], "quiz": [{"q": "표준 드럼 배치에서 킥의 음높이는?", "a": ["F#1", "D1", "C1", "A#1"], "c": 2, "e": "C1 킥, D1 스네어, F#1 클로즈 하이햇이 기본 세 자리다."}, {"q": "하우스 계열 드럼의 특징은?", "a": ["킥 없음", "성긴 킥과 16분 하이햇", "4분음표 킥 네 번", "셋잇단 하이햇"], "c": 2, "e": "마디마다 4분음표 킥 네 번이 하우스의 뼈대다."}, {"q": "드럼을 트랙으로 나눠야 하는 판단 기준은?", "a": ["트랙이 많을수록 좋아서", "서로 반대 방향의 처리가 필요해졌을 때", "녹음이 끝나면 항상", "CPU가 남을 때"], "c": 1, "e": "킥에는 저역을 남기고 하이햇에는 잘라야 하는데 한 트랙에서 둘 다 안 될 때가 나눌 때다."}, {"q": "멀티 아웃풋으로 나눈 뒤 확인해야 하는 것은?", "a": ["조표", "출력을 지정하지 않은 부위가 첫 채널로 나오는지", "템포", "리버브"], "c": 1, "e": "지정 안 한 부위는 그대로 첫 채널로 나와서 소리가 두 곳에서 겹칠 수 있다."}, {"q": "드럼을 나누기에 적절한 시점은?", "a": ["믹싱에서 실제로 막힌 것이 확인된 뒤", "편곡 시작 전", "편곡 중", "발매 직전"], "c": 0, "e": "편곡 중에 트랙이 많으면 작업 속도가 떨어진다."}]}, {"d": 39, "s": 6, "t": "베이스를 사람처럼", "goal": "손가락과 줄의 움직임을 미디로 옮겨 베이스가 연주처럼 들리게 만든다.", "con": ["베이스는 화성의 뿌리와 리듬의 뼈대를 동시에 맡는다. 베이스가 흔들리면 곡 전체가 흔들린다. 그런데 미디 베이스가 가짜처럼 들리는 이유는 음이 틀려서가 아니라 <b>손가락이 하는 일</b>을 안 해서다.", "먼저 음역이다. 실제 베이스 기타의 최저음은 <v>E1</v>이고 대부분의 연주는 <v>E1</v>에서 <v>G3</v> 사이다. 미디로 찍을 때 무심코 한 옥타브 아래로 내려가면 실제로는 없는 음이 된다. 5현 베이스라면 <v>B0</v>까지 내려간다.", "<b>고스트 노트</b>가 첫째다. 줄을 살짝 눌러 음정 없이 툭 치는 소리다. 실제 베이시스트는 음과 음 사이를 이것으로 채운다. 미디에서는 벨로시티 <v>20~40</v>의 아주 짧은 음으로 찍는다. 음정은 앞 음과 같거나 반음 아래로 두고 길이는 <v>1/32</v> 이하다. 좋은 음원에는 전용 고스트 노트 아티큘레이션이 있다. 이것 하나만 넣어도 베이스가 사람처럼 들린다.", "<b>슬라이드</b>가 둘째다. 손가락을 줄 위로 미끄러뜨려 음을 옮기는 것이다. 코드가 바뀔 때 근음에서 근음으로 미끄러지면 연결이 부드러워진다. 미디에서는 전용 아티큘레이션을 쓰거나, 없으면 앞 음 끝에 <v>2~3</v>반음 짧은 경과음을 벨로시티 낮게 넣는다.", "<b>손가락과 피크</b>가 소리를 가른다. 손가락은 둥글고 부드럽고, 피크는 또렷하고 공격적이다. 음원에 둘 다 있으면 곡에 맞게 고른다. 록과 펑크는 피크, 알앤비와 재즈는 손가락이 기본이다. 벨로시티로 구분하는 음원도 있으니 <v>100</v> 이상에서 어택이 달라지는지 확인한다.", "<b>슬랩</b>은 별개의 주법이다. 엄지로 줄을 때리는 섬과 검지로 당겨 튕기는 팝이 번갈아 나온다. 미디에서는 이 둘을 다른 아티큘레이션으로 쓰고, 섬은 낮은 음 정박에 팝은 높은 음 뒷박에 배치한다. 슬랩 음원이 없으면 흉내 내기 어렵다.", "<b>음 길이가 장르를 만든다.</b> 록과 팝은 음을 다음 음까지 거의 채워 단단하고, 펑크는 짧게 끊어 통통 튀고, 발라드는 길게 이어 부드럽다. 같은 음형이라도 길이만 바꾸면 장르가 바뀐다. 게이트 타임을 <v>50</v>으로 두면 스타카토, <v>95</v>면 레가토에 가깝다.", "<b>벨로시티는 손가락 힘이다.</b> 정박이 강하고 뒷박이 약한 것이 기본이지만, 실제 연주는 그렇게 규칙적이지 않다. 프레이즈 안에서 <v>70~110</v> 사이로 흔든다. 고스트 노트는 그 아래인 <v>20~40</v>이다.", "<b>킥과의 관계</b>가 리듬을 정한다. 킥이 있는 자리에 베이스가 함께 있으면 단단하고, 어긋나면 넓게 들린다. 장르에 따라 고른다. 록은 맞물리고, 펑크와 알앤비는 일부러 어긋낸다. 앞의 사이드체인 절도 이 관계에서 나온다.", "기본 문법은 코드가 바뀔 때 근음을 치는 것이다. 여기에 <v>5</v>음, 옥타브, 경과음을 더한다. 코드 사이를 반음이나 온음으로 걸어 들어가는 경과음이 베이스 라인을 살아 있게 만든다.", "세션 플레이어의 Bass Player를 쓰면 코드 진행만 주고 연주를 맡길 수 있다. 초안을 잡을 때 빠르고, 미디로 변환한 뒤 고스트 노트와 슬라이드를 손으로 더하면 된다."], "path": [{"n": "고스트 노트 넣기", "s": ["음과 음 사이 빈 자리를 찾는다", "앞 음과 같은 음정으로 <v>1/32</v> 길이 음 추가", "벨로시티 <v>20~40</v>", "전용 아티큘레이션이 있으면 그것으로 바꿈"]}, {"n": "장르별 음 길이", "s": ["리전 선택 → <k>I</k> 인스펙터", "<b>게이트 타임</b> 펑크 <v>50</v> · 록 <v>85</v> · 발라드 <v>95</v>", "재생하며 곡에 맞는지 확인"]}, {"n": "근음 사이 경과음", "s": ["코드가 바뀌기 직전 박에 음 하나 추가", "앞 근음과 다음 근음 사이의 반음이나 온음", "벨로시티를 근음보다 <v>-15</v> 낮게"]}], "drill": ["같은 베이스 라인에 고스트 노트를 넣고 뺀 것을 비교한다.", "게이트 타임 50과 95로 각각 만들어 장르가 달라지는지 듣는다.", "코드 사이에 경과음을 넣어 연결이 부드러워지는지 확인한다."], "keys": [["P", "피아노 롤"], ["I", "인스펙터"], ["⌘D", "복제"]], "chk": ["고스트 노트를 넣는다", "음 길이로 장르를 맞춘다", "킥과의 관계를 정한다"], "quiz": [{"q": "미디 베이스를 가장 빠르게 사람처럼 만드는 것은?", "a": ["리버브", "컴프", "고스트 노트", "EQ"], "c": 2, "e": "줄을 살짝 눌러 음정 없이 툭 치는 소리. 벨로시티 20~40의 아주 짧은 음."}, {"q": "같은 음형인데 펑크처럼 들리게 하려면?", "a": ["템포를 올린다", "음정을 올린다", "음 길이를 짧게 한다", "리버브를 건다"], "c": 2, "e": "게이트 타임 50이면 통통 튀고 95면 부드럽다."}, {"q": "베이스 최저음보다 낮게 찍으면?", "a": ["실제로는 없는 음이 된다", "문제없다", "더 무겁다", "5현이 된다"], "c": 0, "e": "4현 베이스는 E1, 5현은 B0까지다."}]}, {"t": "베이스: 줄과 손의 디테일", "goal": "개방현, 줄 선택, 릴리스 노이즈, 워킹 라인까지 다룬다.", "con": ["앞 절이 손가락이 하는 일이었다면 이 절은 <b>줄이 하는 일</b>이다. 같은 음이라도 어느 줄에서 어떻게 내느냐에 따라 소리가 다르고, 그 차이가 미디에서 티가 난다.", "<b>개방현은 다른 악기다.</b> 4현 베이스의 <v>E1</v>, <v>A1</v>, <v>D2</v>, <v>G2</v>는 손가락을 짚지 않고 내는 음이다. 짚은 음보다 길게 울리고 배음이 많으며 <b>비브라토가 안 걸린다</b>. 그래서 E조나 A조 곡에서 근음이 개방현으로 떨어지면 유난히 두껍게 들린다. 좋은 음원은 개방현 샘플을 따로 갖고 있고, 없더라도 그 음의 길이를 조금 길게 두면 비슷해진다.", "<b>같은 음을 여러 줄에서 낼 수 있다.</b> <v>A2</v>는 A현 12프렛에서도, D현 7프렛에서도, G현 2프렛에서도 난다. 낮은 줄에서 높이 짚은 음이 더 두껍고 둥글며, 높은 줄에서 낮게 짚은 음이 더 밝고 또렷하다. 연주자는 프레이즈에 따라 줄을 고르는데, 미디에서는 이 선택이 없으니 음원의 아티큘레이션이나 벨로시티로 대신한다. 두꺼운 소리가 필요하면 벨로시티를 조금 낮추고 음을 길게, 또렷한 소리가 필요하면 반대로 한다.", "<b>릴리스 노이즈</b>는 손을 뗄 때 나는 소리다. 손가락이 줄에서 떨어지며 나는 짧은 잡음인데, 이것이 없으면 소리가 너무 깨끗해 기계처럼 들린다. 좋은 음원은 릴리스 샘플을 갖고 있어 음을 뗄 때 자동으로 난다. 없는 음원이라면 프레이즈 끝에 벨로시티 <v>15~25</v>의 아주 짧은 음을 넣어 흉내 낸다.", "<b>프렛 노 무엇을 안 칠지를 먼저 정한다.", "보이싱이 소리를 결정한다. 근음을 왼손 낮은 곳에 두고 오른손에 3음과 7음을 놓으면 열려 들린다. 세 음을 좁게 뭉치면 답답해진다. C3 아래로는 두 음 이상 겹치지 않는 것이 안전하다. 근거는 배음렬이다. 자연 배음은 아래 간격이 옥타브와 5도로 넓고 위로 갈수록 좁아지는데, 저음에 좁은 간격을 쌓으면 자연에 없는 밀도가 되어 탁하게 들린다.", "일렉트릭 피아노는 벨로시티에 따라 음색이 크게 변한다. 약하게 치면 부드럽고 세게 치면 종처럼 벌어진다. 그래서 벨로시티를 고르게 두면 이 악기의 장점이 사라진다.", "발라드에서는 왼손 근음과 오른손 화음 사이를 넓게 벌리고, 팝에서는 오른손 화음을 좁게 반복하는 편이 많다.", "<b>양손은 정확히 같이 치지 않는다.</b> 실제 연주는 왼손이 오른손보다 아주 조금 먼저 오거나 나중에 온다. 특히 발라드에서 왼손 근음을 <v>10~20</v>ms 앞에 두면 오른손 선율이 그 위에 얹히는 느낌이 난다. 반대로 오른손을 먼저 두면 선율이 앞서 나가는 느낌이다. 완전히 맞추면 기계다.", "<b>코드 안에서도 음이 어긋난다.</b> 한 손으로 화음을 칠 때 다섯 손가락이 정확히 동시에 닿지 않는다. <v>3~8</v>ms 정도 흩어져 있고, 대개 아래에서 위로 또는 선율 음이 조금 늦게 온다. 로직에서는 <b>Q-플램</b>을 작게 주면 된다.", "<b>선율 음을 더 세게 친다.</b> 오른손 화음에서 가장 높은 음이 선율인 경우가 많은데, 실제 연주자는 그 음을 다른 음보다 <v>10~20</v> 세게 친다. 이것을 안 하면 화음이 뭉쳐 선율이 안 들린다. 왼손은 오른손보다 전체적으로 <v>10~15</v> 약하게 두는 것이 기본이다.", "<b>아르페지오</b>는 코드를 한 번에 누르지 않고 아래에서 위로 굴리는 것이다. 발라드와 재즈에서 자주 쓴다. 음 간격은 <v>20~50</v>ms이고, 페달을 밟고 있으면 굴린 음들이 함께 남아 한 화음으로 들린다. 빠르게 굴리면 화려하고 느리게 굴리면 여유롭다.", "<b>보이싱이 소리를 결정한다.</b> 근음을 왼손 낮은 곳에 두고 오른손에 3음과 7음을 놓으면 열려 들린다. 세 음을 좁게 뭉치면 답답해진다. <v>C3</v> 아래로는 두 음 이상 겹치지 않는 것이 기본이다. 저역에서 화음이 겹치면 탁해진다.", "<b>일렉트릭 피아노는 벨로시티가 음색이다.</b> 약하게 치면 부드럽고 세게 치면 종처럼 벌어진다. 그래서 벨로시티를 고르게 두면 이 악기의 장점이 사라진다. 프레이즈 안에서 <v>60</v>에서 <v>110</v>까지 폭넓게 흔든다.", "<b>장르가 손 모양을 정한다.</b> 발라드는 왼손 근음과 오른손 화음 사이를 넓게 벌리고 아르페지오를 섞는다. 팝은 오른손 화음을 좁게 반복한다. 재즈는 왼손에 근음과 7음만 두고 오른손이 자유롭게 움직인다. 록은 옥타브나 파워 코드로 단순하게 친다."], "path": [{"n": "양손 어긋내기", "s": ["왼손 리전과 오른손 리전을 따로 둔다", "왼손 리전 <k>I</k> 인스펙터 <b>딜레이</b> <v>-15</v>ms", "재생해 왼손이 먼저 오는지 확인", "선율이 앞서야 하면 반대로"]}, {"n": "선율 음 강조", "s": ["오른손 화음에서 가장 높은 음만 선택", "벨로시티 <v>+15</v>", "화음 속에서 선율이 들리는지 확인"]}, {"n": "아르페지오 굴리기", "s": ["코드 음 전부 선택", "리전 인스펙터 <b>Q-플램</b>을 <v>20~50</v>ms 상당으로", "또는 음을 하나씩 <v>30</v>ms 간격으로 옮김", "페달을 밟아 굴린 음이 함께 남게"]}], "drill": ["C - Am - F - G를 세 가지 보이싱으로 만든다. 좁은 뭉침, 근음 분리, 3음과 7음 중심.", "페달 없이 만든 뒤 CC64를 넣어 차이를 듣는다.", "일렉트릭 피아노로 같은 진행을 치고 벨로시티를 50대와 100대로 나눠 음색 변화를 확인한다.", "같은 코드를 양손 동시와 왼손 15m
