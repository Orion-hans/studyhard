 것 말고 만드는 방법도 있다. 안 쓰는 저역을 걷어내면 그만큼 여유가 생긴다. 하이패스를 모든 트랙에 거는 이유가 여기 있다. 소리는 그대로인데 마스터 피크만 내려간다. 겹치는 악기를 정리하는 것도 같은 효과를 낸다. 두 악기가 같은 대역에서 싸우고 있으면 합쳐진 에너지가 크므로, 하나를 빼거나 대역을 나누면 피크가 내려간다.", "순서를 정하면 이렇다. 먼저 안 쓰는 저역을 걷어내고, 겹치는 것을 정리하고, 그래도 모자라면 전체를 함께 내린다. 마스터 페이더는 마지막 수단이고, 그것도 임시로만 쓴다.", "리미터로 해결하려는 것도 흔한 실수다. 마스터에 리미터를 걸면 피크가 안 넘치니 문제가 사라진 것처럼 보인다. 하지만 그 리미터는 곡 내내 눌리고 있고, 정작 마스터링에서 라우드니스를 올릴 여지는 이미 없어진 상태다. 믹싱 단계의 마스터에는 미터만 걸어 두고 리미터는 마스터링까지 미룬다."], "path": [{"n": "헤드룸 되찾기", "s": ["<k>X</k> 믹서에서 마스터 피크 확인", "먼저 하이패스가 안 걸린 트랙이 있는지 확인하고 건다", "그래도 넘치면 모든 트랙 선택 → <k>⌥</k>를 누른 채 페이더 하나를 <v>-6</v>dB 내림", "마스터 피크가 <v>-6</v>dBFS 아래인지 확인", "마스터 페이더는 <v>0</v>에 그대로 둔다"]}], "drill": ["마스터가 넘치는 상태에서 마스터 페이더를 내린 것과 전체 트랙을 함께 내린 것을 비교하고, 각 트랙의 피크를 확인한다.", "모든 트랙에 하이패스를 걸기 전과 후의 마스터 피크를 비교한다."], "keys": [["X", "믹서"], ["⌥", "일괄 조절"], ["⇧⌘G", "트랙 스택"]], "chk": ["헤드룸을 되찾는 순서를 안다", "마스터 페이더로 해결하지 않는다", "안 쓰는 저역을 걷어내 여유를 만든다"], "quiz": [{"q": "마스터가 넘칠 때 마스터 페이더를 내리면?", "a": ["라우드니스가 오른다", "근본 해결이 된다", "음질이 좋아진다", "각 트랙은 뜨거운 채로 남아 증상만 가려진다"], "c": 3, "e": "플러그인들이 설계 레벨 밖에서 계속 일하고, 트랙을 하나 더 추가하면 같은 문제가 또 온다."}, {"q": "균형을 지키면서 전체를 내리려면?", "a": ["하나씩 내린다", "마스터를 내린다", "리미터를 건다", "모든 트랙을 선택하고 ⌥를 누른 채 페이더 하나를 내린다"], "c": 3, "e": "나머지가 상대 차이를 지킨 채 같이 내려간다. 하나씩 내리면 애써 잡은 균형이 무너진다."}, {"q": "믹싱 단계에서 마스터에 리미터를 걸면?", "a": ["문제가 해결된다", "마스터링에서 라우드니스를 올릴 여지가 없어진다", "위상이 틀어진다", "음량이 준다"], "c": 1, "e": "미터만 걸어 두고 리미터는 마스터링까지 미룬다."}], "s": 10, "d": 78}, {"d": 79, "s": 11, "t": "이퀄라이저", "goal": "하이패스와 컷 중심으로 EQ를 사용한다.", "con": ["EQ의 첫 번째 용도는 더하기가 아니라 빼기다. 안 쓰는 저역을 걷어내는 것만으로 믹스가 훨씬 맑아진다.", "하이패스 필터는 거의 모든 트랙에 건다. 모든 트랙에 거는 이유는 쌓임이다. 트랙 하나의 저역 잡음은 안 들리지만 스무 트랙이 겹치면 악기가 내지도 않는 대역이 큰 에너지가 되어 헤드룸을 잡아먹고 전체를 흐린다. 기준값. 보컬 <v>80~100</v>Hz, 기타 <v>90~120</v>Hz, 스네어 <v>120</v>Hz, 하이햇 <v>300~500</v>Hz, 신스 패드 <v>150~200</v>Hz. 킥과 베이스는 하이패스를 걸더라도 <v>25~30</v>Hz 정도로 아주 낮게만 건다.", "하이패스에는 주파수 말고 하나 더 정할 것이 있다. 얼마나 급하게 자를지다. 이것을 슬로프라고 하고 <v>dB/Oct</v>로 적는다. <v>12</v>dB/Oct는 완만해서 자른 자리가 티 나지 않고 원래 소리에 가깝다. <v>24</v>dB/Oct는 급해서 확실히 잘리지만 자른 경계가 들리기도 한다. 같은 <v>100</v>Hz라도 슬로프에 따라 결과가 상당히 다르다.", "고르는 기준은 목적이다. 소리를 다듬는 것이 목적이면 <v>12</v>dB/Oct로 자연스럽게 간다. 저역 잡음이나 발소리처럼 확실히 없애야 할 것이 있으면 <v>24</v>dB/Oct로 급하게 자른다. Channel EQ에서는 하이패스 밴드를 클릭하면 슬로프를 고를 수 있다.", "자주 문제가 되는 대역은 여섯 군데다. <v>20~40</v>Hz는 귀에 안 들리고 몸으로만 느껴지는 울림이라 하이패스로 걷어낸다. <v>200~400</v>Hz는 뭉치고 답답한 느낌, <v>400~800</v>Hz는 상자 안에서 나는 것 같은 갑갑함, <v>1~2</v>kHz는 코를 막고 말하는 듯한 소리, <v>2~5</v>kHz는 귀를 찌르는 날카로움, <v>5~8</v>kHz는 치찰음이다. 잡음이 섞인 녹음이라면 <v>10</v>kHz 위를 로우패스로 정리하기도 한다.", "이 표를 규칙으로 오해하지 않는다. 같은 주파수가 악기에 따라 문제가 되기도 하고 그 악기의 특징이 되기도 한다. 스네어의 <v>400</v>Hz는 몸통이고, 같은 자리가 기타에 있으면 갑갑함이다. 소리를 듣고 문제가 느껴질 때만 손댄다.", "깎을 자리와 올릴 자리가 겹치는 경우도 있다. 현악기가 <v>2~5</v>kHz에서 거슬리는데 동시에 <v>3~8</v>kHz가 묻혀 있는 식이다. 두 가지를 그대로 하면 같은 대역을 깎았다 올렸다 하게 된다. 이럴 때는 나눠서 한다. 거슬리는 지점은 <v>Q 3~6</v>으로 좁게, 낮은 쪽에서 깎는다. 올리는 것은 <v>Q 1</v> 이하로 넓게, 그보다 높은 쪽에서 한다. 둘 다 필요 없는 경우가 더 많으므로 먼저 하나만 해보고 판단한다.", "찾는 방법은 부스트 스윕이다. 좁은 폭으로 크게 올린 채 주파수를 옮기며 가장 거슬리는 지점을 찾고, 그 지점을 반대로 깎는다.", "찾은 뒤 깎을 때는 폭도 정한다. 폭을 정하는 값이 Q이고 숫자가 클수록 좁다. 문제 대역을 깎을 때는 <v>Q 3~6</v>으로 좁게 잡는다. 거슬리는 지점만 정확히 덜어내고 주변은 건드리지 않기 위해서다. 반대로 밝기나 두께를 더할 때는 <v>Q 0.7~1</v>로 넓게 잡는다. 좁게 올리면 그 지점만 튀어 부자연스럽다.", "깎는 폭과 올리는 폭도 다르다. 깎는 것은 <v>-1</v>에서 <v>-4</v>dB까지 써도 대개 자연스럽다. 문제를 덜어내는 일이라 귀가 알아채기 어렵기 때문이다. 올리는 것은 <v>+1</v>에서 <v>+3</v>dB 안에서 끝낸다. 없던 것을 더하는 일이라 조금만 넘겨도 티가 난다.", "밝게 하고 싶으면 <v>10</v>kHz 부근을 넓게 <v>2~3</v>dB 올린다. 이 정도면 소리에 공기가 들어온 것처럼 트이고 앞으로 조금 나온다. <v>5</v>dB를 넘기면 트이는 대신 치찰음과 잡음까지 함께 올라와 귀가 따갑다. 넓게 올리라는 것도 이유가 있다. 좁게 올리면 그 지점만 튀어 부자연스럽고, 넓게 올려야 원래 그런 소리였던 것처럼 들린다.", "EQ는 눈이 아니라 귀로 한다. 그래프가 예쁜 것과 소리가 좋은 것은 다르다. 자주 쓰는 시작점은 프리셋으로 저장해 둔다. 보컬 하이패스와 뭉침 컷을 걸어 둔 상태를 플러그인 창 상단 프리셋 메뉴의 <b>별도 저장</b>으로 남기면 다음 곡에서 제로부터 시작하지 않는다. 프리셋은 시작점이지 정답이 아니므로 불러온 뒤 귀로 다시 맞춘다.", "Channel EQ에는 알아두면 좋은 버튼이 둘 있다. <b>Q-Couple</b>은 게인을 바꿀 때 Q를 자동으로 함께 조정해 체감 폭을 유지해 준다. <b>HQ</b>는 오버샘플링을 켠다. <v>5</v>kHz 위를 만지는데 프로젝트 샘플레이트가 <v>96</v>kHz 아래라면 켜는 편이 낫다. 안 켜면 고역에서 필터가 좁아지면서 소리가 거칠어진다. 앞에서 <v>48</v>kHz로 작업하라고 한 이유가 여기서 이어진다. 샘플레이트를 올리는 대신 이 버튼을 켜면 같은 문제를 해결하면서 파일 크기와 부하는 그대로 둘 수 있다.", "밴드는 여덟 개다. 양 끝의 1번과 8번은 하이패스와 로우패스이고 나머지 여섯 개로 중간 대역을 다룬다. Q를 <v>100</v> 가까이 올리면 아주 좁은 대역만 남아서 특정 잡음 하나를 골라 없앨 때 쓴다."], "path": [{"n": "Channel EQ 쓰기", "s": ["채널 스트립 이펙트 슬롯 → <b>EQ → Channel EQ</b>", "맨 왼쪽 밴드 = 하이패스. 켜고 주파수 입력", "밴드를 클릭해 켜고, 세로 드래그로 게인, 가로 드래그로 주파수", "<b>Q</b> 값은 밴드 위에서 위아래 드래그"]}, {"n": "부스트 스윕", "s": ["밴드 게인을 <v>+12</v>dB, Q를 <v>8</v> 정도로", "주파수를 좌우로 천천히 이동", "가장 거슬리는 지점 찾기", "게인을 <v>-3</v>에서 <v>-6</v>dB로 뒤집기"]}, {"n": "슬로프와 Q 정하기", "s": ["<b>Channel EQ</b>에서 하이패스 밴드 클릭", "슬로프 선택: 자연스럽게 <v>12</v>dB/Oct · 확실히 <v>24</v>dB/Oct", "컷 밴드는 <b>Q</b>를 <v>3~6</v>으로", "부스트 밴드는 <b>Q</b>를 <v>0.7~1</v>로", "깎기는 <v>-1~-4</v>dB · 올리기는 <v>+1~+3</v>dB 안에서"]}], "drill": ["모든 트랙에 적절한 하이패스를 건다. 걸기 전후를 비교한다.", "한 트랙에서 부스트 스윕으로 문제 대역을 찾아 깎아본다.", "보컬 트랙에서 200~400Hz를 3dB 깎고 10kHz를 2dB 올려 차이를 듣는다.", "같은 트랙에 하이패스를 12dB/Oct와 24dB/Oct로 걸어 자른 경계가 들리는지 비교한다.", "같은 지점을 Q 1과 Q 5로 깎아 주변 대역이 얼마나 함께 움직이는지 확인한다."], "keys": [["X", "믹서"], ["⌥클릭", "값 초기화"]], "chk": ["하이패스를 습관적으로 건다", "부스트 스윕으로 문제를 찾을 수 있다", "깎기를 먼저 시도한다", "문제 대역 여섯 군데를 안다", "Q-Couple과 HQ의 쓰임을 안다", "하이패스 슬로프를 목적에 맞게 고른다", "컷과 부스트의 Q를 다르게 잡는다"], "quiz": [{"q": "답답하고 뭉친 느낌이 자주 생기는 대역은?", "a": ["2~4kHz", "12kHz 이상", "40~60Hz", "200~400Hz"], "c": 3, "e": "200~400Hz에 여러 악기가 겹치면 탁해진다."}, {"q": "보컬 하이패스의 일반적인 시작점은?", "a": ["300Hz", "20Hz", "1kHz", "80~100Hz"], "c": 3, "e": "80~100Hz 아래는 보컬에 필요 없는 저역이 대부분이다."}, {"q": "상자 안에서 나는 것 같은 갑갑한 소리의 대역은?", "a": ["20~40Hz", "10kHz 이상", "2~5kHz", "400~800Hz"], "c": 3, "e": "400~800Hz다. 다만 같은 자리가 스네어에서는 몸통이 되므로 악기마다 판단한다."}, {"q": "저역 잡음을 확실히 없애야 할 때 하이패스 슬로프는?", "a": ["슬로프는 상관없다", "12dB/Oct", "6dB/Oct", "24dB/Oct"], "c": 3, "e": "급하게 잘린다. 소리를 다듬는 것이 목적이면 12dB/Oct로 자연스럽게 간다."}, {"q": "밝기를 더할 때 Q를 넓게 잡는 이유는?", "a": ["더 크게 올라가서", "CPU 절약", "자동이라서", "좁게 올리면 그 지점만 튀어 부자연스러워서"], "c": 3, "e": "깎을 때는 Q 3~6으로 좁게, 올릴 때는 Q 0.7~1로 넓게 잡는다."}, {"q": "같은 대역에 깎을 자리와 올릴 자리가 겹친다면?", "a": ["컴프로 해결한다", "포기한다", "둘 다 그대로 한다", "깎기는 좁게 낮은 쪽, 올리기는 넓게 높은 쪽으로 나눈다"], "c": 3, "e": "그대로 하면 같은 대역을 깎았다 올렸다 하게 된다. 둘 다 필요 없는 경우가 더 많다."}]}, {"t": "EQ 화면 읽기와 종류", "goal": "밴드 모양과 EQ 종류를 구분하고 화면의 그래프를 읽는다.", "con": ["앞 절이 무엇을 깎고 올릴지였다면 이 절은 <b>어떤 모양으로</b> 할지다. EQ 창을 열면 위쪽에 버튼이 줄지어 있는데, 밴드마다 모양을 고르는 것이다. 모양이 다르면 같은 값을 넣어도 결과가 다르다.", "<b>벨</b>은 종을 엎어 놓은 모양이다. 가운데 주파수를 중심으로 양옆이 함께 올라가거나 내려간다. 앞 절에서 본 Q가 이 종의 폭을 정한다. 문제가 되는 대역 하나를 골라 손볼 때 쓰는 기본 모양이고, EQ 밴드의 대부분이 이것이다.", "<b>셸프</b>는 선반이라는 뜻이다. 어느 지점부터 위 전체 또는 아래 전체를 통째로 올리거나 내린다. 벨이 한 대역만 건드린다면 셸프는 그 너머를 전부 바꾼다. <b>하이 셸프</b>로 <v>10</v>kHz 위를 <v>+2</v>dB 올리면 공기감이 전체적으로 더해지고, <b>로우 셸프</b>로 <v>100</v>Hz 아래를 내리면 저역 전체가 줄어든다. 밝기나 두께를 통째로 조절할 때 쓴다.", "<b>노치</b>는 아주 좁게 깊이 파는 모양이다. 벨을 Q 최대로 두고 크게 내린 것과 비슷한데, 한 주파수만 도려낸다. 전기 잡음의 <v>60</v>Hz나 하울링이 생기는 한 지점처럼 <b>문제가 한 점에 있을 때</b>만 쓴다. 음악 대역에 쓰면 그 자리의 음이 사라져 구멍이 난다.", "<b>하이패스와 로우패스</b>는 앞 절에서 봤다. 지정한 주파수 아래 또는 위를 깎아 내는 것이고, 슬로프로 얼마나 급하게 자를지 정한다. Channel EQ에서는 가장 왼쪽과 가장 오른쪽 밴드가 이것이다.", "화면의 그래프도 읽을 줄 알아야 한다. 가로가 주파수, 세로가 크기다. 곡선이 위로 솟으면 그 대역을 올린 것이고 아래로 파이면 깎은 것이다. 점을 끌면 주파수와 게인이 함께 바뀌고, 점 위에서 위아래로 드래그하면 Q가 바뀐다.", "Channel EQ에는 <b>분석기</b> 버튼이 있다. 켜면 재생되는 소리의 주파수 분포가 그래프 위에 겹쳐 보인다. 어느 대역에 에너지가 몰려 있는지, 저역이 어디까지 있는지가 눈으로 보인다. 다만 <b>보이는 것과 들리는 것은 다르다</b>. 그래프에 봉우리가 있다고 반드시 문제인 것은 아니다. 분석기는 귀로 찾은 것을 확인하는 용도이지 그것만 보고 깎는 도구가 아니다.", "EQ 자체도 종류가 갈린다. 로직에는 세 가지가 있다. <b>Channel EQ</b>가 기본이고 여덟 밴드에 분석기가 붙어 있다. <b>Linear Phase EQ</b>는 생김새가 같지만 안에서 처리하는 방식이 다르고, <b>Vintage EQ</b>는 옛 하드웨어를 흉내 낸 것들이다.", "<b>선형 위상</b>이 무엇인지 알아둘 필요가 있다. 보통의 EQ는 대역을 깎거나 올릴 때 그 주변 주파수의 도착 시간을 아주 조금 어긋나게 만든다. 이것을 위상 변화라고 하는데, 한 트랙에서는 티가 안 나지만 여러 트랙이 겹치면 미세하게 소리가 상한다. 선형 위상 EQ는 이 어긋남이 없다.", "대신 지연이 생긴다. 신호를 미리 읽어 처리해야 해서 소리가 늦게 나온다. 그래서 <b>녹음하며 모니터할 때는 쓰지 않고</b>, 마스터처럼 실시간성이 덜 중요한 자리에 쓴다. 앞에서 마스터에 Linear Phase EQ를 권한 이유가 이것이다.", "<b>Vintage EQ</b>는 반대다. 위상이 틀어지고 약간의 배음까지 생기는데, 그 변형이 듣기 좋아서 일부러 쓴다. Console EQ, Graphic EQ, Tube EQ 세 가지가 있고 각각 옛 장비의 성격을 흉내 낸다. 정확히 깎는 일에는 Channel EQ를 쓰고, 색을 입히려 할 때 이쪽을 쓴다.", "마지막으로 <b>Q-Couple</b>이 있다. Channel EQ의 설정 항목인데, 게인을 크게 줄수록 Q가 자동으로 좁아진다. 사람이 손으로 EQ를 조작하는 방식과 비슷해서 자연스럽게 들린다. 기본으로 켜져 있고 대개 그대로 둔다."], "path": [{"n": "밴드 모양 바꾸기", "s": ["<b>Channel EQ</b> 창 상단의 밴드 버튼", "왼쪽부터 하이패스 · 로우 셸프 · 벨 넷 · 하이 셸프 · 로우패스", "셸프 밴드를 클릭하고 <v>10</v>kHz에 <v>+2</v>dB", "벨과 비교해 위 전체가 올라가는지 확인"]}, {"n": "분석기로 확인", "s": ["창 왼쪽 위 <b>Analyzer</b> 버튼 켜기", "재생하며 에너지가 몰린 대역 확인", "귀로 찾은 지점과 맞는지만 대조", "그래프만 보고 깎지 않는다"]}, {"n": "EQ 고르기", "s": ["트랙 정밀 작업 → <b>Channel EQ</b>", "마스터 → <b>Linear Phase EQ</b>", "색을 입힐 때 → <b>Vintage EQ</b> 셋 중 하나", "녹음 모니터 중에는 선형 위상을 쓰지 않는다"]}], "drill": ["같은 트랙에 벨과 셸프로 각각 10kHz를 올려 차이를 듣는다.", "분석기를 켜고 귀로 찾은 지점과 그래프의 봉우리가 맞는지 확인한다.", "Channel EQ와 Vintage EQ로 같은 값을 걸어 비교한다."], "keys": [["X", "믹서"], ["I", "인스펙터"]], "chk": ["벨·셸프·노치를 구분해 쓴다", "분석기는 확인용으로만 쓴다", "선형 위상을 언제 쓰는지 안다"], "quiz": [{"q": "10kHz 위 전체를 밝게 하려면 어느 모양인가?", "a": ["벨", "하이패스", "노치", "하이 셸프"], "c": 3, "e": "벨은 한 대역만, 셸프는 그 너머 전체를 바꾼다."}, {"q": "노치를 쓰는 경우는?", "a": ["전체 밝기 조절", "부스트", "저역 정리", "60Hz 전기 잡음처럼 문제가 한 점에 있을 때"], "c": 3, "e": "음악 대역에 쓰면 그 자리의 음이 사라져 구멍이 난다."}, {"q": "선형 위상 EQ를 녹음 모니터 중에 안 쓰는 이유는?", "a": ["무거워서", "음질이 나빠서", "위상이 틀어져서", "지연이 생겨 소리가 늦게 나와서"], "c": 3, "e": "신호를 미리 읽어 처리한다. 마스터처럼 실시간성이 덜 중요한 자리에 쓴다."}, {"q": "분석기를 대하는 올바른 태도는?", "a": ["분석기만 보고 작업", "켜지 않는다", "그래프의 봉우리를 전부 깎는다", "귀로 찾은 것을 확인하는 용도"], "c": 3, "e": "보이는 것과 들리는 것은 다르다."}], "s": 11, "d": 80}, {"d": 81, "s": 11, "t": "컴프레서", "goal": "컴프레서의 다섯 파라미터를 설정한다.", "con": ["컴프레서는 큰 소리만 눌러 크고 작은 차이를 줄인다. 그 뒤 전체를 올리면 작은 소리가 더 잘 들린다. 결과적으로 소리가 앞으로 나오고 단단해진다.", "파라미터 다섯 개. 스레숄드는 누르기 시작하는 지점, 레이시오는 누르는 비율, 어택은 누르기 시작하는 속도, 릴리스는 놓아주는 속도, 메이크업 게인은 줄어든 만큼 보상하는 값이다.", "시작값 감각. 보컬은 레이시오 <v>3:1</v>, 어택 <v>10</v>ms, 릴리스 <v>100</v>ms, 게인 리덕션 <v>3~6</v>dB. 킥과 스네어는 레이시오 <v>4:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>80~150</v>ms. 베이스는 레이시오 <v>4:1</v>, 어택 <v>20</v>ms, 릴리스 <v>120</v>ms다. 각 값이 무엇을 하는지 보면 이렇다. 보컬 설정은 여린 부분을 끌어올려 가사가 다 들리게 하고, 드럼의 어택 <v>10~30</v>ms는 타격을 통과시키고 뒤의 울림만 눌러 펀치를 키우며, 베이스 설정은 음마다 들쭉날쭉하던 저역을 고르게 깔아 곡의 바닥을 안정시킨다.", "어택이 짧으면 타격감이 눌린다. 드럼에서 펀치를 살리려면 어택을 <v>20~30</v>ms로 길게 둬서 첫 타격은 통과시키고 그 뒤를 누른다.", "릴리스는 곡의 템포와 맞물린다. 너무 길면 다음 소리까지 눌리고, 너무 짧으면 펌핑이 생긴다. 발이 까딱거리는 느낌이 나면 대개 맞은 것이다.", "게인 리덕션 미터가 <v>3~6</v>dB 정도 움직이는 것이 일반적이다. 10dB 이상 계속 눌린다면 다시 생각한다.", "컴프로 어택을 조절하는 것과 다른 길이 하나 있다. 트랜지언트 셰이퍼다. 로직의 <b>Transient Designer</b>는 노브 두 개로 소리의 앞부분과 뒷부분을 따로 키우고 줄인다. <b>Attack</b>을 올리면 타격이 튀어나오고, <b>Sustain</b>을 내리면 울림이 짧아진다.", "컴프와 다른 점은 레벨을 안 본다는 것이다. 컴프는 스레숄드를 넘는 소리에만 반응하므로 여린 타격은 손대지 않는다. 트랜지언트 셰이퍼는 크기와 무관하게 모든 타격의 모양을 바꾼다. 그래서 드럼에서 결과가 더 확실하고 조작이 단순하다.", "쓰는 자리가 정해져 있다. 킥의 타격만 키우고 싶을 때, 스네어의 방 울림을 줄이고 싶을 때, 어쿠스틱 기타의 피크 소리를 살리고 싶을 때다. 시작값은 Attack <v>+3~+8</v>, Sustain <v>-3~-8</v> 정도다. 이 값이면 킥의 타격이 앞으로 튀어나오고 방 울림이 짧아져 드럼이 또렷하고 단단해진다. 극단으로 돌리면 타격만 남고 몸통이 사라져 소리가 부자연스럽게 찢어진다.", "컴프와 함께 쓸 때는 트랜지언트 셰이퍼를 앞에 둔다. 모양을 먼저 정하고 그다음에 음량 편차를 다듬는 순서다. 반대로 두면 컴프가 눌러 놓은 것을 다시 키우는 셈이 된다.", "컴프와 함께 자주 쓰는 것이 새추레이션이다. 소리를 아주 살짝 일그러뜨려 원래 없던 배음을 만드는 처리다. 진공관이나 테이프 같은 옛 장비가 신호를 완벽하게 통과시키지 못하고 조금씩 왜곡시켰는데, 그 왜곡이 듣기 좋아서 지금은 일부러 흉내 낸다.", "결과는 두 가지다. 배음이 늘어나 소리가 두꺼워지고 따뜻해진다. 그리고 고역 쪽에 없던 성분이 생기므로 음량을 올리지 않아도 앞으로 나온 것처럼 들린다. 얇은 소리에 특히 효과가 크다. 컴프가 음량 편차를 다루는 것과 달리 새추레이션은 음색 자체를 바꾼다.", "로직에서는 <b>ChromaGlow</b>가 대표적이고 <b>Distortion</b> 계열도 같은 일을 한다. 거는 정도는 걸었는지 안 걸었는지 애매한 수준이다. 과하면 지저분해지고 특히 여러 트랙에 함께 걸면 곡 전체가 탁해진다. 판단은 껐다 켜며 하되 음량을 맞춰서 한다. 새추레이션은 켜면 소리가 커지기 때문이다."], "path": [{"n": "Compressor 걸기", "s": ["채널 스트립 이펙트 슬롯 → <b>Dynamics → Compressor</b>", "상단에서 모델 선택. 기본은 <b>Platinum Digital</b>, 보컬은 <b>Studio VCA</b>", "<b>Threshold</b>를 내려 게인 리덕션 <v>3~6</v>dB 확보", "<b>Ratio</b>, <b>Attack</b>, <b>Release</b> 순으로 조정", "<b>Make Up</b>으로 음량 보상"]}, {"n": "Transient Designer 걸기", "s": ["드럼 채널 이펙트 슬롯 → <b>Dynamics → Transient Designer</b>", "<b>Attack</b>을 <v>+5</v>까지 올리며 타격 변화 확인", "<b>Sustain</b>을 <v>-5</v>까지 내리며 울림 변화 확인", "컴프보다 앞 슬롯에 두기"]}], "drill": ["보컬에 컴프를 걸고 스레숄드만 움직여 게인 리덕션 3dB와 10dB를 비교한다.", "드럼에서 어택을 1ms와 30ms로 바꿔 타격감 차이를 듣는다.", "릴리스를 30ms와 300ms로 바꿔 펌핑이 생기는 지점을 찾는다.", "얇은 신스에 새추레이션을 걸고 음량을 맞춰 껐다 켜며 두께 변화를 확인한다."], "keys": [["X", "믹서"], ["⌥클릭", "값 초기화"]], "chk": ["다섯 파라미터를 설명할 수 있다", "어택으로 타격감을 조절할 수 있다", "게인 리덕션 양을 보고 판단한다", "트랜지언트 셰이퍼와 컴프의 차이를 안다", "새추레이션과 컴프의 차이를 안다"], "quiz": [{"q": "드럼의 타격감을 살리려면 어택을?", "a": ["0ms에 가깝게 짧게", "20~30ms로 길게", "조절하지 않음", "최대로 길게"], "c": 1, "e": "어택을 길게 두면 첫 타격이 통과한 뒤 눌리기 때문에 펀치가 남는다."}, {"q": "일반적인 게인 리덕션 목표 범위는?", "a": ["3~6dB", "20dB 이상", "0~1dB", "10~15dB"], "c": 0, "e": "3~6dB가 자연스러운 범위다."}, {"q": "트랜지언트 셰이퍼가 컴프와 다른 점은?", "a": ["저역만 다룬다", "CPU를 덜 쓴다", "레벨과 무관하게 모든 타격의 모양을 바꾼다", "자동이다"], "c": 2, "e": "컴프는 스레숄드를 넘는 소리에만 반응하지만 트랜지언트 셰이퍼는 크기를 보지 않는다."}, {"q": "새추레이션이 컴프와 다른 점은?", "a": ["배음을 더해 음색 자체를 바꾼다", "자동이다", "저역만 다룬다", "음량 편차를 다룬다"], "c": 0, "e": "컴프는 음량을, 새추레이션은 음색을 다룬다. 음량을 올리지 않고도 앞으로 나온 것처럼 들린다."}]}, {"t": "컴프 파라미터 더 보기", "goal": "니, 오토 게인, 감지 방식, 병렬 컴프까지 다룬다.", "con": ["앞 절의 넷으로 대부분은 된다. 여기서는 창에 있지만 아직 안 본 것들을 정리한다. 몰라도 소리는 나지만, 알면 왜 생각한 대로 안 되는지가 풀린다.", "<b>니</b>는 무릎이라는 뜻이다. 스레숄드를 넘는 순간 압축이 어떻게 시작되는지를 정한다. <b>하드 니</b>는 넘는 순간 정해진 비율로 확 눌린다. 경계가 뚜렷해서 드럼처럼 또렷한 것에 맞는다. <b>소프트 니</b>는 스레숄드 근처에서 서서히 비율이 올라간다. 눌리기 시작하는 지점이 흐려져 티가 덜 나고, 보컬처럼 자연스러워야 하는 것에 쓴다.", "로직 Compressor에서는 <b>Knee</b> 노브로 정한다. <v>0</v>이 완전한 하드이고 값을 올릴수록 부드러워진다. 보컬은 <v>0.5</v> 부근, 드럼은 <v>0</v>에 가깝게 두면 된다. 모델에 따라 이 노브가 없는 것도 있는데, 그 모델이 원래 갖고 있는 성격으로 고정되어 있다는 뜻이다.", "<b>오토 게인</b>이 중요하다. 로직 Compressor는 기본으로 켜져 있고, 누른 만큼 자동으로 다시 올려 준다. 그래서 게인 리덕션이 <v>6</v>dB 걸려도 음량이 안 줄어든다. 여기서 흔한 착각이 생긴다. 컴프를 걸었는데 소리가 안 작아지니 효과가 없다고 여기고 더 세게 거는 것이다.", "판단할 때는 <b>오토 게인을 끄고</b> 걸린 양만 본 뒤, 다시 켜서 음량을 맞춰 비교한다. 앞에서 컴프를 껐다 켜며 판단하라고 한 것도 음량이 같아야 의미가 있다. 음량이 커지면 사람 귀는 무조건 좋게 듣기 때문이다.", "<b>감지 방식</b>도 고를 수 있다. <b>피크</b>는 순간의 최대값을 보고, <b>RMS</b>는 짧은 구간의 평균을 본다. 피크는 갑작스러운 튐을 잡는 데 빠르고, RMS는 사람이 느끼는 크기에 가까워 부드럽다. 드럼처럼 타격이 중요한 것은 피크, 보컬이나 베이스처럼 덩어리로 들려야 하는 것은 RMS가 맞는 경우가 많다.", "<b>룩어헤드</b>는 신호를 미리 읽어 두는 기능이다. 소리가 오기 전에 눌릴 준비를 하므로 아주 빠른 타격도 놓치지 않는다. 대신 그만큼 지연이 생겨 녹음 모니터 중에는 부담이 된다. 믹싱 단계에서만 쓴다.", "<b>병렬 컴프레션</b>은 방식 자체가 다르다. 원음은 그대로 두고 <b>복사본만 세게 눌러</b> 섞는 것이다. 원음의 타격은 살아 있고 복사본이 여린 부분을 끌어올려서, 세게 누른 소리의 밀도와 안 누른 소리의 생동감을 함께 얻는다. 드럼 버스와 보컬에 많이 쓴다.", "만드는 법은 센드를 쓰는 것이다. 버스로 보내고 그 버스에 컴프를 게인 리덕션 <v>10</v>dB 이상 세게 건 뒤, 원음 아래에서 조금씩 올린다. 복사본에만 걸리므로 앞에서 본 누적 <v>8</v>dB 상한과는 무관하다. 로직 Compressor에는 <b>Mix</b> 노브가 있어서 플러그인 하나로도 같은 일을 할 수 있다. <v>100</v>이 완전히 처리된 소리이고 낮출수록 원음이 섞인다.", "정리하면 이렇다. 니는 눌리기 시작하는 경계의 부드러움, 오토 게인은 음량 보정, 감지 방식은 무엇을 보고 누를지, 룩어헤드는 미리 보기, 병렬은 섞는 방식이다. 처음에는 앞 절의 넷만 쓰고, 생각대로 안 될 때 이쪽을 본다."], "path": [{"n": "니 조절", "s": ["<b>Compressor</b> → <b>Knee</b> 노브", "보컬 <v>0.5</v> · 드럼 <v>0</v>에 가깝게", "같은 스레숄드에서 니만 바꿔 비교"]}, {"n": "오토 게인 끄고 판단", "s": ["<b>Auto Gain</b>을 <b>Off</b>로", "게인 리덕션 미터로 걸린 양만 확인", "<b>Make Up</b>으로 수동으로 음량 맞춤", "컴프를 껐다 켜며 비교. 음량이 같아야 판단이 된다"]}, {"n": "병렬 컴프 만들기", "s": ["드럼 트랙들의 <b>센드</b>를 새 버스로", "그 버스에 <b>Compressor</b> → 레이시오 <v>8:1</v> · GR <v>10</v>dB 이상", "버스 페이더를 <v>-∞</v>에서 천천히 올림", "원음이 두꺼워지는 지점에서 멈춤"]}, {"n": "Mix 노브로 병렬", "s": ["트랙에 <b>Compressor</b> 직접 삽입", "세게 눌리도록 스레숄드를 내림", "<b>Mix</b>를 <v>100</v>에서 <v>30~50</v>으로 내림", "원음과 섞이는 비율을 귀로 정함"]}], "drill": ["같은 보컬에 니 0과 1로 각각 걸어 차이를 듣는다.", "오토 게인을 끄고 켜고 게인 리덕션이 같을 때 음량이 어떻게 다른지 본다.", "드럼에 병렬 컴프를 만들어 원음만일 때와 비교한다."], "keys": [["X", "믹서"], ["⌥클릭", "값 초기화"]], "chk": ["오토 게인을 끄고 판단한다", "니로 경계의 부드러움을 정한다", "병렬 컴프의 원리를 안다"], "quiz": [{"q": "컴프를 걸었는데 음량이 안 줄어든다면?", "a": ["레이시오가 낮은 것", "스레숄드가 높은 것", "효과가 없는 것", "오토 게인이 켜져 있어 자동으로 보정된 것"], "c": 3, "e": "판단할 때는 끄고 걸린 양만 본 뒤 음량을 맞춰 비교한다."}, {"q": "보컬에 소프트 니를 쓰는 이유는?", "a": ["더 세게 눌려서", "빨라서", "음량이 커져서", "눌리기 시작하는 지점이 흐려져 티가 덜 나서"], "c": 3, "e": "드럼처럼 또렷해야 하는 것은 하드 니가 맞는다."}, {"q": "병렬 컴프레션이 누적 8dB 상한과 무관한 이유는?", "a": ["약하게 걸어서", "복사본에만 걸리고 원음은 그대로라서", "Mix 때문", "버스라서"], "c": 1, "e": "원음의 타격은 살아 있고 복사본이 여린 부분을 끌어올린다."}, {"q": "드럼처럼 타격이 중요한 것에 맞는 감지 방식은?", "a": ["룩어헤드", "RMS", "피크", "둘 다 같다"], "c": 2, "e": "RMS는 평균을 봐서 사람이 느끼는 크기에 가깝고 부드럽다."}], "s": 11, "d": 82}, {"d": 83, "s": 11, "t": "디에서, 게이트, 멀티밴드", "goal": "디에서, 게이트, 멀티밴드 컴프레서를 사용한다.", "con": ["컴프레서는 크기 전체에 반응한다. 그런데 문제가 특정 주파수나 특정 구간에만 있을 때가 있다. 그때 쓰는 도구가 따로 있다.", "디에서는 치찰음을 잡는다. 시옷과 치읓 발음에서 <v>5~9</v>kHz가 튀어 귀를 찌를 때 그 대역만 순간적으로 누른다. 여성 보컬은 <v>6~8</v>kHz, 남성 보컬은 <v>5~7</v>kHz 부근인 경우가 많다. 제대로 잡으면 스와 치 발음만 순해지고 나머지는 그대로다. 대역을 낮게 잡으면 발음 전체가 눌려 웅얼거리고, 리덕션을 세게 걸면 스 소리가 아예 사라져 혀 짧은 소리가 난다. 너무 강하게 걸면 발음이 뭉개져 웅얼거리게 되므로, 튀는 순간에만 <v>3~6</v>dB 눌리는 정도가 적당하다.", "게이트는 설정한 레벨보다 작은 소리를 아예 막는다. 드럼 마이크에 새어 들어온 다른 악기 소리를 걷어내거나, 기타 앰프의 잡음을 없앨 때 쓴다. 릴리스가 짧으면 소리 꼬리가 잘려 부자연스럽고, 길면 잡음이 남는다. 홀드 값을 <v>10~50</v>ms 정도 주면 문이 덜 떨린다.", "멀티밴드 컴프레서는 주파수를 여러 구간으로 나눠 각각 따로 누른다. 저역만 출렁일 때 저역 구간만 잡을 수 있다. 강력하지만 과하게 쓰면 소리가 납작해진다. 문제가 명확할 때만 쓴다.", "다이내믹 EQ는 멀티밴드와 비슷해 보이지만 쓰는 자리가 다르다. 고정 EQ는 그 대역을 항상 깎는다. 그런데 문제가 가끔만 생기는 경우가 있다. 보컬이 어떤 단어에서만 <v>3</v>kHz가 튀거나, 베이스가 특정 음에서만 부풀 때다. 고정 EQ로 깎으면 안 튀는 구간까지 손해를 본다.", "다이내믹 EQ는 그 대역이 설정한 레벨을 넘을 때만 깎는다. 튀는 순간에만 반응하고 평소에는 아무 일도 안 한다. 앞에서 배운 디에서가 사실 다이내믹 EQ의 특수한 경우다. 치찰음 대역만 다루도록 만들어진 것이다.", "고르는 기준. 항상 문제면 고정 EQ, 가끔 문제면 다이내믹 EQ, 넓은 구간이 통째로 출렁이면 멀티밴드 컴프다. 로직에서는 Channel EQ의 각 밴드에서 <b>Dynamic</b> 모드를 켜서 쓴다.", "순서가 있다. 먼저 편곡으로, 다음 EQ로, 그다음 이런 도구로 간다. 도구부터 꺼내면 원인을 못 찾는다."], "path": [{"n": "디에서", "s": ["보컬 채널 → <b>Dynamics → DeEsser 2</b>", "<b>Detection</b> 주파수를 <v>7000</v>Hz 부근으로", "<b>Monitor</b>를 켜서 치찰음만 들리는 지점 찾기", "<b>Threshold</b>를 내려 리덕션 <v>3~6</v>dB", "Monitor 끄고 확인"]}, {"n": "게이트", "s": ["채널 → <b>Dynamics → Noise Gate</b>", "<b>Threshold</b>를 올려 원하는 소리만 통과", "<b>Hold</b> <v>20</v>ms, <b>Release</b> <v>100</v>ms", "<b>Hysteresis</b>로 문 떨림 방지"]}], "drill": ["보컬에 디에서를 걸고 Monitor로 치찰음만 들어 정확한 주파수를 찾는다.", "일부러 강하게 걸어 발음이 뭉개지는 지점을 확인하고 되돌린다.", "드럼 톰 트랙에 게이트를 걸어 다른 소리가 새어 들어오는 것을 막아본다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["디에서 주파수를 귀로 찾을 수 있다", "게이트의 홀드 역할을 안다", "도구를 꺼내기 전에 원인을 먼저 본다", "고정 EQ와 다이내믹 EQ를 구분해 쓴다"], "quiz": [{"q": "디에서가 다루는 대역은?", "a": ["200~400Hz", "15kHz 이상", "60~120Hz", "5~9kHz"], "c": 3, "e": "치찰음은 대체로 5~9kHz에 몰려 있다."}, {"q": "보컬이 특정 단어에서만 3kHz가 튈 때 알맞은 도구는?", "a": ["고정 EQ", "리버브", "다이내믹 EQ", "게이트"], "c": 2, "e": "가끔만 문제라면 그 순간에만 반응하는 다이내믹 EQ가 맞다. 고정 EQ는 안 튀는 구간까지 깎는다."}]}, {"t": "게이트와 왜곡 계열", "goal": "게이트가 끊기지 않게 설정하고 왜곡 플러그인을 구분해 쓴다.", "con": ["앞 절에서 게이트가 기준보다 작은 소리를 막는다는 것을 봤다. 그런데 실제로 걸어 보면 소리가 뚝뚝 끊기거나 문이 덜덜 떨린다. 그것을 막는 노브가 따로 있다.", "<b>스레숄드</b>는 문이 열리는 기준이다. 이 값보다 크면 통과하고 작으면 막힌다. 드럼이라면 타격은 넘고 다른 드럼의 새어 들어옴은 못 넘는 지점을 찾는다.", "<b>홀드</b>는 문이 열린 뒤 <b>최소한 이만큼은 유지</b>하라는 시간이다. 이게 없으면 소리가 기준 근처에서 오락가락할 때 문이 계속 열렸다 닫혀 덜덜거린다. <v>10~50</v>ms를 주면 사라진다. 스네어의 울림을 남기려면 더 길게 준다.", "<b>릴리스</b>는 문이 닫히는 속도다. 급하게 닫으면 소리가 뚝 끊겨 부자연스럽고, 느리게 닫으면 새어 들어오는 소리까지 함께 남는다. <v>50~200</v>ms에서 찾는다. 탐은 울림이 길어 더 길게 준다.", "<b>레인지</b>는 문이 닫혔을 때 <b>얼마나 막을지</b>다. 완전히 막으면 <v>-∞</v>가 되어 그 구간이 무음이 된다. 실제로는 완전한 무음이 더 부자연스러워서 <v>-20~-40</v>dB 정도만 줄이는 경우가 많다. 배경이 조금 남아 있는 편이 자연스럽다.", "<b>히스테리시스</b>는 여는 기준과 닫는 기준을 다르게 두는 것이다. 여는 기준보다 닫는 기준을 <v>3~6</v>dB 낮게 두면, 한 번 열린 문이 조금 작아졌다고 바로 닫히지 않는다. 홀드와 함께 덜덜거림을 막는 핵심이다. 로직 Noise Gate에서는 <b>Hysteresis</b> 노브다.", "게이트가 안 잡히면 <b>사이드체인 필터</b>를 쓴다. 게이트가 무엇을 보고 열지를 정하는 것인데, 킥 마이크에 스네어가 새어 든다면 사이드체인을 킥 대역으로 좁혀 두면 스네어에는 안 열린다. 앞의 사이드체인 절과 같은 구조다.", "이제 <b>왜곡 계열</b>이다. 앞에서 새추레이션이 배음을 더해 두껍게 만든다고 했는데, 왜곡은 정도와 방식에 따라 이름이 갈린다.", "<b>새추레이션</b>은 가장 약하다. 걸었는지 안 걸었는지 애매한 정도로 배음만 더한다. <b>오버드라이브</b>는 그보다 세서 소리가 살짝 거칠어지고 두꺼워진다. 기타 앰프를 조금 밀어붙인 소리다. <b>디스토션</b>은 확실히 일그러져 원래 음색이 바뀐다. 록 기타의 그 소리다.", "<b>비트 리덕션</b>은 성격이 다르다. 배음을 더하는 것이 아니라 <b>정보를 줄여</b> 거칠게 만든다. 비트 심도를 낮추면 계단처럼 뭉툭해지고 샘플레이트를 낮추면 금속성 잡음이 낀다. 옛 게임기나 로파이 느낌이 필요할 때 쓴다.", "<b>클리퍼</b>는 파형의 꼭대기를 잘라 낸다. 리미터와 비슷해 보이지만 리미터가 눌러서 낮추는 것이라면 클리퍼는 잘라 버린다. 그래서 타격이 유지되면서 피크만 사라진다. 드럼 버스나 마스터에서 리미터 앞에 살짝 쓰면 라우드니스를 더 얻을 수 있다.", "로직에서는 <b>ChromaGlow</b>가 새추레이션부터 오버드라이브까지 다섯 방식을 담고 있어 대부분 이것으로 해결된다. 더 센 것이 필요하면 <b>Distortion</b>, <b>Bitcrusher</b>, <b>Clip Distortion</b>을 쓴다. 기타는 <b>Amp Designer</b>와 <b>Pedalboard</b>가 따로 있다.", "공통 주의 하나. 왜곡 계열은 전부 <b>음량을 키운다</b>. 껐다 켜며 판단할 때 음량을 맞추지 않으면 무조건 좋게 들린다. 출력 노브로 맞춘 뒤 비교한다."], "path": [{"n": "게이트 설정", "s": ["트랙에 <b>Dynamics → Noise Gate</b>", "<b>Threshold</b>를 올려 새어 드는 소리가 막히는 지점까지", "<b>Hold</b> <v>20</v>ms · <b>Release</b> <v>100</v>ms", "<b>Hysteresis</b> <v>-4</v>dB", "<b>Reduction</b>을 <v>-30</v>dB로 (완전히 막지 않음)"]}, {"n": "게이트가 안 잡힐 때", "s": ["<b>Side Chain</b> 섹션 열기", "<b>Filter</b>를 켜고 대역을 좁힘", "킥이면 <v>50~120</v>Hz만 보게", "다시 스레숄드 조정"]}, {"n": "왜곡 고르기", "s": ["살짝 두껍게 → <b>ChromaGlow</b>", "거칠게 → <b>Distortion</b> 계열", "로파이 → <b>Bitcrusher</b>", "피크만 잘라 → <b>Clip Distortion</b>", "출력 노브로 음량을 맞춘 뒤 껐다 켜며 판단"]}], "drill": ["게이트 홀드를 0과 30ms로 두고 덜덜거림 차이를 듣는다.", "레인지를 -∞와 -25dB로 두고 어느 쪽이 자연스러운지 판단한다.", "같은 트랙에 새추레이션·오버드라이브·디스토션을 걸어 비교한다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["홀드와 히스테리시스로 덜덜거림을 막는다", "레인지를 완전히 막지 않는다", "왜곡은 음량을 맞춘 뒤 판단한다"], "quiz": [{"q": "게이트가 덜덜 떨린다면?", "a": ["레인지를 -∞로", "릴리스를 0으로", "홀드와 히스테리시스를 준다", "스레숄드를 올린다"], "c": 2, "e": "기준 근처에서 오락가락할 때 문이 계속 열렸다 닫힌다."}, {"q": "게이트 레인지를 -∞로 두지 않는 이유는?", "a": ["CPU 때문", "완전한 무음이 더 부자연스러워서", "잡음 때문", "소리가 커져서"], "c": 1, "e": "배경이 -20~-40dB 정도 남아 있는 편이 자연스럽다."}, {"q": "비트 리덕션이 다른 왜곡과 다른 점은?", "a": ["음량이 준다", "고역만 바꾼다", "배음을 더하는 게 아니라 정보를 줄인다", "더 세다"], "c": 2, "e": "비트 심도를 낮추면 뭉툭해지고 샘플레이트를 낮추면 금속성 잡음이 낀다."}, {"q": "클리퍼와 리미터의 차이는?", "a": ["클리퍼는 저역만", "클리퍼가 더 약하다", "같다", "리미터는 눌러 낮추고 클리퍼는 잘라 낸다"], "c": 3, "e": "그래서 타격이 유지되면서 피크만 사라진다."}], "s": 11, "d": 84}, {"t": "그룹 버스 컴프레션", "goal": "같은 계열 트랙을 하나로 묶어 함께 누르고, 누적 게인 리덕션을 관리한다.", "con": ["개별 트랙 컴프는 트랙 하나의 음량 편차를 다듬는다. 그런데 드럼 여덟 트랙을 각각 다듬어도 여덟 개가 따로 노는 느낌은 남는다. 이때 여덟 트랙을 하나의 버스로 모아 그 버스에 컴프를 하나 더 걸면, 여덟 트랙이 같은 손에 눌려 한 덩어리로 움직인다. 이것이 그룹 버스 컴프레션이고 흔히 글루라고 부른다.", "묶는 기준은 역할이다. 드럼끼리, 보컬끼리, 기타끼리, 건반과 현악 같은 배경 악기끼리 묶는다. 소리가 비슷해서가 아니라 곡에서 하는 일이 같아서 묶는 것이다.", "드럼 버스. 레이시오 <v>4:1</v>, 어택 <v>20~30</v>ms, 릴리스 <v>100</v>ms 또는 자동, 게인 리덕션 <v>3~6</v>dB. 어택을 길게 두는 이유는 개별 트랙 때와 같다. 첫 타격을 통과시키고 뒤의 울림만 눌러야 펀치가 남는다. 목표는 킷 전체가 한 사람이 친 것처럼 들리는 것이다.", "보컬 버스. 레이시오 <v>2:1~3:1</v>, 어택 <v>5~20</v>ms, 릴리스 <v>50~150</v>ms, 게인 리덕션 <v>2~4</v>dB. 리드와 더블링과 하모니를 묶어 함께 누르면 여러 겹이 하나의 목소리 덩어리로 들린다. 개별 보컬 컴프보다 약하게 거는 이유는 이미 각 트랙에서 한 번 눌렸기 때문이다.", "기타 버스. 레이시오 <v>2:1~4:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>80~200</v>ms, 게인 리덕션 <v>2~5</v>dB. 좌우로 벌린 리듬 기타 두 대를 묶어 누르면 둘이 한 벽처럼 붙어 넓게 들린다.", "배경 악기 버스. 건반, 베이스, 관악, 현악처럼 화성을 채우는 악기들. 레이시오 <v>2:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>100~250</v>ms, 게인 리덕션 <v>1~3</v>dB. 가장 약하게 건다. 이 정도면 건반과 현악이 서로 밀어내지 않고 하나의 층으로 붙어 들린다. 개별로 들으면 달라진 것이 거의 없고 합쳐서 들을 때만 정돈된 느낌이 난다. 이 층은 앞에 나서지 않고 자리를 지키는 것이 일이라 세게 누르면 오히려 존재가 흐려진다.", "버스 단계의 게인 리덕션이 개별 트랙보다 작은 이유가 있다. 컴프는 겹쳐 걸리기 때문이다. 트랙에서 <v>5</v>dB 누르고 버스에서 <v>4</v>dB 누르고 마스터에서 <v>2</v>dB 누르면 그 소리는 합쳐서 <v>11</v>dB 눌린 것이다. 각 단계에서는 적당해 보여도 최종 결과는 납작해진다. 그래서 아래 단계로 갈수록 조금씩만 누르고, 세 단계 합이 <v>8</v>dB를 넘지 않게 관리한다.", "버스 컴프의 효과를 확인하는 방법은 하나다. 켜고 끄면서 듣되, 켜면 소리가 커지므로 메이크업 게인을 낮춰 음량을 맞춘 뒤 비교한다. 음량을 안 맞추면 큰 쪽이 무조건 좋게 들려 판단이 성립하지 않는다.", "버스를 만들면 그 버스에 EQ와 리버브 센드를 함께 걸 수 있다는 이점도 생긴다. 드럼 전체에 같은 룸 리버브를 보내면 킷이 한 방 안에 있는 것처럼 들린다."], "path": [{"n": "버스에 컴프 걸기", "s": ["스택 트랙 선택 → <k>X</k> 믹서에서 해당 채널 확인", "이펙트 슬롯 → <b>Dynamics → Compressor</b>", "모델은 <b>Studio VCA</b> 또는 <b>Vintage VCA</b>", "레이시오와 어택, 릴리스를 계열별 값으로 설정", "<b>Threshold</b>를 내려 목표 게인 리덕션 확보"]}, {"n": "음량 맞춰 비교", "s": ["컴프를 켠 상태에서 <b>Make Up</b>을 조정해 켜기 전과 음량을 같게 맞춤", "플러그인 좌상단 전원 버튼으로 껐다 켜며 비교", "커진 것이 아니라 묶인 것이 느껴지는지 판단"]}, {"n": "누적 확인", "s": ["같은 소리에 걸린 컴프를 트랙, 버스, 마스터 순으로 모두 확인", "각 단계의 게인 리덕션 값을 더한다", "합이 <v>8</v>dB를 넘으면 아래 단계부터 줄인다"]}], "drill": ["드럼 트랙 전체를 서밍 스택으로 묶고 4:1, 어택 25ms, GR 4dB로 걸어 본다. 메이크업으로 음량을 맞춘 뒤 껐다 켜며 차이를 듣는다.", "드럼 버스 어택을 1ms와 25ms로 바꿔 펀치가 어떻게 달라지는지 비교한다.", "한 트랙에 걸린 컴프 세 단계(트랙·버스·마스터)의 게인 리덕션을 각각 적고 합을 계산한다."], "keys": [["⇧⌘G", "트랙 스택 만들기"], ["X", "믹서"], ["S", "솔로"], ["⌥클릭", "값 초기화"]], "chk": ["역할 기준으로 트랙을 묶는다", "계열별 시작값을 안다", "세 단계 누적 게인 리덕션을 관리한다"], "quiz": [{"q": "버스 컴프의 게인 리덕션이 개별 트랙보다 작아야 하는 이유는?", "a": ["버스는 소리가 작아서", "리버브가 걸려 있어서", "컴프가 겹쳐 걸려 누적되기 때문", "CPU를 아끼려고"], "c": 2, "e": "트랙·버스·마스터에서 각각 누른 양이 더해진다. 단계마다 적당해 보여도 합치면 납작해진다."}, {"q": "드럼 버스에서 어택을 20~30ms로 두는 이유는?", "a": ["저역을 깎으려고", "첫 타격을 통과시켜 펀치를 남기려고", "릴리스를 길게 하려고", "CPU 부담을 줄이려고"], "c": 1, "e": "어택이 짧으면 타격의 앞부분까지 눌려 힘이 빠진다."}, {"q": "버스 컴프 효과를 판단할 때 반드시 해야 하는 것은?", "a": ["메이크업으로 음량을 맞추고 비교", "리버브 끄기", "템포 낮추기", "솔로로 듣기"], "c": 0, "e": "켜면 소리가 커지므로 음량을 맞추지 않으면 큰 쪽이 무조건 좋게 들린다."}], "d": 85, "s": 11}, {"t": "트랙 스택과 그룹", "goal": "서밍 스택과 폴더 스택의 차이를 알고 목적에 맞게 묶는다.", "con": ["트랙이 스물을 넘어가면 화면이 복잡해지고 같이 움직여야 할 것들이 따로 논다. 로직에는 트랙을 묶는 방법이 셋 있고 하는 일이 다 다르다. <b>서밍 스택</b>, <b>폴더 스택</b>, <b>트랙 그룹</b>이다. 이름이 비슷해 헷갈리지만 구분이 분명하다.", "<b>서밍 스택</b>은 소리를 한 곳으로 모은다. 여러 트랙의 출력이 하나의 Aux 채널로 들어가고, 그 채널에 EQ와 컴프를 걸면 전부에 함께 걸린다. 앞 절에서 본 그룹 버스가 이것이다. 메인 트랙의 페이더를 내리면 안에 든 트랙 전체가 함께 작아진다. 실제로 소리가 합쳐지므로 버스 컴프와 공용 리버브 센드를 걸 수 있다.", "<b>폴더 스택</b>은 화면만 접는다. 소리는 각자 원래 출력으로 나가고 합쳐지지 않는다. 트랙 열 개를 하나로 접어 화면을 정리하는 용도다. 메인 트랙의 페이더는 <b>VCA</b>로 동작해서 안쪽 트랙들의 페이더를 상대적으로 함께 움직인다. 소리는 안 합쳐지는데 음량은 함께 움직이는 셈이다.", "차이를 정리하면 이렇다. <b>함께 처리하고 싶으면 서밍</b>, <b>화면만 정리하고 싶으면 폴더</b>다. 드럼 여덟 트랙에 버스 컴프를 걸겠다면 서밍이고, 안 쓰는 트랙들을 접어 두겠다면 폴더다. 서밍은 Aux 채널이 하나 늘어나 자원을 조금 쓰고, 폴더는 거의 안 쓴다.", "만드는 법은 같다. 묶을 트랙을 전부 선택하고 <k>⇧⌘G</k>로 서밍 스택을, <k>⇧⌘H</k>로 폴더 스택을 바로 만든다. 트랙 헤더 우클릭 메뉴에서 골라 만들 수도 있다. 나중에 바꿀 수도 있다.", "스택 안에 스택을 넣을 수도 있다. 킥과 스네어를 서밍으로 묶고, 탐들을 서밍으로 묶고, 그 둘을 다시 드럼 서밍에 넣는 식이다. 다만 깊어질수록 신호가 어디로 가는지 추적하기 어려워지므로 두 단계까지가 적당하다.", "<b>트랙 그룹</b>은 스택과 다른 것이다. 소리를 모으지도 화면을 접지도 않고, <b>조작만 함께</b> 한다. 여러 트랙의 페이더와 뮤트와 솔로를 하나로 묶어 함께 움직이게 한다. 드럼 여덟 트랙의 균형을 맞춰 놓았는데 전체를 조금 줄이고 싶을 때, 하나씩 내리면 균형이 깨지지만 그룹으로 묶어 두면 관계가 유지된 채 함께 움직인다.", "버스로 묶는 것과 별개로 트랙 그룹이라는 기능이 있다. 여러 트랙의 페이더와 뮤트와 솔로를 하나로 묶어 함께 움직이게 하는 것이다. 드럼 여덟 트랙의 균형을 맞춰 놓았는데 드럼 전체를 조금 올리고 싶을 때, 그룹으로 묶여 있으면 하나만 움직여도 나머지가 상대 차이를 유지한 채 따라온다.", "버스와 그룹은 다른 일을 한다. 버스는 소리를 한 곳으로 모아 함께 처리하는 것이고, 그룹은 조작을 함께 하는 것이다. 둘을 같이 쓰는 경우가 많다. 드럼을 버스로 묶어 컴프를 걸고, 동시에 그룹으로 묶어 페이더를 함께 움직인다.", "그룹에서 무엇을 묶을지 고를 수 있다. 볼륨과 뮤트만 묶고 팬은 따로 두는 식이다. 잠시 하나만 조절하고 싶으면 <k>⌃</k>를 누른 채 조작하면 그 순간만 그룹이 풀린다. 이 임시 해제를 모르면 그룹을 만들어 놓고 매번 껐다 켜게 된다.", "로직 12에서는 폴더 스택을 서밍 스택으로 바꾸는 것도 된다. 이때 폴더 스택 메인 트랙의 VCA 오토메이션이 서밍 스택 메인 트랙의 Aux 볼륨 오토메이션으로 변환된다.", "그룹은 최대 <v>64</v>개까지 만들 수 있고, 한 채널이 여러 그룹에 동시에 속할 수도 있다. 다만 초보 단계에서 그룹을 많이 만들면 무엇이 왜 같이 움직이는지 추적하기 어려워진다. 드럼 하나로 시작해 필요할 때 늘린다.", "셋을 함께 쓰는 것이 보통이다. 드럼을 서밍 스택으로 묶어 버스 컴프를 걸고, 동시에 트랙 그룹으로 묶어 페이더를 함께 움직인다. 편집까지 함께 해야 하는 다중 마이크 드럼이라면 그룹 설정에서 <b>편집</b>과 <b>위상 잠금 오디오</b>를 켠다.", "정리하면 목적으로 고른다. 소리를 합쳐 함께 처리하려면 서밍 스택, 화면을 접으려면 폴더 스택, 조작을 함께 하려면 트랙 그룹이다. 세 가지가 서로 배타적이지 않아서 한 묶음의 트랙에 셋을 다 걸 수도 있다."], "path": [{"n": "서밍 스택 만들기", "s": ["묶을 트랙 전부 선택", "<k>⇧⌘G</k>", "메인 트랙 이름을 역할로 바꿈 (DRUMS, VOX 등)", "메인 트랙 채널에 EQ와 컴프를 건다"]}, {"n": "폴더 스택 만들기", "s": ["접을 트랙 전부 선택", "<k>⇧⌘H</k> 폴더 스택 생성", "메인 트랙 왼쪽 삼각형으로 접고 펴기", "메인 페이더는 VCA로 동작한다"]}, {"n": "스택 바꾸기", "s": ["폴더 스택 메인 트랙 선택", "트랙 헤더 우클릭 → <b>서밍 스택으로 변환</b>", "VCA 오토메이션이 Aux 볼륨으로 바뀌는지 확인"]}, {"n": "트랙 스택으로 버스 만들기", "s": ["묶을 트랙들을 모두 선택", "<k>⇧⌘G</k> → <b>서밍 스택</b> 선택", "맨 위에 생긴 스택 트랙이 그 그룹의 버스다", "이름을 <b>DRUMS</b>처럼 대문자로 지정해 개별 트랙과 구분"]}, {"n": "트랙 그룹 만들기", "s": ["<k>X</k> 믹서에서 묶을 채널 모두 선택", "채널 스트립의 <b>그룹</b> 슬롯 클릭 → <b>Group 1</b> 선택", "<b>그룹 설정 열기</b>에서 묶을 항목 체크: <b>Volume</b>, <b>Mute</b>, <b>Solo</b>", "임시 해제: <k>⌃</k>를 누른 채 조작"]}], "drill": ["드럼 트랙을 서밍과 폴더로 각각 묶어 소리가 합쳐지는지 확인한다.", "폴더 스택 메인 페이더를 내려 안쪽 페이더가 함께 움직이는지 본다.", "서밍 스택 메인 채널에 컴프를 걸어 전체에 걸리는지 확인한다."], "keys": [["⇧⌘G", "트랙 스택 생성"], ["X", "믹서"], ["⌃드래그", "그룹 임시 해제"]], "chk": ["버스와 그룹의 차이를 안다", "서밍과 폴더의 차이를 안다", "목적으로 골라 묶는다"], "quiz": [{"q": "트랙 그룹으로 묶인 페이더 하나만 잠시 조절하려면?", "a": ["솔로를 켠다", "버스를 푼다", "⌃를 누른 채 조작한다", "그룹을 삭제한다"], "c": 2, "e": "⌃를 누르는 동안만 그룹이 임시로 풀린다."}, {"q": "드럼 여덟 트랙에 버스 컴프를 걸려면?", "a": ["폴더 스택", "서밍 스택", "셋 다 안 된다", "트랙 그룹"], "c": 1, "e": "소리가 하나의 Aux 채널로 합쳐져야 함께 처리된다."}, {"q": "폴더 스택 메인 페이더의 동작은?", "a": ["VCA로 안쪽 페이더를 상대적으로 움직임", "Aux 볼륨", "뮤트만", "아무 일 없음"], "c": 0, "e": "소리는 안 합쳐지는데 음량은 함께 움직인다."}, {"q": "트랙 그룹이 하는 일은?", "a": ["소리를 모은다", "화면을 접는다", "리버브를 공유한다", "조작을 함께 한다"], "c": 3, "e": "페이더와 뮤트와 솔로를 함께 움직인다. 소리는 안 모은다."}], "s": 11, "d": 86}, {"d": 87, "s": 11, "t": "사이드체인 덕킹", "goal": "사이드체인 컴프레션을 설정한다.", "con": ["사이드체인은 컴프레서에게 다른 트랙의 소리를 듣고 반응하라고 시키는 것이다. 킥 소리를 듣고 베이스를 누르게 하면, 킥이 칠 때마다 베이스가 잠깐 물러난다. 저역에서 둘이 싸우지 않게 된다.", "두 가지 목적이 있다. 하나는 자리 만들기다. 이때는 효과가 들리지 않을 정도로 약하게 건다. 킥이 뚫고 나오는데 무엇이 달라졌는지는 모르겠는 상태가 이상적이다.", "다른 하나는 효과다. 하우스와 일렉트로닉에서 패드 전체가 킥에 맞춰 크게 숨쉬는 소리가 여기서 나온다. 이때는 일부러 크게 건다.", "장르마다 쓰는 정도가 다르다. 하우스와 EDM은 가장 세게 건다. 4분 킥이 계속 나오므로 패드와 베이스와 코드 전체가 킥에 맞춰 오르내리고, 그 출렁임 자체가 곡의 리듬이 된다. 게인 리덕션 <v>6~12</v>dB에 릴리스는 다음 킥 직전에 회복되도록 맞춘다. 이렇게 걸면 킥이 칠 때마다 나머지가 통째로 주저앉았다가 다시 차오른다. 곡이 숨을 쉬는 것처럼 들리고, 그 오르내림 자체가 박자를 알려주기 때문에 하이햇을 촘촘히 깔지 않아도 리듬이 선다.", "힙합과 트랩은 목적이 다르다. 808이 킥과 같은 저역을 쓰기 때문에 둘이 겹치면 킥의 타격이 사라진다. 여기서는 808에 사이드체인을 걸어 킥이 칠 때만 잠깐 비키게 한다. 릴리스를 <v>50~120</v>ms로 짧게 두어 808의 긴 울림이 최대한 남게 한다. 효과로 들리면 실패다.", "팝과 록은 베이스에만 약하게 건다. 게인 리덕션 <v>2~4</v>dB에서 무엇이 달라졌는지 모르겠는 상태가 목표다. 이 값에서 실제로 일어나는 일은 킥이 칠 때만 베이스가 아주 잠깐 비켜서 저역이 겹치지 않는 것이고, 귀에는 킥이 또렷해진 것으로만 들린다. 이 장르에서 출렁임이 들리면 대개 과한 것이다.", "알앤비와 로파이와 발라드는 거의 쓰지 않는다. 킥이 성기게 나오고 그루브가 느긋해서, 규칙적인 출렁임이 오히려 흐름을 방해한다. 저역이 부딪히면 사이드체인보다 EQ와 편곡으로 나누는 편이 낫다.", "릴리스를 정하는 계산이 있다. 한 박의 길이는 <v>60000</v>을 BPM으로 나눈 값이다. <v>128</v>BPM이면 한 박이 약 <v>469</v>ms이고, 4분 킥이라면 릴리스가 그보다 짧아야 다음 킥 전에 회복된다. 릴리스를 한 박의 절반에서 3분의 2 사이에 두면 대체로 맞는다.", "설정값의 감각. 어택은 <v>0.1~5</v>ms로 아주 짧게 둔다. 킥이 시작하는 순간 바로 눌러야 하기 때문이다. 릴리스가 곡의 인상을 정한다. <v>50~100</v>ms면 짧게 툭 비켰다 돌아오고, <v>150~300</v>ms면 길게 숨쉰다. 템포에 맞춰 다음 킥 직전에 회복되는 값을 찾는다.", "덕킹을 크게 걸수록 킥은 뚫고 나오지만 곡 전체 음량이 출렁인다. 게인 리덕션 <v>2~4</v>dB면 자리 만들기, <v>6</v>dB 이상이면 효과다.", "저역 정리를 사이드체인으로만 해결하려 들면 안 된다. 편곡과 EQ로 먼저 나누고 마지막 손질로 쓴다.", "소스가 킥일 필요는 없다. 실전에서 자주 쓰는 것이 보컬이다. 보컬을 소스로 삼아 리버브 버스나 패드를 누르면, 노래하는 동안에는 배경이 물러나고 쉬는 자리에서 잔향이 살아난다. 보컬을 크게 올리지 않고도 또렷하게 만드는 방법이라 발라드에서도 쓸 수 있다. 이때 릴리스는 <v>200~400</v>ms로 길게 두어야 단어마다 출렁이지 않는다.", "사이드체인 필터를 알아두면 오작동을 막을 수 있다. 컴프레서의 사이드체인 입력에도 EQ를 걸 수 있는데, 여기에 하이패스를 <v>100</v>Hz 정도로 걸면 킥의 저역에는 반응하지 않고 타격의 중역에만 반응한다. 결과가 눈에 띄게 달라진다. 필터가 없으면 킥의 긴 저역 꼬리에 계속 반응해 눌리는 양이 들쭉날쭉하고 덕킹이 늘어지는데, 필터를 걸면 타격 순간에만 반응해 눌리는 양이 일정해지고 회복도 깔끔해진다. 반대로 로우패스를 걸면 저역에만 반응한다. 소스에 하이햇 같은 다른 소리가 섞여 컴프가 계속 눌릴 때 이 필터로 원하는 대역만 골라낸다. 필터는 소리를 바꾸는 것이 아니라 컴프가 무엇을 들을지만 정한다.", "판단이 어려우면 껐다 켜며 듣는다. 이때도 음량을 맞춰야 한다. 사이드체인을 걸면 전체 음량이 줄어드는데, 그 상태로 비교하면 안 건 쪽이 좋게 들린다."], "path": [{"n": "사이드체인 걸기", "s": ["눌릴 트랙(베이스)에 <b>Compressor</b> 추가", "플러그인 창 오른쪽 위 <b>Side Chain</b> 메뉴 클릭", "소스로 킥 트랙 선택", "<b>Attack</b> <v>1</v>ms, <b>Release</b> <v>80</v>ms, <b>Ratio</b> <v>4:1</v>로 시작", "<b>Threshold</b>를 내려 리덕션 <v>3</v>dB 확보"]}, {"n": "킥이 안 잡힐 때", "s": ["킥 트랙 출력이 사이드체인 목록에 없으면 킥에 <b>Bus</b> 센드를 하나 추가", "센드를 <b>프리 페이더</b>로 두면 킥 음량과 무관하게 신호 전달"]}, {"n": "사이드체인 필터 쓰기", "s": ["Compressor 창에서 <b>Side Chain</b> 영역의 필터 부분 열기", "<b>Filter</b>를 켜고 <b>HP</b> 선택 → 주파수 <v>100</v>Hz", "<b>Listen</b> 버튼으로 컴프가 듣고 있는 소리를 직접 확인", "확인 후 Listen 끄기"]}, {"n": "보컬로 리버브 덕킹", "s": ["리버브 Aux 채널에 <b>Compressor</b> 추가", "<b>Side Chain</b> 소스로 보컬 트랙 또는 보컬 버스 지정", "레이시오 <v>3:1</v>, 어택 <v>5</v>ms, 릴리스 <v>300</v>ms", "게인 리덕션 <v>3~5</v>dB. 노래하는 동안 잔향이 물러나는지 확인"]}], "drill": ["킥과 베이스만 놓고 사이드체인 없이, 3dB 리덕션, 8dB 리덕션 세 가지를 비교한다.", "릴리스를 40, 100, 250ms로 바꿔가며 곡이 숨쉬는 속도가 어떻게 달라지는지 듣는다.", "패드에 사이드체인을 걸어 하우스 느낌을 만들어 본다.", "같은 곡을 하우스식(GR 8dB)과 팝식(GR 3dB)으로 걸어 비교한다.", "보컬을 소스로 리버브 버스를 덕킹해 보고, 보컬 페이더를 올리는 것과 어느 쪽이 또렷한지 판단한다.", "사이드체인 필터의 Listen 버튼을 눌러 컴프가 실제로 무엇을 듣고 있는지 확인한다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["자리 만들기와 효과를 구분해 쓴다", "릴리스로 숨쉬는 속도를 조절한다", "리덕션 양으로 강도를 판단한다", "장르별 강도를 구분한다", "사이드체인 필터의 역할을 안다"], "quiz": [{"q": "사이드체인 덕킹에서 어택을 아주 짧게 두는 이유는?", "a": ["소리를 부드럽게 하려고", "CPU를 아끼려고", "릴리스를 길게 하려고", "킥이 시작하는 순간 바로 비켜야 해서"], "c": 3, "e": "어택이 길면 킥의 앞부분이 이미 부딪친 뒤에 눌리기 때문에 효과가 없다."}, {"q": "자리 만들기 목적일 때 적절한 게인 리덕션은?", "a": ["2~4dB", "0dB", "15dB 이상", "8~12dB"], "c": 0, "e": "들리지 않을 정도로 약하게 거는 것이 자리 만들기다."}, {"q": "트랩에서 808에 사이드체인을 거는 목적은?", "a": ["음정을 고치려고", "템포를 맞추려고", "출렁이는 효과를 만들려고", "킥과 808이 겹쳐 킥의 타격이 사라지는 것을 막으려고"], "c": 3, "e": "808과 킥이 같은 저역을 쓴다. 여기서는 효과로 들리면 실패다."}, {"q": "사이드체인 필터가 하는 일은?", "a": ["소스의 소리를 바꾼다", "음량을 키운다", "템포를 맞춘다", "컴프가 무엇을 들을지 정한다"], "c": 3, "e": "필터는 컴프의 판단 재료만 거른다. 실제 출력 소리는 바뀌지 않는다."}, {"q": "128BPM에서 4분 킥일 때 릴리스 기준은?", "a": ["한 박(약 469ms)보다 길게", "0ms", "1초 이상", "한 박보다 짧게"], "c": 3, "e": "다음 킥이 오기 전에 회복되어야 한다. 한 박의 절반에서 3분의 2 사이가 무난하다."}]}, {"d": 88, "s": 12, "t": "팬과 좌우 배치", "goal": "팬으로 자리를 나누고 마스킹을 줄인다.", "con": ["밸런스 단계에서 대략 정해 둔 좌우 자리를 여기서 다듬는다. 그때는 가운데와 바깥만 나눴다면 이제 폭과 앞뒤까지 정한다.", "입체감은 세 축으로 만든다. 좌우는 팬, 앞뒤는 음량과 리버브 양, 위아래는 주파수다.", "팬을 돌리면 두 가지 일이 동시에 일어난다. 하나는 자리다. 왼쪽으로 돌리면 왼쪽 스피커가 커지고 오른쪽이 작아져서 소리가 왼쪽에서 오는 것으로 들린다. 다른 하나가 실제 이득이다. 두 악기가 같은 주파수를 쓰더라도 좌우로 갈라 놓으면 서로 덜 가린다. 귀가 방향이 다른 소리를 따로 듣기 때문이다.", "이 두 번째가 팬을 쓰는 진짜 이유다. EQ로 대역을 나누는 것과 목적이 같다. 기타와 건반이 같은 중역에서 부딪힐 때 한쪽을 <v>L45</v>, 다른 쪽을 <v>R45</v>로 벌리면 EQ를 손대지 않고도 둘 다 들린다. 자리가 남아 있는데 EQ부터 깎으면 악기의 음색만 잃는다. 순서는 팬이 먼저다.", "돌리는 만큼 반대쪽을 잃는다는 것도 알아야 한다. 기타를 <v>L70</v>으로 크게 벌리면 왼쪽에서만 거의 다 들린다. 한쪽 이어폰만 끼거나 스피커 한쪽 편에 앉은 사람에게는 그 기타가 없는 곡이 된다. 그래서 곡에 하나뿐인 악기는 크게 벌리지 않고, 벌린다면 반대쪽에 짝이 되는 것을 둔다.", "음량도 함께 움직인다. 팬을 완전히 한쪽으로 돌리면 그 스피커 하나만 소리를 내므로 가운데 있을 때보다 총량이 줄어든다. 로직은 이 차이를 보정하지만 완전히 같지는 않으므로, 팬을 크게 바꾼 뒤에는 페이더를 다시 본다. 팬만 돌리고 균형이 맞았다고 생각하면 그 트랙이 조금 작아진 상태로 남는다.", "팬 배치의 기본. 킥, 베이스, 스네어, 리드 보컬은 가운데. 가운데인 이유는 배분이다. 에너지가 큰 요소를 가운데 두면 좌우 스피커가 일을 반씩 나눠 맡고, 저역은 어차피 방향이 지각되지 않으며, 모노로 합쳐도 균형이 유지된다. 나머지는 좌우로 벌린다. 같은 역할의 악기 두 개가 있으면 좌우 대칭으로 둔다. 기타 두 대를 <v>L60</v>과 <v>R60</v>에 두는 식이다. 폭은 네 구간으로 나눠 생각하면 결정이 빨라진다. 가운데 <v>0</v>도는 킥, 스네어, 베이스, 리드 보컬. 좁게 <v>±10~30</v>도는 백보컬, 톰, 오버헤드처럼 중심을 도우면서 폭을 조금 넓히는 것들. 넓게 <v>±30~70</v>도는 기타, 건반, 패드처럼 배경을 채우는 층. 극단 <v>±70~100</v>도는 효과음과 라이저처럼 사라져도 곡이 유지되는 것들이다. 중요한 것일수록 가운데에 두고, 없어도 되는 것일수록 바깥에 둔다."], "path": [{"n": "기록하기", "s": ["트랙 헤더 오토메이션 모드를 <b>Touch</b>로", "재생하며 페이더 조작 → 움직인 동안만 기록", "모드를 <b>Read</b>로 되돌리기"]}, {"n": "팬으로 자리 나누기", "s": ["부딪히는 두 악기를 <b>솔로</b>로 함께 듣는다", "한쪽을 <v>L45</v>, 다른 쪽을 <v>R45</v>로 벌린다", "솔로를 풀고 전체에서 둘 다 들리는지 확인", "그래도 가리면 그때 EQ로 대역을 나눈다", "<b>Gain</b>의 모노 버튼으로 합쳐 확인"]}], "drill": ["기타 두 대를 L60, R60에 두고 가운데 악기와의 관계를 확인한다.", "같은 중역의 악기 둘을 겹쳐 두고, EQ로 나누는 것과 팬으로 나누는 것을 비교한다.", "기타를 L70으로 벌린 뒤 왼쪽 이어폰만 빼고 들어 본다."], "keys": [["A", "오토메이션 표시"], ["X", "믹서"], ["⌃⌘A", "오토메이션 켜기와 끄기"]], "chk": ["팬 배치 원칙을 안다", "네 개 패닝 구간을 안다", "팬이 마스킹을 줄이는 원리를 안다", "팬을 바꾼 뒤 페이더를 다시 본다"], "quiz": [{"q": "악기를 뒤로 보내기 위해 함께 해야 하는 것은?", "a": ["음량만 줄이기", "리버브만 늘리기", "음량 줄이고 리버브 늘리고 고역 깎기", "팬을 끝으로"], "c": 2, "e": "거리감은 세 가지가 함께 작동할 때 만들어진다."}, {"q": "효과음과 라이저를 극단까지 벌려도 되는 이유는?", "a": ["사라져도 곡이 유지되기 때문", "저역이 없어서", "소리가 작아서", "리버브가 걸려서"], "c": 0, "e": "모노에서 상쇄되거나 한쪽에서만 들려도 곡의 뼈대가 무너지지 않는 요소들이다."}, {"q": "기타와 건반이 같은 중역에서 부딪힐 때 먼저 할 일은?", "a": ["EQ로 한쪽을 깎는다", "좌우로 벌린다", "리버브를 건다", "한쪽을 지운다"], "c": 1, "e": "자리가 남아 있는데 EQ부터 깎으면 악기의 음색만 잃는다. 팬이 먼저다."}, {"q": "곡에 하나뿐인 악기를 L70으로 크게 벌리면?", "a": ["넓어져서 좋다", "한쪽에서만 듣는 사람에게는 없는 곡이 된다", "음정이 바뀐다", "저역이 는다"], "c": 1, "e": "크게 벌린다면 반대쪽에 짝이 되는 것을 둔다."}, {"q": "팬을 크게 바꾼 뒤 확인할 것은?", "a": ["페이더", "템포", "조표", "샘플레이트"], "c": 0, "e": "팬을 한쪽으로 돌리면 총 음량이 줄어든다. 로직이 보정하지만 완전하지 않다."}]}, {"t": "깊이 1: 음량·리버브·고역", "goal": "세 가지를 함께 움직여 악기를 앞뒤로 배치한다.", "con": ["좌우를 정했으면 앞뒤 차례다. 좌우는 팬 하나로 되지만 앞뒤는 그런 노브가 없다. 여러 요소를 함께 움직여 만든다.", "뒤로 보내려면 음량을 줄이고 리버브를 늘리고 고역을 약간 깎는다. 세 가지를 함께 해야 실제로 뒤에 있는 것처럼 들린다. 시작값은 음량 <v>-3~-6</v>dB, 리버브 센드 <v>-14</v>dB 부근, <v>6</v>kHz 위를 <v>2~3</v>dB 정도다. 하나만 해서는 그냥 작아지거나 그냥 흐려질 뿐이다.", "이 셋이 왜 함께 가는지는 실제 공간에서 벌어지는 일과 같다. 소리원이 멀어지면 도달하는 에너지가 줄고, 공기가 고역을 먼저 흡수하고, 직접음보다 반사음의 비율이 커진다. 그래서 셋을 함께 움직여야 귀가 거리로 받아들인다.", "앞으로 당기는 것은 반대다. 음량을 올리고 리버브를 줄이고 <v>8~12</v>kHz를 살짝 올린다. 다만 앞으로 나올 수 있는 자리는 하나뿐이다. 여러 악기를 동시에 앞으로 당기면 아무것도 앞에 있지 않게 된다. 앞자리를 누구에게 줄지 먼저 정한다.", "리버브 쪽에도 거리 조절 도구가 둘 더 있다. 프리 딜레이를 <v>0</v>에 가깝게 두면 원음과 잔향이 붙어 멀리 있는 것처럼 들리고, <v>30</v>ms 부근으로 벌리면 원음이 먼저 도착해 가깝게 들린다. 앞에서 본 선행음 효과가 여기서도 작동한다. 초기 반사를 줄이는 것도 거리를 만든다. 벽이 가까울수록 초기 반사가 많이 들리기 때문에, 이를 줄이면 넓은 공간의 먼 자리에 있는 것처럼 들린다."], "path": [{"n": "뒤로 보내기 (기본 셋)", "s": ["페이더 <v>-3~-6</v>dB", "리버브 센드를 <v>-14</v>dB 부근까지", "<b>Channel EQ</b> 하이셸프 <v>6</v>kHz 위 <v>-2~-3</v>dB", "셋을 함께 한 뒤 재생해 확인"]}, {"n": "앞으로 당기기", "s": ["앞자리를 줄 트랙 하나만 정한다", "페이더 <v>+1~+2</v>dB · 리버브 센드 <v>-20</v>dB 아래", "하이셸프 <v>8~12</v>kHz <v>+1~+2</v>dB", "Direction Mixer Spread <v>1.2~1.5</v>", "ChromaVerb Distance <v>20~30</v>"]}], "drill": ["패드를 뒤로 보내기 위해 음량, 리버브, 고역 세 가지를 함께 조정한다."], "keys": [["A", "오토메이션"], ["X", "믹서"], ["S", "솔로"]], "chk": ["깊이를 만드는 다섯 요소를 안다"], "quiz": [{"q": "악기를 뒤로 보낼 때 음량만 줄이면?", "a": ["리버브가 는다", "고역이 준다", "그냥 작아질 뿐이다", "뒤로 간다"], "c": 2, "e": "음량, 리버브, 고역 세 가지를 함께 해야 귀가 거리로 받아들인다."}, {"q": "프리 딜레이를 0에 가깝게 두면?", "a": ["멀리 있는 것처럼 들린다", "템포가 어긋난다", "음정이 바뀐다", "가깝게 들린다"], "c": 0, "e": "원음과 잔향이 붙는다. 30ms 부근으로 벌리면 원음이 먼저 도착해 가깝게 들린다."}], "s": 12, "d": 89}, {"t": "깊이 2: 폭·초기 반사·대역·Distance", "goal": "거리감을 더 확실하게 만드는 추가 방법과 ChromaVerb Distance를 안다.", "con": ["여기까지가 음량, 리버브 양, 고역 세 가지였다. 실제로는 방법이 더 있고, 서로 겹쳐 쓰면 거리감이 더 확실해진다.", "<b>폭을 좁힌다.</b> 멀리 있는 소리는 좌우 차이가 거의 없다. 바로 앞에 있는 사람의 목소리는 왼쪽 귀와 오른쪽 귀에 다르게 도착하지만, 50미터 밖의 소리는 양쪽 귀에 거의 같게 도착한다. 그래서 스테레오 소스의 좌우 폭을 좁혀 모노에 가깝게 두면 뒤로 물러난다. 로직에서는 <b>Imaging → Direction Mixer</b>를 걸고 <b>Spread</b>를 <v>1.0</v>에서 <v>0.5~0.7</v>로 줄인다. 1.0이 원래 폭, 0이 완전한 모노다. 반대로 <v>1.2~1.5</v>로 넓히면 앞으로 나온다.", "<b>초기 반사를 흉내 낸다.</b> 소리가 벽에 부딪혀 처음 돌아오는 것을 초기 반사라고 한다. 리버브 없이 이것 하나만 만들어도 소리가 방 안 어딘가에 놓인다. 방법은 원음 뒤에 <v>10~30</v>ms 늦은 복사본을 <v>-6~-10</v>dB로 겹치는 것이다. <b>Delay → Sample Delay</b>나 <b>Stereo Delay</b>를 걸고 딜레이 시간을 <v>15</v>ms, 피드백 <v>0</v>, 믹스 <v>20~30</v>퍼센트로 두면 된다. 앞의 위상 절에서 본 하스 효과와 같은 원리인데, 폭이 아니라 거리를 만드는 데 쓴다. 딜레이가 길수록 벽이 멀고, 짧을수록 벽이 가깝다.", "<b>대역을 좁힌다.</b> 앞에서 고역만 깎으라고 했는데, 실제로 멀리 있는 소리는 고역만 빠지는 것이 아니다. 저역도 함께 줄어들어 중역만 남는다. 가까운 소리는 근접 효과로 저역이 붇고, 멀어지면 그 반대가 된다. 그래서 하이패스 <v>200</v>Hz와 로우패스 <v>5</v>kHz를 함께 걸어 대역을 좁히면 거리감이 훨씬 확실해진다. 전화기 소리가 <v>300~3000</v>이니 그보다 조금 넓은 셈이다. <b>Channel EQ</b>의 양 끝 밴드 두 개로 한다.", "<b>ChromaVerb의 Distance 노브</b>는 이것들을 한 번에 다룬다. 이 노브 하나가 초기 반사와 후기 잔향의 비율을 바꿔 거리감을 만든다. 값을 올리면 초기 반사가 줄고 후기 잔향이 늘어 멀어지고, 내리면 초기 반사가 살아나 가까워진다. 전용 거리 플러그인은 로직에 없지만, 리버브를 어차피 쓴다면 이 노브가 그 역할을 한다. 시작값은 <v>50</v>이고, 뒤로 보낼 트랙은 <v>70~80</v>, 앞에 둘 트랙은 <v>20~30</v>이다. 다만 리버브 버스 하나를 여러 트랙이 공유하면 노브 하나로 전부 바뀌므로, 거리를 다르게 두려면 리버브 버스를 둘로 나눈다.", "여섯 가지를 정리하면 이렇다. 음량, 리버브 양, 고역 깎기, 폭 좁히기, 초기 반사, 대역 좁히기. 뒤로 보낼 때 전부 쓸 필요는 없다. 음량과 리버브와 고역이 기본이고, 그래도 부족하면 폭을 좁히고, 그래도 안 되면 대역을 좁힌다. 초기 반사는 리버브를 쓰지 않는 마른 믹스에서 대신 쓴다."], "path": [{"n": "더 멀리 (추가 셋)", "s": ["<b>Imaging → Direction Mixer</b> → Spread <v>0.5~0.7</v>", "<b>Channel EQ</b> 하이패스 <v>200</v>Hz + 로우패스 <v>5</v>kHz", "리버브 버스 ChromaVerb → <b>Distance</b> <v>70~80</v>"]}, {"n": "리버브 없이 거리 (초기 반사)", "s": ["<b>Delay → Stereo Delay</b> 삽입", "딜레이 <v>15</v>ms · 피드백 <v>0</v> · 믹스 <v>25</v>퍼센트", "벽이 멀면 <v>30</v>ms, 가까우면 <v>10</v>ms"]}], "drill": ["같은 트랙에 Spread 0.5와 1.5를 번갈아 걸어 앞뒤가 바뀌는지 듣는다.", "ChromaVerb Distance를 20과 80으로 바꿔 차이를 적는다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["깊이를 만드는 여섯 가지를 안다", "ChromaVerb Distance가 무엇을 바꾸는지 안다"], "quiz": [{"q": "스테레오 폭을 좁히면 소리가 뒤로 가는 이유는?", "a": ["고역이 줄어서", "음량이 줄어서", "리버브가 늘어서", "멀리 있는 소리는 좌우 차이가 거의 없어서"], "c": 3, "e": "50미터 밖의 소리는 양쪽 귀에 거의 같게 도착한다. Direction Mixer Spread 0.5~0.7."}, {"q": "ChromaVerb의 Distance 노브가 바꾸는 것은?", "a": ["리버브 길이", "프리 딜레이", "음량", "초기 반사와 후기 잔향의 비율"], "c": 3, "e": "올리면 초기 반사가 줄고 후기 잔향이 늘어 멀어진다. 뒤로 70~80, 앞으로 20~30."}, {"q": "리버브를 쓰지 않는 마른 믹스에서 거리를 만들려면?", "a": ["컴프를 건다", "팬을 돌린다", "음량만 줄인다", "10~30ms 딜레이 하나로 초기 반사를 흉내 낸다"], "c": 3, "e": "원음 뒤에 15ms, -6~-10dB의 복사본 하나가 방 안 어딘가에 놓인 느낌을 만든다."}], "s": 12, "d": 90}, {"d": 91, "s": 12, "t": "리버브: 센드 버스와 공간", "goal": "센드 버스로 리버브를 구성하고 종류와 값을 곡에 맞게 정한다.", "con": ["리버브를 트랙마다 개별로 거는 것은 비효율적이고 소리도 흩어진다. 센드 버스를 만들어 여러 트랙이 같은 공간을 공유하게 하는 것이 표준이다. 같은 방에 있는 것처럼 들린다.", "그 전에 종류를 안다. 리버브는 어떤 공간을 흉내 내느냐로 나뉘고, 로직에서는 ChromaVerb와 Space Designer의 프리셋 이름에 이 말들이 그대로 붙어 있다.", "실제 공간을 본뜬 것이 셋이다. 룸(Room)은 작은 방이라 잔향이 짧고 어둡다. 소리를 뒤로 밀지 않고 마르지 않게만 해주므로 드럼과 기타에 쓴다. 홀(Hall)은 콘서트홀이라 잔향이 길고 넓게 퍼진다. 발라드 코러스와 오케스트라의 공간이다. 챔버(Chamber)는 옛 스튜디오가 스피커와 마이크를 놓아두고 쓰던 울림방으로, 룸보다 길고 홀보다 짧아 보컬에 자주 쓰인다.", "기계에서 나온 것이 둘이다. 플레이트(Plate)는 금속판을 떨게 해 만든 소리라 자연에 없는 매끈함과 밝은 잔향이 특징이다. 보컬과 스네어에 오래 쓰여 왔다. 스프링(Spring)은 용수철을 쓴 방식으로 통통 튀는 특유의 색이 있고, 기타 앰프에 들어 있는 것이 이것이다.", "효과로 쓰는 것이 둘이다. 게이트 리버브(Gated)는 잔향이 자연스럽게 사라지지 않고 도중에 뚝 끊긴다. 1980년대 스네어 소리가 여기서 나왔다. 시머(Shimmer)는 잔향에 옥타브 위 음을 섞어 계속 위로 번지게 만든 것으로, 앰비언트와 영화 음악에서 배경을 채울 때 쓴다.", "고르는 순서는 단순하다. 곡의 공간이 실내인지 큰 홀인지 정하고, 자연스러움이 필요하면 룸이나 홀, 매끈함이 필요하면 플레이트, 색을 넣고 싶으면 스프링이나 시머로 간다.", "버스는 최소 두 개를 만든다. 짧은 공간용과 긴 공간용이다. 짧은 것은 룸이나 플레이트 <v>0.8~1.5</v>초, 긴 것은 홀 <v>2.5~4</v>초.", "얼마나 보낼지에도 기준이 있다. 센드 노브를 <v>-∞</v>에서 천천히 올리다가 잔향이 들리기 시작하는 지점을 찾고, 거기서 조금만 더 올린다. 대개 <v>-20</v>에서 <v>-12</v>dB 사이에 자리 잡는다. 잔향이 또렷하게 들리면 이미 과한 것이고, 껐을 때 소리가 갑자기 마르는 정도가 적당하다.", "악기마다 보내는 양이 다르다. 보컬과 스네어는 많이, 기타와 건반은 중간, 베이스와 킥은 거의 보내지 않는다. 같은 버스를 쓰되 보내는 양으로 거리를 만드는 것이다. 이것이 곡의 앞뒤를 만드는 방법이기도 하다.", "센드가 신호 흐름의 어느 지점에서 갈라지는지는 세 가지 중에서 고른다. <b>포스트 팬</b>은 페이더와 팬을 모두 지난 뒤라 음량과 좌우 위치가 둘 다 반영된다. 기본값이고 대부분 이쪽이면 된다. <b>포스트 페이더</b>는 페이더를 지나되 팬 앞이라 음량만 반영되고 좌우는 반영되지 않는다. 트랙을 한쪽으로 몰아도 잔향은 가운데 두고 싶을 때 쓴다. <b>프리 페이더</b>는 둘 다 지나기 전이라 페이더를 내려도 보내는 양이 그대로다. 페이더를 완전히 내려 잔향만 남기거나 사이드체인 소스를 안정적으로 보낼 때 쓴다.", "프리 딜레이도 함께 본다. <v>20~40</v>ms를 주면 원음이 먼저 들리고 잔향이 따라와서 명료도가 유지된다. 이 범위인 이유는 선행음 효과다. 귀는 약 30ms 안에 도착하는 반사음을 원음과 한 덩어리로 듣되 먼저 온 쪽으로 위치와 또렷함을 판단하므로, 그 경계 안의 틈은 공간감을 남기고 명료도만 올린다.", "리버브에 하이패스와 로우패스를 건다. 리버브 입력에 <v>200</v>Hz 하이패스, <v>8</v>kHz 로우패스를 걸면 저역이 뭉치지 않고 치찰음이 번지지 않는다. 안 걸었을 때와 비교하면 차이가 분명하다. 하이패스가 없으면 킥과 베이스의 저역까지 잔향이 붙어 곡의 바닥이 흐려지고, 로우패스가 없으면 스와 치 발음의 잔향이 길게 남아 보컬이 쉭쉭거린다. 두 필터를 걸면 잔향의 양은 그대로인데 곡은 또렷해진다.", "로직에서는 계산할 필요 없이 <b>Sync</b> 버튼을 켜면 음표 단위로 고를 수 있다. 다만 숫자를 알아두면 동기를 끄고 몇 ms 어긋나게 두는 조정이 가능해진다. 살짝 어긋난 딜레이가 더 자연스러운 경우가 있다.", "저역 악기에는 리버브를 거의 걸지 않는다. 킥과 베이스는 마른 채로 두는 것이 기본이다. 완성한 리버브 Aux는 채널 스트립 설정으로 저장해 둔다. Aux 채널 스트립 맨 위의 <b>설정</b> 버튼(채널 스트립 상단) → <b>다른 이름으로 채널 스트립 설정 저장</b>. EQ와 리버브가 포함된 공간 하나가 통째로 저장되어 다음 곡에서 한 번에 불러온다.", "로직의 리버브 플러그인이 여럿이라 고르기가 헷갈린다. 기준은 단순하다. <b>ChromaVerb</b>는 계산으로 공간을 만드는 방식이라 파라미터로 자유롭게 빚을 수 있고 가볍다. 대부분의 작업은 여기서 시작한다. <b>Space Designer</b>는 실제 공간을 녹음해 그대로 씌우는 방식이라 사실적이지만 세부 조정의 폭이 좁고 자원을 더 쓴다. 특정한 실제 공간의 느낌이 필요할 때 고른다.", "<b>Quantec Room Simulator</b>는 로직 12에서 서라운드까지 지원하도록 확장된 고급 리버브다. 자연스러움이 최우선인 어쿠스틱 작업이나 몰입형 작업에 쓴다. 셋 중 무엇을 고르든 앞에서 본 디케이와 프리 딜레이와 EQ의 원칙은 같다.", "센드가 어디로 가는지 헷갈릴 때 확인하는 방법이 있다. 센드를 <k>⇧</k>클릭하면 그 센드가 향하는 Aux 채널이 세 번 깜빡인다. 버스를 여러 개 쓸 때 잘못 보낸 것을 빨리 찾을 수 있다."], "path": [{"n": "센드 버스 만들기", "s": ["<k>X</k> 믹서 → 트랙 채널 스트립의 <b>센드</b> 슬롯 클릭. 채널마다 최대 여덟 개까지 만들 수 있다. 앞에서 버스를 최소 두 개 만들라고 한 것은 시작 기준이고 여유는 충분하다", "<b>Bus → Bus 1</b> 선택 → 그 버스로 가는 Aux 채널이 자동 생성", "Aux 채널 이펙트 슬롯 → <b>Reverb → ChromaVerb</b> 또는 <b>Space Designer</b>", "Aux의 <b>Mix</b>를 <v>100</v>퍼센트로 설정", "각 트랙의 센드 노브로 보내는 양 조절", "센드 노브를 -∞에서 올려 잔향이 들리기 시작하는 지점 찾기", "보내는 양을 악기별로 다르게: 보컬 많이, 킥과 베이스는 거의 없이"]}, {"n": "리버브 다듬기", "s": ["Aux 채널 이펙트 첫 슬롯에 <b>Channel EQ</b>", "하이패스 <v>200</v>Hz, 로우패스 <v>8</v>kHz", "리버브 <b>프리 딜레이</b> <v>25</v>ms", "<b>디케이</b> 시간 설정"]}, {"n": "리버브 종류 골라 듣기", "s": ["리버브 Aux의 <b>ChromaVerb</b> 열기", "프리셋 분류에서 <b>Room</b>, <b>Hall</b>, <b>Plate</b>, <b>Chamber</b>를 차례로 재생", "같은 보컬 구간으로 네 가지를 비교하고 하나를 고름", "디케이와 프리 딜레이를 곡에 맞게 다시 조정"]}], "drill": ["짧은 버스와 긴 버스 두 개를 만들고 악기별로 보내는 양을 다르게 준다.", "리버브에 EQ를 걸기 전과 후를 비교한다."], "keys": [["X", "믹서"], ["⌥클릭", "초기화"]], "chk": ["센드 버스를 만들 수 있다", "리버브에 EQ를 건다", "저역 악기는 마르게 둔다", "리버브 종류를 구분하고 용도에 맞게 고른다", "센드 양의 기준과 프리·포스트 페이더의 차이를 안다", "센드 세 방식의 차이를 안다"], "quiz": [{"q": "금속판의 떨림으로 만든, 보컬과 스네어에 오래 쓰여 온 리버브는?", "a": ["룸", "홀", "스프링", "플레이트"], "c": 3, "e": "플레이트는 자연에 없는 매끈하고 밝은 잔향이라 보컬에 잘 붙는다."}, {"q": "잔향이 도중에 뚝 끊기는 리버브는?", "a": ["게이트", "홀", "챔버", "시머"], "c": 0, "e": "게이트 리버브다. 1980년대 스네어 소리가 여기서 나왔다."}, {"q": "리버브 센드 양의 적정 상태는?", "a": ["껐을 때 소리가 갑자기 마르는 정도", "잔향이 또렷하게 들린다", "전혀 안 보낸다", "최대로 보낸다"], "c": 0, "e": "또렷하게 들리면 이미 과하다. -20에서 -12dB 사이에 대개 자리 잡는다."}, {"q": "포스트 페이더 센드의 특징은?", "a": ["자동으로 조절된다", "페이더를 내리면 보내는 양도 함께 준다", "페이더와 무관하게 일정", "저역만 보낸다"], "c": 1, "e": "소리와 잔향의 비율이 유지되므로 대부분 이쪽이 맞다."}]}, {"t": "리버브 노브와 종류", "goal": "ChromaVerb의 노브가 각각 무엇을 바꾸는지 알고 리버브 종류를 고른다.", "con": ["앞 절이 리버브를 어디에 어떻게 걸지였다면 이 절은 <b>창 안의 노브</b>다. ChromaVerb를 열면 노브가 여럿인데, 하는 일을 알면 프리셋을 넘기지 않고 직접 만들 수 있다.", "<b>Size</b>는 공간의 크기다. 키우면 벽까지의 거리가 멀어져 반사가 늦게 돌아오고 잔향이 넓게 퍼진다. 작게 하면 좁은 방이 되어 반사가 촘촘하고 빠르다. 노래방 같은 작은 방과 성당의 차이가 이것이다. Size를 바꾸면 <b>디케이도 함께 변하는 느낌</b>이 드는데, 실제로 큰 공간일수록 소리가 오래 남기 때문이다.", "<b>Decay</b>는 잔향이 사라지기까지의 시간이다. 앞 절에서 본 값 그대로 룸과 플레이트는 <v>0.8~1.5</v>초, 홀은 <v>2.5~4</v>초다. Size가 공간의 넓이라면 Decay는 그 공간이 소리를 얼마나 오래 머금는지다. 같은 크기라도 벽이 딱딱하면 오래 남고 커튼이 있으면 금방 사라진다.", "<b>Density</b>는 반사의 촘촘함이다. 높이면 반사가 빽빽하게 채워져 매끄러운 잔향이 되고, 낮추면 반사 하나하나가 띄엄띄엄 들려 거칠고 금속적인 느낌이 난다. 대개 높게 두지만, 일부러 낮춰 옛 디지털 리버브의 질감을 내기도 한다.", "<b>Damping</b>은 감쇠다. 실제 공간에서 고역은 벽과 공기에 먼저 흡수되어 저역보다 빨리 사라진다. 이 노브를 올리면 고역 잔향이 짧아져 따뜻하고 자연스러워진다. 내리면 고역이 오래 남아 밝고 인공적이다. 앞에서 리버브 버스에 로우패스를 걸라고 한 것과 목적이 비슷한데, 이쪽은 <b>시간에 따라</b> 깎는다는 점이 다르다.", "<b>Mix</b> 또는 Dry/Wet은 원음과 잔향의 비율이다. 원음이 드라이, 잔향이 웻이다. <b>센드로 쓸 때는 반드시 <v>100</v>퍼센트 웻</b>으로 둔다. 원음은 이미 자기 트랙에서 나오고 있으므로 버스에서 또 섞으면 두 번 들린다. 인서트로 직접 걸 때만 이 값으로 비율을 정한다.", "여기에 앞 절에서 본 <b>프리 딜레이</b>와 <b>초기 반사</b>, 깊이 절에서 본 <b>Distance</b>가 더해진다. ChromaVerb에는 공간 모양을 고르는 목록도 있는데, Room과 Hall 같은 이름이 붙은 것들이 반사 패턴을 통째로 바꾼다.", "리버브 종류도 갈린다. 크게 둘이다. <b>알고리즘 리버브</b>는 계산으로 잔향을 만든다. ChromaVerb와 PlatinumVerb가 이쪽이고, 노브로 공간을 자유롭게 바꿀 수 있으며 가볍다. <b>컨볼루션 리버브</b>는 실제 공간에서 잰 소리를 쓴다. Space Designer가 이쪽이다.", "컨볼루션의 재료를 <b>임펄스 응답</b>이라고 한다. 실제 홀에서 짧고 날카로운 소리를 내고 그 공간이 어떻게 되울리는지를 녹음한 것이다. 그 녹음을 원음에 적용하면 마치 그 공간에서 연주한 것처럼 들린다. 진짜 공간이라 사실적이지만, 잰 그대로라서 공간을 마음대로 바꾸기는 어렵고 계산 부담도 크다.", "고르는 기준은 간단하다. <b>곡에 어울리는 공간을 만들려면 알고리즘</b>, <b>특정 실제 공간이 필요하면 컨볼루션</b>이다. 대부분의 작업은 ChromaVerb로 충분하고, 교회나 특정 홀의 느낌이 곡의 핵심일 때 Space Designer를 연다.", "성격으로 부르는 이름도 있다. <b>룸</b>은 작은 방, <b>홀</b>은 큰 공연장, <b>플레이트</b>는 금속판을 울려 만들던 옛 장비를 흉내 낸 것으로 밝고 매끄러워 보컬과 스네어에 잘 맞는다. <b>스프링</b>은 용수철을 쓰던 기타 앰프의 리버브로 특유의 튕기는 소리가 난다. <b>체임버</b>는 실제 울림방에서 소리를 틀고 다시 녹음하던 방식이다.", "노브를 만질 때 순서가 있다. 먼저 <b>종류와 공간 모양</b>을 고르고, <b>Decay</b>로 길이를 잡고, <b>프리 딜레이</b>로 거리를 정하고, <b>Damping</b>으로 밝기를 다듬고, 마지막에 센드 양으로 섞는 정도를 정한다. 노브를 아무 데서나 돌리면 무엇이 무엇을 바꿨는지 알 수 없다."], "path": [{"n": "ChromaVerb 직접 만들기", "s": ["리버브 버스에 <b>ChromaVerb</b>", "공간 모양 목록에서 <b>Hall</b> 또는 <b>Room</b> 선택", "<b>Decay</b> 룸 <v>1.2</v>초 · 홀 <v>3</v>초", "<b>Pre-Delay</b> <v>25</v>ms", "<b>Damping</b>을 올려 고역 잔향을 줄임", "<b>Mix</b>를 <v>100</v>퍼센트로 (센드이므로)"]}, {"n": "노브 하나씩 확인", "s": ["<b>Size</b>만 최소와 최대로 바꿔 듣기", "<b>Density</b>를 낮춰 거칠어지는지 확인", "<b>Damping</b>을 0과 최대로 비교", "각각 무엇이 바뀌는지 적어 둔다"]}, {"n": "Space Designer 쓰기", "s": ["특정 실제 공간이 필요할 때만", "리버브 버스에 <b>Space Designer</b>", "프리셋 목록에서 공간 고르기", "<b>Length</b>로 길이 조정. 크게 줄이면 부자연스러워진다"]}], "drill": ["ChromaVerb의 노브를 하나씩만 바꿔 가며 무엇이 변하는지 적는다.", "같은 보컬에 ChromaVerb와 Space Designer를 걸어 비교한다.", "Mix를 100이 아닌 값으로 둔 센드 버스를 들어 무엇이 이상한지 확인한다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["Size와 Decay의 차이를 안다", "센드에서는 Mix를 100으로 둔다", "알고리즘과 컨볼루션을 구분해 고른다"], "quiz": [{"q": "센드 버스의 리버브 Mix를 50으로 두면?", "a": ["원음이 두 번 들린다", "문제없다", "잔향이 짧아진다", "자연스럽다"], "c": 0, "e": "원음은 이미 자기 트랙에서 나오고 있다. 센드에서는 100퍼센트 웻."}, {"q": "Damping을 올리면?", "a": ["밀도가 는다", "저역이 준다", "잔향이 길어진다", "고역 잔향이 짧아져 따뜻해진다"], "c": 3, "e": "실제 공간에서 고역이 먼저 흡수되는 것을 흉내 낸다."}, {"q": "특정 교회의 울림이 곡의 핵심이라면?", "a": ["ChromaVerb", "PlatinumVerb", "딜레이", "Space Designer"], "c": 3, "e": "컨볼루션은 실제 공간에서 잰 임펄스 응답을 쓴다."}, {"q": "Density를 낮추면?", "a": ["밝아진다", "잔향이 매끄러워진다", "길어진다", "반사가 띄엄띄엄 들려 거칠어진다"], "c": 3, "e": "대개 높게 두지만 일부러 낮춰 옛 디지털 질감을 내기도 한다."}], "s": 12, "d": 92}, {"t": "딜레이와 에코", "goal": "반복 간격으로 두께와 공간을 구분하고 템포에 맞춰 시간을 정한다.", "con": ["딜레이와 에코는 다른 장치가 아니다. 에코는 반복이 또렷하게 떨어져 들리는 딜레이를 부르는 말이다. 갈리는 것은 반복 간격 하나다. <v>30</v>ms 아래는 원음과 한 덩어리로 들려 소리가 두꺼워지고, <v>30~100</v>ms는 두께와 넓이가 되고, <v>100</v>ms를 넘어서면 별개의 반복으로 들리기 시작해 에코가 된다. 이 경계는 선행음 효과에서 배운 값과 같다. 딜레이는 곡의 템포에 맞춘다. 점8분음표 딜레이가 넓은 느낌을 만들고, 4분음표 딜레이는 리듬을 강조한다. 피드백은 <v>15~30</v>퍼센트가 무난하다.", "실전 시작값. 두께와 그루브용 짧은 딜레이는 시간 <v>80~140</v>ms, 피드백 <v>25~35</v>퍼센트, 믹스 <v>20~30</v>퍼센트. 또렷한 반복으로 공간을 만드는 에코는 시간 <v>250</v>ms 이상, 피드백 <v>40~50</v>퍼센트, 믹스 <v>15~25</v>퍼센트. 피드백은 반복이 몇 번 이어지는지를 정하는 값이라 높을수록 꼬리가 길어지고, 70퍼센트를 넘기면 소리가 스스로 쌓여 무한히 늘어난다.", "딜레이 시간을 곡에 맞추는 계산이 있다. 4분음표 한 개는 <v>60000</v>을 BPM으로 나눈 값이다. <v>120</v>BPM이면 <v>500</v>ms다. 여기서 8분음표는 절반인 <v>250</v>ms, 16분음표는 <v>125</v>ms, 점8분음표는 8분음표의 <v>1.5</v>배인 <v>375</v>ms다.", "점8분음표가 넓게 들리는 이유가 여기 있다. 반복이 8분음표 격자와도 4분음표 격자와도 어긋난 자리에 떨어져서, 원래 리듬과 겹치지 않고 사이를 메운다. 4분음표 딜레이는 반대로 박 위에 정확히 떨어져 리듬을 두껍게 한다. 넓히려면 점8분, 강조하려면 4분이다.", "딜레이 버스에도 EQ를 건다. 하이패스 <v>300</v>Hz와 로우패스 <v>6</v>kHz를 걸면 반복이 원음보다 어두워져 뒤로 물러난다. 원음과 같은 밝기로 반복되면 두 소리가 경쟁해서 산만해진다."], "path": [{"n": "템포 동기 딜레이", "s": ["센드 버스를 하나 더 만들고 <b>Delay Designer</b> 또는 <b>Stereo Delay</b> 추가", "<b>Sync</b> 버튼을 켜고 음표 단위 선택", "넓히려면 <b>점8분음표</b>, 리듬을 강조하려면 <b>4분음표</b>", "<b>Feedback</b> <v>25~35</v>퍼센트, 버스 <b>Mix</b> <v>100</v>퍼센트", "트랙 센드 양으로 보내는 정도 조절"]}, {"n": "딜레이에 EQ 걸기", "s": ["딜레이 Aux 첫 슬롯에 <b>Channel EQ</b>", "하이패스 <v>300</v>Hz, 로우패스 <v>6</v>kHz", "반복이 원음보다 어두워져 뒤로 물러남"]}], "drill": ["같은 리드에 점8분음표 딜레이와 4분음표 딜레이를 걸어 폭과 리듬의 차이를 듣는다.", "피드백을 20, 40, 70퍼센트로 바꿔가며 꼬리 길이와 쌓임을 확인한다.", "동기를 끄고 계산한 값에서 몇 ms 어긋나게 두어 어느 쪽이 자연스러운지 판단한다."], "keys": [["X", "믹서"], ["S", "솔로"], ["A", "오토메이션"]], "chk": ["딜레이와 에코의 경계를 안다", "템포에서 딜레이 시간을 계산할 수 있다", "피드백으로 꼬리를 조절한다"], "quiz": [{"q": "원음의 명료도를 지키면서 잔향을 주는 설정은?", "a": ["믹스 100퍼센트", "디케이 10초", "프리 딜레이 0ms", "프리 딜레이 20~40ms"], "c": 3, "e": "프리 딜레이가 있으면 원음이 먼저 도달해 또렷하게 들린다."}, {"q": "딜레이가 에코로 들리기 시작하는 대략적인 경계는?", "a": ["1초", "10ms", "30ms", "100ms"], "c": 3, "e": "100ms를 넘어서면 반복이 원음과 분리되어 별개의 소리로 들린다. 그 아래는 두께와 넓이가 된다."}, {"q": "120BPM에서 점8분음표 딜레이는 몇 ms인가?", "a": ["125ms", "250ms", "375ms", "500ms"], "c": 2, "e": "4분음표 500ms의 절반이 8분음표 250ms이고, 그 1.5배가 375ms다."}], "s": 12, "d": 93}, {"t": "딜레이 노브와 종류", "goal": "딜레이 창의 노브가 각각 무엇을 바꾸는지 알고 종류를 골라 쓴다.", "con": ["앞 절에서 딜레이 시간을 곡에 맞추는 법을 봤다. 이 절은 창 안의 나머지 노브다. 딜레이는 노브가 몇 개 안 되는데 그 몇 개가 소리를 완전히 바꾼다.", "<b>딜레이 타임</b>은 원음 뒤 얼마나 있다가 반복이 나올지다. 앞 절의 <v>60000</v> 나누기 BPM 계산이 이 값을 정하는 것이다. 음표 단위로 고르는 <b>Sync</b> 버튼이 있으면 켜 두는 편이 낫다. 템포가 바뀌어도 알아서 따라온다.", "<b>피드백</b>은 반복이 몇 번이나 이어질지다. 나온 소리를 다시 입력으로 되돌려 보내는 양이라서 이름이 되먹임이다. <v>0</v>이면 한 번만 울리고 끝나고, 올릴수록 반복이 길게 이어진다. <v>20~30</v>퍼센트면 두세 번 들리고 <v>60</v>퍼센트를 넘으면 한참 남는다. <v>100</v>에 가까우면 줄지 않고 계속 쌓여 발진한다.", "<b>Mix</b> 또는 Dry/Wet은 원음과 반복의 비율이다. 리버브와 마찬가지로 <b>센드로 쓸 때는 <v>100</v>퍼센트 웻</b>이다. 인서트로 직접 걸 때만 이 값으로 정한다.", "<b>딜레이 안의 필터</b>가 생각보다 중요하다. 실제 공간에서 소리가 되돌아올 때마다 고역이 조금씩 깎인다. 그래서 반복마다 어두워져야 자연스럽다. Stereo Delay에는 <b>Low Cut</b>과 <b>High Cut</b>이 있는데, 하이컷을 <v>4~8</v>kHz로 두면 반복이 뒤로 물러나 원음을 안 가린다. 로우컷을 <v>200</v>Hz로 두면 저역이 뭉치지 않는다. 리버브 버스에 EQ를 걸라고 한 것과 같은 이유다.", "종류도 몇 가지로 갈린다. <b>슬랩백</b>은 <v>60~120</v>ms의 짧은 딜레이를 피드백 없이 한 번만 거는 것이다. 반복으로 들리지 않고 소리가 두꺼워진 느낌만 난다. 로커빌리 보컬과 기타의 특징이고, 지금도 목소리에 살짝 걸면 앞으로 나온다.", "<b>핑퐁</b>은 반복이 좌우를 번갈아 오간다. 왼쪽에서 한 번, 오른쪽에서 한 번, 다시 왼쪽에서 점점 작아지며 오간다. 공간이 넓어 보이고 원음의 가운데 자리를 안 뺏는다. Stereo Delay에서 좌우 딜레이 타임을 다르게 주고 크로스 피드백을 켜면 된다.", "<b>멀티탭</b>은 반복 지점을 여러 개 직접 찍는 것이다. Delay Designer가 이것이고, 탭마다 시간과 음량과 팬과 필터를 따로 정한다. 규칙적인 반복이 아니라 리듬 패턴 자체를 만들 수 있다. 다만 복잡해서 대부분의 작업에는 Stereo Delay면 충분하다.", "<b>테이프 딜레이</b>는 옛 장비를 흉내 낸 것이다. 자기 테이프가 돌면서 반복을 만들던 시절의 소리라 반복마다 음질이 조금씩 나빠지고 미세하게 흔들린다. Tape Delay가 이것이고, 깨끗한 반복보다 따뜻하고 거친 느낌이 필요할 때 쓴다.", "쓸 때 순서가 있다. 먼저 <b>딜레이 타임</b>을 곡에 맞추고, <b>피드백</b>으로 몇 번 반복할지 정하고, <b>필터</b>로 반복을 뒤로 물리고, 마지막에 센드 양으로 섞는 정도를 정한다. 원음과 반복이 똑같이 밝으면 무엇이 원음인지 헷갈린다."], "path": [{"n": "기본 딜레이 세팅", "s": ["딜레이 버스에 <b>Stereo Delay</b>", "<b>Sync</b> 켜고 <v>1/8</v> 점음표 또는 <v>1/4</v>", "<b>Feedback</b> <v>25</v>퍼센트", "<b>High Cut</b> <v>6</v>kHz · <b>Low Cut</b> <v>200</v>Hz", "<b>Mix</b> <v>100</v>퍼센트 (센드이므로)"]}, {"n": "슬랩백", "s": ["트랙에 <b>Stereo Delay</b> 직접 삽입", "Sync 끄고 딜레이 타임 <v>80</v>ms", "<b>Feedback</b> <v>0</v>", "<b>Mix</b> <v>20~30</v>퍼센트"]}, {"n": "핑퐁", "s": ["<b>Stereo Delay</b>에서 좌우 타임을 다르게", "왼쪽 <v>1/8</v> · 오른쪽 <v>1/4</v>", "<b>Crossfeed</b>를 올려 좌우가 오가게", "가운데가 비는지 확인"]}], "drill": ["같은 딜레이에 피드백 0·25·60퍼센트로 두고 반복 수를 비교한다.", "하이컷을 끄고 켜고 반복이 원음을 가리는지 확인한다.", "보컬에 슬랩백을 걸어 앞으로 나오는지 듣는다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["피드백이 반복 횟수임을 안다", "딜레이에 필터를 건다", "슬랩백과 핑퐁을 구분한다"], "quiz": [{"q": "딜레이 반복이 몇 번 이어질지 정하는 것은?", "a": ["필터", "딜레이 타임", "피드백", "Mix"], "c": 2, "e": "나온 소리를 다시 입력으로 되돌려 보내는 양이라 되먹임이라 부른다."}, {"q": "딜레이 반복에 하이컷을 거는 이유는?", "a": ["피드백을 막으려고", "실제로 반사될 때마다 고역이 깎이므로 자연스럽게", "음량을 줄이려고", "CPU 때문"], "c": 1, "e": "반복이 뒤로 물러나 원음을 안 가린다."}, {"q": "60~120ms를 피드백 없이 한 번만 거는 것은?", "a": ["핑퐁", "슬랩백", "테이프", "멀티탭"], "c": 1, "e": "반복으로 들리지 않고 소리가 두꺼워진 느낌만 난다."}], "s": 12, "d": 94}, {"d": 95, "s": 13, "t": "위상과 스테레오 이미지", "goal": "위상을 점검하고 모노 호환성을 확보한다.", "con": ["두 신호가 합쳐질 때 파형이 서로 반대면 상쇄된다. 이것이 위상 문제다. 스테레오로 들을 때는 넓고 좋았는데 모노로 합치면 소리가 사라지는 일이 여기서 생긴다.", "모노는 여전히 쓰인다. 휴대폰 스피커, 카페 천장 스피커, 클럽 시스템이 모노에 가깝게 재생한다. 스테레오에서만 좋은 믹스는 절반의 상황에서 무너진다.", "코렐레이션 미터로 확인한다. <v>+1</v>이면 좌우가 같아 완전한 모노, <v>0</v>이면 넓게 퍼진 상태, <v>-1</v>이면 완전히 반대라 모노에서 사라진다. 대부분의 시간을 <v>0</v>에서 <v>+1</v> 사이에 두고, 순간적으로 <v>0</v> 아래로 내려가는 정도는 괜찮다.", "저역은 가운데 두는 것이 원칙이다. 이유는 두 가지다. 저역은 파장이 수 미터로 길어 좌우가 조금만 어긋나도 상쇄의 골이 깊고, 귀는 대략 100Hz 아래의 방향을 구분하지 못해 넓혀도 얻는 것이 없다. 킥과 베이스를 넓히면 재생 환경마다 다르게 들리고 마스터링에서 문제가 된다. <v>120</v>Hz 아래를 모노로 만드는 처리를 흔히 쓴다.", "넓히는 방법 중 안전한 것은 실제로 두 번 연주해 좌우에 두는 더블링이다. 사람이 두 번 연주하면 타이밍과 음정이 미세하게 달라서 위상이 규칙적으로 어긋나지 않는다. 그래서 모노로 합쳐도 상쇄가 생기지 않는다.", "좌우로 나누는 것 말고 다른 나눔이 있다. 미드사이드다. 좌우 신호를 더하면 양쪽에 공통으로 있는 소리, 즉 가운데가 나오고, 빼면 한쪽에만 있는 소리, 즉 좌우로 벌어진 부분이 나온다. 이 둘을 따로 처리한 뒤 다시 합치는 방식이다. 로직에서는 한 플러그인의 스위치로 오가는 것이 아니라, Channel EQ를 두 개 걸고 하나는 Mid, 다른 하나는 Side로 지정해서 쓴다. 전체에 걸 EQ가 따로 필요하면 스테레오로 둔 세 번째를 더해도 된다.", "쓸모가 분명한 경우가 셋이다. 저역만 가운데로 모으고 싶을 때는 사이드의 <v>120</v>Hz 아래를 깎는다. 이러면 위쪽 폭은 그대로 두고 저역만 단단해진다. 좌우만 밝게 하고 싶을 때는 사이드의 고역을 올린다. 가운데 보컬은 건드리지 않고 배경만 열린다. 반대로 보컬만 손보고 싶으면 미드에 처리를 건다.", "주의할 것은 사이드를 키우면 모노에서 그만큼 잃는다는 점이다. 사이드 성분은 모노로 합칠 때 상쇄되는 부분이라, 폭을 키울수록 모노 재생에서 곡이 얇아진다. 만진 뒤에는 반드시 모노로 확인한다.", "마이크를 여러 개 세워 녹음했다면 위상 정렬이 먼저다. 파형을 확대해 첫 타격 지점을 맞추거나 한쪽 극성을 뒤집어 저역이 가장 두꺼워지는 쪽을 고른다.", "Mid Only로 들으면 양쪽에 똑같이 들어 있는 소리만 들린다. 리드 보컬, 베이스, 기타 같은 가운데 요소다. Side Only로 들으면 좌우가 서로 다른 부분만 들린다. 리버브와 백보컬이 여기 해당한다. 무엇이 어느 쪽에 있는지 귀로 확인한 뒤 손대는 것이 안전하다."], "path": [{"n": "모노 점검", "s": ["<b>Stereo Out</b> 이펙트 슬롯 → <b>Metering → Correlation Meter</b>", "다른 슬롯에 <b>Gain</b> 추가 → <b>Mono</b> 버튼으로 합쳐 듣기", "사라지는 악기가 있는지 확인"]}, {"n": "폭 조절", "s": ["채널 → <b>Imaging → Direction Mixer</b>", "<b>Spread</b> 값으로 폭 조절", "저역 모노: <b>Imaging → Stereo Spread</b> 또는 EQ로 저역 분리 후 처리"]}, {"n": "극성 뒤집기", "s": ["채널 → <b>Gain</b> 플러그인", "<b>Phase Invert</b> 버튼(∅) 클릭", "저역이 두꺼워지는 쪽으로 선택"]}, {"n": "미드사이드 EQ", "s": ["채널에 <b>Channel EQ</b>를 <b>두 개</b> 삽입", "첫 번째의 <b>프로세싱</b> 메뉴를 <b>Mid Only</b>로, 두 번째를 <b>Side Only</b>로", "Side 쪽 인스턴스에서 <v>120</v>Hz 하이패스 → 저역이 가운데로 모임", "Mid 쪽 인스턴스에서 보컬 등 가운데 요소를 조정", "<b>Gain</b> 플러그인의 모노 버튼으로 확인"]}], "drill": ["완성 믹스를 모노로 합쳐 듣고 사라지거나 약해지는 악기를 찾는다.", "코렐레이션 미터를 보며 곡 전체에서 -1에 가까워지는 구간이 있는지 확인한다.", "드럼 오버헤드와 스네어 마이크의 극성을 뒤집어 보고 저역 차이를 듣는다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["코렐레이션 값을 읽을 수 있다", "저역을 가운데 둔다", "모노 점검을 습관화했다", "미드사이드의 원리와 위험을 안다", "Mid Only와 Side Only로 나눠 들을 수 있다"], "quiz": [{"q": "코렐레이션 미터가 -1을 가리키면?", "a": ["음량이 최대", "적당히 넓음", "모노에서 상쇄됨", "완전한 모노"], "c": 2, "e": "좌우가 완전히 반대 위상이라 합치면 사라진다."}, {"q": "미드사이드에서 사이드를 키우면 생기는 일은?", "a": ["음정이 바뀐다", "저역이 단단해진다", "템포가 빨라진다", "모노에서 그만큼 잃는다"], "c": 3, "e": "사이드 성분은 모노로 합칠 때 상쇄되는 부분이다. 폭을 키울수록 모노에서 얇아진다."}]}, {"t": "미드사이드와 스테레오 이미징", "goal": "가운데와 양옆을 따로 다뤄 폭과 초점을 조절한다.", "con": ["스테레오 신호는 보통 왼쪽과 오른쪽 둘로 되어 있다. 그런데 다르게 볼 수도 있다. 양쪽에 <b>공통으로 들어 있는 소리</b>와 <b>한쪽에만 있는 소리</b>로 나누는 것이다. 앞을 미드, 뒤를 사이드라고 한다.", "미드에는 가운데에 놓인 것들이 모인다. 킥, 베이스, 스네어, 리드 보컬이다. 사이드에는 좌우로 벌린 것들이 모인다. 넓은 패드, 좌우로 나눈 기타, 리버브의 양옆 성분이다. <b>좌우로 나누면 악기가 섞여 있지만, 미드사이드로 나누면 역할별로 갈린다.</b> 이것이 이 방식의 쓸모다.", "쓰는 자리는 주로 마스터다. 예를 들어 저역은 가운데에 모여야 단단한데 스테레오 소스 때문에 옆으로 퍼져 있다면, <b>사이드의 저역만</b> 깎으면 된다. 좌우로 나눠서는 할 수 없는 일이다.", "반대로 <b>사이드의 고역만</b> 조금 올리면 곡이 넓어지는데 가운데 초점은 그대로 남는다. 전체를 넓히면 보컬까지 퍼져 흐려지지만, 사이드만 만지면 그런 일이 없다.", "로직에서 하는 방법은 <b>Channel EQ 두 개</b>를 쓰는 것이다. 첫 번째를 <b>Mid</b> 모드로, 두 번째를 <b>Side</b> 모드로 두면 각각 미드와 사이드만 처리한다. 플러그인 창 상단에서 모드를 고른다. 세 번째를 일반 스테레오로 두면 전체에 공통으로 걸 수도 있다.", "<b>Direction Mixer</b>는 폭 자체를 바꾼다. <b>Spread</b>가 <v>1.0</v>이 원래이고, 내리면 좁아져 모노에 가까워지고 올리면 넓어진다. 깊이 절에서 뒤로 보낼 때 <v>0.5~0.7</v>로 줄이라고 한 것이 이것이다. 마스터에서 <v>1.1~1.2</v> 정도로 살짝 올리면 곡이 넓어지지만, 넘기면 가운데가 비고 모노에서 소리가 사라진다.", "이 플러그인에는 <b>Direction</b> 노브도 있는데 스테레오 이미지 전체를 좌우로 기울인다. 녹음이 한쪽으로 치우쳤을 때 바로잡는 데 쓴다.", "<b>Stereo Spread</b>는 다른 방식이다. 주파수 대역별로 나눠 높은 대역일수록 더 넓게 벌린다. 저역은 가운데에 남고 고역만 퍼지므로 저역이 흐트러지지 않는다. 마스터에서 넓히고 싶을 때 Direction Mixer보다 안전하다.", "무엇을 하든 <b>모노 확인이 필수</b>다. 넓히는 처리는 전부 위상을 건드리므로, 모노로 합쳤을 때 소리가 사라지거나 작아질 수 있다. 앞의 위상 절에서 본 그대로다. 마스터에 <b>Correlation Meter</b>를 걸고 값이 <v>0</v> 아래로 자주 내려가면 넓힌 것을 되돌린다.", "과하게 넓히는 것은 초보가 가장 흔히 저지르는 실수다. 헤드폰으로는 시원하게 들리지만 스피커 하나로 나오는 곳에서는 소리가 빠진다. <b>넓히기 전에 좁혀 보는 것</b>이 더 도움이 될 때도 많다. 가운데가 단단하면 곡이 오히려 커 보인다."], "path": [{"n": "미드사이드 EQ", "s": ["<b>Stereo Out</b>에 <b>Channel EQ</b> 두 개", "첫 번째 창 상단을 <b>Mid</b>로", "두 번째를 <b>Side</b>로", "Side에서 <v>120</v>Hz 아래를 하이패스", "Side에서 <v>10</v>kHz를 <v>+1</v>dB 셸프"]}, {"n": "폭 조절", "s": ["<b>Imaging → Direction Mixer</b>", "<b>Spread</b> <v>1.1</v>로 살짝 넓힘", "또는 <b>Stereo Spread</b>로 대역별 확장", "저역이 흐트러지지 않는지 확인"]}, {"n": "모노 확인", "s": ["<b>Correlation Meter</b>를 마스터에", "값이 <v>0</v> 아래로 자주 가는지 본다", "<b>Gain</b>의 모노 버튼으로 합쳐 듣기", "사라지는 악기가 있으면 넓힌 것을 되돌림"]}], "drill": ["같은 곡에 Side EQ로 고역만 올려 보고 전체를 올린 것과 비교한다.", "Spread를 1.0과 1.3으로 두고 모노로 합쳐 차이를 확인한다.", "폭을 넓히는 대신 좁혀 보고 어느 쪽이 곡에 맞는지 판단한다."], "keys": [["X", "믹서"], ["S", "솔로"]], "chk": ["미드와 사이드가 무엇인지 안다", "넓힌 뒤 모노로 확인한다", "좁히는 선택지도 고려한다"], "quiz": [{"q": "저역이 옆으로 퍼져 단단하지 않다면?", "a": ["폭을 넓힌다", "미드를 올린다", "전체 저역을 깎는다", "사이드의 저역만 깎는다"], "c": 3, "e": "좌우로 나눠서는 할 수 없는 일이다. 미드사이드로 나누면 역할별로 갈린다."}, {"q": "로직에서 미드사이드 EQ를 하려면?", "a": ["전용 플러그인", "불가능", "Direction Mixer", "Channel EQ 두 개를 Mid와 Side 모드로"], "c": 3, "e": "플러그인 창 상단에서 모드를 고른다."}, {"q": "폭을 넓힌 뒤 반드시 할 것은?", "a": ["컴프", "모노로 합쳐 사라지는 악기가 없는지 확인", "음량 확인", "EQ"], "c": 1, "e": "넓히는 처리는 전부 위상을 건드린다. Correlation Meter로도 본다."}], "s": 13, "d": 96}, {"t": "위상으로 폭과 움직임 만들기", "goal": "간섭을 통제해 폭을 넓히고 움직임을 만든다.", "con": ["여기까지가 위상을 피하는 이야기였다. 위상을 일부러 만들어 쓰는 방법도 있다. 원리를 먼저 본다. 같은 소리를 두 개 겹치는데 한쪽을 아주 조금 늦추면, 어떤 높이의 음은 두 파형의 마루가 겹쳐 커지고 어떤 높이는 마루와 골이 만나 작아진다. 이렇게 높이마다 커지고 작아지는 것이 간섭이다. 문제로 나타나면 소리가 사라지고, 통제하면 폭이나 움직임이 된다.", "간섭이 만드는 무늬에는 이름이 있다. 늦춘 시간이 일정하면 커지는 대역과 작아지는 대역이 주파수축에서 규칙적으로 번갈아 나타난다. 그래프로 그리면 빗살처럼 촘촘한 골이 반복되어서 빗살 무늬 간섭이라고 부른다. 소리로는 좁은 관을 통과한 듯 속이 빈 느낌이 난다. 얇은 종이컵에 대고 말할 때 나는 그 소리가 이것이다.", "가장 단순한 것이 한쪽을 늦추는 방법이다. 왼쪽은 그대로 두고 오른쪽만 <v>10~30</v>ms 늦춘다. 이 정도 차이는 두 소리로 들리지 않는다. 대신 소리가 왼쪽에서 오는 것처럼 들리면서 전체 폭이 크게 열린다. 사람은 먼저 도착한 쪽을 소리의 방향으로 판단하기 때문이다. 실제 음량은 그대로인데 자리만 옮겨 가는 셈이다. 이것을 하스 효과라고 부른다.", "위험도 여기서 나온다. 스테레오로 들을 때는 두 귀가 따로 받아서 폭으로 느끼지만, 모노로 합치면 두 신호가 한 자리에서 더해진다. 그 순간 앞에서 본 빗살 무늬가 생겨 소리가 속 빈 느낌으로 바뀐다. 그래서 쓴다면 반드시 모노로 확인하고, 킥이나 리드 보컬처럼 곡의 뼈대가 되는 소리에는 걸지 않는다.", "더 안전한 방법이 음정을 아주 조금 어긋나게 하는 것이다. 반음을 100등분한 단위를 센트라고 한다. <v>100</v>센트가 반음이므로 <v>7</v>센트는 반음의 <v>14</v>분의 <v>1</v> 정도라 음정이 틀렸다고 느끼지 못하는 폭이다.", "복사본 하나를 <v>+7</v>센트 올려 왼쪽에, 다른 하나를 <v>-7</v>센트 내려 오른쪽에 둔다. 두 소리의 높이가 미세하게 다르므로 파형이 맞았다 어긋났다를 천천히 반복한다. 지연 방식은 어긋난 정도가 고정이라 빗살 무늬가 한 자리에 박히지만, 이쪽은 계속 움직여서 무늬가 한 곳에 머물지 않는다. 그래서 모노로 합쳐도 특정 대역이 파이지 않는다. 여러 사람이 같은 선율을 부를 때 두꺼워지는 것과 같은 이치다.", "만드는 방법은 두 가지다. 복사한 트랙 두 개에 <b>Pitch Shifter</b>를 걸고 각각 <b>Cents</b>를 <v>+7</v>과 <v>-7</v>로 두거나, 한 트랙에 <b>Modulation Delay</b>를 걸고 좌우를 알아서 어긋나게 하는 것이다.", "코러스와 플랜저와 페이저는 이 어긋남을 자동으로 계속 움직이게 만든 장치다. 셋 다 복사본을 어긋나게 하는데, 어긋나는 양이 다르면 완전히 다른 소리가 난다.", "코러스는 <v>20~30</v>ms 근처에서 흔든다. 이 정도면 사람이 여럿 모여 같은 것을 연주할 때처럼 들린다. 한 대의 기타가 두세 대로 늘어난 느낌이고, 소리가 두꺼워지면서 좌우로도 퍼진다.", "플랜저는 <v>1~10</v>ms의 아주 짧은 지연을 흔든다. 지연이 짧으면 빗살 무늬의 골 간격이 넓어지는데, 이 골이 지연 시간을 따라 위아래로 훑고 지나간다. 그래서 비행기가 머리 위를 지나가는 듯한 쏴아 하는 소리가 난다. 티가 확실히 나는 효과라 구간을 표시할 때 쓴다.", "페이저는 지연을 쓰지 않는다. 대신 특정 높이 구간의 위상만 돌려서 몇 군데에만 골을 만들고 그 골을 움직인다. 플랜저보다 골이 적어서 훑는 느낌이 부드럽고, 물결이 지나가는 것처럼 들린다. 일렉트릭 피아노와 기타에 오래 쓰여 왔다.", "고르는 기준은 무엇을 얻고 싶은가다. 두께가 필요하면 코러스, 눈에 띄는 움직임이 필요하면 플랜저나 페이저, 티 안 나는 폭이 필요하면 미세 음정 차이다. 셋 다 모노 호환이 지연 방식보다 낫지만 완전하지는 않으므로 확인은 한다.", "반대 방향으로도 쓴다. 킥과 베이스가 저역에서 부딪힐 때, 둘 중 하나의 위상을 조금 돌려 파형이 겹치는 지점을 비끼면 합쳐진 저역이 커진다. 극성을 통째로 뒤집는 것과 다른 처리다. 로직에서는 <b>Utility → Sample Delay</b>로 한쪽을 샘플 단위로 미세하게 늦춰서 한다. <v>0</v>에서 <v>200</v>샘플 사이를 천천히 움직이며 저역 미터가 가장 커지는 지점을 찾는다. 48kHz에서 <v>48</v>샘플이 <v>1</v>ms이고 <v>60</v>Hz 한 파장이 약 <v>17</v>ms이므로, <v>200</v>샘플이면 파장의 4분의 1까지 훑을 수 있다. 그 안에 최대점이 있다."], "path": [{"n": "미세 음정 차이로 넓히기", "s": ["트랙을 두 번 복제해 좌우 <v>L60</v>, <v>R60</v>에 배치", "각 복사본에 <b>Pitch → Pitch Shifter</b>", "한쪽 <b>Cents</b>를 <v>+7</v>, 다른 쪽을 <v>-7</v>", "복사본 음량을 원본보다 <v>-6</v>dB 아래로", "모노로 합쳐 대역이 깎이지 않는지 확인"]}, {"n": "코러스와 플랜저 비교", "s": ["같은 신스 트랙을 두 개 복제", "하나에 <b>Modulation → Chorus</b>, 다른 하나에 <b>Modulation → Flanger</b>", "둘 다 <b>Mix</b>를 <v>30</v>퍼센트 정도로", "번갈아 들으며 두꺼워지는 쪽과 훑고 지나가는 쪽을 구분", "모노로 합쳐 각각 얼마나 버티는지 확인"]}], "drill": ["같은 기타를 한쪽 20ms 지연과 좌우 ±7센트 두 방식으로 넓히고, 모노로 합쳐 어느 쪽이 버티는지 비교한다.", "코러스와 플랜저를 같은 신스에 걸어 지연 시간 차이가 만드는 인상 차이를 듣는다.", "페이저를 일렉트릭 피아노에 걸고 속도를 바꿔가며 물결이 지나가는 느낌을 확인한다."], "keys": [["X", "믹서"], ["S", "솔로"], ["⌘D", "복제"], ["A", "오토메이션"]], "chk": ["간섭이 무엇인지 설명할 수 있다", "하스와 미세 음정의 차이를 안다", "코러스·플랜저·페이저를 소리로 구분한다"], "quiz": [{"q": "한쪽을 20ms 늦춰 넓혔을 때 모노에서 생기는 문제는?", "a": ["템포가 어긋난다", "빗살 무늬 간섭으로 특정 대역이 깎인다", "음정이 바뀐다", "음량이 커진다"], "c": 1, "e": "지연이 고정되어 있어 모노에서 빗살 무늬가 한 자리에 박힌다. 속이 빈 소리가 된다."}, {"q": "모노에서 안전하게 폭을 넓히는 방법은?", "a": ["한쪽을 30ms 지연", "좌우를 ±5~10센트 어긋나게", "사이드를 크게 키움", "극성 반전"], "c": 1, "e": "음정 차이는 어긋난 정도가 계속 움직여서 빗살 무늬가 한 곳에 머물지 않는다."}, {"q": "플랜저와 코러스의 차이는?", "a": ["플랜저가 더 크다", "플랜저는 모노용", "지연 시간이 다르다. 플랜저는 1~10ms, 코러스는 20~30ms", "코러스는 위상을 안 쓴다"], "c": 2, "e": "어긋나는 양이 다르면 다른 소리가 난다. 짧으면 훑고 지나가는 소리, 길면 여럿이 연주하는 소리다."}], "s": 13, "d": 97}, {"t": "목소리를 바꾸는 효과", "goal": "보컬에 성격을 입히는 효과들의 원리와 결과를 알고 곡에 맞게 고른다.", "con": ["앞에서 다룬 보컬 처리는 있는 소리를 다듬는 일이었다. 여기서는 목소리를 다른 것으로 바꾼다. 곡 전체에 거는 경우는 드물고, 한 구간이나 한 층에만 걸어 대비를 만드는 데 쓴다.", "음정과 음색을 따로 움직일 수 있다는 것이 출발점이다. 목소리에는 두 가지 정보가 들어 있다. 성대가 떨리는 빠르기가 음정이고, 목과 입이 만드는 공명의 모양이 포먼트다. 이 둘은 보통 함께 움직인다. 음정을 올리면 포먼트도 따라 올라가 어린아이 목소리처럼 들리는 것이 그래서다.", "둘을 따로 움직이면 결과가 달라진다. 음정은 그대로 두고 포먼트만 올리면 같은 음을 부르는데 체구가 작아진 느낌이 나고, 포먼트만 내리면 굵고 어두운 목소리가 된다. 반대로 음정만 올리고 포먼트를 고정하면 목소리의 성격은 유지한 채 음역만 바뀐다. 로직에서는 <b>Pitch Shifter</b>와 <b>Vocal Transformer</b>가 이 둘을 나눠 다룬다. 백보컬을 리드와 다른 사람이 부른 것처럼 만들 때 포먼트를 <v>±2</v> 정도만 움직인다.", "하모나이저는 부른 음정을 읽어 화음을 자동으로 만든다. 조와 스케일을 지정하면 그 안에서 3도 위나 아래를 붙인다. 직접 부른 하모니보다 얇고 균일해서 사람 목소리 겹의 두께는 안 나온다. 그래서 실제 하모니를 부를 수 없을 때의 대안이거나, 일부러 인공적인 느낌이 필요한 구간에 쓴다. 앞에서 본 하모니 편성과 함께 쓰면 사람이 부른 층 위에 얇은 층을 하나 더 얹는 셈이 된다.", "보코더는 원리가 다르다. 목소리의 발음 정보만 뽑아 다른 소리에 씌운다. 신스가 소리를 내고 목소리가 그 소리의 입 모양을 정하는 구조라, 결과는 말하는 신스가 된다. 로직의 <b>EVOC 20 PolySynth</b>가 이것이다. 목소리 트랙과 신스가 동시에 필요하고, 발음이 또렷할수록 알아듣기 쉽다. 자음이 약하면 웅얼거리는 소리만 나온다.", "대역을 좁히면 재생 장치가 바뀐 것처럼 들린다. <v>300</v>Hz 아래와 <v>3000</v>Hz 위를 잘라내면 전화기 소리가 된다. 라디오 느낌은 <v>200</v>Hz에서 <v>5</v>kHz 사이로 조금 넓게 잡는다. 여기에 약한 왜곡을 더하면 오래된 스피커에서 나오는 소리에 가까워진다. 인트로에서 이렇게 눌러 두었다가 코러스에서 필터를 풀면 소리가 터져 나오는 효과가 생긴다.", "질감을 낡게 만드는 방법도 있다. 새추레이션은 배음을 더해 두께와 거친 맛을 준다. 비트 리덕션은 디지털 해상도를 일부러 낮춰 자글자글한 잡음을 만든다. 로파이 계열에서 쓰는 처리이고, 앞에서 본 로파이 편성과 이어진다. 다만 이런 처리는 되돌릴 수 없으므로 원본을 남기고 복사본에 건다.", "공간계로도 성격을 바꾼다. 리버스 리버브는 잔향을 거꾸로 재생해 소리가 빨려 들어가는 느낌을 준다. 단어 하나 앞에 붙이면 그 단어가 어디선가 나타나는 것처럼 들린다. 만드는 방법은 해당 구간을 리버브만 남겨 바운스하고 리전을 리버스한 뒤 원래 단어 앞에 붙이는 것이다.", "고르는 기준은 하나다. 이 효과가 곡에서 무슨 일을 하는가. 구간을 대비시키는가, 인물을 만드는가, 질감을 통일하는가. 답이 안 나오면 안 쓰는 편이 낫다. 효과는 걸면 티가 나기 때문에, 이유 없이 걸린 것은 듣는 사람에게도 이유 없이 들린다.", "어디에 거느냐도 정해진다. 곡 전체를 바꾸는 것이 아니라면 인서트로 걸고 오토메이션으로 필요한 구간만 켠다. 또는 복사한 트랙에 효과를 걸어 두고 그 트랙의 음량을 오토메이션한다. 뒤쪽이 되돌리기 쉽고 원본과 섞는 비율도 조절된다."], "path": [{"n": "포먼트 바꾸기", "s": ["보컬 트랙 복사 → 복사본 이펙트 슬롯 → <b>Pitch → Vocal Transformer</b>", "<b>Pitch</b>는 <v>0</v>으로 두고 <b>Formant</b>만 <v>+2</v> 또는 <v>-2</v>", "원본과 섞어 들으며 다른 사람이 부른 느낌이 나는지 확인", "복사본 팬을 한쪽으로 벌리고 음량을 <v>-8</v>dB 아래로"]}, {"n": "전화기 소리", "s": ["구간을 복사한 트랙에 <b>Channel EQ</b>", "하이패스 <v>300</v>Hz, 로우패스 <v>3000</v>Hz, 둘 다 기울기를 급하게", "<b>Distortion</b>이나 <b>Bitcrusher</b>를 아주 약하게 추가", "<k>A</k> 오토메이션으로 그 구간만 켜지게"]}, {"n": "보코더 만들기", "s": ["새 소프트웨어 악기 트랙 → <b>EVOC 20 PolySynth</b>", "<b>Side Chain</b>에서 보컬 트랙을 소스로 지정", "악기 트랙에 코드를 미디로 입력", "보컬을 재생하며 코드가 말하는 소리로 바뀌는지 확인", "자음이 안 들리면 보컬에 하이셸프를 올려 또렷하게"]}, {"n": "리버스 리버브", "s": ["효과를 줄 단어 구간만 잘라 새 트랙으로 복사", "그 트랙에 리버브를 <b>Mix 100</b>퍼센트로 걸고 바운스", "만들어진 리전을 우클릭 → <b>리버스</b>", "원래 단어 <b>앞에</b> 붙이고 끝이 단어 시작과 맞물리게 정렬"]}], "drill": ["같은 백보컬을 포먼트 +2와 -2로 만들어 원본과 섞고 어느 쪽이 더 다른 사람처럼 들리는지 판단한다.", "벌스 첫 4마디를 전화기 소리로 만들고 코러스에서 풀어 대비를 확인한다.", "하모나이저로 만든 3도와 직접 부른 3도를 비교해 두께 차이를 적는다.", "리버스 리버브를 단어 하나 앞에 붙여 본다."], "keys": [["A", "오토메이션"], ["X", "믹서"], ["⌘D", "복제"], ["S", "솔로"]], "chk": ["음정과 포먼트를 따로 움직일 수 있다", "효과를 거는 이유를 말할 수 있다", "원본을 남기고 복사본에 건다"], "quiz": [{"q": "음정은 그대로 두고 포먼트만 올리면?", "a": ["음이 높아진다", "체구가 작아진 느낌이 난다", "소리가 커진다", "박자가 빨라진다"], "c": 1, "e": "포먼트는 목과 입이 만드는 공명의 모양이다. 음정과 따로 움직이면 목소리의 성격만 바뀐다."}, {"q": "전화기 소리를 만드는 대역은?", "a": ["20~200Hz", "300~3000Hz", "5~10kHz", "전 대역"], "c": 1, "e": "이 밖을 잘라내면 재생 장치가 바뀐 것처럼 들린다. 라디오는 200Hz~5kHz로 조금 넓게 잡는다."}, {"q": "보코더에서 자음이 약하면?", "a": ["템포가 어긋난다", "음정이 틀어진다", "웅얼거리는 소리만 나온다", "음량이 준다"], "c": 2, "e": "보코더는 목소리의 발음 정보로 신스의 입 모양을 정한다. 발음이 또렷할수록 알아듣기 쉽다."}, {"q": "효과를 걸지 말지 판단하는 기준은?", "a": ["이 효과가 곡에서 무슨 일을 하는지", "플러그인이 비싼지", "최신 유행인지", "다른 곡에 있는지"], "c": 0, "e": "이유 없이 걸린 것은 듣는 사람에게도 이유 없이 들린다."}], "d": 98, "s": 13}, {"t": "오토메이션", "goal": "시간에 따라 값을 움직여 곡을 살아 있게 만든다.", "con": ["오토메이션은 시간에 따라 값이 변하게 하는 기능이다. 벌스보다 코러스에서 기타를 <v>1.5</v>dB 올리는 정도의 미세한 조정이 곡을 살아 있게 만든다. 작아 보이지만 구간이 바뀌는 순간에는 확실히 느껴진다. 듣는 사람은 기타가 커졌다고 인식하지 않고 코러스가 열렸다고 느낀다. <v>3</v>dB를 넘기면 기타가 커진 것으로 들려서 의도가 드러난다.", "팬도 오토메이션 대상이다. 다만 곡 내내 움직이면 어지럽다. 쓸모 있는 경우는 정해져 있다. 같은 소리가 반복될 때 두 번째를 조금 다른 자리에 두면 반복이 지루하지 않고, 효과음이 한쪽에서 반대쪽으로 지나가면 구간이 바뀌는 신호가 된다. 리드 보컬과 킥과 베이스는 움직이지 않는다. 곡의 중심이 흔들린다.", "쓰는 방식은 두 가지다. 선을 직접 그리거나, 재생하면서 페이더를 움직여 기록하는 것이다. 기록 모드는 Touch, Latch, Write가 있고 보통 Touch를 쓴다.", "오토메이션 우선 대상은 음량, 팬, 센드 양, 필터 컷오프다."], "path": [{"n": "오토메이션 그리기", "s": ["<k>A</k> → 트랙에 오토메이션 표시", "트랙 헤더의 파라미터 메뉴에서 <b>Volume</b> 선택", "선 위를 클릭 → 포인트 생성", "포인트를 드래그해 값 조절"]}], "drill": ["코러스 구간에서 특정 트랙을 1.5dB 올리는 오토메이션을 그린다."], "keys": [["A", "오토메이션"], ["X", "믹서"]], "chk": ["오토메이션 기록 모드를 구분한다", "리드·킥·베이스의 팬은 움직이지 않는다"], "quiz": [{"q": "오토메이션 우선 대상이 아닌 것은?", "a": ["음량", "팬", "템포", "센드 양"], "c": 2, "e": "음량, 팬, 센드 양, 필터 컷오프가 우선이다."}, {"q": "팬 오토메이션을 리드 보컬에 쓰지 않는 이유는?", "a": ["팬은 오토메이션이 안 돼서", "곡의 중심이 흔들려서", "소리가 커져서", "CPU 때문"], "c": 1, "e": "리드 보컬과 킥과 베이스는 움직이지 않는다. 같은 소리가 반복될 때나 효과음이 지나갈 때만."}, {"q": "오토메이션 기록 모드 중 지나간 뒤 원래 값으로 돌아오는 것은?", "a": ["Latch", "Touch", "Read", "Write"], "c": 1, "e": "Touch는 손을 뗀 순간 원래 곡선으로 돌아가고, Latch는 마지막 값을 유지한다."}], "s": 13, "d": 99}, {"t": "믹스 마무리 점검", "goal": "마스터링으로 넘기기 전에 흩어진 항목을 순서대로 훑는다.", "con": ["믹싱과 믹싱 심화가 여기서 끝난다. 마스터링으로 넘기기 전에 흩어져 있던 것들을 한 번에 훑는다. 아래 열두 가지는 지금까지 배운 것을 순서대로 다시 세운 것이고, 막히면 괄호 안의 일차를 과정 탭에서 제목으로 찾아 다시 본다.", "먼저 레벨이다. 개별 트랙 평균이 <v>-18</v>dBFS 부근이고 피크가 <v>-12</v>에서 <v>-6</v>dBFS 안에 있는가(게인 스테이징 일차). 어느 트랙에서도 미터가 빨갛게 되지 않는가. 마스터 출력에 <v>-6</v>dBFS 여유가 남아 있는가. 이 셋이 안 되면 아래를 볼 필요가 없다.", "다음은 저역이다. 킥과 베이스가 서로 다른 자리에 있는가(음역 배치 일차). 사이드체인을 걸었다면 킥이 칠 때 실제로 비켜서는가(사이드체인 일차). 저역이 가운데 모여 있는가.", "그다음 처리다. EQ에서 남긴 것이 부스트보다 컷 위주인가(이퀄라이저 일차). 찾을 때는 크게 올려도 되지만 최종적으로 남기는 값은 깎기 <v>-4</v>dB, 올리기 <v>+3</v>dB 안이다. 리버브가 곡을 흐리지 않는가. 리버브 버스에 하이패스와 로우패스를 걸었는지 확인한다(센드 버스 일차).", "마지막은 확인이다. 모노로 합쳐 사라지는 소리가 없는가. 레퍼런스와 음량을 맞춰 비교했는가(레퍼런스 일차). 스피커, 이어폰, 휴대폰 세 곳에서 들었는가. 여기까지 통과하면 마스터링으로 넘긴다. 넘길 파일은 <v>24</v>비트 WAV다(바운스 일차).", "한 가지만 덧붙인다. 이 목록은 통과 여부를 세는 것이지 점수를 매기는 것이 아니다. 하나라도 걸리면 마스터링에서 고치려 들지 말고 믹스로 돌아간다."], "path": [{"n": "마무리 점검 순서", "s": ["레벨: 개별 트랙 피크, 클리핑, 마스터 여유", "저역: 킥과 베이스 분리, 사이드체인 동작, 저역 가운데", "처리: EQ 컷 위주, 리버브 통제", "확인: 모노, 레퍼런스 비교, 세 환경 청취", "통과하면 <v>24</v>비트 WAV로 넘김"]}], "drill": ["점검 열두 항목을 실제 곡에 하나씩 적용하고 걸리는 것을 적는다.", "걸린 항목이 있으면 해당 일차로 돌아가 고친 뒤 다시 점검한다."], "keys": [["X", "믹서"], ["⌘B", "바운스"], ["S", "솔로"]], "chk": ["믹스 마무리 열두 항목을 훑을 수 있다", "걸리면 믹스로 돌아간다"], "quiz": [{"q": "마무리 점검에서 레벨 세 가지를 가장 먼저 보는 이유는?", "a": ["여기가 안 되면 아래 항목의 판단이 성립하지 않아서", "순서는 상관없어서", "미터가 잘 보여서", "가장 쉬워서"], "c": 0, "e": "클리핑이 있거나 여유가 없으면 EQ와 공간계를 아무리 다듬어도 결과가 달라지지 않는다."}, {"q": "점검에서 걸린 항목이 있으면?", "a": ["리미터를 세게 건다", "그대로 넘긴다", "믹스로 돌아간다", "마스터링에서 보정한다"], "c": 2, "e": "믹스의 문제는 마스터링으로 해결되지 않는다."}], "s": 13, "d": 100}, {"d": 101, "s": 14, "t": "마스터 버스 체인", "goal": "마스터 버스 체인을 순서대로 구성한다.", "con": ["마스터링은 믹스가 끝난 곡 전체에 마지막 손질을 하는 단계다. 믹스가 좋지 않으면 마스터링으로 해결되지 않는다. 순서를 지킨다.", "기본 체인 순서. EQ → 컴프레서(글루) → 새추레이션 → 리미터. 이 순서를 크게 벗어나지 않는다. 리미터는 여기서 자리만 잡아 두고, 실제 값은 라우드니스를 재면서 정한다. 다음 일차에서 다룬다.", "마스터 EQ는 아주 작게 쓴다. <v>1~2</v>dB 안에서. 전체가 어둡다면 <v>10</v>kHz를 넓게 <v>1.5</v>dB, 저역이 과하면 <v>200</v>Hz 부근을 <v>1</v>dB 정도 깎는다. 이 정도는 곡의 성격을 바꾸지 않고 기울기만 조금 편다. 마스터에서 <v>3</v>dB 이상 움직이면 특정 악기가 앞으로 튀어나오거나 뒤로 밀려서, 믹스에서 맞춰 둔 균형이 깨진다.", "글루 컴프레서는 레이시오 <v>2:1</v>, 어택 <v>30</v>ms, 릴리스 <v>auto</v> 또는 <v>300</v>ms, 게인 리덕션 <v>1~2</v>dB로 아주 살짝만 건다. 살짝만인 이유는 이 단계에 오면 트랙 사이 균형이 이미 완성되어 있기 때문이다. 마스터에서 세게 누르면 큰 소리와 작은 소리의 관계가 바뀌어 애써 잡은 믹스 밸런스를 되돌리는 셈이 된다. 곡이 하나로 묶인 느낌을 만드는 것이 목적이지 음량을 키우는 것이 아니다. 이 값에서 나는 변화는 미묘하다. 껐다 켜면 음량 차이만 느껴질 정도인데, 음량을 맞춰 비교하면 트랙들이 따로 놀지 않고 한 덩어리로 움직이는 것이 들린다. 어택을 <v>30</v>ms로 길게 두는 것도 이유가 있다. 짧으면 킥의 타격이 눌려 곡 전체의 추진력이 사라진다.", "새추레이션은 배음을 더해 따뜻하게 만든다. <b>ChromaGlow</b>가 이 역할을 한다. 아주 조금만 쓴다.", "믹스를 마스터링할 때는 마스터 채널의 여유가 <v>-6</v>dBFS 정도 있어야 한다. 없다면 믹스로 돌아간다. 완성된 마스터 체인은 채널 스트립 설정으로 저장한다. Stereo Out의 <b>설정</b> 버튼 → <b>다른 이름으로 채널 스트립 설정 저장</b>. 다음 곡에서 같은 체인을 불러와 값만 곡에 맞게 다시 잡으면 된다.", "마무리 전 점검 목록. 체인의 각 단계마다 클리핑이 없는지 확인했는가. 플러그인을 켜고 껐을 때 실제로 나아지는가. 레퍼런스와 음량을 맞춰 비교했는가. 큰 음량과 작은 음량 양쪽에서 들었는가. 모노로 합쳐 확인했는가. 미터의 피크와 라우드니스와 다이내믹을 모두 봤는가.", "가장 흔한 실수 세 가지는 따로 기억해둔다. 첫째, 믹스의 문제를 마스터링으로 고치려는 것이다. 보컬이 묻히거나 저역이 뭉쳤다면 믹스로 돌아간다. 둘째, 헤드폰에서 좋다고 저역과 고역을 크게 올리는 것이다. 다른 스피커에서 무너진다. 셋째, 개선이 들리지 않는데도 플러그인을 남겨두는 것이다. 확신이 없으면 빼는 쪽이 낫다.", "마스터링의 목적은 곡을 크게 만드는 것이 아니라 어느 재생 환경에서도 무너지지 않게 만드는 것이다."], "path": [{"n": "마스터 체인 구성", "s": ["<k>X</k> 믹서 → 맨 오른쪽 <b>Stereo Out</b> 채널", "이펙트 슬롯 1: <b>EQ → Linear Phase EQ</b>", "슬롯 2: <b>Dynamics → Compressor</b> (Ratio <v>2:1</v>, GR <v>1~2</v>dB)", "슬롯 3: <b>Distortion → ChromaGlow</b> 약하게", "슬롯 4: <b>Dynamics → Limiter</b>"]}], "drill": ["완성된 믹스에 마스터 체인 네 개를 순서대로 걸고 각 단계마다 켜고 끄며 차이를 확인한다.", "글루 컴프의 게인 리덕션을 1dB와 6dB로 비교해 어느 쪽이 자연스러운지 판단한다."], "keys": [["X", "믹서"], ["⌘S", "저장"]], "chk": ["체인 순서를 안다", "각 단계를 작게 쓴다", "믹스 여유를 확보하고 시작한다", "마무리 점검 목록을 실행한다"], "quiz": [{"q": "마스터 글루 컴프레서의 적절한 게인 리덕션은?", "a": ["1~2dB", "10dB 이상", "리덕션 없음", "5~8dB"], "c": 0, "e": "묶는 것이 목적이므로 아주 살짝만 건다."}, {"q": "마스터링 단계에서 플러그인의 개선이 들리지 않으면?", "a": ["하나 더 추가한다", "그대로 둔다", "값을 더 크게 준다", "빼는 쪽이 낫다"], "c": 3, "e": "들리지 않는 처리는 헤드룸과 다이내믹만 소모한다."}]}, {"t": "마스터링 어시스턴트와 자동 도구", "goal": "마스터링 어시스턴트와 스템 스플리터를 사용한다.", "con": ["로직에는 곡을 분석해서 알아서 처리해 주는 도구가 몇 개 들어 있다. 쓸 줄 알면 좋은 출발점이 되고, 원리를 모르고 쓰면 판단력이 늘지 않는다. 앞에서 수동 체인을 먼저 배운 이유가 그것이다.", "마스터링 어시스턴트는 곡 전체를 듣고 EQ, 다이내믹, 라우드니스를 자동으로 맞춰 준다. 스테레오 아웃에 얹으면 재생하면서 분석하고, 끝나면 결과를 적용한다. 목표 라우드니스도 스트리밍 기준으로 맞춰 준다. 다는 곳이 정해져 있다. Stereo Out 채널 스트립 <b>맨 아래의 Mastering 슬롯</b>이거나 <b>믹스 → Mastering Assistant</b>다. 일반 이펙트 슬롯에서 찾으려 하면 안 보인다.", "캐릭터를 고를 수 있다. 깨끗한 쪽과 색이 붙는 쪽이 있고, 일부 캐릭터는 애플 실리콘 맥에서만 열린다. 자동 결과가 마음에 안 들면 EQ 커브와 세기를 직접 손볼 수 있다.", "가장 좋은 사용법은 비교다. 내가 만든 수동 체인과 어시스턴트 결과를 번갈아 들으며 무엇이 다른지 찾는 것이다. 어시스턴트가 저역을 깎았다면 내 믹스의 저역이 과했다는 뜻이다. 자동 도구를 채점자로 쓰는 셈이다. 비교가 끝나면 반드시 한쪽만 남긴다. 어시스턴트와 수동 체인을 둘 다 켜 두면 EQ와 리미팅이 이중으로 걸린다.", "스템 스플리터는 반대 방향의 도구다. 이미 섞여 있는 오디오 하나를 보컬, 드럼, 베이스, 기타, 피아노, 나머지로 분리한다. 초기에는 네 갈래였고 이후 업데이트로 기타와 피아노가 추가됐다. 옛날 데모나 연습 녹음에서 보컬만 꺼내 새 반주를 붙이는 일이 가능해진다. 이것도 애플 실리콘이 필요하다.", "분리 품질에는 한계가 있다. 소리가 겹친 부분에서는 뭉개짐이 남는다. 공부와 스케치, 리믹스 연습에는 충분하지만 남의 음원을 분리해 쓰는 것은 저작권 문제가 된다. 자기 소재에 쓴다.", "자동 도구의 자리를 정리하면 이렇다. 시작을 빠르게 해주고 내 판단을 채점해 준다. 마지막 결정은 항상 귀가 한다.", "쓰면서 놓치기 쉬운 것이 셋 있다. 첫째, 어시스턴트는 스테레오 출력의 <b>맨 마지막</b>에 들어가야 한다. 이미 걸어 둔 다른 플러그인이 있다면 그 뒤다. 둘째, 분석이 끝난 뒤에 믹스를 고쳤다면 <b>재분석</b>을 눌러야 한다. 트랙 하나의 음량이나 EQ만 바꿔도 마찬가지다. 안 누르면 옛 믹스 기준의 처리가 그대로 걸려 있다.", "셋째는 놓치면 결과가 달라진다. <b>라우드니스 보정</b>은 켜고 끌 때 음량을 맞춰 주는 기능이라 비교할 때는 유용하지만, <b>바운스 전에는 반드시 꺼야 한다</b>. 켜 둔 채 뽑으면 의도한 라우드니스가 나오지 않는다.", "수동 조정도 된다. EQ 그래프의 점 세 개를 위아래로 끌면 레벨이, 좌우로 끌면 중심 주파수가 바뀐다. 조정 폭은 밴드마다 <v>±6</v>dB까지 열려 있다. 열려 있다고 다 쓰라는 뜻은 아니다. 마스터 단계의 EQ는 트랙보다 좁은 <v>±1~2</v>dB 안에서 끝내는 것이 원칙이고, 그보다 크게 손대야 한다면 믹스에 문제가 있다는 신호다. <b>Auto EQ</b> 슬라이더로 자동 커브를 얼마나 적용할지도 정할 수 있다.", "수동 체인과 비교할 때 주의할 것이 있다. 완성된 수동 리미터 체인 뒤에 어시스턴트를 얹어 놓고 비교하면 공정한 비교가 아니다. 이중 처리가 되기 때문이다. 대체 저장으로 버전을 나누거나 수동 체인을 우회시킨 뒤 어시스턴트를 마지막 이펙트로 두고 비교한다."], "path": [{"n": "마스터링 어시스턴트", "s": ["믹스가 끝난 뒤 <k>X</k> 믹서 → <b>Stereo Out</b> 채널", "맨 아래 <b>Mastering</b> 슬롯 클릭. 다른 플러그인이 있다면 그 뒤에 들어간다", "즉시 분석이 시작된다. 곡 전체를 재생해 모든 구간을 확인", "<b>캐릭터</b>를 골라 비교", "필요하면 <b>Auto EQ</b> 슬라이더와 그래프의 점 세 개로 조정", "믹스를 고쳤다면 <b>재분석</b>", "바운스 전에 <b>라우드니스 보정</b> 끄기"]}, {"n": "수동 체인과 비교", "s": ["앞에서 만든 수동 마스터 체인을 함께 걸어 둔다", "한쪽씩 켜고 끄며 번갈아 듣는다", "라우드니스 미터로 두 결과의 통합 수치를 비교한다"]}, {"n": "스템 스플리터", "s": ["분리할 오디오 리전을 선택한다", "리전을 <b>우클릭 → 스템 분리</b>", "보컬, 드럼, 베이스, 기타, 피아노, 그 외 트랙이 새로 생긴다", "필요 없는 갈래는 지우고 쓸 것만 남긴다"]}], "drill": ["완성 곡에 마스터링 어시스턴트를 걸어 분석 결과를 보고, 어시스턴트가 올리거나 깎은 대역이 내 믹스의 어떤 문제를 가리키는지 적는다.", "수동 체인 결과와 어시스턴트 결과의 통합 라우드니스를 각각 재서 비교한다.", "직접 만든 옛 데모 하나를 스템으로 분리해 보컬만 남기고 새 반주를 깔아 본다."], "keys": [["X", "믹서"], ["스페이스", "재생과 정지"]], "chk": ["어시스턴트를 채점자로 쓰는 법을 안다", "수동 체인과 비교해 봤다", "스템 분리의 한계와 용도를 안다", "바운스 전에 라우드니스 보정을 끈다", "믹스를 고치면 재분석한다"], "quiz": [{"q": "마스터링 어시스턴트의 가장 좋은 사용법은?", "a": ["믹싱 전에 먼저 걸기", "결과를 그대로 발매", "수동 체인과 비교하며 내 믹스의 문제를 찾는 채점자로", "모든 트랙에 하나씩 걸기"], "c": 2, "e": "자동 결과가 손댄 부분이 곧 내 믹스의 약점을 가리킨다."}, {"q": "스템 스플리터가 오디오를 나누는 갈래에 해당하지 않는 것은?", "a": ["보컬", "드럼", "리버브", "기타"], "c": 2, "e": "보컬, 드럼, 베이스, 기타, 피아노, 나머지로 나뉜다. 리버브는 갈래가 아니다."}, {"q": "마스터링 어시스턴트로 바운스하기 전에 반드시 해야 하는 것은?", "a": ["EQ 초기화", "라우드니스 보정 끄기", "재생 정지", "캐릭터 바꾸기"], "c": 1, "e": "켜 둔 채 뽑으면 의도한 라우드니스가 나오지 않는다."}, {"q": "분석이 끝난 뒤 트랙 하나의 EQ를 바꿨다면?", "a": ["플러그인을 지운다", "재분석을 누른다", "캐릭터를 바꾼다", "그대로 둔다"], "c": 1, "e": "안 누르면 옛 믹스 기준의 처리가 그대로 걸려 있다."}], "d": 102, "s": 14}, {"d": 103, "s": 14, "t": "라우드니스와 리미터", "goal": "라우드니스를 측정하고 리미터를 설정한다.", "con": ["음량의 기준은 피크가 아니라 라우드니스다. 사람이 느끼는 크기를 측정한 값이고 단위는 LUFS다. 스트리밍 서비스는 이 값을 기준으로 자동 음량 조절을 한다.", "목표값. 스트리밍 일반은 통합 라우드니스 <v>-14</v>LUFS 부근, 트루 피크 <v>-1</v>dBTP다. 애플 뮤직 계열은 <v>-16</v>LUFS를 기준으로 삼는다. 지나치게 크게 만들면 서비스에서 깎여서 다이내믹만 잃는다. 다만 -14가 모든 음악의 정답은 아니다. 장르마다 관행이 다르다. 클럽과 EDM은 <v>-9</v>에서 <v>-6</v>LUFS로 크게 만들고, 현대 팝은 <v>-11</v>에서 <v>-9</v>LUFS, 스트리밍 기준을 그대로 따르는 곡은 <v>-14</v>에서 <v>-11</v>LUFS, 어쿠스틱과 재즈는 <v>-18</v>에서 <v>-16</v>LUFS, 클래식과 오케스트라는 <v>-23</v>에서 <v>-18</v>LUFS다. 아래로 갈수록 다이내믹이 넓다.", "장르 관행과 스트리밍 기준이 어긋날 때 어느 쪽을 따를지가 문제가 된다. 서비스는 기준보다 큰 곡을 재생 시점에 깎아 내리므로, -8로 만들어 올려도 듣는 사람에게는 -14로 들린다. 남는 것은 눌려서 사라진 다이내믹뿐이다. 그래서 스트리밍이 주 무대라면 기준에 맞추는 쪽이 유리하다. 반대로 클럽 재생이나 물리 매체처럼 자동 조절이 없는 곳이 목적지라면 장르 관행을 따른다. 어느 쪽이든 트루 피크 <v>-1</v>dBTP는 공통이다.", "세 가지 측정값을 본다. 통합은 곡 전체 평균, 순간은 지금 값, 레인지는 다이내믹 폭이다. 레인지가 <v>4</v>LU 아래로 내려가면 답답하게 들린다. 대중음악에서 <v>5~9</v>LU가 무난하다.", "통합 값을 읽을 때 가장 흔한 실수가 있다. 통합은 재생을 시작한 시점부터 지금까지를 누적해 평균 낸 값이다. 곡 중간부터 재생하면 그 구간만의 평균이 나오고, 앞에서 재생한 기록이 남아 있으면 그것까지 섞인다. 그래서 잴 때마다 미터를 초기화하고 <k>Return</k>으로 맨 앞으로 간 뒤 끝까지 재생해야 한다. 로직의 Loudness Meter는 값 부분을 클릭하면 초기화된다.", "구간마다 값이 다르다는 것도 알아둬야 한다. 인트로만 재생하면 <v>-20</v>LUFS, 코러스만 재생하면 <v>-10</v>LUFS가 나오는 곡이 흔하다. 통합은 전체 평균이므로 조용한 구간이 길면 전체 값이 내려간다. 그래서 통합 <v>-14</v>인 곡의 코러스는 대개 <v>-11</v> 부근이다. 코러스만 재생해서 <v>-14</v>가 나왔다면 그 곡의 통합은 <v>-17</v> 근처일 수 있다.", "게인을 올린 만큼 라우드니스가 오르지 않는 것도 사람을 헷갈리게 한다. 리미터 게인을 <v>3</v>dB 올려도 통합은 <v>1.5~2</v>dB밖에 안 오르는 경우가 많다. 올린 만큼 리미터가 눌러 되돌리기 때문이다. 목표까지 <v>2</v>dB가 남았다면 게인을 <v>3~4</v>dB 올려야 한다는 뜻이고, 그 과정에서 리덕션이 얼마나 늘어나는지 함께 봐야 한다.", "맞추는 절차를 정해두면 시간이 크게 준다. 곡에서 가장 큰 구간, 대개 마지막 코러스 <v>8</v>마디를 사이클로 잡고 그 구간의 통합 값으로 대략 맞춘다. 이때 목표보다 <v>2~3</v>dB 높게 나오도록 잡으면 전체 통합이 목표 부근에 온다. 앞에서 본 대로 코러스가 통합보다 <v>3</v>dB 정도 높기 때문이다. 코러스에서 정확히 목표값이 나오도록 맞추면 전체 통합은 목표보다 <v>3</v>dB 낮게 끝난다. 대략 맞춘 뒤 한 번만 처음부터 끝까지 재생해 최종 확인한다. 매번 전체를 재생하며 조정하면 4분짜리 곡에서 한 번 확인에 4분씩 든다.", "트루 피크는 디지털 신호를 아날로그로 바꿀 때 생기는 실제 최대값이다. 0dBFS를 넘지 않아도 트루 피크는 넘을 수 있다. 그래서 <v>-1</v>dBTP로 여유를 둔다.", "리미터는 마지막에 하나만 건다. 라우드니스 미터는 그 리미터보다도 뒤, 체인의 맨 끝에 둔다. 미터는 소리를 읽기만 하고 바꾸지 않으므로 어디에 두어도 소리는 같지만, 최종 결과를 읽으려면 리미터를 지난 자리여야 한다. 실링을 <v>-1.0</v>dB로, 게인을 서서히 올려 목표 라우드니스에 닿게 한다. 리덕션이 계속 <v>3</v>dB 이상 걸리면 너무 밀어붙인 것이다.", "게인을 올려도 통합이 안 오르고 리덕션만 늘어나는 상황이 온다. 이건 마스터의 문제가 아니라 믹스의 문제다. 곡의 다이내믹이 너무 넓어서 큰 부분이 먼저 리미터에 걸리는 것이다. 해결은 세 가지다. 믹스로 돌아가 큰 구간의 몇몇 트랙을 정리하거나, 마스터 컴프의 압축을 조금 늘리거나, 목표 라우드니스를 낮추고 다이내믹을 지키는 것이다. 리미터를 더 밀어붙이는 것은 답이 아니다.", "다이내믹이 넓은 곡은 <v>-14</v>를 억지로 맞추지 않아도 된다. 자동 음량 조절이 있는 서비스에서는 조용한 곡이 재생 시점에 올려지므로 손해가 없다. 오히려 억지로 올린 곡이 깎이면서 다이내믹만 잃는다. 어쿠스틱이나 재즈에서 <v>-16</v>이나 <v>-18</v>이 나온다면 그대로 두는 편이 낫다.", "미터만 보고 판단하지 않는다. 같은 <v>-14</v>LUFS라도 저역이 많은 곡이 더 크게 느껴진다. 측정은 사람 귀의 감도를 대략 반영할 뿐 완전히 같지 않기 때문이다. 목표값에 닿았더라도 레퍼런스와 나란히 들어보고 비슷한 크기로 들리는지 확인한다."], "path": [{"n": "측정하기", "s": ["<b>Stereo Out</b> 이펙트 슬롯 → <b>Metering → Loudness Meter</b>", "<k>Return</k>으로 처음으로 → 곡 전체 재생", "<b>Integrated</b> 값 확인", "<b>True Peak</b> 확인"]}, {"n": "리미터 설정", "s": ["<b>Stereo Out</b> 마지막 슬롯 → <b>Dynamics → Limiter</b>", "<b>Output Level</b>(실링) <v>-1.0</v>dB", "<b>Gain</b>을 <v>0</v>부터 천천히 올림", "리덕션이 순간 <v>2~3</v>dB를 넘지 않게"]}, {"n": "효율적인 측정 절차", "s": ["마지막 코러스 <v>8</v>마디를 사이클로 지정", "Loudness Meter 값 부분을 클릭해 초기화", "그 구간을 재생하며 리미터 게인 조정. 목표보다 <v>2~3</v>dB 높게", "미터 초기화 → <k>Return</k> → 곡 전체 재생 → 통합 값 최종 확인", "레퍼런스와 음량을 맞춰 비교"]}], "drill": ["완성 곡의 통합 라우드니스를 측정하고 값을 적는다.", "리미터 게인을 올려 -14LUFS에 맞추고 그 과정에서 소리가 어떻게 변하는지 듣는다.", "일부러 -8LUFS까지 밀어붙인 버전을 만들어 다이내믹이 얼마나 사라지는지 비교한다.", "같은 곡을 -14LUFS와 -9LUFS로 두 번 만들고, 두 파일의 음량을 똑같이 맞춰 비교한다. 다이내믹 차이를 적는다.", "곡의 인트로, 벌스, 코러스를 각각 따로 재생해 통합 값이 얼마나 다른지 적는다.", "리미터 게인을 3dB 올린 뒤 통합이 실제로 몇 dB 올랐는지 재본다."], "keys": [["Return", "처음으로"], ["X", "믹서"]], "chk": ["LUFS와 dBFS의 차이를 안다", "목표값을 기억한다", "트루 피크에 여유를 둔다", "장르별 라우드니스 관행을 안다", "측정 전 미터를 초기화한다", "게인과 라우드니스가 1대1이 아님을 안다"], "quiz": [{"q": "스트리밍 기준으로 흔히 쓰는 목표 라우드니스는?", "a": ["-14LUFS 부근", "-30LUFS", "0LUFS", "-6LUFS"], "c": 0, "e": "-14LUFS 부근이 일반적인 기준이고 애플 계열은 -16LUFS를 쓴다."}, {"q": "트루 피크 여유는 보통 얼마로 두나?", "a": ["-6dBTP", "-20dBTP", "-1dBTP", "0dBTP"], "c": 2, "e": "-1dBTP를 두면 인코딩 과정에서 왜곡이 생기지 않는다."}, {"q": "스트리밍용 곡을 -8LUFS로 만들어 올리면?", "a": ["음질이 좋아진다", "서비스가 깎아 내려 다이내믹만 잃는다", "재생이 거부된다", "더 크게 들린다"], "c": 1, "e": "자동 음량 조절이 기준으로 낮추므로 크기는 같아지고 눌린 다이내믹만 남는다."}, {"q": "통합 라우드니스를 잴 때 반드시 해야 하는 것은?", "a": ["코러스만 재생", "모노로 듣기", "미터를 초기화하고 처음부터 끝까지 재생", "리미터를 끄기"], "c": 2, "e": "통합은 재생 시작 시점부터 누적한 평균이라, 앞 기록이 남으면 값이 섞인다."}, {"q": "리미터 게인을 3dB 올렸는데 통합이 1.5dB만 올랐다면?", "a": ["트루 피크 문제", "올린 만큼 리미터가 눌러 되돌리기 때문", "미터가 고장", "정상이 아니다"], "c": 1, "e": "정상이다. 목표까지 2dB 남았다면 게인은 3~4dB 올려야 한다."}, {"q": "게인을 올려도 통합이 안 오르고 리덕션만 늘어난다면?", "a": ["리미터를 더 밀어붙인다", "샘플레이트를 바꾼다", "믹스의 다이내믹 문제이므로 믹스로 돌아가거나 목표를 낮춘다", "트루 피크를 0으로"], "c": 2, "e": "마스터에서 해결되지 않는 문제다. 리미터를 더 미는 것은 답이 아니다."}]}, {"d": 104, "s": 15, "t": "바운스와 파일 포맷", "goal": "바운스 설정과 파일 포맷을 선택한다.", "con": ["바운스는 프로젝트를 오디오 파일로 만드는 작업이다. 설정 창의 항목이 많아 보이지만 실제로 정하는 것은 몇 개뿐이다.", "발매용 마스터는 WAV, <v>24</v>비트, 프로젝트와 같은 샘플레이트로 뽑는다. 스트리밍 서비스가 알아서 압축하므로 압축 포맷을 직접 만들 필요가 없다.", "들려주기용은 MP3 <v>320</v>kbps나 AAC면 충분하다. 로직은 한 번에 여러 포맷을 동시에 뽑을 수 있다.", "바운스 구간은 곡의 시작과 끝을 정확히 잡는다. 잔향이 끝날 때까지 여유를 두지 않으면 마지막이 뚝 끊긴다. 마지막 음 이후 <v>2~3</v>초를 더 잡는다. 리버브의 꼬리가 이만큼 남기 때문이다. 짧게 자르면 잔향이 뚝 끊겨 끝이 어색하고, 특히 긴 홀 리버브를 쓴 곡은 마지막 화음이 잘려 나간 것처럼 들린다.", "바운스 전에 확인할 것이 두 가지 있다. 포함하고 싶은 트랙이 모두 메인 출력으로 가고 있는지, 그리고 뮤트된 트랙이 없는지다. 다른 버스로 빠져 있거나 뮤트된 트랙은 바운스에 안 들어간다. 곡을 다 만들고 뽑았는데 악기 하나가 빠져 있는 사고가 여기서 난다.", "구간을 정하는 방법도 정해져 있다. 사이클 모드를 켜면 바운스 범위가 사이클 구간과 같아진다. 곡 전체를 뽑을 때는 사이클을 끄고, 일부만 뽑을 때는 사이클로 범위를 잡는다.", "실시간과 오프라인 중 오프라인이 빠르다. 외부 하드웨어로 신호가 나갔다 들어오는 경우에는 로직이 알아서 실시간으로 처리한다. 내부 악기와 플러그인만 쓴다면 오프라인으로 둔다.", "노멀라이즈는 끄고 뽑는다. 노멀라이즈는 파일 전체를 최대치까지 자동으로 올리는 기능인데, 마스터링에서 정한 레벨을 무시하고 바꿔 버린다. 이미 리미터로 정한 라우드니스가 흐트러진다.", "디더는 비트 심도를 줄일 때만 쓴다. 24비트를 16비트로 내릴 때 생기는 미세한 왜곡을 아주 작은 잡음으로 가려주는 처리다. 24비트로 그대로 낼 거라면 <b>없음</b>으로 둔다. 습관적으로 켜두면 오히려 손해다.", "트랙별로 따로 뽑는 것이 스템이다. 다른 사람에게 믹스를 넘기거나 라이브에 쓸 때 필요하다.", "스템을 남에게 넘길 때는 규칙이 있다. 모든 스템을 곡의 <b>같은 시작점</b>에서 뽑는다. 소리가 늦게 나오는 트랙이라도 1마디부터 시작하게 해야 받는 쪽에서 전부 끌어다 놓기만 하면 맞는다. 시작점이 제각각이면 상대가 하나씩 맞춰야 한다.", "함께 보낼 정보도 정해져 있다. 템포, 박자, 조, 샘플레이트, 비트 심도. 이 다섯 가지를 텍스트 파일 하나로 같이 넣는다. 파일 이름도 <b>01_Kick</b>, <b>02_Snare</b>처럼 번호와 악기명으로 통일하면 상대가 정렬만 해도 순서가 맞는다.", "이펙트를 넣을지 뺄지는 미리 합의한다. 믹스 엔지니어에게 넘기는 것이면 트랙 이펙트를 빼고 마른 상태로 보내되, 소리의 성격 자체가 이펙트에서 나오는 트랙은 걸린 채로 보낸다. 예를 들어 앰프 시뮬레이터를 거친 기타는 빼면 다른 악기가 된다. 애매하면 두 벌을 다 보낸다."], "path": [{"n": "프로젝트 바운스", "s": ["포함할 트랙이 메인 출력으로 가는지, 뮤트된 것이 없는지 확인", "전체를 뽑으면 사이클을 끄고, 일부만 뽑으면 사이클로 범위 지정", "<b>파일 → 바운스 → 프로젝트 또는 섹션</b> 또는 <k>⌘B</k>", "<b>대상</b> 영역에서 <b>PCM</b> 체크. 필요하면 MP3도 함께", "PCM: <b>파일 형식</b> WAVE, <b>해상도</b> <v>24</v>비트, <b>샘플률</b>은 프로젝트와 같게, <b>파일 유형</b> 인터리브", "<b>모드</b> 오프라인, <b>노멀라이즈</b> 끄기", "<b>확인</b> → 위치와 이름 지정 → <b>바운스</b>"]}, {"n": "스템 뽑기", "s": ["<b>파일 → 내보내기 → 모든 트랙을 오디오 파일로</b>", "형식과 해상도 지정", "<b>바이패스 이펙트 플러그인</b> 여부 선택", "저장 위치 지정"]}], "drill": ["완성 곡을 WAV 24비트와 MP3 320kbps로 동시에 바운스한다.", "바운스 구간을 잔향 끝까지 잡았는지 결과 파일 마지막을 들어 확인한다.", "모든 트랙을 스템으로 내보내고 폴더 구조를 확인한다."], "keys": [["⌘B", "바운스"], ["U", "선택 영역을 사이클로"]], "chk": ["발매용 포맷을 안다", "노멀라이즈를 끄고 뽑는다", "잔향 끝까지 구간을 잡는다", "스템 협업 규칙을 안다", "메인 출력 라우팅과 뮤트를 먼저 확인한다"], "quiz": [{"q": "발매용 마스터 파일의 일반적인 형식은?", "a": ["MP3 128kbps", "WAV 24비트", "MIDI", "AA
