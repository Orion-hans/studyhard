 뗀다."}], "s": 6, "d": 42}, {"t": "건반: 페달과 울림의 디테일", "goal": "세 페달, 리피티션 한계, 공명과 릴리스까지 다룬다.", "con": ["앞 절이 손이 하는 일이었다면 이 절은 <b>악기 안에서 일어나는 일</b>이다. 피아노는 현과 해머와 댐퍼가 있는 기계라 그 물리가 소리에 그대로 나타난다.", "<b>페달은 셋이다.</b> 오른쪽이 서스테인(CC64)으로 앞 절에서 봤고, 왼쪽이 소프트 페달(CC67), 가운데가 소스테누토(CC66)다. 소프트 페달은 해머가 현을 적게 때리게 해 음량만이 아니라 음색이 부드러워진다. 아주 여린 구간에서 쓴다. 소스테누토는 밟는 순간 눌려 있던 음만 유지하고 이후의 음은 유지하지 않는다. 낮은 근음을 붙잡고 위에서 다른 화음을 치는 곡에서 쓴다. 둘 다 음원이 지원해야 소리가 난다.", "<b>하프 페달</b>이 있다. 서스테인은 0과 127만 있는 것이 아니라 중간이 되는 음원이 있다. <v>40~80</v> 부근에서 댐퍼가 현에 살짝 닿아 잔향이 짧아진다. 코드가 빠르게 바뀌는 구간에서 완전히 떼지 않고 반만 떼면 끊기지 않으면서 섞이지도 않는다. 지원하지 않는 음원은 <v>64</v>를 기준으로 켜고 꺼지므로 확인하고 쓴다.", "<b>리피티션에는 한계가 있다.</b> 같은 건반을 아주 빠르게 반복하면 해머가 돌아올 시간이 필요하다. 그랜드 피아노는 초당 <v>12~14</v>회 정도가 한계이고 업라이트는 그보다 적다. 미디에서 같은 음을 <v>1/64</v>로 촘촘히 찍으면 실제로는 불가능한 연주가 된다. 빠른 반복이 필요하면 음을 번갈아 바꾸거나 트레몰로로 쓴다.", "<b>페달을 밟으면 안 친 줄도 울린다.</b> 댐퍼가 전부 올라가 있어 친 음의 배음과 맞는 다른 줄이 공명한다. 이것이 피아노 특유의 풍성함을 만든다. 좋은 음원은 공명을 따로 계산해서 내고, 그래서 페달을 밟았을 때와 안 밟았을 때의 소리가 음량만 다른 것이 아니다. 공명 기능이 있는 음원이라면 켜 두는 편이 자연스럽다.", "<b>건반을 뗄 때도 소리가 난다.</b> 댐퍼가 줄에 닿으며 나는 짧은 소리다. 느린 곡에서는 이것이 들리고, 없으면 소리가 뚝 끊겨 부자연스럽다. 음원에 릴리스 샘플이 있으면 자동으로 나고, 없으면 음 길이를 조금 길게 두어 갑자기 끊기지 않게 한다.", "<b>손 크기에도 한계가 있다.</b> 한 손으로 <v>10</v>도까지가 보통이고 <v>12</v>도를 넘으면 대부분의 사람이 못 짚는다. 미디에서 왼손에 <v>2</v>옥타브 화음을 찍으면 연주 불가능한 음형이 된다. 넓은 화음이 필요하면 아르페지오로 굴리거나 페달을 밟고 나눠 친다.", "<b>음역에 따라 음색이 다르다.</b> 저역은 줄이 굵고 길어 배음이 복잡하며 오래 울린다. 고역은 줄이 짧아 금방 사라지고 배음이 적다. 그래서 같은 벨로시티로 쳐도 저역이 더 오래 남는다. 미디에서 고역 음의 길이를 저역과 같게 두면 실제보다 길게 들리니, 고역은 조금 짧게 두어도 된다.", "<b>일렉트릭 피아노는 다른 악기다.</b> 로즈는 해머가 금속 막대를 때리는 구조라 벨로시티에 따라 종처럼 벌어지고, 윌리처는 리드가 울려 거칠다. 서스테인 페달이 있지만 어쿠스틱 피아노만큼 공명이 풍부하지 않다. 그리고 대개 앰프와 트레몰로를 거쳐 나오므로 그 효과가 소리의 일부다."], "path": [{"n": "세 페달 쓰기", "s": ["피아노 롤 하단 <b>오토메이션/MIDI</b>", "레인을 <b>Sustain (64)</b> / <b>Soft (67)</b> / <b>Sostenuto (66)</b>로 전환", "소프트는 여린 구간 내내 <v>127</v>", "소스테누토는 붙잡을 음을 누른 직후에 <v>127</v>"]}, {"n": "하프 페달", "s": ["음원이 지원하는지 먼저 확인", "<b>Sustain (64)</b> 레인에 <v>60</v> 정도 값 입력", "잔향이 짧아지는지 들어 본다", "지원 안 하면 64 기준으로 켜고 꺼짐"]}, {"n": "연주 가능성 점검", "s": ["왼손 화음의 간격이 <v>10</v>도 안인지 확인", "같은 음의 반복이 <v>1/32</v>보다 촘촘하지 않은지 확인", "넓은 화음은 아르페지오로 굴림"]}], "drill": ["같은 구간을 소프트 페달 켜고 끄고 들어 음색 차이를 확인한다.", "하프 페달 값을 0·60·127로 바꿔 잔향 차이를 듣는다.", "왼손에 2옥타브 화음을 찍고 아르페지오로 바꿔 비교한다."], "keys": [["P", "피아노 롤"], ["A", "오토메이션"]], "chk": ["세 페달의 차이를 안다", "리피티션 한계를 안다", "손으로 짚을 수 있는 화음인지 확인한다"], "quiz": [{"q": "밟는 순간 눌려 있던 음만 유지하는 페달은?", "a": ["소프트 CC67", "소스테누토 CC66", "없다", "서스테인 CC64"], "c": 1, "e": "낮은 근음을 붙잡고 위에서 다른 화음을 치는 곡에서 쓴다."}, {"q": "소프트 페달이 바꾸는 것은?", "a": ["잔향", "템포", "음량과 음색", "음량만"], "c": 2, "e": "해머가 현을 적게 때려 부드러워진다."}, {"q": "왼손에 2옥타브 화음을 찍으면?", "a": ["풍성하다", "문제없다", "페달이 필요하다", "한 손으로 못 짚는 음형이 된다"], "c": 3, "e": "한 손은 보통 10도까지다. 넓은 화음은 아르페지오로 굴린다."}], "s": 6, "d": 43}, {"d": 44, "s": 6, "t": "신시사이저 기초", "goal": "감산 합성 네 부분을 이해하고 소리를 직접 만든다.", "con": ["대부분의 신스는 같은 구조를 갖는다. 오실레이터가 원재료를 만들고, 필터가 깎고, 앰프가 음량 곡선을 정하고, LFO가 흔든다. LFO와 모듈레이션은 다음 절에서 따로 본다. 이 네 부분만 알면 어떤 신스든 열 수 있다.", "오실레이터 파형의 성격. 톱니는 밝고 두껍다. 사각은 속이 빈 듯한 소리로 게임 음악과 베이스에 잘 맞는다. 삼각과 사인은 부드럽고 저음에 좋다. 노이즈는 바람과 타악 효과에 쓴다.", "필터의 컷오프는 어디부터 깎을지, 레조넌스는 깎는 지점을 얼마나 강조할지 정한다. 컷오프를 서서히 올리는 것이 신스 사운드의 가장 흔한 움직임이다.", "엔벨로프 ADSR. 어택은 소리가 최대에 도달하는 시간, 디케이는 그 뒤 떨어지는 시간, 서스테인은 유지 레벨, 릴리스는 건반을 뗀 뒤 남는 시간이다. 패드는 어택 <v>400~1200</v>ms에 릴리스 <v>800~2000</v>ms, 플럭은 어택 <v>0~5</v>ms에 짧은 디케이다. 패드를 만들면 곧 이 문제를 겪는다. 긴 음이 울리는 도중에 재생을 시작하면 소리가 안 난다. 음이 시작되는 지점을 지나쳤기 때문인데, 악기 고장이 아니다. <b>파일 → 프로젝트 설정 → MIDI → 체이스</b>에서 <b>노트</b>와 <b>서스테인</b>을 체크하면 로직이 앞쪽을 훑어 이미 눌린 음을 찾아 소리를 낸다. 긴 음을 다루는 작업에서는 켜 두는 것이 기본이다.", "로직에는 Retro Synth, ES2, Alchemy가 있다. Retro Synth가 구조를 보기에 가장 쉽다."], "path": [{"n": "Retro Synth 열기", "s": ["소프트웨어 악기 트랙 생성", "인스펙터 악기 슬롯 클릭 → <b>Retro Synth</b>", "상단 탭에서 <b>Analog</b> 선택", "<b>Osc</b> 파형, <b>Filter</b> 컷오프와 레조넌스, <b>Amp</b> ADSR 확인"]}, {"n": "패드 만들기", "s": ["파형 <b>톱니</b>", "필터 컷오프 중간, 레조넌스 낮게", "앰프 어택 <v>800</v>ms, 릴리스 <v>1500</v>ms", "LFO를 필터에 약하게 연결 → 느린 움직임"]}], "drill": ["Retro Synth에서 파형을 톱니, 사각, 삼각으로 바꿔가며 같은 음을 듣고 차이를 적는다.", "컷오프를 완전히 닫았다가 천천히 열며 소리 변화를 듣는다.", "패드 소리 하나와 플럭 소리 하나를 직접 만들어 프리셋으로 저장한다."], "keys": [["B", "스마트 컨트롤"], ["I", "인스펙터"]], "chk": ["네 부분의 역할을 설명할 수 있다", "ADSR로 패드와 플럭을 구분해 만들 수 있다", "프리셋을 저장했다"], "quiz": [{"q": "건반에서 손을 뗀 뒤 소리가 남는 시간을 정하는 것은?", "a": ["서스테인", "디케이", "릴리스", "어택"], "c": 2, "e": "릴리스다. 패드는 길게, 타악기성 소리는 짧게 둔다."}, {"q": "밝고 두꺼워서 신스 리드와 패드에 많이 쓰이는 파형은?", "a": ["톱니", "노이즈", "삼각", "사인"], "c": 0, "e": "톱니파는 배음이 풍부해 필터로 깎을 여지가 많다."}]}, {"t": "LFO와 모듈레이션", "goal": "값을 자동으로 움직이는 구조를 이해하고 신스와 이펙트에 적용한다.", "con": ["신스의 노브는 손으로 돌려 고정할 수도 있지만, 무언가가 <b>자동으로 계속 움직이게</b> 할 수도 있다. 이것을 모듈레이션이라고 한다. 움직이는 쪽을 소스, 움직여지는 쪽을 대상이라고 부른다. 이 구조를 알면 신스만이 아니라 대부분의 플러그인이 같은 얼개로 보인다.", "모듈레이션 소스는 셋이다. <b>LFO</b>는 규칙적으로 오르내리고, <b>엔벨로프</b>는 음을 누를 때마다 한 번 움직이고, <b>CC나 건반 세기</b>는 연주자가 직접 움직인다. 앞에서 본 CC1과 CC11이 세 번째에 해당한다.", "<b>LFO</b>는 저주파 오실레이터의 줄임말이다. 소리를 내는 오실레이터와 구조는 같은데 너무 느려서 음으로는 안 들리고, 대신 다른 값을 흔드는 데 쓴다. 보통 <v>0.1</v>에서 <v>20</v>헤르츠 사이다.", "<b>LFO는 무엇에 거느냐로 이름이 달라진다.</b> 음정에 걸면 비브라토, 음량에 걸면 트레몰로, 필터 컷오프에 걸면 와우, 팬에 걸면 오토팬이다. 소리는 전혀 다르지만 안에서 벌어지는 일은 똑같다. 값 하나가 오르내리는 것뿐이다.", "앞의 위상 절에서 코러스와 플랜저와 페이저를 봤는데, <b>그 셋도 LFO가 움직이는 것</b>이다. 복사본의 지연 시간을 LFO가 계속 바꿔서 간섭이 멈추지 않게 만든다. 그래서 이펙트 창을 열면 Rate와 Depth 노브가 있고, 그것이 LFO의 속도와 깊이다.", "정할 것은 넷이다. <b>Rate</b>는 얼마나 빠르게 흔들지, <b>Depth</b> 또는 Amount는 얼마나 크게 흔들지, <b>Waveform</b>은 어떤 모양으로 흔들지, <b>Sync</b>는 곡 템포에 맞출지다.", "<b>파형이 느낌을 정한다.</b> 사인은 부드럽게 오르내려 비브라토에 맞고, 삼각은 비슷하되 조금 더 직선적이다. 사각은 두 값 사이를 뚝뚝 오가서 트릴이나 게이트 효과가 되고, 톱니는 올라갔다 뚝 떨어져 반복되는 하강감을 만든다. 랜덤은 매번 다른 값으로 튀어 불규칙한 움직임이 된다.", "<b>템포 동기</b>를 켜면 Rate가 헤르츠가 아니라 음표 단위로 바뀐다. <v>1/4</v>로 두면 박마다, <v>1/8</v>이면 반 박마다 한 번 흔들린다. 리듬과 맞물려야 하는 효과는 반드시 켠다. 안 켜면 곡과 따로 논다. 반대로 비브라토처럼 연주자의 떨림을 흉내 내는 것은 꺼 두는 편이 자연스럽다.", "<b>엔벨로프</b>는 LFO와 성격이 다르다. 반복하지 않고 음을 누를 때 한 번 시작해서 끝난다. 앞 절에서 본 ADSR이 이것인데, 음량에만 쓰는 것이 아니다. <b>필터 컷오프에 엔벨로프를 걸면 소리가 시작할 때 밝았다가 닫힌다.</b> 뜯는 악기의 특징이 이것이고, 신스로 플럭이나 베이스를 만들 때 반드시 쓴다.", "그래서 좋은 신스에는 엔벨로프가 둘 이상 있다. 하나는 음량용이고 다른 하나는 필터용이다. 둘의 어택과 디케이를 다르게 두면 음색이 시간에 따라 변한다. 음량은 그대로인데 밝기만 변하는 소리가 이렇게 만들어진다.", "<b>엔벨로프는 신스 밖에도 있다.</b> 컴프의 어택과 릴리스가 같은 개념이고, 트랜지언트 셰이퍼의 Attack과 Sustain도 같은 얼개다. 이름이 다를 뿐 시간에 따라 값이 변하는 모양을 정한다는 점은 같다.", "모듈레이션을 여러 개 겹칠 수도 있다. LFO가 필터를 흔드는데 그 LFO의 속도를 다른 LFO가 또 흔드는 식이다. 깊어질수록 소리는 복잡해지지만 통제하기 어려워지므로, 배우는 단계에서는 소스 하나에 대상 하나로 시작한다."], "path": [{"n": "LFO로 비브라토", "s": ["<b>Retro Synth</b> 열기 → <b>LFO</b> 섹션", "대상을 <b>Pitch</b>로", "<b>Rate</b> <v>5</v>Hz · <b>Depth</b> 아주 조금", "템포 동기는 끈다. 연주자의 떨림이므로"]}, {"n": "LFO로 와우", "s": ["대상을 <b>Filter Cutoff</b>로", "<b>Sync</b> 켜고 <b>Rate</b>를 <v>1/8</v>로", "Depth를 올려 박에 맞춰 열리고 닫히는지 확인", "파형을 사각으로 바꿔 게이트 느낌도 들어 본다"]}, {"n": "필터 엔벨로프로 플럭", "s": ["필터 <b>Cutoff</b>를 중간쯤으로 내림", "<b>Filter Envelope</b>의 Amount를 올림", "Attack <v>0</v> · Decay <v>200</v>ms · Sustain <v>0</v>", "음을 누를 때 밝았다 닫히는지 확인"]}], "drill": ["같은 LFO를 음정·음량·필터에 차례로 걸어 이름이 어떻게 달라지는지 확인한다.", "템포 동기를 켜고 끄고 각각 재생해 곡과 맞물리는지 비교한다.", "필터 엔벨로프 Amount를 0과 최대로 두고 소리 차이를 듣는다."], "keys": [["I", "인스펙터"], ["P", "피아노 롤"], ["A", "오토메이션"]], "chk": ["LFO가 무엇에 걸리느냐로 이름이 달라짐을 안다", "템포 동기를 켤 때와 끌 때를 구분한다", "필터 엔벨로프로 음색 변화를 만든다"], "quiz": [{"q": "LFO를 음정에 걸면?", "a": ["비브라토", "와우", "트레몰로", "오토팬"], "c": 0, "e": "음량이면 트레몰로, 필터면 와우, 팬이면 오토팬이다. 안에서 벌어지는 일은 같다."}, {"q": "코러스와 플랜저의 Rate 노브는 무엇인가?", "a": ["필터", "음정", "LFO 속도", "음량"], "c": 2, "e": "복사본의 지연 시간을 LFO가 계속 바꿔 간섭이 멈추지 않게 한다."}, {"q": "리듬과 맞물려야 하는 효과에서 템포 동기는?", "a": ["끈다", "상관없다", "켠다", "Depth로 대신한다"], "c": 2, "e": "Rate가 음표 단위로 바뀐다. 비브라토는 반대로 꺼 두는 편이 자연스럽다."}, {"q": "뜯는 악기 느낌을 신스로 만들려면?", "a": ["LFO를 음정에", "필터 컷오프에 엔벨로프를 걸어 시작할 때 밝았다 닫히게", "리버브를 건다", "음량을 올린다"], "c": 1, "e": "좋은 신스에는 음량용과 필터용 엔벨로프가 따로 있다."}], "s": 6, "d": 45}, {"d": 46, "s": 6, "t": "스트링과 오케스트라", "goal": "현악 편성을 음역에 맞게 배치한다.", "con": ["현악 4부의 실용 음역. 바이올린 1은 G3에서 E6, 바이올린 2는 G3에서 C6, 비올라는 C3에서 E5, 첼로는 C2에서 A4, 콘트라베이스는 E1에서 G3이다. 이 범위를 벗어나면 실제 연주가 불가능해 보이거나 소리가 어색해진다.", "배치의 기본은 아래를 넓게, 위를 좁게다. 이 규칙인 이유는 배음렬이다. 자연 배음 자체가 아래는 넓고 위는 좁아서, 같은 모양으로 쌓으면 귀가 자연스럽다고 느낀다. 첼로와 베이스는 옥타브 이상 벌리고 위쪽 화음은 좁게 쌓는다. 저음에서 3도를 겹치면 탁해진다.", "긴 음을 그냥 두면 죽는다. 앞서 배운 CC11로 반드시 움직임을 준다. 온음표 하나에도 미세한 오르내림이 있어야 한다.", "레가토와 스타카토를 구간에 따라 나눠 쓴다. 배경은 레가토, 리듬 강조는 스타카토나 스피카토다.", "트레몰로와 피치카토는 긴장과 가벼움을 만드는 색채다. 남용하면 싸구려로 들린다."], "path": [{"n": "스트링 4트랙 만들기", "s": ["<k>⌥⌘N</k> → 소프트웨어 악기 → 개수 <v>4</v>", "각 트랙에 <k>Y</k> 라이브러리에서 바이올린, 비올라, 첼로, 베이스 패치", "트랙 이름과 색 지정", "<b>트랙 스택</b>으로 묶기: 4트랙 선택 후 <k>⇧⌘G</k> → <b>서밍 스택</b>"]}], "drill": ["C - Am - F - G 진행을 현악 4부로 편성한다. 각 성부가 음역 안에 있는지 확인한다.", "모든 성부에 CC11 곡선을 그려 살아 있게 만든다.", "같은 진행을 레가토 버전과 스타카토 버전으로 만들어 성격 차이를 듣는다."], "keys": [["⇧⌘G", "트랙 스택"], ["P", "피아노 롤"]], "chk": ["현악 4부 음역을 안다", "아래는 넓게 위는 좁게 배치한다", "CC11로 긴 음을 살린다"], "quiz": [{"q": "첼로의 최저음은?", "a": ["E1", "C3", "G2", "C2"], "c": 3, "e": "첼로는 C2부터다. 그 아래는 콘트라베이스의 영역이다."}]}, {"t": "현악기를 사람처럼", "goal": "활의 움직임을 미디로 옮겨 스트링이 연주처럼 들리게 만든다.", "con": ["건반으로 찍은 스트링이 가짜처럼 들리는 이유는 음정이나 리듬이 아니다. 실제 연주자가 하는 일을 하지 않아서다. 현악기 연주자가 하는 일은 하나로 요약된다. <b>활을 긋고, 방향을 바꾸고, 손가락으로 음을 만든다.</b> 이 셋을 미디로 옮기면 된다.", "<b>활은 이어진다.</b> 건반으로 치면 음과 음 사이에 미세한 틈이 생기지만, 실제 현악기는 활을 떼지 않는 한 소리가 끊기지 않는다. 피아노 롤에서 음 끝을 다음 음 시작과 <b>맞붙이거나 살짝 겹치게</b> 한다. <v>10~30</v>ms 겹치면 음원의 레가토 전환이 걸려 활을 바꾸지 않고 이어 긋는 소리가 난다. 겹치지 않으면 음마다 새로 활을 긋는 소리가 되어 뚝뚝 끊긴다.", "<b>활은 언젠가 바뀐다.</b> 활에는 길이가 있어서 한 방향으로 계속 그을 수 없다. 느린 곡의 지속음이라면 <v>4~8</v>초쯤에서, 빠른 곡이라면 프레이즈가 끝나는 자리에서 방향이 바뀐다. 미디에서는 그 자리의 음 사이를 <v>20~50</v>ms 벌려 표시한다. 이 틈이 없으면 활이 무한히 긴 셈이라 사람이 아니다. 네 마디쯤마다 한 번, 또는 선율이 한 덩어리를 마칠 때가 기준이다.", "<b>활 방향은 강약을 만든다.</b> 아래로 긋는 다운보는 팔 무게가 실려 강하고, 위로 긋는 업보는 상대적으로 약하다. 그래서 실제 연주는 강한 박에 다운보가 오도록 짠다. 미디에서 이것을 흉내 내려면 마디 첫 박과 강조하는 음의 벨로시티를 <v>10~15</v> 높이고 그다음 음을 낮춘다. 세기가 기계적으로 고르면 활이 없는 소리가 된다.", "<b>긴 음은 살아 있어야 한다.</b> 앞에서 본 CC11로 한다. 현악기의 지속음은 <b>시작보다 중간이 조금 크다</b>. 활이 중간에서 가장 안정적이기 때문이다. 온음표 하나라면 CC11을 <v>60</v>에서 시작해 <v>75</v>까지 올렸다가 <v>65</v>로 내린다. 포인트 셋이면 충분하고 폭은 <v>10~15</v>면 된다. 직선으로 두면 신디사이저다.", "<b>비브라토는 나중에 온다.</b> 연주자는 음을 낸 뒤 왼손이 자리를 잡고 나서 떨기 시작한다. 음이 시작하자마자 비브라토가 최대면 부자연스럽다. 긴 음이라면 길이의 <v>3</v>분의 <v>1</v> 지점부터 서서히 올린다. 음원에 따라 CC1이 비브라토 양을 맡거나 별도 CC가 있다. 짧은 음에는 비브라토가 거의 없다.", "<b>주법을 섞는다.</b> 전부 레가토면 밋밋하다. 긴 배경은 <b>서스테인</b>, 이어지는 선율은 <b>레가토</b>, 강조는 <b>마르카토</b>, 짧은 음형은 <b>스타카토</b>나 <b>스피카토</b>, 긴장은 <b>트레몰로</b>, 가벼움은 <b>피치카토</b>다. 두세 가지만 섞어도 크게 달라진다. 다만 트레몰로와 피치카토는 색채라 남용하면 싸구려로 들린다.", "주법마다 <b>소리가 나오는 시간이 다르다</b>. 레가토와 서스테인은 활이 현에 닿아 소리가 커지기까지 시간이 걸려 <v>40~80</v>ms 늦다. 그래서 음을 격자보다 <v>20~60</v>ms 앞으로 당겨야 박에 맞게 들린다. 스타카토와 피치카토는 즉시 나오므로 그대로 둔다. 한 트랙에 주법이 섞여 있으면 음마다 다르게 당긴다.", "<b>섹션은 한 사람이 아니다.</b> 바이올린 1파트에 열 명이 앉아 있다면 열 명이 정확히 같은 순간에 활을 긋지 않는다. 미디에서는 파트마다 리전 딜레이를 다르게 준다. 바이올린1 <v>0</v>, 바이올린2 <v>+7</v>ms, 비올라 <v>-5</v>ms, 첼로 <v>+12</v>ms 정도다. 완전히 맞으면 신디사이저처럼 들린다.", "<b>음역을 지킨다.</b> 앞 절의 표대로 바이올린은 G3부터, 비올라는 C3부터, 첼로는 C2부터, 콘트라베이스는 E1부터다. 이보다 낮은 음은 음원이 소리를 내더라도 실제로는 없는 음이다. 그리고 각 악기의 가장 낮은 음 네 개는 개방현이라 비브라토가 안 걸리고 소리가 다르다."], "path": [{"n": "레가토 만들기", "s": ["프레이즈 안의 음 전부 선택", "<b>기능 → 노트 이벤트 → 노트 길이 강제 레가토</b>", "프레이즈 끝 음만 골라 길이를 <v>20~50</v>ms 줄여 활 바꿈 표시", "재생해 바뀌는 자리가 자연스러운지 확인"]}, {"n": "활 방향 흉내", "s": ["마디 첫 박과 강조 음 선택", "벨로시티를 <v>+10~15</v>", "그다음 음은 <v>-5~10</v>", "강약이 번갈아 나오는지 확인"]}, {"n": "긴 음에 표정", "s": ["긴 음 선택 → 피아노 롤 하단 <b>오토메이션/MIDI</b>", "레인을 <b>Expression (11)</b>로", "음 시작 전 <v>60</v>, 중간 <v>75</v>, 끝 <v>65</v>", "비브라토는 길이의 <v>1/3</v> 지점부터 CC1 상승"]}, {"n": "섹션 어긋내기", "s": ["바이올린1 리전 <k>I</k> 인스펙터 <b>딜레이</b> <v>0</v>", "바이올린2 <v>+7</v>ms · 비올라 <v>-5</v>ms · 첼로 <v>+12</v>ms", "전체 재생해 뭉치지 않고 넓어지는지 확인"]}], "drill": ["같은 프레이즈를 음을 겹친 것과 띄운 것으로 만들어 비교한다.", "온음표 하나에 CC11 직선과 곡선을 각각 그려 듣는다.", "마디 첫 박 벨로시티를 올린 것과 전부 고른 것을 비교한다.", "섹션 넷에 딜레이를 다르게 주고 전부 0인 것과 비교한다."], "keys": [["P", "피아노 롤"], ["I", "인스펙터"], ["A", "오토메이션"]], "chk": ["활이 이어지고 언젠가 바뀐다는 것을 미디로 표현한다", "긴 음에 CC11 곡선을 그린다", "주법마다 타이밍을 다르게 보정한다", "섹션을 어긋나게 둔다"], "quiz": [{"q": "스트링이 뚝뚝 끊겨 들린다면 먼저 볼 것은?", "a": ["템포", "음과 음이 겹쳐 있는지", "리버브", "음량"], "c": 1, "e": "10~30ms 겹치면 레가토 전환이 걸려 활을 바꾸지 않고 이어 긋는 소리가 난다."}, {"q": "긴 현악 음의 CC11 모양은?", "a": ["계속 커짐", "직선", "시작보다 중간이 조금 큰 곡선", "계속 줄어듦"], "c": 2, "e": "활이 중간에서 가장 안정적이다."}, {"q": "활 방향을 미디로 흉내 내는 방법은?", "a": ["마디 첫 박 벨로시티를 10~15 높인다", "CC1을 쓴다", "리버브를 늘린다", "팬을 움직인다"], "c": 0, "e": "다운보는 팔 무게가 실려 강하고 업보는 약하다. 세기가 고르면 활이 없는 소리가 된다."}, {"q": "섹션 파트를 전부 정확히 맞추면?", "a": ["깔끔하다", "신디사이저처럼 들린다", "리듬이 산다", "음정이 맞는다"], "c": 1, "e": "바이올린 1파트 열 명이 같은 순간에 긋지 않는다. 5~15ms씩 어긋난다."}], "s": 6, "d": 47}, {"t": "관악기를 사람처럼", "goal": "숨과 혀의 움직임을 미디로 옮겨 관악기가 연주처럼 들리게 만든다.", "con": ["관악기는 현악기와 다른 제약이 있다. <b>숨이 유한하다</b>는 것이다. 활은 방향을 바꾸면 계속 그을 수 있지만 숨은 들이마셔야 한다. 이 하나가 관악기 미디의 절반을 결정한다.", "<b>숨자리를 반드시 넣는다.</b> 프레이즈가 끝나는 자리에서 음 사이를 <v>20~50</v>ms 벌린다. 긴 프레이즈라면 <v>100</v>ms 이상 벌려야 실제로 숨을 쉰 것처럼 들린다. 사람이 한 호흡에 부는 길이는 대개 <v>4~8</v>초, 길어야 <v>12</v>초다. 그보다 긴 선율을 끊김 없이 이어 두면 사람이 아니라는 것이 바로 들린다. 선율을 짤 때부터 숨자리를 염두에 두면 자연스러워진다.", "<b>텅잉과 슬러를 구분한다.</b> 혀로 음을 끊어 내는 것이 텅잉이고, 혀를 쓰지 않고 이어 부는 것이 슬러다. 미디에서는 음을 떼면 텅잉, 겹치면 슬러가 된다. 빠른 패시지를 전부 이으면 흐물거리고 전부 끊으면 딱딱하다. <b>두세 음씩 묶어 잇고 그 사이를 끊는</b> 것이 실제 연주에 가깝다. 스타카토가 많은 음형은 각 음을 짧게 두고 사이를 벌린다.", "<b>숨은 세기를 만든다.</b> 관악기의 음량은 숨의 압력이라 한 음 안에서도 계속 변한다. CC11로 표현하는데 현악기와 모양이 조금 다르다. 관악기의 지속음은 <b>시작에 살짝 부풀었다가 안정되고 끝에서 빠진다</b>. <v>55</v>에서 시작해 <v>70</v>까지 빠르게 올랐다가 <v>65</v>로 안정되고 끝에서 <v>55</v>로 내리는 모양이다. 시작이 현악기보다 빠르다.", "<b>음역에 따라 세기가 정해진다.</b> 관악기는 낮은 음에서 여리게 부는 것이 어렵고, 높은 음에서 여리게 부는 것은 더 어렵다. 음역의 양 끝에서는 세게 쓰는 것이 자연스럽고, 여린 표현은 중간 음역에서 한다. 이 제약을 무시하고 높은 음을 아주 여리게 찍으면 음원이 소리를 내더라도 실제로는 불가능한 연주가 된다.", "<b>비브라토는 악기마다 다르다.</b> 플루트와 색소폰은 비브라토를 많이 쓰고, 오보에는 절제하고, 클라리넷은 클래식에서 거의 쓰지 않는다. 금관은 트럼펫과 트롬본이 상황에 따라 쓴다. 무조건 넣지 말고 그 악기의 관례를 따른다. 넣을 때는 현악기와 마찬가지로 음이 시작한 뒤 조금 지나서 올린다.", "<b>어택이 악기의 성격이다.</b> 플루트는 바람 소리가 먼저 나고, 트럼펫은 입술이 열리는 순간이 또렷하고, 색소폰은 리드가 울리기 시작하는 질감이 있다. 좋은 음원은 이것을 벨로시티로 구분한다. 벨로시티가 낮으면 부드러운 어택, 높으면 또렷한 어택이 나오므로, 강조하는 음의 벨로시티를 올리면 음량만 커지는 것이 아니라 어택이 바뀐다.", "<b>운지가 만드는 한계도 있다.</b> 관악기는 음을 바꿀 때 손가락이 움직여야 해서 아주 빠른 도약은 어렵다. 한 옥타브 이상 뛰는 것이 연속으로 나오면 실제로는 불가능에 가깝다. 특히 금관은 입술 모양까지 바꿔야 해서 더 느리다. 빠른 패시지는 붙어 있는 음들로 짠다.", "<b>섹션은 현악보다 적게 어긋낸다.</b> 관악 섹션은 대개 파트당 한두 명이라 현악처럼 뭉개지지 않는다. <v>3~8</v>ms 정도면 충분하고, 현악처럼 크게 벌리면 따로 노는 것으로 들린다.", "정리하면 관악기 미디는 이 순서로 손본다. 숨자리를 먼저 정하고, 텅잉과 슬러를 나누고, CC11로 숨의 압력을 그리고, 음역에 맞게 세기를 조절한다. 앞의 현악기 절과 겹치는 것은 CC11과 비브라토 정도이고 나머지는 다르다."], "path": [{"n": "숨자리 만들기", "s": ["선율을 <v>4~8</v>초 단위로 나눈다", "나뉘는 자리의 앞 음 길이를 <v>50~100</v>ms 줄인다", "재생하며 숨 쉴 시간이 있는지 확인", "너무 촉박하면 앞 음을 더 줄인다"]}, {"n": "텅잉과 슬러", "s": ["빠른 음형에서 두세 음씩 묶는다", "묶은 안쪽은 <b>강제 레가토</b>로 이어 붙임", "묶음 사이는 <v>30~60</v>ms 벌림", "재생해 흐물거리지도 딱딱하지도 않은지 확인"]}, {"n": "숨의 압력 그리기", "s": ["긴 음 선택 → 하단 <b>오토메이션/MIDI</b> → <b>Expression (11)</b>", "음 시작 전 <v>55</v>", "시작 직후 <v>70</v>, 중간 <v>65</v>, 끝 <v>55</v>", "현악기보다 시작이 빠르게 오르는지 확인"]}, {"n": "음역 점검", "s": ["높은 음 중 여리게 찍은 것을 찾는다", "벨로시티와 CC11을 올려 세게 바꾼다", "여린 표현은 중간 음역으로 옮긴다"]}], "drill": ["긴 선율에 숨자리를 넣은 것과 안 넣은 것을 비교한다.", "빠른 음형을 전부 잇기, 전부 끊기, 두세 음씩 묶기 세 가지로 만들어 듣는다.", "같은 음을 벨로시티 50과 110으로 찍어 어택이 어떻게 다른지 확인한다."], "keys": [["P", "피아노 롤"], ["I", "인스펙터"], ["A", "오토메이션"]], "chk": ["숨자리를 4~8초마다 넣는다", "텅잉과 슬러를 나눈다", "음역 끝에서는 세게 쓴다"], "quiz": [{"q": "관악 선율을 끊김 없이 열여섯 마디 이어 두면?", "a": ["음량이 준다", "음정이 틀어진다", "숨을 안 쉰 셈이라 사람이 아닌 것이 들린다", "부드럽다"], "c": 2, "e": "한 호흡은 대개 4~8초, 길어야 12초다."}, {"q": "빠른 관악 패시지를 자연스럽게 만들려면?", "a": ["벨로시티를 고르게", "두세 음씩 묶어 잇고 사이를 끊는다", "전부 잇는다", "전부 끊는다"], "c": 1, "e": "전부 이으면 흐물거리고 전부 끊으면 딱딱하다."}, {"q": "관악기 지속음의 CC11 모양이 현악기와 다른 점은?", "a": ["시작에 살짝 부풀었다가 안정된다", "같다", "계속 줄어든다", "직선이다"], "c": 0, "e": "숨의 압력이라 시작이 현악기보다 빠르게 오른다."}, {"q": "높은 음을 아주 여리게 찍으면?", "a": ["자연스럽다", "음정이 낮아진다", "문제없다", "실제로는 불가능한 연주가 된다"], "c": 3, "e": "관악기는 음역 끝에서 여리게 부는 것이 어렵다. 여린 표현은 중간 음역에서."}], "s": 6, "d": 48}, {"d": 49, "s": 6, "t": "기타를 사람처럼", "goal": "줄과 손가락의 제약을 지켜 미디 기타를 연주처럼 만든다.", "con": ["미디 기타가 가짜처럼 들리는 이유는 대개 셋이다. <b>여섯 줄로 칠 수 없는 화음</b>을 찍었거나, <b>스트럼이 동시에</b> 울리거나, <b>벨로시티가 균일</b>해서다. 하나씩 고친다.", "<b>줄은 여섯 개다.</b> 최대 여섯 음이고, 그것도 한 손가락이 닿는 범위 안이어야 한다. 손가락은 넷이라 네 프렛 안에서 짚는다. 실제 코드 폼을 참고해 음을 고른다. 개방현 코드는 낮은 근음과 넓은 간격이 특징이고, 바레 코드는 근음과 5음이 겹쳐 두껍다. 피아노처럼 음을 촘촘히 쌓으면 기타가 아니다.", "<b>스트럼은 훑는 것이다.</b> 위에서 아래로 훑기 때문에 음이 시차를 두고 울린다. 미디에서 음마다 <v>8~20</v>ms씩 어긋나게 배치한다. 다운 스트로크는 낮은 줄부터, 업 스트로크는 높은 줄부터다. 빠른 곡일수록 시차가 짧고 느린 발라드일수록 길다. 로직에서는 여러 음을 선택하고 <b>기능 → MIDI 변환 → 스트럼</b>을 쓰거나, 리전 인스펙터의 <b>Q-플램</b>으로도 된다.", "<b>다운과 업이 번갈아 온다.</b> 연속으로 다운만 치는 것은 느린 곡에서만이고, 보통은 다운과 업이 교대한다. 다운이 강하고 업이 약하므로 벨로시티를 <v>10~20</v> 차이로 번갈아 준다. 업 스트로크에서는 낮은 줄이 빠지는 경우도 많아 음 수를 줄이기도 한다.", "<b>팜뮤트</b>는 오른손 손날로 줄을 살짝 눌러 치는 것이다. 소리가 짧고 답답해지며 록과 메탈의 벌스에서 많이 쓴다. 음원에 전용 아티큘레이션이 있고, 없으면 음 길이를 아주 짧게 하고 벨로시티를 낮춘다. 코러스에서 팜뮤트를 풀면 소리가 확 열려 구간이 갈린다.", "<b>왼손 주법</b>이 기타의 표정을 만든다. <b>해머온</b>은 줄을 뜯지 않고 손가락으로 때려 높은 음을 내는 것이고, <b>풀오프</b>는 반대로 손가락을 떼며 낮은 음을 내는 것이다. 둘 다 뜯는 소리가 없어 부드럽다. 미디에서는 전용 아티큘레이션을 쓰거나, 없으면 그 음의 벨로시티를 <v>-25</v> 낮추고 앞 음과 겹친다.", "<b>슬라이드</b>는 손가락을 프렛 위로 미끄러뜨리는 것이고, <b>벤딩</b>은 줄을 밀어 음정을 올리는 것이다. 벤딩은 피치 벤드로 표현한다. 반음이면 벤드 범위 안에서 절반, 온음이면 최대까지 올린다. 올라가는 데 시간이 걸리므로 <v>50~150</v>ms에 걸쳐 곡선을 그린다. 실제 연주는 벤딩 뒤에 비브라토가 따라오는 경우가 많다.", "<b>하모닉스</b>는 줄을 살짝 대고 뜯어 맑은 고음을 내는 것이다. 12프렛, 7프렛, 5프렛에서 잘 난다. 전용 아티큘레이션이 없으면 흉내 내기 어렵다. 전환 자리의 색채로 쓴다.", "<b>아르페지오는 겹쳐 울린다.</b> 뜯은 줄은 다음 줄을 뜯어도 계속 울린다. 그래서 각 음의 길이를 다음 음까지, 또는 그 이상으로 늘려야 한다. 음을 짧게 끊으면 기타가 아니라 하프시코드처럼 들린다.", "<b>일렉트릭은 앰프가 소리의 절반이다.</b> 클린한 미디를 만든 뒤 <b>Amp Designer</b>나 <b>Pedalboard</b>를 얹는다. 순서는 실제 신호 흐름과 같아서 <b>Pedalboard가 앞, Amp Designer가 뒤</b>다. 반대로 두면 앰프가 만든 소리에 페달이 걸려 실제 기타에서 나올 수 없는 소리가 된다.", "Amp Designer는 앰프와 캐비닛과 마이크 위치를 통째로 고르는 도구라 소리의 큰 성격이 여기서 정해진다. Pedalboard는 그 앞에 두는 페달들이고, 오버드라이브·코러스·딜레이 순으로 늘어놓는다. 먼저 앰프를 고르고 그다음 페달을 얹는다.", "<b>더블링</b>은 기타의 기본이다. 같은 파트를 두 번 치고 좌우로 벌린다. 미디에서는 복사한 뒤 한쪽의 타이밍과 벨로시티를 미세하게 흔들거나, 리전 딜레이를 <v>10~20</v>ms 다르게 준다. 완전히 같은 것을 복사만 하면 폭이 안 생기고 음량만 커진다."], "path": [{"n": "스트럼 만들기", "s": ["코드 음 전부 선택", "<b>기능 → MIDI 변환 → 스트럼</b> 또는 리전 인스펙터 <b>Q-플램</b>", "다운은 낮은 음부터, 업은 높은 음부터", "간격 <v>8~20</v>ms. 빠른 곡은 짧게"]}, {"n": "다운·업 교대", "s": ["마디 안에서 다운 자리 음 선택 → 벨로시티 <v>+10~20</v>", "업 자리 음 → 벨로시티 <v>-10</v>", "업에서 낮은 줄 한두 음 삭제"]}, {"n": "해머온·풀오프 흉내", "s": ["이어지는 음 중 뜯지 않을 음 선택", "벨로시티를 <v>-25</v>", "앞 음과 <v>10~20</v>ms 겹치게"]}, {"n": "벤딩", "s": ["벤딩할 음 선택 → 하단 <b>오토메이션/MIDI</b> → <b>Pitch Bend</b>", "음 시작에 <v>0</v>", "<v>50~150</v>ms에 걸쳐 반음이면 절반, 온음이면 최대까지", "도달한 뒤 비브라토를 얹으면 실제 연주에 가깝다"]}, {"n": "앰프 체인", "s": ["<b>Pedalboard</b>를 앞 슬롯에", "<b>Amp Designer</b>를 뒤 슬롯에", "앰프를 먼저 고르고 페달을 얹는다"]}], "drill": ["같은 코드를 시차 없이, 10ms 시차로, 20ms 시차로 만들어 비교한다.", "벌스를 팜뮤트로, 코러스를 오픈으로 만들어 구간이 갈리는지 확인한다.", "기타 파트를 복사해 한쪽만 흔든 것과 그대로 복사한 것을 비교한다."], "keys": [["P", "피아노 롤"], ["I", "인스펙터"], ["A", "오토메이션"], ["⌘D", "복제"]], "chk": ["여섯 음 안에서 실제 코드 폼으로 찍는다", "스트럼에 시차를 준다", "다운과 업을 교대한다", "Pedalboard를 앞에 둔다"], "quiz": [{"q": "미디 코드가 기타처럼 안 들리는 첫째 이유는?", "a": ["여섯 줄로 칠 수 없는 화음이라서", "리버브 때문", "음정이 틀려서", "템포 때문"], "c": 0, "e": "최대 여섯 음이고 손가락 넷이 네 프렛 안에서 짚는 범위여야 한다."}, {"q": "스트럼의 음 시차는?", "a": ["8~20ms", "없다", "1박", "100ms"], "c": 0, "e": "빠른 곡일수록 짧고 느린 발라드일수록 길다."}, {"q": "해머온을 미디로 흉내 내려면?", "a": ["음정을 올린다", "벨로시티를 낮추고 앞 음과 겹친다", "피치 벤드", "길이를 늘린다"], "c": 1, "e": "뜯는 소리가 없어 부드럽다. 전용 아티큘레이션이 있으면 그것을 쓴다."}, {"q": "Pedalboard와 Amp Designer의 순서는?", "a": ["앰프가 앞", "같이 못 쓴다", "페달이 앞", "상관없다"], "c": 2, "e": "실제 기타 신호 흐름과 같다. 반대로 두면 앰프가 만든 소리에 페달이 걸린다."}]}, {"t": "기타: 줄과 톤의 디테일", "goal": "줄 선택, 파워 코드, 뮤트 스트로크, 노이즈, 튜닝까지 다룬다.", "con": ["앞 절이 오른손이 하는 일이었다면 이 절은 <b>왼손과 줄이 하는 일</b>이다. 같은 음이라도 어느 줄에서 내느냐에 따라 소리가 다르고, 실제 기타리스트는 그걸 골라 친다.", "<b>같은 음을 여러 줄에서 낼 수 있다.</b> <v>E3</v>는 6번 줄 <v>12</v>프렛에서도, 3번 줄 <v>9</v>프렛에서도 난다. 낮은 줄에서 높이 짚으면 두껍고 어둡고, 높은 줄에서 낮게 짚으면 밝고 또렷하다. 솔로를 칠 때 연주자는 한 줄에서 길게 가거나 여러 줄을 오가며 음색을 바꾼다. 미디에서는 이 선택이 없으므로 음원 아티큘레이션이나 벨로시티로 대신한다.", "<b>파워 코드</b>는 근음과 <v>5</v>음만 쓴다. <v>3</v>음이 없어 장조도 단조도 아니고, 그래서 왜곡을 크게 걸어도 뭉개지지 않는다. 록과 메탈의 기본이다. 미디에서 세 음짜리 코드를 찍고 왜곡을 걸었는데 지저분하다면 <v>3</v>음을 빼면 대개 해결된다. 옥타브를 더해 근음·5음·옥타브 세 음으로 두기도 한다.", "<b>뮤트 스트로크</b>는 왼손으로 줄을 전부 눌러 음정 없이 리듬만 내는 것이다. 팜뮤트가 오른손으로 살짝 누르는 것이라면 이쪽은 왼손으로 완전히 죽인다. 펑크와 레게의 커팅 기타가 이것이고, 음정 있는 음과 번갈아 나오면서 리듬을 만든다. 음원에 전용 아티큘레이션이 있고, 없으면 벨로시티 <v>30~50</v>의 아주 짧은 음으로 흉내 낸다.", "<b>노이즈가 실제 기타를 만든다.</b> 손가락이 줄 위를 미끄러지는 프렛 노이즈, 피크가 줄에 닿는 소리, 앰프의 배경 잡음이 전부 실제 연주에 있다. 좋은 음원은 이것들을 별도 키나 자동 재생으로 갖고 있다. 완전히 깨끗한 기타는 기타가 아니다. 다만 노이즈를 크게 두면 지저분하니 <v>-18</v>dB 아래로 깔아 둔다.", "<b>캐포와 오픈 튜닝</b>도 알아야 한다. 캐포는 프렛에 걸어 전체 음을 올리는 도구인데, 그러면 개방현 코드 폼으로 다른 조를 칠 수 있다. 그래서 캐포를 쓴 곡은 음역이 높고 보이싱이 개방현 특유의 넓은 간격을 갖는다. 오픈 튜닝은 줄을 다르게 조율해 개방현만으로 코드가 나게 하는 것이고, 슬라이드 기타와 포크에서 쓴다. 미디에서 이런 곡을 흉내 내려면 그 음역과 보이싱을 따라야 한다.", "<b>어쿠스틱과 일렉트릭은 다르게 찍는다.</b> 어쿠스틱은 몸통이 울려 저역이 많고 스트럼이 크게 들린다. 코드를 여섯 음 다 쓰고 시차를 길게 준다. 일렉트릭은 앰프가 소리를 만들어 저역이 적고, 왜곡이 걸리면 음이 적을수록 또렷하다. 파워 코드나 두 음짜리 보이싱이 많다. 같은 미디를 두 악기에 보내면 어느 한쪽은 어색해진다.", "<b>솔로는 프레이즈로 짠다.</b> 음을 나열하는 것이 아니라 짧은 덩어리를 만들고 그 사이에 쉼을 둔다. 실제 기타리스트는 한 손가락 위치에서 낼 수 있는 음들로 프레이즈를 짜므로, 한 프레이즈 안의 음들은 대개 한 옥타브 안에 모여 있다. 미디에서 두 옥타브를 오르내리는 솔로를 찍으면 기타로 불가능한 연주가 된다.", "<b>벤딩 뒤에는 릴리스가 있다.</b> 줄을 밀어 올린 뒤 원래 음으로 내리는 것인데, 올릴 때보다 빠르게 떨어진다. 피치 벤드로 그릴 때 올라가는 곡선은 <v>50~150</v>ms, 내려오는 곡선은 <v>30~80</v>ms로 두면 자연스럽다. 내려오지 않고 그대로 끝나는 벤딩도 있다."], "path": [{"n": "파워 코드로 바꾸기", "s": ["왜곡이 걸린 기타 트랙의 코드를 확인", "각 코드에서 <v>3</v>음을 삭제", "근음과 <v>5</v>음, 필요하면 옥타브만 남김", "왜곡이 뭉개지지 않는지 확인"]}, {"n": "커팅 기타 만들기", "s": ["음정 있는 코드와 뮤트를 번갈아 배치", "뮤트 음은 벨로시티 <v>30~50</v>, 길이 <v>1/32</v>", "전용 아티큘레이션이 있으면 지정", "16분음표 격자에서 리듬을 짠다"]}, {"n": "노이즈 얹기", "s": ["음원의 노이즈 키를 찾는다", "프레이즈가 바뀌는 자리에 배치", "노이즈 트랙을 따로 두면 <v>-18</v>dB 아래로", "과하면 지저분하니 적게"]}, {"n": "벤딩 왕복", "s": ["<b>Pitch Bend</b> 레인 열기", "올림 <v>50~150</v>ms 곡선", "정점에서 잠시 유지", "내림 <v>30~80</v>ms로 더 빠르게"]}], "drill": ["세 음 코드와 파워 코드에 같은 왜곡을 걸어 비교한다.", "커팅 기타 두 마디를 만들어 리듬이 서는지 확인한다.", "두 옥타브를 오가는 솔로와 한 옥타브 안 솔로를 비교한다."], "keys": [["P", "피아노 롤"], ["A", "오토메이션"], ["I", "인스펙터"]], "chk": ["왜곡에는 3음을 뺀다", "노이즈를 작게 깐다", "프레이즈를 한 옥타브 안에서 짠다"], "quiz": [{"q": "왜곡 건 기타 코드가 지저분하다면?", "a": ["EQ로 깎는다", "왜곡을 줄인다", "3음을 뺀다", "음량을 줄인다"], "c": 2, "e": "파워 코드는 근음과 5음만 써서 왜곡에서 뭉개지지 않는다."}, {"q": "커팅 기타의 뮤트 음은?", "a": ["왼손으로 전부 눌러 음정 없이 리듬만", "음정 있는 짧은 음", "하모닉스", "팜뮤트와 같다"], "c": 0, "e": "벨로시티 30~50의 아주 짧은 음으로 흉내 낸다. 펑크와 레게의 핵심."}, {"q": "기타 솔로를 두 옥타브 오르내리게 찍으면?", "a": ["화려하다", "문제없다", "기타로 불가능한 연주가 된다", "벤딩이 필요하다"], "c": 2, "e": "한 손가락 위치에서 낼 수 있는 음들로 프레이즈를 짠다."}], "s": 6, "d": 50}, {"d": 51, "s": 7, "t": "음역 배치", "goal": "악기별 주파수 대역을 파악하고 겹침을 정리한다.", "con": ["곡이 탁하게 들리는 가장 큰 원인은 여러 악기가 같은 음역에 몰려 있기 때문이다. 믹스로 고치기 전에 편곡에서 자리를 나누는 것이 정답이다.", "음역을 네 층으로 나눠 생각한다. 저역은 <v>20~200</v>Hz로 킥과 베이스, 중저역은 <v>200~800</v>Hz로 기타 코드와 왼손 피아노, 중고역은 <v>800~4000</v>Hz로 보컬과 리드, 고역은 <v>4000</v>Hz 이상으로 하이햇과 공기감이다.", "저역에는 한 번에 하나만 둔다. 하나만인 이유는 귀의 분해능이다. 두 소리를 따로 듣는 데 필요한 주파수 간격이 낮은 대역일수록 넓어져서 가까운 두 저음은 하나의 뭉개진 소리로 합쳐 들리고, 파장이 길어 위상 간섭의 골도 깊다. 킥과 베이스가 같은 음역에서 싸우면 둘 다 흐려진다. 킥을 <v>60</v>Hz 부근, 베이스를 <v>90</v>Hz 부근으로 나누는 식으로 정한다. 이렇게 나누면 둘 다 들린다. 킥은 가슴을 치는 무게로, 베이스는 음정이 있는 심으로 각자 자리를 갖는다. 나누지 않으면 합쳐진 저역이 하나의 뭉친 소리가 되어 킥의 타격도 베이스의 음정도 안 들린다.", "보컬이 있는 곡이라면 중고역은 보컬의 자리다. 다른 악기의 화려한 움직임을 그 자리에서 빼면 보컬이 저절로 들린다.", "같은 코드를 두 악기가 칠 때는 옥타브를 다르게 하거나 한쪽이 일부 음만 맡는다."], "path": [{"n": "음역 확인", "s": ["채널 스트립 이펙트 슬롯 → <b>Channel EQ</b>", "분석기 버튼 켜기 → 실시간 스펙트럼 확인", "여러 트랙을 하나씩 솔로로 들으며 어디에 몰려 있는지 확인"]}], "drill": ["기존 프로젝트에서 트랙별 주요 음역을 표로 적는다. 겹치는 곳을 찾는다.", "겹친 두 악기 중 하나를 옥타브 올리거나 음을 덜어내고 다시 듣는다.", "킥과 베이스만 솔로로 듣고 서로 다른 음역에 있는지 확인한다."], "keys": [["S", "솔로"], ["X", "믹서"]], "chk": ["네 개 음역 층을 안다", "저역에 하나만 두는 원칙을 지킨다", "보컬 자리를 비워둔다"], "quiz": [{"q": "곡이 탁하게 들리는 가장 흔한 원인은?", "a": ["같은 음역에 악기가 몰림", "템포가 느림", "리버브 부족", "트랙 수가 적음"], "c": 0, "e": "편곡 단계에서 음역을 나누는 것이 근본 해결책이다."}]}, {"d": 52, "s": 7, "t": "리듬 레이어", "goal": "기본 박, 세분, 강조 세 층으로 리듬을 구성한다.", "con": ["그루브는 드럼만의 일이 아니다. 어떤 악기든 짧게 끊어 치면 리듬 악기가 된다.", "세 층으로 생각한다. 기본 박을 잡는 층(킥과 베이스), 세분을 채우는 층(하이햇, 셰이커, 기타 커팅), 강조하는 층(스네어, 클랩, 악센트).", "세분 층이 비면 곡이 느슨해진다. 하이햇 대신 셰이커나 짧은 신스 스타카토, 또는 기타 뮤트 커팅으로 채워도 된다.", "오프비트가 움직임을 만든다. 박과 박 사이에 놓인 소리가 곡을 앞으로 민다. 하우스의 오프비트 오픈 하이햇, 레게의 뒷박 기타가 대표적이다.", "악센트를 한 마디에 하나씩만 다르게 줘도 여덟 마디가 지루하지 않다. 8마디 중 마지막 마디를 살짝 다르게 만드는 것이 가장 쉬운 방법이다."], "path": [{"n": "세분 층 만들기", "s": ["새 소프트웨어 악기 트랙 → 퍼커션 패치", "16분음표로 셰이커 패턴 입력", "벨로시티를 강약 번갈아", "<k>Q</k> 퀀타이즈 강도 <v>85</v>퍼센트, 스윙 <v>55</v>"]}], "drill": ["기존 드럼 위에 셰이커 층을 하나 얹고 있고 없고를 비교한다.", "기타나 신스를 짧게 끊어 오프비트에 배치해 리듬 악기로 써본다.", "8마디 반복 구간에서 마지막 마디만 다르게 만든다."], "keys": [["Q", "퀀타이즈"], ["M", "뮤트"]], "chk": ["세 층 개념을 안다", "세분 층을 채워봤다", "오프비트로 움직임을 만들었다"], "quiz": [{"q": "곡이 느슨하게 들릴 때 보강하면 좋은 층은?", "a": ["기본 박 층", "저역 층", "강조 층", "세분 층"], "c": 3, "e": "16분음표 계열의 세분 층이 비면 곡이 늘어져 들린다."}]}, {"t": "보컬 편성: 리드, 더블, 하모니", "goal": "목소리를 몇 겹으로 쌓을지 정하고 구간마다 다르게 배치한다.", "con": ["보컬도 편곡한다. 리드 하나만 있는 곡과 여러 겹이 쌓인 곡은 다른 인상을 준다. 겹을 정하는 것은 녹음 전에 할 일이고, 다 부른 뒤에 정하려 하면 다시 부르게 된다.", "층은 네 가지다. 리드는 곡의 선율을 부르는 주인공이다. 더블은 리드와 같은 것을 한 번 더 부른 것으로, 두께를 만든다. 하모니는 리드와 다른 음을 부르는 화성 층이다. 애드리브는 빈 자리를 채우는 짧은 소리다.", "더블은 복사해서는 안 된다. 미디처럼 복사한 오디오는 원본과 완전히 같아서 두꺼워지는 대신 음량만 커진다. 사람이 두 번 부르면 발음과 음정과 타이밍이 미세하게 어긋나고, 그 어긋남이 두께가 된다. 좌우로 벌려 두면 폭까지 생긴다.", "하모니는 3도 위가 기본이다. 리드보다 3도 높게 부르면 밝아지고, 3도 아래면 두툼해진다. 6도 위는 3도 아래를 옥타브 올린 것과 같은 음이라 비슷하게 들리지만 음역이 달라 더 가볍다. 5도는 비어 있는 느낌이라 특정 장르가 아니면 잘 쓰지 않는다.", "하모니 음을 고를 때는 그 자리의 코드를 본다. 리드가 코드의 3음을 부르고 있으면 하모니는 5음이나 근음으로 간다. 코드에 없는 음으로 하모니를 붙이면 그 순간만 어긋나 들린다. 코드 트랙을 켜 두면 판단이 빨라진다.", "구간마다 다르게 쌓는 것이 실제 작업이다. 흔한 배치는 이렇다. 첫 벌스는 리드만. 프리코러스에서 더블을 넣어 밀어 올린다. 코러스에서 더블과 하모니를 다 넣는다. 브리지에서 다시 리드만으로 떨어뜨린다. 마지막 코러스에서 애드리브까지 얹는다. 이 오르내림이 곡의 에너지 곡선이 된다.", "층이 많아질수록 리드가 묻힌다. 하모니는 리드보다 <v>6~10</v>dB 아래, 더블은 <v>3~6</v>dB 아래에서 시작한다. 이 정도면 코러스가 넓어지고 두꺼워지는데 선율은 여전히 리드가 끈다. 하모니를 올리면 두 선율이 경쟁해서 무엇을 따라가야 할지 모르게 되고, 더블을 올리면 두 사람이 부르는 것으로 들려 리드의 초점이 흐려진다. 하모니가 또렷하게 들리면 이미 과한 것이다. 있는지 없는지 애매한 정도가 맞다.", "가사 발음도 맞춘다. 하모니가 리드와 다른 시점에 자음을 발음하면 두 사람이 따로 부르는 것으로 들린다. 특히 끝소리를 같은 지점에서 끊어야 한다."], "path": [{"n": "겹 계획 세우기", "s": ["어레인지먼트 마커를 보며 구간마다 어떤 층을 쓸지 종이에 적는다", "트랙을 미리 만들고 이름을 <b>LEAD</b>, <b>DBL L</b>, <b>DBL R</b>, <b>HARM</b>으로 지정", "<k>⇧⌘G</k>로 <b>VOX</b> 서밍 스택에 묶는다"]}, {"n": "하모니 음 확인", "s": ["<k>G</k> → 코드 트랙에 진행 입력", "리드 미디나 악보를 보며 그 자리 코드의 구성음 확인", "리드가 부르는 음 위의 코드음을 하모니 음으로 선택"]}, {"n": "층 배치", "s": ["더블은 팬 <v>L40</v>과 <v>R40</v>", "하모니는 <v>L25</v>와 <v>R25</v> 또는 가운데", "리드는 가운데 고정", "더블 <v>-4</v>dB, 하모니 <v>-8</v>dB에서 시작해 귀로 조정"]}], "drill": ["8마디 후렴에 리드만, 리드와 더블, 리드와 더블과 하모니 세 가지를 만들어 인상 차이를 적는다.", "같은 하모니를 3도 위와 3도 아래로 각각 만들어 비교한다.", "곡 전체의 구간별 보컬 층을 표로 그리고 에너지가 오르내리는지 확인한다."], "keys": [["⇧⌘G", "트랙 스택"], ["G", "글로벌 트랙"], ["R", "녹음"], ["X", "믹서"]], "chk": ["네 가지 층을 구분한다", "하모니 음을 코드에서 고른다", "구간마다 층을 다르게 쌓는다"], "quiz": [{"q": "더블을 복사로 만들면 안 되는 이유는?", "a": ["템포가 어긋나서", "용량이 커져서", "원본과 완전히 같아 두꺼워지지 않고 음량만 커져서", "저작권 때문에"], "c": 2, "e": "사람이 두 번 부를 때 생기는 미세한 어긋남이 두께를 만든다."}, {"q": "하모니 음을 고르는 기준은?", "a": ["아무 음이나", "그 자리 코드의 구성음", "리드와 같은 음", "항상 반음 위"], "c": 1, "e": "코드에 없는 음을 붙이면 그 순간만 어긋나 들린다."}, {"q": "하모니 음량의 적정 상태는?", "a": ["또렷하게 들리게", "리드보다 크게", "리드와 같게", "있는지 없는지 애매한 정도"], "c": 3, "e": "또렷하게 들리면 이미 과한 것이다. 리드보다 6~10dB 아래에서 시작한다."}], "d": 53, "s": 7}, {"d": 54, "s": 7, "t": "장르별 편성", "goal": "장르별 표준 편성과 템포를 안다.", "con": ["장르는 규칙이 아니라 재료 목록이다. 어떤 악기를 몇 개 쓰는지, 템포와 그루브가 어떤지, 무엇을 비워두는지가 장르를 만든다.", "곡을 시작할 때 정하는 순서가 있다. 템포와 박자를 먼저 잡고, 드럼의 뼈대를 세우고, 베이스로 저역을 정하고, 그다음 화성 악기와 선율을 올린다. 편성 목록부터 만들면 트랙만 늘고 소리는 안 난다.", "장르마다 안 쓰는 것이 있고, 그것이 쓰는 것만큼 장르를 만든다. 발라드에서 촘촘한 16분 하이햇을 빼고, 하우스에서 화려한 코드 진행을 빼고, 힙합에서 두꺼운 패드를 빼는 식이다. 재료를 더하기 전에 무엇을 비울지 정한다.", "발라드. 템포 <v>62~76</v>. 피아노, 스트링, 베이스, 부드러운 드럼, 패드. 벌스는 피아노와 목소리만, 코러스에서 스트링과 드럼이 들어온다. 저역은 얕게.", "팝. 템포 <v>100~120</v>. 드럼, 베이스, 기타 또는 신스 코드, 리드, 백보컬. 코러스에 훅이 반복된다. 세분 층이 항상 있다.", "알앤비. 템포 <v>70~92</v>. 성긴 킥과 스네어, 촘촘한 하이햇, 일렉트릭 피아노, 낮은 베이스, 넓은 패드. 코드가 7화음과 9화음 중심이다.", "힙합. 템포 <v>80~95</v>. 성긴 킥과 스네어, 16분 하이햇, 짧은 샘플이나 건반 루프, 808 베이스. 808 킥이 베이스를 겸하므로 별도 베이스를 겹치면 저역이 무너진다. 하이햇의 32분 연타와 스윙이 그루브를 만든다. 하위 갈래로 트랩, 붐뱁, 드릴이 있고 하이햇 밀도와 킥 패턴에서 갈린다. 트랩은 표기 템포를 <v>140~160</v>으로 적기도 하는데 체감은 그 절반이다. 같은 곡을 두 배로 세느냐 절반으로 세느냐의 차이일 뿐이다.", "로파이. 템포 <v>70~90</v>. 성긴 드럼, 재즈 화성의 건반, 낮은 베이스, 잡음과 테이프 흔들림. 일부러 고역을 깎고 음정을 미세하게 흔든다. 깨끗함을 목표로 하지 않는 유일한 계열이라 믹싱 원칙 일부가 반대로 간다.", "하우스. 템포 <v>122~128</v>. 4분 킥, 오프비트 하이햇, 클랩, 베이스라인, 코드 스탭. 같은 구간을 반복하며 필터를 움직이는 것이 이 장르의 문법이다.", "록. 템포 <v>120~160</v>. 드럼, 베이스, 리듬 기타 둘, 리드 기타, 보컬. 기타 두 대를 좌우로 벌린다.", "영화 음악. 템포 자유. 스트링, 목관, 금관, 타악, 피아노, 패드. 다이내믹 폭이 크고 CC11 작업이 대부분이다.", "장르 이름은 계층으로 되어 있다. 하우스와 테크노는 일렉트로닉 아래에 있고, 트랩과 붐뱁은 힙합 아래에 있다. 레퍼런스를 찾을 때 이 계층을 알면 검색을 넓히거나 좁힐 수 있다. 원하는 소리가 안 나오면 상위 이름으로 넓히고, 너무 많이 나오면 하위 이름으로 좁힌다.", "템플릿을 저장할 때는 트랙 목록만 넣지 말고 매번 다시 만들게 되는 것들을 함께 넣는다. 짧은 리버브와 긴 리버브 센드 버스 두 개, 이름과 색을 정해 둔 트랙, 어레인지먼트 마커 뼈대, 마스터의 라우드니스 미터까지. 그리고 <b>설정 → 일반 → 프로젝트 처리</b>에서 시동 동작을 내 템플릿으로 지정하면 로직을 켜는 순간 작업 준비가 끝난 상태로 시작한다."], "path": [{"n": "템플릿 만들기", "s": ["장르별 트랙 구성을 만든 뒤 <b>파일 → 템플릿으로 저장</b>", "다음부터 <b>파일 → 신규 → 나의 템플릿</b>에서 불러오기"]}], "drill": ["세 가지 장르를 골라 각각 트랙 목록을 종이에 적는다. 트랙 수와 이름까지.", "가장 자주 만들 장르 하나를 템플릿으로 저장한다.", "같은 코드 진행을 두 장르로 편성해 얼마나 달라지는지 확인한다.", "힙합과 로파이를 각각 8마디씩 만들어 무엇을 비웠는지 적는다."], "keys": [["⌥⌘N", "새 트랙"], ["⌘S", "저장"]], "chk": ["장르별 템포 범위를 안다", "템플릿을 하나 만들었다", "같은 진행을 두 장르로 편성해봤다", "정하는 순서를 안다", "장르마다 비우는 것을 말할 수 있다"], "quiz": [{"q": "하우스의 전형적인 템포 범위는?", "a": ["100~110", "122~128", "172~176", "70~92"], "c": 1, "e": "122~128 사이가 하우스의 표준 구간이다."}, {"q": "힙합에서 808 위에 별도 베이스를 겹치면?", "a": ["템포가 빨라진다", "아무 변화 없다", "808이 이미 베이스 역할이라 저역이 무너진다", "두꺼워진다"], "c": 2, "e": "808 킥이 베이스를 겸한다. 저역에는 한 번에 하나만 둔다는 원칙이 여기서도 적용된다."}, {"q": "곡을 시작할 때 가장 먼저 정하는 것은?", "a": ["마스터 체인", "템포와 박자", "리버브", "편성 목록"], "c": 1, "e": "템포와 박자 → 드럼 뼈대 → 베이스 → 화성과 선율 순서다."}]}, {"t": "전환 효과와 샘플 소재", "goal": "구간이 바뀌는 자리를 소재로 채우고, 남의 샘플을 안전하게 쓴다.", "con": ["곡의 구간이 바뀌는 자리는 그냥 두면 뚝 끊긴다. 벌스에서 코러스로 넘어갈 때 드럼과 악기만 바뀌면 앞뒤가 이어지지 않는다. 이 자리를 채우는 것이 전환 효과이고, 대부분 직접 만들지 않고 소재를 가져다 쓴다.", "소재는 방향으로 나뉜다. 라이저(Riser)는 점점 올라가며 긴장을 쌓는다. 코러스 직전 <v>2~4</v>마디에 걸어 절정 직전에 끝나게 둔다. 다운리프터(Downlifter)는 반대로 떨어진다. 코러스가 끝나고 힘이 빠지는 자리에 쓴다. 임팩트(Impact) 또는 부머(Boomer)는 한 번 크게 때리는 소리로, 코러스 첫 박에 정확히 얹어 시작을 못 박는다.", "소리의 성질로도 나뉜다. 노이즈 스윕은 화이트 노이즈에 필터를 열고 닫아 만든 바람 소리로, 어느 장르에나 무난하게 붙는다. 리버스 심벌은 심벌을 거꾸로 재생한 것이라 흡입되는 느낌을 준다. 스윕은 신스가 주파수를 훑고 지나가는 소리다.", "놓는 자리에 규칙이 있다. 라이저와 리버스 심벌은 다음 구간의 <b>첫 박에서 끝나야</b> 한다. 그래서 소재의 끝을 코러스 첫 박에 맞추고 앞쪽으로 늘린다. 뒤에서 앞으로 배치하는 것이다. 임팩트는 반대로 첫 박에서 시작한다. 이 둘을 겹쳐 쓰면 라이저가 차오르다 임팩트로 터지는 가장 흔한 전환이 만들어진다.", "음량은 생각보다 작다. 전환 효과는 곡의 뼈대가 아니므로 피크가 다른 악기보다 낮아야 한다. 앞에서 본 상대 순서에서 가장 뒤에 놓이는 층이다. 크게 넣으면 그 순간만 튀어서 오히려 흐름이 끊긴다.", "직접 만들 수도 있다. 신스에 화이트 노이즈를 켜고 필터 컷오프를 <v>4</v>마디에 걸쳐 올리는 오토메이션을 그리면 노이즈 라이저가 된다. 리버브를 크게 건 심벌을 바운스한 뒤 리전을 리버스하면 리버스 심벌이 된다. 소재를 사는 것보다 곡에 정확히 맞는다.", "이제 소재 자체를 다룬다. 샘플 팩은 원샷과 루프로 나뉜다. 원샷은 킥이나 클랩처럼 한 번 울리고 끝나는 소리다. 루프는 이미 연주된 구간이다. 배우는 단계에서는 원샷을 쓰는 편이 낫다. 루프는 편해 보이지만 남의 연주를 그대로 쓰는 것이라 내 곡의 리듬을 만드는 연습이 안 된다.", "원샷을 쓸 때 가장 흔한 실수는 음정을 안 맞추는 것이다. 킥과 808과 임팩트에는 각각 고유한 음높이가 있다. 곡이 F단조인데 킥이 G에 맞춰져 있으면 저역에서 계속 부딪힌다. 샘플러에 올려 음정을 확인하고 곡의 조에 맞춘다. 로직에서는 Quick Sampler에 넣고 <b>Tune</b>으로 조정한다.", "드럼은 겹쳐 쓰는 것이 기본이다. 킥 하나로 원하는 소리가 안 나오면 저역이 좋은 킥과 타격이 좋은 킥을 겹친다. 이때 두 샘플의 시작 지점을 정확히 맞추고 위상을 확인한다. 어긋나면 저역이 상쇄되어 오히려 얇아진다. 겹친 뒤 반드시 하나씩 껐다 켜며 두꺼워지는지 확인한다.", "보컬 촙은 보컬 한 구절을 잘라 악기처럼 쓰는 기법이다. Quick Sampler의 Slice 모드에 넣으면 조각마다 건반이 배정되어 새로운 프레이즈로 재구성할 수 있다. 알앤비와 하우스에서 자주 쓴다.", "저작권은 반드시 확인한다. 샘플 팩에는 대개 로열티 프리라고 적혀 있는데, 이는 사서 쓰면 추가 비용 없이 상업적으로 쓸 수 있다는 뜻이지 아무 소리나 써도 된다는 뜻이 아니다. 남의 완성곡에서 잘라 쓰는 것은 별개 문제이고, 저작권자 허락을 받는 절차가 따로 있다. 로직에 들어 있는 Apple Loops와 샘플은 로직 사용자에게 사용이 허락되어 있다.", "타임 스트레치의 한계도 알아둔다. 원샷을 곡 템포에 맞추려고 크게 늘이거나 줄이면 소리가 상한다. 앞에서 본 <v>10</v>퍼센트 안쪽이 무난한 범위이고, 그보다 벌어지면 다른 소재를 찾는 편이 낫다."], "path": [{"n": "라이저 배치", "s": ["소재를 코러스 시작 지점 뒤쪽에 끌어다 놓기", "리전 <b>끝</b>을 코러스 첫 박에 정확히 맞춤", "앞쪽 끝을 드래그해 <v>2~4</v>마디 길이로 조정", "페이더를 다른 악기보다 낮게. 튀지 않을 때까지 내림"]}, {"n": "노이즈 라이저 직접 만들기", "s": ["소프트웨어 악기 트랙 → <b>Retro Synth</b>", "오실레이터 파형을 <b>노이즈</b>로", "필터 컷오프를 낮게 두고 긴 음 하나 입력", "<k>A</k> 오토메이션 → 컷오프를 <v>4</v>마디에 걸쳐 상승", "코러스 첫 박에서 끝나도록 위치 조정"]}, {"n": "원샷 음정 맞추기", "s": ["샘플을 <b>Quick Sampler</b>에 드래그", "건반을 눌러 원래 음높이 확인", "<b>Tune</b>으로 곡의 조에 맞춤", "킥과 808과 베이스가 같은 조에 있는지 확인"]}, {"n": "킥 두 겹 쌓기", "s": ["트랙 두 개에 각각 다른 킥 배치", "파형을 확대해 두 샘플의 시작 지점을 정확히 맞춤", "한쪽 트랙에 <b>Gain</b> → <b>Phase Invert</b>를 켜고 소리가 커지면 위상이 어긋난 것", "하나씩 껐다 켜며 실제로 두꺼워지는지 확인"]}], "drill": ["라이저를 코러스 첫 박에서 끝나게 놓은 것과 첫 박에서 시작하게 놓은 것을 비교한다.", "노이즈 라이저를 직접 만들어 산 소재와 비교한다.", "킥 원샷의 음높이를 확인하고 곡의 조와 다르면 맞춘 뒤 저역 변화를 듣는다.", "킥 두 개를 겹치고 위상을 뒤집어 보며 어느 쪽이 두꺼운지 확인한다."], "keys": [["A", "오토메이션"], ["P", "피아노 롤"], ["X", "믹서"], ["⌘F", "플렉스 표시"]], "chk": ["라이저와 임팩트의 배치 방향을 안다", "원샷의 음정을 곡에 맞춘다", "로열티 프리의 의미를 정확히 안다"], "quiz": [{"q": "라이저를 놓는 방향은?", "a": ["아무 데나", "코러스 첫 박에서 끝나게", "곡 맨 앞", "코러스 첫 박에서 시작"], "c": 1, "e": "차오르다가 절정에서 끝나야 한다. 임팩트는 반대로 첫 박에서 시작한다."}, {"q": "곡이 F단조인데 킥이 G에 맞춰져 있으면?", "a": ["템포가 어긋난다", "저역에서 계속 부딪힌다", "음량이 준다", "문제없다"], "c": 1, "e": "킥과 808에도 고유한 음높이가 있다. 샘플러에서 확인하고 곡의 조에 맞춘다."}, {"q": "로열티 프리 샘플 팩의 뜻은?", "a": ["무료 배포다", "한 곡에만 쓸 수 있다", "사서 쓰면 추가 비용 없이 상업적으로 쓸 수 있다", "아무 소리나 써도 된다"], "c": 2, "e": "남의 완성곡에서 잘라 쓰는 것은 별개 문제이고 허락 절차가 따로 있다."}, {"q": "킥 두 개를 겹쳤는데 오히려 얇아졌다면?", "a": ["리버브 때문에", "두 샘플의 위상이 어긋나서", "템포 때문에", "음량이 작아서"], "c": 1, "e": "시작 지점을 맞추고 위상을 확인한다. 어긋나면 저역이 상쇄된다."}], "d": 55, "s": 7}, {"d": 56, "s": 8, "t": "서드파티 플러그인 설치와 검증", "goal": "서드파티 플러그인을 설치하고 검증을 확인한다.", "con": ["맥의 로직은 오디오 유닛(AU) 형식만 읽는다. 윈도우 진영의 VST는 그대로 쓸 수 없다. 플러그인을 살 때 AU 지원 여부를 먼저 확인하는 습관이 필요하다. 대부분의 제품은 AU와 VST를 함께 제공한다.", "설치되는 자리는 정해져 있다. 컴포넌트 파일이 <b>/Library/Audio/Plug-Ins/Components</b>에 들어간다. 설치 프로그램이 알아서 넣어주므로 직접 옮길 일은 드물지만, 문제가 생겼을 때 어디를 봐야 하는지는 알아둬야 한다.", "로직은 실행할 때 새 플러그인을 자동으로 검사한다. 이것이 검증이다. 검증에 실패한 플러그인은 목록에 나타나지 않는다. 새 플러그인을 설치했는데 보이지 않는다면 대개 검증 실패이거나 로직을 재실행하지 않았기 때문이다.", "애플 실리콘 맥에서는 플러그인이 네이티브인지 인텔용인지가 문제가 된다. 인텔용만 있는 오래된 플러그인은 로직 전체를 로제타로 실행해야 쓸 수 있고, 그러면 성능이 떨어진다. 가능하면 네이티브 버전으로 갱신한다.", "플러그인을 지울 때는 컴포넌트 파일을 지우고 로직을 다시 켠다. 목록에 남아 있으면 플러그인 관리자에서 지운다."], "path": [{"n": "검증 상태 확인", "s": ["<b>Logic Pro → 설정 → 플러그인 관리자</b>", "목록에서 제조사와 플러그인 검색", "<b>호환성</b> 열에서 검증 통과 여부 확인", "실패한 항목 선택 → <b>재검증</b>"]}, {"n": "악기 불러오기", "s": ["소프트웨어 악기 트랙 선택 → <k>I</k> 인스펙터", "<b>악기</b> 슬롯 클릭 → <b>AU 악기</b> → 제조사 → 플러그인", "스테레오와 멀티 아웃풋 중 선택"]}], "drill": ["플러그인 관리자를 열어 설치된 서드파티 목록을 확인하고 검증 실패 항목이 있는지 본다.", "무료 AU 악기를 하나 설치해 로직 재실행 후 목록에 뜨는지 확인한다.", "악기 슬롯에서 스테레오와 멀티 아웃풋 항목이 둘 다 보이는지 확인한다."], "keys": [["I", "인스펙터"], ["X", "믹서"]], "chk": ["로직이 AU만 읽는다는 것을 안다", "플러그인 관리자에서 검증을 확인할 수 있다", "설치 경로를 안다"], "quiz": [{"q": "맥용 로직이 읽는 플러그인 형식은?", "a": ["VST3", "AU", "AAX", "VST"], "c": 1, "e": "오디오 유닛만 지원한다. 구입 전에 AU 제공 여부를 확인해야 한다."}, {"q": "새로 설치한 플러그인이 목록에 없을 때 먼저 볼 곳은?", "a": ["프로젝트 설정", "라이브러리", "플러그인 관리자", "믹서"], "c": 2, "e": "검증에 실패하면 목록에 나타나지 않는다. 관리자에서 재검증을 시도한다."}]}, {"t": "서드파티 플러그인 활용", "goal": "자주 쓰이는 외부 플러그인의 성격을 알고 로직 기본과 나눠 쓴다.", "con": ["설치와 검증을 마쳤으면 언제 무엇을 쓸지가 남는다. 로직 기본 플러그인으로 대부분 되지만, 외부 플러그인이 더 나은 자리가 있다. 기준은 하나다. <b>기본으로 안 되는 일을 하는가</b>, 아니면 <b>같은 일을 더 빠르게 하는가</b>다. 둘 다 아니면 쓸 이유가 없다.", "<b>EQ</b>는 FabFilter Pro-Q 계열이 대표적이다. 로직 Channel EQ와 하는 일은 같지만 화면이 크고 대역을 눈으로 찾기 쉽다. 밴드 수 제한이 없고, 다이내믹 EQ와 선형 위상을 한 플러그인에서 전환한다. 여러 트랙의 EQ를 겹쳐 보는 기능이 있어 마스킹을 찾을 때 빠르다. 로직 Channel EQ로 배운 원리가 그대로 적용되므로 값은 앞서 본 것과 같다.", "<b>컴프레서</b>는 Pro-C 계열이다. 로직 Compressor의 모델 전환과 비슷하게 스타일을 고르고, 게인 리덕션이 파형 위에 그려져 어디가 눌리는지 눈으로 보인다. 사이드체인 필터가 더 자유롭다. 다만 값은 앞에서 본 그대로다. 레이시오 3:1, 어택 10ms, 게인 리덕션 3~6dB.", "<b>디에서</b>는 Pro-DS가 로직 DeEsser 2보다 잡아내는 정확도가 높다. 치찰음만 골라 누르고 나머지를 안 건드린다. <b>리미터</b>는 Pro-L 계열이 마스터링에서 많이 쓰인다. 라우드니스 미터가 내장되어 있어 앞에서 본 목표값을 보면서 올릴 수 있다.", "<b>리버브</b>는 Pro-R 계열이 ChromaVerb와 성격이 다르다. 공간 크기와 밝기를 몇 개의 노브로 다루고, 디케이를 주파수별로 나눠 조절할 수 있다. 저역 잔향만 짧게 하고 고역을 길게 두는 식이다. 앞에서 리버브 버스에 EQ를 걸라고 한 것을 플러그인 안에서 하는 셈이다.", "<b>마스터링 묶음</b>은 iZotope Ozone 계열이다. EQ, 다이내믹, 이미저, 맥시마이저, 매치 EQ를 한 창에 모아 놓았고 분석해서 시작점을 제안한다. 로직 마스터링 어시스턴트와 목적이 같지만 조절할 수 있는 것이 훨씬 많다. 다만 앞서 말한 원칙은 그대로다. <b>믹스가 좋지 않으면 마스터링으로 해결되지 않는다.</b> 도구가 많아질수록 이 원칙을 잊기 쉽다.", "<b>샘플러</b>는 Kontakt가 사실상 표준이다. 상용 음원 대부분이 이 형식으로 나온다. 앞에서 본 컨탁 라이브러리 구조가 이것이다. 로직 Sampler와 다른 점은 음원 제작자가 만든 전용 화면을 그대로 쓴다는 것이고, 그래서 음원마다 조작이 다르다. 처음 여는 음원은 매뉴얼을 한 번 훑는 편이 빠르다.", "<b>드럼</b>은 Addictive Drums 같은 전용 음원이 로직 Drum Kit Designer보다 세밀하다. 마이크별 채널이 따로 나오고 방 울림을 따로 조절한다. 앞에서 본 멀티 아웃풋 라우팅이 여기서 쓰인다.", "<b>하드웨어 모델링</b>은 UAD나 Universal Audio 계열이다. 실제 장비를 흉내 낸 것이라 특유의 색이 있다. LA-2A 같은 옵티컬 컴프는 부드럽게 눌러 보컬에 자주 쓰인다. 로직 Vintage Opto가 같은 계열을 흉내 낸 것이므로 먼저 그것으로 감을 잡아도 된다.", "쓰는 순서를 정하면 이렇다. <b>배울 때는 로직 기본으로</b> 한다. 파라미터가 적어 무엇이 무엇을 하는지 알기 쉽다. 감이 잡힌 뒤에 외부 플러그인으로 넘어가면 같은 원리를 더 편하게 쓰게 된다. 반대로 하면 노브가 많아 무엇을 만지는지 모른 채 프리셋만 넘기게 된다.", "그리고 외부 플러그인은 프로젝트 호환에 영향을 준다. 다른 사람에게 프로젝트를 넘길 때 그쪽에 같은 플러그인이 없으면 그 트랙은 비어서 열린다. 협업하는 곡은 로직 기본으로 만들거나, 넘기기 전에 그 트랙을 오디오로 바운스한다."], "path": [{"n": "외부 플러그인 열기", "s": ["채널 스트립 이펙트 슬롯 클릭", "<b>Audio Units</b> 하위에서 제조사 이름 찾기", "로직 기본은 상단, 외부는 <b>Audio Units</b> 아래에 모인다"]}, {"n": "협업 전 정리", "s": ["외부 플러그인이 걸린 트랙 확인", "그 트랙을 <k>⌃B</k> 바운스 인 플레이스로 오디오화", "원본 트랙은 남겨 두고 비활성화", "프로젝트 정리 → 에셋 복사로 저장"]}], "drill": ["같은 보컬에 로직 Compressor와 외부 컴프를 같은 값으로 걸어 비교한다.", "외부 플러그인이 걸린 트랙을 바운스 인 플레이스로 오디오화해 본다."], "keys": [["⌃B", "바운스 인 플레이스"], ["X", "믹서"]], "chk": ["기본으로 안 되는 일인지 먼저 묻는다", "배울 때는 로직 기본으로 한다", "협업 곡은 외부 플러그인을 정리한다"], "quiz": [{"q": "외부 플러그인을 쓸지 판단하는 기준은?", "a": ["비싼 것일수록 좋다", "유명한 것", "최신 것", "기본으로 안 되는 일인가, 같은 일을 더 빠르게 하는가"], "c": 3, "e": "둘 다 아니면 쓸 이유가 없다."}, {"q": "배우는 단계에서 로직 기본을 권하는 이유는?", "a": ["무료라서", "파라미터가 적어 무엇이 무엇을 하는지 알기 쉬워서", "가벼워서", "음질이 좋아서"], "c": 1, "e": "노브가 많으면 무엇을 만지는지 모른 채 프리셋만 넘기게 된다."}, {"q": "외부 플러그인이 걸린 프로젝트를 넘길 때는?", "a": ["그냥 보낸다", "그 트랙을 오디오로 바운스한다", "불가능하다", "플러그인도 같이 보낸다"], "c": 1, "e": "받는 쪽에 같은 플러그인이 없으면 그 트랙은 비어서 열린다."}], "s": 8, "d": 57}, {"d": 58, "s": 8, "t": "샘플 라이브러리 구조와 컨탁", "goal": "샘플 라이브러리의 구조를 알고 컨탁에서 불러온다.", "con": ["샘플 라이브러리는 실제 악기를 녹음해 모아둔 것이다. 원리는 단순하다. 음마다, 세기마다, 주법마다 따로 녹음한 오디오 파일을 건반에 배치해두고, 연주하면 해당 파일을 재생한다.", "세 가지 층으로 되어 있다. 샘플은 실제 오디오 파일이다. 매핑은 어떤 건반과 어떤 벨로시티에 어떤 샘플을 놓을지 정한 표다. 스크립트는 레가토 연결이나 주법 전환 같은 동작을 처리하는 규칙이다. 우리가 사는 제품은 이 세 층을 묶은 것이다.", "벨로시티 레이어는 세기별로 다른 녹음을 쌓은 것이다. 층이 많을수록 자연스럽지만 용량이 커진다. 라운드 로빈은 같은 음을 연달아 칠 때 매번 다른 녹음을 돌려쓰는 장치다. 이것이 없으면 반복 타격이 기계처럼 들린다. 이 두 가지가 좋은 라이브러리와 아닌 것을 가른다.", "컨탁은 이런 라이브러리를 돌리는 재생기다. 컨탁 자체는 그릇이고 라이브러리가 내용물이다. 무료 컨탁 플레이어로 열리는 제품이 있고 정식 컨탁이 있어야 열리는 제품이 있다. 구입 전에 어느 쪽인지 확인한다.", "파일 확장자로 구분한다. 인스트루먼트 하나는 NKI, 여러 개를 묶은 멀티는 NKM이다. 플레이어 대응 제품은 컨탁의 라이브러리 목록에 나타나고, 비대응 제품은 파일 브라우저에서 NKI를 직접 찾아 연다."], "path": [{"n": "컨탁 열고 악기 로드", "s": ["소프트웨어 악기 트랙 → 악기 슬롯 → <b>AU 악기 → Native Instruments → Kontakt</b>", "왼쪽 <b>라이브러리</b>에서 제품 선택 → 악기 클릭", "비대응 제품은 <b>Files</b> 탭에서 NKI 파일 위치로 이동해 더블 클릭"]}, {"n": "음원 확인", "s": ["건반을 눌러 매핑 범위 확인. 회색 건반은 소리 없는 구간", "낮은 음역의 색이 다른 건반은 키스위치", "제품 화면의 <b>Dynamics</b> 또는 <b>Expression</b> 노브가 CC1과 CC11에 연결되어 있는지 확인"]}], "drill": ["샘플 라이브러리를 하나 열어 연주 가능한 음역과 키스위치 위치를 확인한다.", "같은 음을 여덟 번 연속으로 쳐보고 소리가 매번 조금씩 다른지 듣는다. 라운드 로빈이 있는지 판단한다.", "벨로시티를 30, 70, 110으로 나눠 쳐보고 음색이 몇 단계로 바뀌는지 센다."], "keys": [["I", "인스펙터"], ["P", "피아노 롤"]], "chk": ["샘플, 매핑, 스크립트 세 층을 설명할 수 있다", "라운드 로빈이 있는지 귀로 확인할 수 있다", "NKI와 NKM을 구분한다"], "quiz": [{"q": "같은 음을 연달아 칠 때 매번 다른 녹음을 돌려 쓰는 장치는?", "a": ["벨로시티 레이어", "라운드 로빈", "레가토 스크립트", "키스위치"], "c": 1, "e": "라운드 로빈이 없으면 연타가 복사한 것처럼 똑같이 들린다."}, {"q": "컨탁에서 인스트루먼트 하나의 파일 확장자는?", "a": ["NKM", "WAV", "NKI", "NKS"], "c": 2, "e": "NKI가 인스트루먼트, NKM이 멀티다."}]}, {"d": 59, "s": 8, "t": "멀티 아웃풋과 라우팅", "goal": "멀티 아웃풋으로 채널을 분리하고 미디 채널을 나눈다.", "con": ["샘플 악기는 하나의 인스턴스 안에 여러 악기를 담을 수 있다. 컨탁은 최대 16개까지 담긴다. 이것을 멀티팀버라고 한다. 컴퓨터 자원을 아낄 수 있지만 믹싱이 불편해진다.", "기본 상태에서는 16개 악기의 소리가 하나의 채널로 합쳐 나온다. 스트링 전체에 리버브를 걸 수는 있어도 첼로에만 다르게 걸 수는 없다. 이걸 해결하는 것이 멀티 아웃풋이다.", "멀티 아웃풋으로 악기를 불러오면 믹서에서 여러 채널을 뽑아낼 수 있다. 각 악기의 출력을 서로 다른 번호로 지정하면 채널이 나뉜다. 그때부터 악기마다 따로 EQ와 컴프를 걸 수 있다.", "미디 쪽도 나눠야 한다. 악기마다 미디 채널 번호를 다르게 주고, 로직에서는 트랙을 여러 개 만들어 같은 악기를 가리키되 채널만 다르게 지정한다.", "판단 기준. 오케스트라처럼 악기가 많고 각각 다르게 처리해야 하면 멀티 아웃풋을 쓴다. 악기 두세 개면 그냥 인스턴스를 따로 만드는 편이 단순하고 사고가 적다."], "path": [{"n": "멀티 아웃풋으로 불러오기", "s": ["악기 슬롯 클릭 → 플러그인 이름 옆 <b>멀티 아웃풋</b> 항목 선택", "<k>X</k> 믹서 → 해당 채널 스트립 하단 <b>+</b> 버튼 클릭 → Aux 채널 생성", "필요한 개수만큼 반복"]}, {"n": "악기별 출력 지정", "s": ["플러그인 안에서 각 악기의 <b>Output</b>을 <v>st.1</v>, <v>st.2</v>처럼 다르게 지정", "믹서에서 채널이 나뉘어 나오는지 확인"]}, {"n": "미디 채널 나누기", "s": ["트랙 헤더 우클릭 → <b>기존 트랙에 트랙 생성</b>", "<k>I</k> 인스펙터 → <b>MIDI 채널</b>을 <v>1</v>, <v>2</v>… 로 지정", "플러그인 안 악기의 미디 채널과 맞춤"]}], "drill": ["샘플 악기 하나에 세 개의 악기를 올리고 멀티 아웃풋으로 채널을 셋으로 나눈다.", "각 채널에 서로 다른 리버브 양을 보내 차이를 확인한다.", "같은 구성을 인스턴스 세 개로도 만들어 어느 쪽이 편한지 비교한다."], "keys": [["X", "믹서"], ["I", "인스펙터"]], "chk": ["멀티팀버와 멀티 아웃풋을 구분한다", "믹서에서 Aux 채널을 뽑을 수 있다", "미디 채널을 나눌 수 있다"], "quiz": [{"q": "악기 하나 안의 여러 소리를 믹서에서 따로 처리하려면?", "a": ["스테레오로 불러온다", "트랙을 복제한다", "멀티 아웃풋으로 불러온다", "프리즈한다"], "c": 2, "e": "멀티 아웃풋으로 불러와야 믹서에서 Aux 채널을 뽑을 수 있다."}]}, {"d": 60, "s": 8, "t": "로직 내장 샘플러", "goal": "Quick Sampler와 Sampler로 오디오를 악기화한다.", "con": ["로직에는 샘플러가 둘 있다. Quick Sampler는 오디오 하나를 즉시 악기로 만드는 도구다. Sampler는 여러 샘플을 직접 배치하는 본격 도구다.", "Quick Sampler의 네 가지 모드. Classic은 음높이를 따라 늘려 연주한다. One Shot은 건반을 뗴도 끝까지 재생한다. Slice는 타격 지점마다 잘라 건반에 흩어 놓는다. Recorder는 바로 녹음해 받는다. 이미 트랙에 놓인 오디오 리전이라면 더 빠른 길이 있다. 리전을 선택하고 <k>⌃E</k>를 누르면 그 리전이 샘플러 트랙으로 바로 변환된다. 방금 녹음한 소리를 즉석에서 악기로 만들 때 쓴다.", "드럼 루프를 Slice 모드로 넣으면 각 타격이 건반 하나씩 배정된다. 순서를 바꿔 새 그루브를 만들 수 있다. 남의 루프를 그대로 쓰는 것보다 훨씬 자기 것이 된다.", "Sampler에서는 존과 그룹을 다룬다. 존은 샘플 하나가 놓인 건반 범위와 벨로시티 범위다. 그룹은 존들을 묶어 공통 규칙을 주는 단위다. 벨로시티 레이어와 라운드 로빈을 직접 만들 수 있다.", "루프 포인트를 지정하면 짧은 샘플도 길게 늘여 연주할 수 있다. 파형에서 반복 구간을 지정하는 방식이다.", "현장에서 자주 쓰는 방법 하나. 마음에 드는 소리를 녹음해 Quick Sampler에 넣고 악기로 만들면, 아무도 갖고 있지 않은 음색이 생긴다."], "path": [{"n": "Quick Sampler", "s": ["악기 슬롯 → <b>Quick Sampler</b>", "오디오 파일을 창 가운데로 드래그", "상단에서 <b>Classic / One Shot / Slice / Recorder</b> 선택", "<b>Pitch</b>, <b>Filter</b>, <b>Amp</b>에서 다듬기"]}, {"n": "Slice로 그루브 만들기", "s": ["드럼 루프를 드래그 → <b>Slice</b> 모드", "슬라이스 방식을 <b>Transient</b>로", "<b>MIDI 드래그</b> 아이콘을 트랙으로 끌어 놓으면 원본 순서 미디 생성", "피아노 롤에서 순서를 바꿔 새 그루브"]}, {"n": "Sampler 매핑", "s": ["악기 슬롯 → <b>Sampler</b>", "<b>Mapping</b> 탭 → 샘플 드래그", "존의 좌우 끝을 드래그해 건반 범위 지정", "<b>Zone → Velocity Range</b>로 세기 층 나누기"]}], "drill": ["목소리나 주변 소리를 녹음해 Quick Sampler로 악기를 만들고 한 프레이즈 연주한다.", "드럼 루프를 Slice로 잘라 미디를 뽑고 순서를 바꿔 새 패턴을 만든다.", "Sampler에서 샘플 두 개를 벨로시티 범위로 나눠 배치한다."], "keys": [["I", "인스펙터"], ["P", "피아노 롤"], ["⌃E", "리전을 샘플러 트랙으로"]], "chk": ["네 가지 모드를 구분한다", "Slice로 미디를 뽑아봤다", "존과 그룹의 차이를 안다"], "quiz": [{"q": "드럼 루프를 타격마다 잘라 건반에 배치하는 모드는?", "a": ["Slice", "Classic", "Recorder", "One Shot"], "c": 0, "e": "Slice 모드는 트랜지언트 기준으로 잘라 각 조각을 건반에 배정한다."}]}, {"d": 61, "s": 8, "t": "라이브러리 관리", "goal": "라이브러리 저장 위치와 메모리 설정을 관리한다.", "con": ["샘플 라이브러리는 크다. 오케스트라 제품 하나가 수백 기가를 차지하는 일이 흔하다. 내장 디스크가 금방 차므로 처음부터 외장에 두는 계획이 필요하다.", "라이브러리는 두 종류다. 하나는 서드파티 샘플 라이브러리이고, 다른 하나는 로직이 들고 있는 사운드 라이브러리다. 로직 쪽에는 플러그인 설정, 채널 스트립 설정, 패치, Apple Loops, 샘플이 모두 들어 있고 이것만으로도 수십 기가가 된다.", "로직 12부터 이 사운드 라이브러리가 <b>Logic Pro Library.bundle</b>이라는 파일 하나로 묶였다. 기본 위치는 사용자 폴더 안의 음악 폴더이고, 이 파일을 통째로 다른 곳으로 옮긴 뒤 로직에게 위치만 알려주면 된다. 예전 버전처럼 여러 폴더가 흩어져 있지 않아 이동이 단순해졌다.", "옮기는 순서는 파일을 먼저 옮기고 나중에 알려주는 것이다. <b>설정 → 일반 → 사운드 라이브러리</b>에 위치 표시와 <b>찾기</b> 버튼이 있다. 파인더로 번들 파일을 외장으로 옮긴 뒤 찾기를 눌러 그 파일을 두 번 클릭하면 경로가 바뀐다.", "외장에 두면 두 가지 이점이 더 생긴다. 네트워크 드라이브에 올리면 여러 대의 컴퓨터가 같은 라이브러리 하나를 함께 쓸 수 있다. 그리고 한 컴퓨터에서 여러 사용자 계정을 쓴다면 공유 폴더에 두고 각자 그 위치를 지정하면 된다. 같은 내용을 계정마다 중복해서 갖고 있을 이유가 없다.", "외장을 연결하지 않고 로직을 열면 라이브러리를 찾을 수 없다는 창이 뜬다. 위치를 다시 지정하거나 빈 라이브러리를 새로 만들 것인지 묻는데, 여기서 새로 만들기를 고르면 기존 내용이 안 보이게 되므로 반드시 외장을 연결하고 다시 연다.", "저장 매체가 성능을 좌우한다. 샘플 재생은 디스크에서 실시간으로 읽는 작업이라 읽기 속도가 느리면 바로 끊긴다. 외장 SSD를 쓰고 연결은 가능한 한 빠른 단자를 쓴다. 회전식 하드디스크에 큰 라이브러리를 두면 소리가 끊긴다.", "프리로드 버퍼는 각 샘플의 앞부분을 메모리에 미리 올려두는 양이다. 크게 잡으면 디스크 부담이 줄고 메모리를 많이 쓴다. 작게 잡으면 반대다. 디스크가 느리면 키우고 메모리가 부족하면 줄인다.", "퍼지는 지금 연주에 쓰이지 않는 샘플을 메모리에서 걷어내는 기능이다. 큰 오케스트라 편성에서 메모리가 모자랄 때 효과가 크다. 다만 새 음을 연주하면 다시 불러와야 한다.", "라이브러리를 옮길 때는 파일만 복사해서는 안 된다. 관리 프로그램에서 위치를 다시 알려줘야 한다. 그냥 옮기면 악기가 샘플을 찾지 못한다.", "백업은 라이브러리 원본과 프로젝트를 따로 생각한다. 라이브러리는 다시 내려받을 수 있는 경우가 많지만, 프로젝트와 녹음 파일은 잃으면 끝이다. 프로젝트 백업이 우선이다.", "여기서부터 트랙이 늘어나면 재생이 끊기기 시작한다. 편곡 단계에서 이미 버거워진다면 작업 흐름 스테이지의 프리즈 일차를 먼저 펼쳐 봐도 된다. 순서대로 갈 필요는 없고, 지금 막힌 것을 푸는 쪽이 낫다."], "path": [{"n": "로직 사운드 라이브러리 옮기기", "s": ["외장 드라이브를 연결한다", "파인더에서 <b>~/음악</b> 폴더의 <b>Logic Pro Library.bundle</b>을 외장으로 옮긴다", "로직에서 <b>설정 → 일반 → 사운드 라이브러리</b>를 연다", "<b>찾기</b> 버튼 → 옮긴 번들 파일을 두 번 클릭", "위치 표시가 새 경로로 바뀌었는지 확인", "<b>Finder에서 보기</b>로 실제 파일이 그곳에 있는지 확인"]}, {"n": "메모리 설정", "s": ["샘플러 플러그인의 <b>Options</b> 또는 <b>설정</b> 열기", "<b>Memory</b> 항목의 프리로드 버퍼 값 조정", "<b>Purge</b> 메뉴에서 사용하지 않는 샘플 제거"]}, {"n": "위치 옮기기", "s": ["라이브러리 폴더를 외장 디스크로 복사", "제조사 관리 프로그램에서 <b>위치 변경</b> 또는 <b>재지정</b>", "프로그램에서 인식되는지 확인한 뒤 원본 삭제"]}], "drill": ["설치된 라이브러리의 총 용량을 확인하고 남은 디스크 공간과 비교한다.", "프리로드 버퍼를 키우고 줄여가며 큰 편성에서 끊김이 생기는 지점을 찾는다.", "프로젝트 폴더 백업 규칙을 정해 적어둔다.", "사운드 라이브러리 설정에서 현재 위치를 확인하고 Finder에서 보기로 실제 파일을 찾아본다."], "keys": [["⌘S", "저장"]], "chk": ["SSD가 필요한 이유를 안다", "프리로드 버퍼의 역할을 안다", "라이브러리 이동 절차를 안다", "로직 사운드 라이브러리와 서드파티 라이브러리를 구분한다"], "quiz": [{"q": "샘플 재생에서 디스크 속도가 중요한 이유는?", "a": ["CPU를 대신해서", "연주 중 실시간으로 읽어오기 때문", "파일이 압축되어 있어서", "백업이 자주 필요해서"], "c": 1, "e": "메모리에 올린 앞부분 이후는 디스크에서 계속 읽는다. 느리면 소리가 끊긴다."}, {"q": "로직 12에서 사운드 라이브러리가 저장되는 형태는?", "a": ["클라우드에만 있다", "Logic Pro Library.bundle 파일 하나", "프로젝트 안에 들어 있다", "여러 폴더에 흩어져 있다"], "c": 1, "e": "12부터 단일 번들 파일로 묶여서 통째로 옮기고 위치만 알려주면 된다."}, {"q": "외장을 연결하지 않고 로직을 열었더니 라이브러리를 못 찾는다는 창이 떴다면?", "a": ["외장을 연결하고 다시 연다", "로직을 재설치한다", "무시하고 작업한다", "새로 만들기를 고른다"], "c": 0, "e": "새로 만들기를 고르면 빈 라이브러리가 생겨 기존 내용이 안 보이게 된다."}]}, {"t": "오디오 인터페이스와 주변 기기", "goal": "인터페이스, 케이블, 모니터, 헤드폰의 역할과 연결을 안다.", "con": ["마이크에서 스피커까지의 길 한가운데에 오디오 인터페이스가 있다. 인터페이스가 하는 일은 네 가지다. 마이크의 전기 신호를 숫자로 바꾸고(입력 변환), 숫자를 다시 전기로 바꿔 스피커로 보내고(출력 변환), 작은 마이크 신호를 키우고(프리앰프), 팬텀 파워를 공급한다. 맥 내장 단자로 안 되는 것이 이 네 가지라서 녹음을 하려면 인터페이스가 필요하다.", "앞면부터 읽는다. 게인 노브는 입력 증폭량, <v>48V</v> 버튼은 팬텀 파워, INST 버튼은 기타와 베이스를 직접 꽂을 때 누르는 것이다. INST가 따로 있는 이유는 신호의 성질이다. 기타 픽업의 신호는 마이크와 성질이 달라서 일반 입력에 꽂으면 고음이 죽는데, INST를 누르면 입력의 특성이 기타에 맞게 바뀐다. MIX 또는 모니터 노브는 입력 소리와 컴퓨터 소리의 비율, 그 옆이 헤드폰 볼륨과 메인 아웃 볼륨이다.", "케이블은 세 종류만 알면 된다. XLR은 세 핀짜리 마이크 케이블, TRS는 헤드폰 잭처럼 생겼는데 검은 줄이 두 개인 케이블, TS는 줄이 하나인 기타 케이블이다.", "XLR과 TRS가 잡음에 강한 이유는 밸런스드 방식이기 때문이다. 같은 신호를 하나는 그대로, 하나는 위아래를 뒤집어 두 가닥으로 보낸다. 케이블이 도중에 잡음을 맞으면 두 가닥에 똑같이 실리는데, 받는 쪽에서 뒤집힌 가닥을 다시 뒤집어 합치면 신호는 두 배가 되고 잡음은 서로 반대가 되어 사라진다. TS는 이 장치가 없어서 길게 끌수록 잡음이 는다. 그래서 긴 거리는 XLR과 TRS로, 기타에서 인터페이스까지 짧은 구간만 TS로 쓴다.", "모니터 스피커는 메인 아웃에 TRS로 연결한다. 배치가 소리의 절반이다. 두 스피커와 머리가 정삼각형을 이루게 놓고, 고음 유닛을 귀 높이에 맞추고, 좌우를 대칭으로 둔다. 정삼각형인 이유는 좌우 신호가 같은 거리에서 같은 시간에 도착해야 팬으로 만든 위치가 그대로 들리기 때문이다. 벽에서 <v>20~30</v>cm 이상 떼는 것도 잊지 않는다. 벽에 붙이면 뒷벽 반사가 저역을 부풀려 실제보다 저음이 많게 들리고, 그 상태로 믹스하면 저음이 빈 결과물이 나온다.", "헤드폰은 두 갈래다. 밀폐형은 귀를 감싸 소리가 새지 않는다. 녹음용이다. 새어 나간 반주가 마이크에 다시 들어가는 것을 막아야 하기 때문이다. 개방형은 뒤가 뚫려 소리가 새는 대신 울림이 자연스럽고 오래 들어도 덜 지친다. 믹싱용이다. 하나만 산다면 밀폐형이 먼저다. 녹음은 밀폐형이 아니면 안 되지만 믹싱은 밀폐형으로도 가능하다.", "전원 순서 하나만 외운다. 켤 때는 스피커를 마지막에, 끌 때는 스피커를 먼저. 다른 장비를 켜고 끌 때 나는 퍽 소리가 스피커에 도달하기 전에 스피커가 꺼져 있게 하는 순서다.", "USB 마이크는 마이크와 인터페이스를 한 몸에 합친 물건이다. 시작은 간편하지만 마이크를 바꾸거나 입력을 늘릴 길이 막힌다. 계속할 생각이면 인터페이스와 XLR 마이크를 따로 사는 쪽이 결국 싸다.", "단자마다 받는 신호의 세기가 다르다는 것도 알아야 한다. 마이크가 내보내는 신호는 아주 작아서 프리앰프로 크게 키워야 하고, 신디사이저나 오디오 기기가 내보내는 <b>라인</b> 신호는 이미 충분히 크다. 마이크 단자에 라인 신호를 꽂으면 과하게 증폭되어 깨지고, 반대로 하면 너무 작아 들리지 않는다.", "기타와 베이스는 또 다르다. 이 악기들의 픽업은 신호가 작으면서 <b>임피던스가 높다</b>. 임피던스는 신호가 흐를 때 받는 저항이라고 보면 된다. 임피던스가 높은 기기를 낮은 입력에 꽂으면 고역이 빠지고 소리가 힘없이 얇아진다. 그래서 인터페이스에는 <b>INST</b> 또는 <b>Hi-Z</b> 단자가 따로 있다. 기타를 꽂을 때는 반드시 이 단자를 쓰거나 스위치를 켠다.", "이 단자가 없다면 <b>DI 박스</b>를 쓴다. 높은 임피던스를 낮은 임피던스로 바꿔 주는 작은 장치이고, 긴 케이블을 써야 할 때도 신호가 덜 상한다. 기타를 꽂았는데 소리가 얇고 답답하다면 대개 이 문제다."], "path": [{"n": "연결 전체 그리기", "s": ["마이크 → XLR → 인터페이스 입력", "기타 → TS → INST 입력", "인터페이스 메인 아웃 → TRS 두 가닥 → 모니터 좌우", "인터페이스 헤드폰 단자 → 밀폐형 헤드폰", "인터페이스 → USB → 맥"]}, {"n": "모니터 배치 점검", "s": ["두 스피커 사이 거리와 스피커에서 머리까지 거리를 같게 맞춘다", "고음 유닛이 앉았을 때 귀 높이에 오는지 확인한다", "뒷벽에서 <v>20~30</v>cm 이상 떨어져 있는지 잰다", "좌우 스피커 주변이 대칭인지 본다"]}, {"n": "로직에서 확인", "s": ["<b>Logic Pro → 설정 → 오디오 → 기기</b>", "<b>입력 장비</b>와 <b>출력 장비</b>를 인터페이스로 지정", "마이크에 대고 말하며 입력 미터 확인", "재생하며 모니터와 헤드폰 양쪽 출력 확인"]}, {"n": "기타 연결 확인", "s": ["인터페이스에 <b>INST</b>나 <b>Hi-Z</b> 표시가 있는 단자를 찾는다", "없으면 입력 옆 스위치를 <b>INST</b>로", "둘 다 없으면 <b>DI 박스</b>를 거쳐 마이크 단자로", "소리가 얇으면 연결을 다시 확인한다"]}], "drill": ["내 연결 전체를 종이에 화살표로 그리고 각 구간의 케이블 종류를 적는다.", "모니터 배치를 정삼각형 기준으로 재고, 어긋난 것을 하나 고친 뒤 같은 곡을 다시 들어 차이를 확인한다.", "전원을 순서대로 켜고 꺼 본다. 일부러 순서를 어겨 퍽 소리가 나는지 아주 작은 볼륨으로 확인해 본다."], "keys": [["X", "믹서"], ["스페이스", "재생과 정지"]], "chk": ["인터페이스가 하는 네 가지 일을 말할 수 있다", "XLR, TRS, TS를 구분하고 밸런스드의 원리를 안다", "모니터 정삼각형 배치의 이유를 안다", "기타는 INST 단자에 꽂는다"], "quiz": [{"q": "밸런스드 케이블이 잡음에 강한 이유는?", "a": ["케이블이 두꺼워서", "신호가 두 배 빨라서", "뒤집힌 신호를 합칠 때 잡음이 상쇄되어서", "금도금이라서"], "c": 2, "e": "두 가닥에 똑같이 실린 잡음이 한쪽을 다시 뒤집어 합치는 순간 반대가 되어 사라진다."}, {"q": "기타를 인터페이스에 직접 꽂을 때 누르는 버튼은?", "a": ["48V", "INST", "MIX", "MONO"], "c": 1, "e": "기타 픽업 신호는 성질이 달라서 INST를 눌러 입력 특성을 바꿔야 고음이 살아 있다."}, {"q": "녹음용 헤드폰으로 밀폐형을 쓰는 이유는?", "a": ["가벼워서", "저음이 좋아서", "선이 길어서", "새어 나간 소리가 마이크에 들어가는 것을 막아서"], "c": 3, "e": "반주가 헤드폰 밖으로 새면 마이크에 함께 녹음된다."}, {"q": "전원을 끌 때 가장 먼저 끄는 것은?", "a": ["스피커", "마이크", "인터페이스", "컴퓨터"], "c": 0, "e": "다른 장비의 퍽 소리가 도달하기 전에 스피커가 먼저 꺼져 있어야 한다."}, {"q": "기타를 꽂았는데 소리가 얇고 답답하다면?", "a": ["EQ로 고친다", "INST/Hi-Z 단자가 아닌 곳에 꽂혔을 가능성", "게인을 올린다", "케이블 문제"], "c": 1, "e": "임피던스가 안 맞으면 고역이 빠진다. DI 박스를 써도 된다."}], "d": 62, "s": 9}, {"t": "마이크 기초 용어", "goal": "마이크 종류, 지향성, 주변 장비의 용어를 안다.", "con": ["마이크는 공기의 떨림을 전기로 바꾸는 장치다. 바꾸는 방식에 따라 크게 두 갈래로 나뉘고, 이 구분이 마이크 선택의 출발점이다.", "다이내믹 마이크는 코일과 자석으로 소리를 받는다. 튼튼하고, 큰 소리에 강하고, 전원이 필요 없다. 대신 감도가 낮아 섬세한 소리는 덜 잡는다. 공연장 보컬, 드럼, 기타 앰프에 쓰는 것이 이쪽이다. SM58 같은 손잡이형 마이크를 떠올리면 된다.", "콘덴서 마이크는 얇은 막의 떨림을 전기로 읽는다. 감도가 높아 숨소리와 잔향까지 섬세하게 담는다. 대신 충격에 약하고 전원이 필요하다. 스튜디오 보컬과 어쿠스틱 악기 녹음의 기본이 이쪽이다. 홈 레코딩에서 보컬용으로 사는 마이크는 대부분 콘덴서다.", "콘덴서에 공급하는 전원이 팬텀 파워다. <v>48V</v>라고 적힌 버튼이 오디오 인터페이스에 있다. 콘덴서를 꽂으면 켜고, 리본 마이크 같은 예민한 기기에는 켜기 전에 설명서를 확인한다. 다이내믹 마이크는 팬텀이 켜져 있어도 해가 없다. 콘덴서와 다이내믹을 같이 쓸 때 일일이 껐다 켰다 할 필요는 없다. 켜고 끌 때는 페이더를 내리고 한다. 퍽 하는 소리가 스피커를 상하게 할 수 있다.", "지향성은 마이크가 어느 방향의 소리를 받는지다. 카디오이드는 앞만 받고 뒤를 거의 안 받는다. 심장 모양의 수음 범위라서 붙은 이름이고, 홈 레코딩의 기본값이다. 기본값인 이유는 방이다. 집 녹음의 가장 큰 적은 뒤와 옆 벽에서 되돌아오는 울림인데, 카디오이드는 바로 그 방향을 깎아 받아 마이크 자체가 흡음재 역할을 한다. 무지향성은 사방을 고르게 받아 공간 전체를 담을 때 쓴다. 8자 지향성은 앞뒤만 받고 옆을 안 받는다.", "근접 효과는 지향성 마이크에 입을 가까이 댈수록 저음이 부풀어 오르는 현상이다. 라디오 진행자의 두툼한 목소리가 이것이다. 활용하면 무기가 되고 모르면 저음이 뭉개지는 원인이 된다.", "주변 도구들. 팝 필터는 입과 마이크 사이에 세우는 망이다. 파열음이 만드는 바람이 마이크를 직접 때리는 것을 막는다. 쇼크 마운트는 마이크를 고무줄로 띄워 책상과 바닥의 진동이 타고 올라오는 것을 끊는다. 리플렉션 필터는 마이크 뒤에 두르는 반원형 흡음판으로, 방 울림을 줄인다.", "연결은 XLR 케이블이 표준이다. 세 핀짜리 굵은 케이블로, 잡음에 강하고 팬텀 파워도 이 선으로 전달된다. USB 마이크는 인터페이스 없이 컴퓨터에 바로 꽂는 방식인데 시작하기엔 간편하지만 확장이 막힌다.", "마이크 신호는 아주 작아서 증폭이 필요하다. 이 증폭기가 프리앰프이고 오디오 인터페이스에 내장되어 있다. 증폭량을 정하는 노브가 게인이다. 볼륨과 헷갈리기 쉬운데, 게인은 들어오는 신호의 크기이고 볼륨은 나가는 소리의 크기다. 녹음 품질을 결정하는 것은 게인 쪽이다."], "path": [{"n": "내 마이크 파악하기", "s": ["마이크의 종류(다이내믹인지 콘덴서인지)를 확인한다", "콘덴서라면 인터페이스의 <v>48V</v> 버튼 위치를 확인한다", "지향성 표시(카디오이드 기호 등)를 찾아본다", "마이크와 인터페이스를 XLR로 연결한다"]}, {"n": "팬텀 파워 안전 순서", "s": ["로직과 스피커의 볼륨을 내린다", "마이크를 XLR로 꽂는다", "<v>48V</v>를 켠다", "몇 초 기다린 뒤 게인을 올리며 신호를 확인한다", "끌 때는 역순: 게인 내리고 → 48V 끄고 → 뽑는다"]}], "drill": ["가진 마이크 또는 사려는 마이크의 종류, 지향성, 팬텀 파워 필요 여부를 표로 적는다.", "마이크에 대고 정면, 옆, 뒤에서 말해 보고 소리 크기 차이로 지향성을 몸으로 확인한다.", "입을 5cm까지 붙였다가 30cm까지 떼면서 저음이 부풀었다 빠지는 근접 효과를 듣는다."], "keys": [["X", "믹서"], ["R", "녹음"]], "chk": ["다이내믹과 콘덴서의 차이를 말할 수 있다", "팬텀 파워를 안전한 순서로 켜고 끈다", "근접 효과를 귀로 확인했다"], "quiz": [{"q": "콘덴서 마이크에 필요한 것은?", "a": ["건전지", "팬텀 파워 48V", "USB 허브", "드라이버 설치"], "c": 1, "e": "콘덴서는 막을 동작시킬 전원이 필요하다. 인터페이스의 48V 버튼이 그것이다."}, {"q": "앞의 소리만 받고 뒤를 거의 안 받는 지향성은?", "a": ["카디오이드", "8자", "무지향성", "전지향성"], "c": 0, "e": "심장 모양의 수음 범위. 홈 레코딩의 기본값이다."}, {"q": "지향성 마이크에 입을 가까이 댈수록 생기는 현상은?", "a": ["소리가 작아진다", "고음이 커진다", "저음이 부풀어 오른다", "잡음이 사라진다"], "c": 2, "e": "근접 효과다. 알고 쓰면 두툼한 목소리를 만드는 무기가 된다."}], "d": 63, "s": 9}, {"d": 64, "s": 9, "t": "오디오 녹음 세팅", "goal": "입력 레벨, 버퍼, 샘플레이트를 설정한다.", "con": ["녹음 전에 확인할 것은 세 가지다. 오디오 인터페이스가 잡혀 있는지, 트랙의 입력이 맞는지, 레벨이 적정한지.", "레벨의 기준은 피크 <v>-12</v>에서 <v>-6</v>dBFS다. 0에 닿으면 클립이라 되돌릴 수 없다. 여유를 크게 두는 편이 안전하다. 24비트로 녹음하면 작게 녹음해도 노이즈 문제가 없다.", "버퍼 크기는 녹음할 때 작게, 믹스할 때 크게 둔다. 녹음 <v>64~128</v> 샘플, 믹스 <v>512~1024</v> 샘플이 일반적이다. 작을수록 지연이 적고 컴퓨터 부담이 크다.", "샘플레이트는 <v>48</v>kHz, 비트 심도는 <v>24</v>비트를 기본으로 한다. 프로젝트 시작 후에는 바꾸지 않는다. <v>96</v>kHz로 올리는 것은 음악 작업에서는 대체로 의미가 없다. 청감상 이득이 거의 없는데 용량과 컴퓨터 부하는 두 배가 된다.", "모니터링은 인터페이스의 다이렉트 모니터를 쓰는 편이 지연이 없다. 로직의 소프트웨어 모니터링을 쓸 때는 버퍼를 최소로 낮춘다.", "버퍼를 고르고 나면 그 아래에 지연 시간이 표시된다. <b>왕복 지연</b>은 소리가 들어와서 나가기까지의 전체 시간이라 실제로 느끼는 값이다. 앞의 <v>64~128</v> 샘플은 일반적인 기준일 뿐이고 실제로는 이 숫자를 보며 정한다. 몇 ms부터 연주에 지장이 생기는지는 작업 흐름 스테이지의 레이턴시 일차에서 다룬다."], "path": [{"n": "장치 설정", "s": ["<b>Logic Pro → 설정 → 오디오 → 기기</b>", "<b>출력 장비</b>와 <b>입력 장비</b> 지정", "<b>I/O 버퍼 크기</b>를 <v>128</v>으로", "<b>적용</b>"]}, {"n": "녹음 준비", "s": ["오디오 트랙 생성 <k>⌥⌘N</k> → <b>오디오</b>", "인스펙터에서 <b>입력</b> 채널 선택", "트랙 헤더 <b>R</b> 버튼(녹음 준비) 켜기", "레벨 미터 확인하며 인터페이스 게인 조절 → 피크 <v>-12</v>dBFS", "<k>R</k>로 녹음"]}, {"n": "프로젝트 포맷", "s": ["<b>파일 → 프로젝트 설정 → 오디오</b>", "<b>샘플률</b> <v>48</v>kHz", "<b>녹음 파일 유형</b> 확인"]}], "drill": ["오디오 트랙을 만들고 마이크를 연결해 30초를 녹음한다. 피크가 -12dBFS 근처인지 확인한다.", "버퍼를 1024로 올려 지연을 체감한 뒤 128로 되돌린다.", "일부러 클립시켜 소리가 어떻게 깨지는지 한 번 들어본다."], "keys": [["R", "녹음"], ["스페이스", "재생"], ["⌘S", "저장"]], "chk": ["적정 레벨을 안다", "버퍼 크기를 상황에 따라 바꾼다", "입력 채널을 지정할 수 있다", "버퍼 아래의 왕복 지연 표시를 확인한다"], "quiz": [{"q": "녹음 시 권장 피크 레벨은?", "a": ["-12에서 -6dBFS", "-40dBFS", "-3dBFS", "0dBFS"], "c": 0, "e": "여유를 두어야 클립을 피하고 이후 처리 공간이 생긴다."}]}, {"t": "보컬 마이킹: 위치, 거리, 각도", "goal": "보컬 녹음의 위치, 거리, 각도, 게인을 설정한다.", "con": ["녹음 품질의 절반은 마이크를 켜기 전에 정해진다. 방, 거리, 각도다. 비싼 마이크보다 이 셋이 먼저다.", "방이 가장 큰 변수다. 맨벽의 사각 방은 소리가 벽 사이를 오가며 울린다. 이 울림은 나중에 지울 수 없다. 해결은 흡음이다. 옷이 가득한 옷장 앞, 두꺼운 커튼 앞, 이불을 두른 구석이 좋은 녹음 부스가 된다. 마이크 뒤에 리플렉션 필터를 두르는 것도 같은 원리다. 손뼉을 쳐서 울림이 짧은 자리를 찾는다.", "거리는 <v>15~20cm</v>가 기준이다. 주먹 두 개 정도다. 가까우면 근접 효과로 저음이 붇고 숨소리가 커지며, 멀면 방 울림이 많이 섞인다. 곡의 성격에 따라 조절하되 한 곡 안에서는 거리를 유지한다. 팝 필터는 입과 마이크 사이, 마이크에서 <v>5~10cm</v> 앞에 세운다.", "각도도 도구다. 입 정면에 정확히 맞추면 파열음과 치찰음이 직격한다. 마이크를 입 높이에서 살짝 위나 옆으로 <v>10~20</v>도 틀면 바람은 비켜 가고 목소리는 그대로 담긴다. 이렇게 축을 벗어나게 놓는 것을 오프 액시스라고 부른다.", "게인은 앞에서 배운 기준 그대로다. 가장 크게 부르는 부분을 미리 불러 보며 피크가 <v>-12</v>dBFS 부근에 오도록 잡는다. 이 값이면 실제 녹음에서 예상보다 크게 불러도 <v>0</v>에 닿지 않는다. 사람은 본 녹음에서 리허설보다 크게 부르기 때문에 여유가 필요하다. 조용한 부분 기준으로 잡으면 후렴에서 클리핑이 난다.", "모니터링은 반드시 헤드폰으로 한다. 스피커를 켜 둔 채 녹음하면 스피커 소리가 마이크로 다시 들어가 하울링이 나거나 반주가 녹음에 섞인다. 밀폐형 헤드폰이 소리 샘이 적다. 자기 목소리가 헤드폰으로 들리는 정도는 인터페이스의 다이렉트 모니터링으로 맞추면 지연이 없다. 이때 겹침을 조심한다. 다이렉트 모니터링을 쓰면서 로직의 입력 모니터링 버튼까지 켜 두면 같은 목소리가 두 경로로 들어와 겹쳐 울린다. 한쪽만 쓴다.", "녹음 직전 점검 다섯 가지. 에어컨과 선풍기를 껐는가, 휴대폰이 무음인가, 의자가 삐걱대지 않는가, 헤드폰에서 소리가 새지 않는가, 물을 준비했는가."], "path": [{"n": "자리 잡기", "s": ["손뼉을 치며 방에서 울림이 가장 짧은 자리를 찾는다", "옷장 앞이나 커튼 앞처럼 흡음이 되는 곳에 마이크를 세운다", "쇼크 마운트에 마이크를 걸고 팝 필터를 <v>5~10cm</v> 앞에 세운다"]}, {"n": "거리·각도·게인", "s": ["입에서 <v>15~20cm</v> 거리를 잡는다", "마이크를 입 높이에서 살짝 틀어 오프 액시스로 놓는다", "가장 큰 소절을 불러 보며 게인을 피크 <v>-12</v>dBFS로 맞춘다"]}, {"n": "모니터링", "s": ["스피커를 끄고 밀폐형 헤드폰을 쓴다", "인터페이스의 다이렉트 모니터링으로 내 목소리 크기를 맞춘다", "반주와 목소리의 균형을 헤드폰 안에서 편하게 만든다"]}], "drill": ["방의 세 자리에서 같은 문장을 녹음해 울림 차이를 비교하고 가장 좋은 자리를 정한다.", "거리 10cm, 20cm, 40cm로 같은 소절을 녹음해 근접 효과와 방 울림의 변화를 듣는다.", "정면과 오프 액시스로 파열음이 많은 문장을 녹음해 바람 소리 차이를 비교한다."], "keys": [["R", "녹음"], ["스페이스", "재생과 정지"], ["U", "선택 영역을 사이클로"]], "chk": ["울림이 짧은 자리를 찾을 수 있다", "거리와 각도를 이유와 함께 정한다", "헤드폰 모니터링으로 녹음한다"], "quiz": [{"q": "보컬 마이크 거리의 기준은?", "a": ["15~20cm", "1m", "5cm", "50cm"], "c": 0, "e": "주먹 두 개 정도. 가까우면 저음이 붇고 멀면 방 울림이 섞인다."}, {"q": "녹음할 때 스피커를 꺼야 하는 이유는?", "a": ["마이크가 상해서", "전기를 아끼려고", "스피커 소리가 마이크로 다시 들어가서", "저작권 때문에"], "c": 2, "e": "하울링이 나거나 반주가 녹음에 섞인다. 모니터링은 헤드폰으로 한다."}, {"q": "게인은 어느 부분을 기준으로 잡나?", "a": ["가장 조용한 부분", "가장 크게 부르는 부분", "반주만", "중간 부분"], "c": 1, "e": "제일 큰 소절에서 피크 -12dBFS 부근이면 어디서도 클리핑이 나지 않는다."}], "d": 65, "s": 9}, {"t": "악기 마이킹", "goal": "악기별 마이크 기준 위치와 다중 마이크 규칙을 안다.", "con": ["악기 마이킹의 원리는 하나다. 마이크가 놓인 자리의 소리가 그대로 녹음된다. 악기는 부위마다 다른 소리를 내므로, 어디를 겨누느냐가 음색을 정한다. 정답은 없고 기준점이 있다.", "어쿠스틱 기타. 사운드홀을 정면으로 겨누면 저음이 과해 붕붕댄다. 기준점은 <v>12</v>프렛 부근, 거리 <v>15~30cm</v>다. 넥 쪽으로 갈수록 맑아지고 브리지 쪽으로 갈수록 두꺼워진다. 마이크를 조금씩 옮기며 헤드폰으로 듣고 정한다.", "기타 앰프. 스피커 콘의 중심을 겨누면 밝고 날카롭고, 가장자리로 갈수록 어둡고 부드럽다. 기준점은 중심과 가장자리의 중간, 그릴에 바짝 붙인 거리다. 다이내믹 마이크가 큰 음압을 버텨 주므로 이쪽이 기본이다.", "피아노, 현악기, 방 전체 같은 넓은 소리는 마이크 한 대로 부족할 때가 있다. 두 대로 스테레오를 만드는 가장 안전한 방법이 XY다. 두 마이크의 머리를 한 점에 모으고 <v>90</v>도로 벌려 좌우를 나눠 받는다. 한 점에 모으는 이유는 시간이다. 머리가 한 점에 있으면 소리가 두 마이크에 같은 시간에 도착해 위상 문제가 없고, 좌우 구분은 두 마이크가 받는 크기 차이로 만들어진다. 90도인 이유는 균형이다. 더 벌리면 넓어지는 대신 가운데가 비고, 좁히면 모노에 가까워진다. 머리가 한 점에 있어서 두 마이크에 소리가 같은 시간에 도착하고, 위상 문제가 생기지 않는다.", "마이크를 여러 대 쓸 때의 규칙이 3대 1 법칙이다. 두 번째 마이크는 첫 마이크와 소리원 사이 거리의 세 배 이상 떨어뜨린다. 세 배인 이유는 거리 감쇠다. 소리는 거리가 두 배가 될 때마다 약 6dB씩 작아지므로, 세 배 거리에서는 새어 드는 소리가 원 신호보다 9dB 이상 작아 간섭의 굴곡이 귀에 잡히지 않는다. 소리원에서 30cm에 세웠다면 다음 마이크는 90cm 밖이다. 이 간격이 지켜지면 같은 소리가 두 마이크에 시간 차로 들어가 생기는 위상 간섭이 귀에 안 들릴 만큼 작아진다.", "거리 자체도 음색이다. 가까이 대면 마르고 또렷한 소리, 멀리 두면 공간이 섞인 소리가 된다. 가까이 받은 트랙에 리버브를 더하는 것은 쉽지만, 멀리 받아 섞인 울림을 빼는 것은 불가능하다. 애매하면 가까이 받는다.", "녹음 전 마지막 확인. 악기 자체의 상태다. 기타 줄이 오래됐으면 어떤 마이크로도 죽은 소리가 난다. 조율, 줄, 삐걱거리는 의자. 소리의 출발점이 좋아야 이후 단계의 결과도 좋다.", "마이크 여러 개로 받은 드럼을 편집할 때 조심할 것이 있다. 킥 트랙만 잘라 옮기면 나머지 마이크와 시간이 어긋나 애써 맞춘 위상이 깨진다. 그래서 편집 전에 트랙들을 그룹으로 묶고 <b>편집 (선택)</b>과 <b>위상 잠금 오디오</b>를 켠다. 그러면 한 트랙을 자르거나 옮길 때 그룹 전체가 똑같이 따라온  거는 것과 다른 점은?", "a": ["CPU를 덜 쓴다", "누른 소리로 대체하지 않고 원음에 더한다", "음정이 정확해진다", "자동이다"], "c": 1, "e": "원음의 다이내믹을 유지한 채 눌린 복사본을 섞어 밀도만 더한다."}, {"q": "무음 제거 후 리전이 수십 개로 쪼개졌다면?", "a": ["프리 어택을 0으로", "다시 녹음한다", "스레숄드를 올린다", "최소 무음 길이를 늘린다"], "c": 3, "e": "짧게 잡으면 숨 쉬는 사이마다 잘린다. 0.2~0.5초가 무난하다."}]}, {"d": 69, "s": 9, "t": "플렉스 타임", "goal": "오디오의 타이밍을 모드에 맞게 고치고 퀀타이즈한다.", "con": ["앞 일차에서 구간을 정리했으면 이제 타이밍과 음정 차례다. 플렉스 타임은 오디오의 타이밍을 미디처럼 옮길 수 있게 해준다. 파형에 트랜지언트 표시가 생기고 그것을 드래그하면 앞뒤가 늘어나거나 줄어든다.", "먼저 모드를 고른다. 모드는 여섯 개이고 소재에 따라 갈린다. <b>모노포닉</b>은 한 번에 한 음만 나는 소리에 쓴다. 솔로 보컬과 베이스 라인이 여기 해당한다. <b>폴리포닉</b>은 코드가 들어간 소리에 쓰고 여섯 중 컴퓨터를 가장 많이 쓴다. <b>슬라이싱</b>은 드럼처럼 타격이 분명한 소리에 쓴다. <b>리듬</b>은 리듬 기타나 건반 반주처럼 규칙적인 소재에 맞는다. <b>템포폰</b>과 <b>속도</b>는 소재별 구분이 아니라 특수 처리다.", "슬라이싱이 드럼에 맞는 이유가 있다. 다른 모드는 소리를 늘이거나 줄이는데, 슬라이싱은 타격 지점에서 자른 뒤 조각을 옮기기만 하고 원래 속도로 재생한다. 그래서 타격의 앞부분이 손상되지 않는다. 드럼에 폴리포닉이나 모노포닉을 걸면 타격이 번지고 위상이 흐트러진다.", "모노포닉에는 조건이 하나 붙는다. 녹음이 비교적 마른 상태여야 한다. 잔향이 들리는 녹음이라면 모노포닉이 제대로 동작하지 않으므로 폴리포닉을 대신 쓴다. 그리고 모노포닉의 <b>퍼커시브</b> 항목은 뜯는 악기나 음정 있는 타악기일 때 켜고, 활로 긋는 현악기나 관악기일 때는 끈다. 반대로 두면 타격 지점에서 잡음이 생긴다.", "플렉스를 켜면 컴퓨터 부담이 커진다. 작업이 끝나면 바운스해서 새 오디오로 만드는 편이 좋다. 되돌릴 수 없는 편집을 하기 전에는 <k>⌥⌘F</k>로 리전을 독립된 오디오 파일로 만든다. 같은 파일을 쓰는 다른 리전이 함께 바뀌는 사고를 막아준다. 특히 Apple Loops나 같은 샘플을 여러 번 복사해 쓴 경우에 필요하다.", "플렉스를 켜면 오디오도 퀀타이즈할 수 있다. 트랙에 플렉스를 켠 뒤 리전을 선택하고 <k>Q</k>를 누르면 로직이 타격 지점을 분석해 격자에 붙인다. 격자와 강도는 미디와 마찬가지로 리전 인스펙터에서 정한다. 손으로 친 드럼 녹음을 정리할 때 쓰는 방법이다.", "플렉스 마커를 직접 다루는 방법도 알아둔다. 플렉스를 켜면 파형 위쪽에 얇은 세로선이 트랜지언트 자리마다 생기는데, 그 자리를 클릭하면 마커가 되고 끌면 그 지점만 옮겨진다. 한 박만 늦은 타격을 고칠 때 리전을 자를 필요 없이 마커 하나만 끌면 된다. 마커를 잘못 찍었으면 더블 클릭으로 지운다.", "리전 전체의 길이를 바꾸는 것도 플렉스가 한다. 리전 끝을 <k>⌥</k>를 누른 채 끌면 잘리는 것이 아니라 늘어나거나 줄어든다. 4마디 루프를 8마디로 늘리거나, 다른 템포의 소재를 곡에 맞출 때 쓴다. 다만 <v>10</v>퍼센트 이상 바꾸면 소리가 상한다.", "속도 모드는 다른 모드와 성격이 다르다. 테이프를 빨리 돌리듯 길이와 음정이 함께 바뀐다. 자연스럽지 않지만 그것이 목적일 때 쓴다. 드럼을 느리게 해 무겁게 만들거나 보컬을 빠르게 해 효과음처럼 쓸 때다.", "오디오를 미디로 바꾸는 것도 플렉스 피치에서 할 수 있다. 단선율 보컬이나 베이스를 분석해 미디 리전으로 만들면, 부른 선율을 다른 악기로 바꾸거나 화음을 붙일 수 있다. 정확도는 소재가 깨끗할수록 높다."], "path": [{"n": "플렉스 요하다.", "음정 보정은 완전히 붙이지 않는 것이 자연스럽다. 완벽하게 맞추면 기계처럼 들린다. 눈에 띄게 벗어난 음만 고치는 것이 기본이다.", "플렉스 피치에는 한계가 있다. 한 번에 한 음만 울리는 소리에서만 제대로 동작한다. 보컬과 단선율 악기는 되지만 기타 코드나 피아노처럼 여러 음이 겹친 오디오는 음을 따로 잡아내지 못한다.", "겹친 음을 다루려면 ARA를 지원하는 외부 플러그인이 필요하다. Melodyne이 대표적이고, 로직 안에서 오디오를 직접 편집하는 방식으로 붙는다. 기타 코드에서 한 음만 고치거나 화음의 음정을 바꾸는 작업이 이때 가능해진다.", "이것을 알아둬야 하는 이유는 판단 때문이다. 코드가 틀린 기타 녹음을 플렉스 피치로 붙잡고 있으면 시간만 버린다. 다시 녹음하거나 ARA 플러그인을 쓰거나 둘 중 하나다."], "path": [{"n": "플렉스 피치 실전", "s": ["트랙 헤더 플렉스 버튼 → <b>Flex Pitch</b>", "리전 선택 → <k>I</k> 인스펙터 → <b>피치 보정</b> <v>60</v>퍼센트", "재생하며 여전히 벗어난 음을 찾는다", "그 음만 막대를 잡아 위아래로 끌거나 더블 클릭", "흔들림이 심한 음은 아래 손잡이를 <v>50</v>퍼센트로", "끝나면 <k>⌥⌘F</k>로 새 파일 만들기"]}], "drill": ["플렉스 피치로 벗어난 음 두세 개만 고치고 나머지는 그대로 둔다."], "keys": [["⌘F", "플렉스 표시"], ["I", "인스펙터"], ["⌥⌘F", "독립 파일로"]], "chk": ["플렉스 피치의 한계와 대안을 안다", "피치 보정 값으로 전체를 당긴 뒤 개별 수정한다"], "quiz": [{"q": "기타 코드 녹음에서 한 음만 음정을 고치려면?", "a": ["ARA 지원 플러그인", "퀀타이즈", "게이트", "플렉스 피치"], "c": 0, "e": "플렉스 피치는 단선율만 다룬다. 겹친 음은 Melodyne 같은 ARA 플러그인이 필요하다."}, {"q": "잔향이 들리는 보컬 녹음의 타이밍을 고치려면?", "a": ["속도", "폴리포닉", "모노포닉", "슬라이싱"], "c": 1, "e": "모노포닉은 마른 녹음에서만 제대로 동작한다. 잔향이 있으면 폴리포닉을 쓴다."}, {"q": "플렉스 피치에서 피치 보정을 100으로 두면?", "a": ["아무 변화 없다", "음이 낮아진다", "가장 자연스럽다", "완전히 붙어 기계적으로 들린다"], "c": 3, "e": "50~70에서 전체를 당기고 눈에 띄는 음만 손으로 고친다."}], "s": 9, "d": 70}, {"d": 71, "s": 9, "t": "스마트 템포와 오디오 가져오기", "goal": "외부 오디오를 프로젝트 템포에 맞춰 가져온다.", "con": ["바깥에서 받은 오디오는 대개 프로젝트와 템포가 다르다. 그냥 넣으면 어긋난다. 로직은 세 가지 방식으로 처리한다.", "프로젝트 템포 모드가 세 가지다. 유지는 프로젝트 템포를 지키고 오디오를 그에 맞춘다. 조정은 반대로 들어온 오디오의 템포를 프로젝트가 따라간다. 자동은 상황에 따라 판단한다. 대부분의 경우 유지가 맞다.", "리전 단위로도 정한다. 리전 인스펙터의 플렉스와 팔로우 항목을 켜면 그 리전이 프로젝트 템포를 따라간다. 루프 소재를 넣을 때 편하다. 샘플 하나를 즉석에서 맞출 때는 더 직접적인 방법이 있다. 샘플의 원래 길이만큼 사이클 구간을 잡고 리전을 선택한 뒤 <k>⌥⌘L</k>을 누르면, 리전이 사이클 길이에 맞춰 늘어나거나 줄어든다. 템포를 모르는 샘플이라면 리전을 선택하고 <k>⌥⌘T</k>로 먼저 분석시킨다. 매번 손으로 맞추는 것이 번거롭다면 <k>⌥P</k>로 스마트 템포 설정을 열어 <b>가져온 파일</b>을 <b>켬 + 마디 및 비트 정렬</b>로 바꿔 둔다. 그 뒤로는 파일을 끌어다 놓는 순간 로직이 알아서 분석해 맞춘다.", "템포를 크게 바꾸면 소리가 상한다. 원본에서 <v>10</v>퍼센트 안쪽이면 대체로 티가 안 나고, <v>20</v>퍼센트를 넘으면 늘어지거나 떨리는 소리가 들린다. 그럴 때는 다른 소재를 찾는 편이 낫다.", "샘플레이트가 다른 파일은 로직이 변환해 넣는다. 프로젝트와 같은 샘플레이트의 파일을 쓰는 것이 가장 깨끗하다.", "오디오를 가져오는 방법은 셋이다. 파인더에서 드래그, 브라우저에서 드래그, 파일 메뉴에서 가져오기. 어느 쪽이든 프로젝트 폴더로 복사할지 묻는데, 복사해두는 편이 안전하다.", "로직 12.3부터 리전 인스펙터에 스마트 템포 팝업 메뉴가 생겼다. 파일 템포를 끄면 플렉스를 쓸 때 파일에 적힌 템포 정보를 무시하므로, 잘못 적힌 템포 때문에 어긋나는 소재를 다룰 때 쓴다. 오디오 파일의 템포를 리전 인스펙터에서 직접 입력하는 것도 가능해졌다.", "드럼을 마이크 여러 개로 녹음한 것이나 밴드 라이브 녹음을 가져오면 문제가 하나 생긴다. 파일마다 따로 분석되어 킥 트랙과 오버헤드 트랙의 템포가 서로 다르게 잡힌다. 이때는 멀티트랙 세트로 묶는다. 파일들을 하나의 연주로 보고 함께 분석하므로 전부 같은 템포 맵을 따른다. 한 파일씩 분석하면 애써 맞춘 위상도 깨진다."], "path": [{"n": "템포 모드 설정", "s": ["LCD 왼쪽의 <b>프로젝트 템포 모드</b> 표시 클릭", "<b>유지 / 조정 / 자동</b> 중 선택", "확신이 없으면 <b>유지</b>"]}, {"n": "리전이 템포를 따르게", "s": ["오디오 리전 선택 → <k>I</k> 인스펙터", "<b>플렉스와 팔로우</b> 항목을 <b>켬</b> 또는 <b>켬 + 리전 시작에 맞춤</b>", "템포를 바꿔 리전이 따라오는지 확인"]}, {"n": "멀티트랙 세트 분석", "s": ["함께 녹음된 오디오 파일들을 전부 선택", "<b>편집 → 템포 → 멀티트랙 세트로 스마트 템포 분석</b>", "기준이 될 트랙(대개 킥이나 오버헤드) 지정", "분석 후 전체가 같은 템포를 따르는지 확인"]}], "drill": ["템포가 다른 드럼 루프를 가져와 프로젝트 템포에 맞춘다.", "원본에서 10퍼센트, 25퍼센트 벌어지게 템포를 바꿔 소리가 상하는 지점을 찾는다.", "같은 파일을 프로젝트 폴더로 복사한 경우와 아닌 경우를 만들어 폴더 구조를 비교한다."], "keys": [["I", "인스펙터"], ["⌘F", "플렉스 표시"], ["⌥⌘L", "사이클 길이에 맞추기"], ["⌥⌘T", "리전 템포 분석"], ["⌥P", "스마트 템포 설정"]], "chk": ["세 가지 템포 모드를 안다", "리전이 템포를 따르게 만들 수 있다", "템포 변경 한계를 안다"], "quiz": [{"q": "오디오 템포를 원본에서 몇 퍼센트 넘게 바꾸면 소리가 상하기 시작하나?", "a": ["100퍼센트", "50퍼센트", "20퍼센트 부근", "2퍼센트"], "c": 2, "e": "10퍼센트 안쪽은 대체로 무난하고 20퍼센트를 넘으면 티가 나기 시작한다."}]}, {"d": 72, "s": 10, "t": "레퍼런스와 청취 환경", "goal": "레퍼런스 트랙을 설정하고 청취 환경을 관리한다.", "con": ["믹싱에서 가장 흔한 실패는 기술 부족이 아니라 판단 기준이 없는 것이다. 목표로 삼을 소리를 옆에 두고 비교하면 문제가 눈에 띄게 잘 보인다.", "레퍼런스는 내가 만들려는 곡과 장르와 편성이 비슷한 완성 음원이다. 프로젝트에 오디오 트랙으로 불러와 놓고 수시로 오간다.", "비교할 때 반드시 음량을 맞춘다. 레퍼런스는 마스터링이 끝나 크기 때문에 그냥 비교하면 무조건 좋게 들린다. 레퍼런스 트랙 페이더를 <v>-8</v>에서 <v>-12</v>dB 정도 내려 체감 크기를 비슷하게 맞춘 뒤 듣는다.", "청취 음량이 판단을 바꾼다. 크게 들으면 저역과 고역이 강조되어 실제보다 좋게 들린다. 밸런스 판단은 작게, 세부 확인은 잠깐 크게 하는 식으로 나눈다. 한 자리에서 오래 크게 듣는 것이 가장 나쁘다.", "기준 숫자가 있으면 편하다. 실무에서 쓰는 범위는 대략 <v>76~85</v>dB SPL이다. 이 부근에서 귀의 감도가 비교적 평평해서 저역과 고역이 실제 비율로 들린다. 스마트폰의 소음 측정 앱으로도 대략 잴 수 있으니 한 번 재서 그 볼륨 위치를 표시해 두면 매번 같은 조건에서 판단할 수 있다.", "귀가 지치는 것도 음량과 관계있다. <v>85</v>dB SPL을 넘겨 오래 들으면 청력에 무리가 가고, 그전에 판단력이 먼저 흐려진다. 밸런스는 <v>70</v>dB 부근에서 작게, 세부 확인은 잠깐만 크게, 이렇게 나누면 오래 작업해도 귀가 버틴다. 작게 들으면 중역의 균형만 남아서 무엇이 묻히는지가 바로 드러나고, 크게 들으면 저역과 잡음처럼 작게는 안 들리는 문제가 드러난다. 두 가지를 다른 음량에서 확인하는 셈이다.", "귀는 20분에서 30분이면 지친다. 지친 귀는 고역을 덜 느껴서 자꾸 밝게 만들게 된다. 짧게 쉬는 편이 낫다.", "확인은 여러 곳에서 한다. 스튜디오 모니터, 이어폰, 노트북 스피커, 휴대폰, 차 안. 모두에서 무난하면 완성이다."], "path": [{"n": "레퍼런스 트랙 만들기", "s": ["오디오 트랙 생성 → 완성 음원 파일 드래그", "트랙 출력을 <b>Stereo Out</b> 대신 새 <b>Bus</b>로 지정하면 마스터 체인을 거치지 않음", "페이더를 <v>-10</v>dB 부근으로 내려 음량 맞춤", "<k>S</k>로 오가며 비교"]}], "drill": ["장르가 비슷한 완성 음원 세 곡을 프로젝트에 넣고 음량을 맞춘다.", "내 믹스와 레퍼런스를 번갈아 들으며 저역, 보컬 크기, 넓이 세 가지를 비교해 적는다.", "같은 믹스를 아주 작은 음량과 큰 음량으로 듣고 판단이 어떻게 달라지는지 확인한다."], "keys": [["S", "솔로"], ["M", "뮤트"], ["X", "믹서"]], "chk": ["레퍼런스 음량을 맞춰 비교한다", "작게 듣고 밸런스를 판단한다", "여러 환경에서 확인한다", "청취 음량 기준을 안다"], "quiz": [{"q": "레퍼런스와 비교할 때 반드시 해야 하는 것은?", "a": ["같은 템포로 맞추기", "모노로 듣기", "음량을 맞추기", "같은 조로 옮기기"], "c": 2, "e": "크면 좋게 들리기 때문에 음량을 맞추지 않으면 비교가 성립하지 않는다."}, {"q": "믹싱 시 권장되는 청취 음량 범위는?", "a": ["50~60dB SPL", "76~85dB SPL", "최대한 크게", "95~105dB SPL"], "c": 1, "e": "이 부근에서 귀의 감도가 평평해 저역과 고역이 실제 비율로 들린다."}]}, {"d": 73, "s": 10, "t": "프리즈와 바운스 인 플레이스", "goal": "프리즈와 바운스 인 플레이스로 부하를 줄인다.", "con": ["곡이 커지면 컴퓨터가 버거워진다. 소리가 끊기거나 시스템 과부하 경고가 뜬다. 해결책은 처리를 미리 해두고 그 결과만 재생하는 것이다.", "프리즈는 트랙을 임시로 오디오로 만들어 재생한다. 언제든 해제해서 다시 편집할 수 있다. 되돌릴 여지를 남기므로 작업 중에는 프리즈가 편하다. 프리즈 모드가 두 가지인데, 소스만 얼리면 이후 이펙트는 계속 조절할 수 있고, 사전 페이더까지 얼리면 자원이 더 많이 절약되는 대신 이펙트도 고정된다.", "바운스 인 플레이스는 아예 오디오 리전으로 바꾼다. 되돌리려면 원본 트랙을 보관해야 한다. 미디 이펙트 결과를 확정하거나 다른 사람에게 넘길 때 쓴다.", "둘의 차이가 하나 더 있다. 프리즈는 <v>32</v>비트 부동소수점으로 얼리기 때문에 음량이 넘쳐도 깨지지 않는다. 바운스 인 플레이스는 그런 보호가 없으므로 레벨을 미리 정리해 두고 실행한다.", "바운스 인 플레이스에는 선택이 하나 더 있다. 여러 리전을 골랐을 때 결과를 파일 하나로 합칠지, 트랙마다 하나씩 만들지, 리전마다 따로 만들지 정할 수 있다. 어느 쪽이든 이펙트의 잔향이 원래 리전 끝을 넘어 파일에 함께 담긴다.", "자원이 새는 흔한 원인들. 쓰지 않는 플러그인이 켜진 채 남아 있는 경우, 리버브를 트랙마다 개별로 건 경우, 샘플 라이브러리를 회전식 하드디스크에 둔 경우, 프리로드 버퍼가 과하게 큰 경우.", "CPU 미터를 보고 판단한다. 코어 하나만 치솟는다면 그 트랙의 플러그인 사슬이 길기 때문이다. 그 트랙을 프리즈하면 해결된다.", "작업 순서를 정해두면 좋다. 편곡이 끝난 트랙은 프리즈한다. 손댈 일이 없는 트랙까지 실시간으로 계산할 이유가 없다."], "path": [{"n": "프리즈 켜기", "s": ["트랙 헤더 우클릭 → <b>트랙 헤더 구성요소</b> → <b>프리즈</b> 체크", "트랙 헤더의 눈송이 버튼 클릭", "재생하면 얼기 시작", "<k>I</k> 인스펙터에서 <b>프리즈 모드</b>를 <b>소스만</b> 또는 <b>사전 페이더</b>로"]}, {"n": "바운스 인 플레이스", "s": ["리전 선택 → <k>⌃B</k>", "트랙 전체는 <k>⌃⌥B</k>", "<b>이름</b> 확인. 기본은 원래 이름 뒤에 <b>_bip</b>가 붙는다", "<b>대상</b>에서 새 트랙에 놓을지 선택한 트랙에 놓을지 고름", "여러 리전이면 파일 하나로 합칠지 각각 만들지 선택", "<b>확인</b>"]}, {"n": "부하 확인", "s": ["<b>보기 → CPU/HD 미터 사용자화</b> 또는 컨트롤 막대의 성능 미터", "코어별 사용량 확인"]}], "drill": ["플러그인이 많은 트랙을 프리즈하고 CPU 미터 변화를 확인한다.", "프리즈 모드 두 가지를 각각 걸어보고 무엇이 조절 가능한지 비교한다.", "아르페지에이터가 걸린 트랙을 바운스 인 플레이스로 확정한다."], "keys": [["⌃B", "리전 바운스 인 플레이스"], ["⌃⌥B", "트랙 바운스 인 플레이스"], ["⌘S", "저장"]], "chk": ["프리즈와 바운스 인 플레이스를 구분한다", "프리즈 모드를 선택할 수 있다", "CPU 미터로 원인을 찾는다", "프리즈와 바운스 인 플레이스의 레벨 처리 차이를 안다"], "quiz": [{"q": "언제든 해제해 다시 편집할 수 있는 쪽은?", "a": ["프리즈", "바운스 인 플레이스", "스템 내보내기", "프로젝트 정리"], "c": 0, "e": "프리즈는 임시라서 해제하면 원래대로 돌아온다."}, {"q": "프리즈가 음량이 넘쳐도 깨지지 않는 이유는?", "a": ["오프라인이라서", "32비트 부동소수점으로 얼리기 때문", "레벨을 낮춰서", "자동으로 리미터가 걸려서"], "c": 1, "e": "바운스 인 플레이스에는 그런 보호가 없으므로 레벨을 미리 정리하고 실행한다."}]}, {"t": "미디를 오디오로 한 번에", "goal": "믹싱 전에 미디 트랙을 오디오로 확정하는 이유를 알고 전체를 한 번에 변환한다.", "con": ["편곡이 끝나고 믹싱으로 넘어갈 때 하는 일이 있다. 미디 트랙을 전부 오디오로 바꾸는 것이다. 안 바꿔도 믹싱은 되지만, 바꾸면 달라지는 것이 여럿이라 대개 이 단계를 거친다.", "<b>첫째, 소리가 고정된다.</b> 미디 트랙은 재생할 때마다 가상악기가 계산해서 소리를 만든다. 대부분 같지만 항상 같지는 않다. 음원에 무작위 요소가 있거나, 라운드 로빈으로 샘플을 번갈아 쓰거나, 아날로그 흉내를 내는 신스라면 재생마다 미세하게 다르다. 믹싱은 소리를 듣고 판단하는 일인데 그 소리가 매번 바뀌면 기준이 흔들린다. 오디오로 바꾸면 파형이 고정되어 어제 맞춘 균형이 오늘도 같다.", "<b>둘째, 컴퓨터가 가벼워진다.</b> 가상악기는 재생 내내 계산을 하고 샘플을 디스크에서 읽는다. 서른 트랙이면 서른 개의 악기가 동시에 돌아간다. 오디오로 바꾸면 이 부담이 사라지고 그 여유가 믹싱 플러그인으로 간다. 믹싱은 트랙마다 EQ와 컴프가 붙는 단계라 자원이 많이 필요하다.", "<b>셋째, 파형이 보인다.</b> 미디 리전은 막대만 보이지만 오디오는 파형이 보인다. 어디가 큰지, 어디에 잡음이 있는지, 두 트랙의 타격이 맞는지가 눈으로 보인다. 앞에서 본 클립 게인과 페이드도 오디오에만 쓸 수 있다. 위상을 맞추는 작업도 파형이 있어야 한다.", "<b>넷째, 오디오에만 되는 처리가 있다.</b> 플렉스 타임과 플렉스 피치, 마키로 구간 늘이기, 리버스, 파일 편집기에서의 파형 수정이 전부 오디오 전용이다. 미디로 두면 이것들을 쓸 수 없다.", "<b>다섯째, 넘기기 쉬워진다.</b> 다른 사람이 믹스할 때 미디 트랙이 있으면 그쪽에도 같은 가상악기가 있어야 한다. 없으면 소리가 안 난다. 오디오로 바꾸면 그런 문제가 없다. 앞에서 본 스템 내보내기도 결국 이 작업이다.", "<b>바꾸지 말아야 할 때도 있다.</b> 아직 음을 고칠 여지가 있으면 바꾸지 않는다. 편곡이 확정되지 않았는데 오디오로 만들면 음 하나 고치려고 다시 만들어야 한다. 그래서 순서가 중요하다. 편곡을 마치고, 악기 음색을 확정하고, 그다음 변환한다.", "<b>변환하는 방법이 여럿이다.</b> 앞에서 본 프리즈는 임시라 되돌릴 수 있고, 바운스 인 플레이스는 확정이다. 믹싱으로 넘어가는 단계라면 바운스 인 플레이스를 쓴다.", "<b>한 번에 하는 방법</b>이 핵심이다. 트랙을 하나씩 바꾸면 서른 트랙에 서른 번이다. 트랙 영역에서 <k>⌘A</k>로 모든 리전을 선택하고 <k>⌃B</k>를 누르면 선택된 것 전부가 한 번에 처리된다. 창이 한 번만 뜨고 그 설정이 전부에 적용된다. 미디 트랙만 고르고 싶으면 트랙 헤더에서 미디 트랙들을 선택한 뒤 <k>⌃⌥B</k>를 쓴다. 이쪽은 트랙 단위라 리전을 일일이 고르지 않아도 된다.", "창에서 정할 것이 몇 가지다. <b>이름</b>은 기본이 원래 이름 뒤에 <b>_bip</b>가 붙는 것인데, 나중에 구분하기 좋으므로 그대로 둔다. <b>대상</b>은 <b>새 트랙</b>을 고른다. 같은 트랙에 놓으면 원본 미디가 사라진다. 새 트랙으로 만들면 미디 트랙이 그대로 남아 나중에 고칠 여지가 생긴다. <b>소스</b>는 <b>남기기</b>를 고르고 원본 트랙은 비활성화한다.", "<b>포함</b> 항목에서 볼 것이 있다. <b>오디오 테일 포함</b>을 켜면 리버브나 딜레이의 꼬리가 리전 끝을 넘어 함께 담긴다. 이걸 끄면 잔향이 뚝 끊긴다. <b>볼륨·팬 오토메이션 포함</b>은 대개 끈다. 오토메이션까지 구워 버리면 믹싱에서 다시 조절할 수 없다. 이펙트는 켜고 오토메이션은 끄는 것이 기본이다.", "<b>변환 뒤에 확인할 것</b>이 있다. 새로 생긴 오디오 트랙의 음량이 원본과 같은지, 잔향이 잘리지 않았는지, 트랙 수가 맞는지 본다. 그리고 원본 미디 트랙은 지우지 말고 비활성화해 둔다. 나중에 음을 고쳐야 할 때 되살릴 수 있다. 프로젝트 용량은 조금 늘지만 그만한 값어치가 있다."], "path": [{"n": "전체를 한 번에 (리전 기준)", "s": ["트랙 영역 클릭 → <k>⌘A</k>로 모든 리전 선택", "미디 리전만 남기려면 오디오 리전은 <k>⇧</k>클릭으로 해제", "<k>⌃B</k> 바운스 인 플레이스", "<b>대상</b>을 <b>새 트랙</b>, <b>소스</b>를 <b>남기기</b>로", "<b>오디오 테일 포함</b> 켜기 · <b>오토메이션 포함</b> 끄기", "<b>확인</b>. 전부 한 번에 처리된다"]}, {"n": "트랙 단위로 한 번에", "s": ["트랙 헤더에서 미디 트랙 전부 선택 (<k>⇧</k>클릭 또는 드래그)", "<k>⌃⌥B</k>", "같은 설정 후 <b>확인</b>", "리전을 고르지 않아도 트랙 전체가 처리된다"]}, {"n": "변환 뒤 정리", "s": ["새 오디오 트랙의 음량이 원본과 같은지 확인", "리버브 꼬리가 잘리지 않았는지 확인", "원본 미디 트랙을 <b>비활성화</b> (트랙 헤더 우클릭 → 트랙 비활성화)", "트랙 이름을 정리하고 색을 맞춤", "<k>⌘S</k> 저장"]}], "drill": ["미디 트랙 세 개를 한 번에 바운스 인 플레이스로 바꿔 본다.", "오디오 테일 포함을 켜고 끄고 각각 만들어 잔향 끝을 비교한다.", "오토메이션 포함을 켠 것과 끈 것으로 만들어 믹싱에서 조절되는지 확인한다."], "keys": [["⌘A", "전체 선택"], ["⌃B", "바운스 인 플레이스"], ["⌃⌥B", "트랙 바운스 인 플레이스"], ["⌘S", "저장"]], "chk": ["왜 오디오로 바꾸는지 다섯 가지를 안다", "편곡이 확정된 뒤에 바꾼다", "원본 미디는 비활성화해 남긴다"], "quiz": [{"q": "미디를 오디오로 바꾸는 가장 큰 이유는?", "a": ["용량이 줄어서", "빨라서", "소리가 고정되어 믹싱 기준이 흔들리지 않아서", "음질이 좋아져서"], "c": 2, "e": "라운드 로빈이나 무작위 요소가 있으면 재생마다 미세하게 다르다."}, {"q": "미디 트랙 서른 개를 한 번에 바꾸려면?", "a": ["프리즈", "내보내기", "⌘A로 전체 선택 후 ⌃B", "하나씩 ⌃B"], "c": 2, "e": "트랙 헤더에서 트랙을 선택하고 ⌃⌥B를 써도 된다."}, {"q": "바운스 인 플레이스에서 오토메이션 포함을 끄는 이유는?", "a": ["구워 버리면 믹싱에서 다시 조절할 수 없어서", "음질 때문", "속도 때문", "용량 때문"], "c": 0, "e": "이펙트는 켜고 오토메이션은 끄는 것이 기본이다."}, {"q": "오디오 테일 포함을 끄면?", "a": ["리버브나 딜레이 꼬리가 뚝 끊긴다", "문제없다", "음량이 준다", "파일이 작아진다"], "c": 0, "e": "잔향이 리전 끝을 넘어 함께 담기게 켜 둔다."}], "s": 10, "d": 74}, {"t": "신호 흐름 한눈에 보기", "goal": "트랙, 버스, 마스터 각 단에서 무엇을 어느 자리에 거는지 전체 그림을 잡는다.", "con": ["믹싱을 배우기 전에 지도를 먼저 본다. 앞으로 나올 처리들이 각각 어느 단의 어느 자리에 들어가는지 알면, 개별 일차를 배울 때마다 자기 위치를 찾을 수 있다.", "단은 셋이다. 트랙 하나하나가 첫 단이고, 같은 역할의 트랙을 모은 버스가 둘째 단이고, 모든 소리가 합쳐지는 마스터가 마지막 단이다. 소리는 이 순서로만 흐르므로 앞 단에서 정리하지 않은 것은 뒤 단에서 더 어려워진다.", "트랙 단의 순서는 이렇다. 리전의 <b>클립 게인</b>으로 구간별 크기를 고르게 만들고, 이펙트 첫 슬롯의 <b>Gain</b>으로 평균을 <v>-18</v>dBFS에 맞춘다. 그다음 <b>EQ</b>로 안 쓰는 저역을 걷어내고 문제 대역을 깎는다. 이어서 다이내믹 계열이 온다. <b>디에서</b>, <b>컴프레서</b>, <b>트랜지언트 셰이퍼</b> 순이다. 마지막이 <b>새추레이션</b> 같은 음색 처리다.", "그다음은 인서트가 아니라 <b>센드</b>다. 리버브와 딜레이는 트랙에 직접 걸지 않고 버스로 보낸다. 그래서 컴프가 잔향을 누르는 일이 없다. 마지막으로 <b>페이더</b>다. 페이더는 레벨을 잡는 도구가 아니라 트랙 사이의 균형을 잡는 도구이므로 항상 맨 뒤다.", "버스 단에서는 다듬는 것이 아니라 묶는다. 서밍 스택으로 모은 채널에 필요하면 <b>EQ</b>를, 그다음 <b>컴프레서</b>를 게인 리덕션 <v>2~5</v>dB로 약하게 건다. 개별 트랙보다 약하게 거는 이유는 누적 때문이다. 트랙과 버스와 마스터에서 누른 양의 합이 <v>8</v>dB를 넘지 않게 관리한다.", "마스터 단의 순서는 <b>EQ</b> → <b>글루 컴프레서</b> → <b>새추레이션</b> → <b>리미터</b>다. 여기서 한 가지만 지킨다. 믹싱 중에는 리미터를 걸지 않는다. 미터만 걸어 두고 리미터는 마스터링 단계까지 미룬다. 미리 걸면 피크가 안 넘쳐 문제가 사라진 것처럼 보이지만 마스터링에서 라우드니스를 올릴 여지가 없어진다.", "마스터링 어시스턴트를 쓴다면 자리가 따로 있다. 스테레오 출력 채널 스트립 맨 아래의 <b>Mastering</b> 슬롯이고, 라우드니스 미터는 그보다도 뒤에 둔다. 미터는 소리를 바꾸지 않지만 최종 결과를 읽으려면 모든 처리를 지난 자리여야 한다.", "작업하는 시간 순서는 이 신호 순서와 조금 다르다. 레퍼런스를 준비하고, 게인과 페이더로 밸런스를 잡고, 헤드룸을 확인하고, 그다음에야 EQ와 컴프로 들어간다. 공간계와 팬은 그 뒤이고, 위상과 모노 확인이 마지막이다. 신호는 위에서 아래로 흐르지만 작업은 굵은 것에서 가는 것으로 간다.", "헷갈리기 쉬운 것 두 가지만 미리 짚는다. EQ와 컴프의 순서는 목적이 정한다. 특정 대역이 튀어서 컴프가 과반응한다면 EQ가 먼저이고, 컴프가 만든 음색 변화를 다듬는 것이라면 EQ가 나중이다. 그리고 새추레이션을 컴프 앞에 두기도 한다. 배음을 먼저 더한 뒤 눌러 밀도를 만드는 방식이라 결과가 상당히 다르므로 두 순서를 다 들어보고 정한다.", "각 단계에서 어느 플러그인을 여는지도 정해 두면 헤맬 일이 없다. 로직에는 같은 일을 하는 플러그인이 여럿 있지만 실제로 쓰는 것은 몇 개뿐이다.", "컴프는 <b>Dynamics → Compressor</b> 하나면 된다. 안에서 모델만 바꾼다. 드럼과 버스에는 <b>Studio VCA</b>가 반응이 빠르고 깔끔하며, 보컬에는 <b>Studio FET</b>가 잡아주는 느낌이 확실하고, 부드럽게 눌러야 할 때는 <b>Vintage Opto</b>가 맞는다. 모델을 바꿔도 파라미터는 같으므로 값을 다시 배울 필요가 없다.", "EQ는 자리에 따라 갈린다. 트랙에는 <b>Channel EQ</b>, 마스터에는 <b>Linear Phase EQ</b>다. 마스터에서 선형 위상을 쓰는 이유는 위상을 틀지 않기 때문이다. 대신 지연이 생기므로 트랙에 쓰면 작업이 불편해진다.", "공간계는 <b>ChromaVerb</b>와 <b>Stereo Delay</b>가 기본이다. 특정 실제 공간의 느낌이 필요할 때만 <b>Space Designer</b>로, 반복마다 다른 소리를 내고 싶을 때만 <b>Delay Designer</b>로 간다. 새추레이션은 <b>ChromaGlow</b> 하나로 충분하고 안에 다섯 가지 방식이 들어 있다.", "미터는 셋을 구분해 쓴다. 레벨 확인은 <b>Level Meter</b>, 라우드니스는 <b>Loudness Meter</b>, 위상은 <b>Correlation Meter</b>다. 미터는 소리를 바꾸지 않으므로 여러 개를 함께 걸어도 된다."], "path": [{"n": "트랙 단 확인", "s": ["<k>X</k> 믹서에서 트랙 하나 선택", "이펙트 슬롯 위에서 아래로 <b>Gain → EQ → 다이내믹 → 음색</b> 순인지 확인", "<b>센드</b>가 그 아래에 있는지 확인", "<b>페이더</b>가 맨 아래인지 확인"]}, {"n": "세 단 훑어보기", "s": ["트랙 채널 → 버스(스택) 채널 → <b>Stereo Out</b> 순으로 클릭하며 이동", "각 단에 걸린 플러그인이 위 순서를 따르는지 확인", "마스터에 리미터가 걸려 있다면 지금은 뺀다", "마스터에 <b>Loudness Meter</b>만 남긴다"]}, {"n": "플러그인 고르기", "s": ["컴프: <b>Dynamics → Compressor</b> → 상단에서 모델 선택", "트랙 EQ: <b>EQ → Channel EQ</b> / 마스터: <b>Linear Phase EQ</b>", "리버브: <b>Reverb → ChromaVerb</b>", "딜레이: <b>Delay → Stereo Delay</b>", "새추레이션: <b>Distortion → ChromaGlow</b>"]}], "drill": ["지금 작업 중인 곡에서 트랙 하나를 골라 이펙트 순서가 지도와 맞는지 확인하고 어긋난 것을 고친다.", "버스와 마스터의 게인 리덕션을 각각 읽고 합이 8dB 안인지 계산한다.", "종이에 트랙에서 마스터까지의 흐름을 직접 그려 본다."], "keys": [["X", "믹서"], ["⇧⌘G", "트랙 스택"], ["I", "인스펙터"]], "chk": ["세 단의 순서를 말할 수 있다", "리버브가 왜 센드인지 안다", "믹싱 중 마스터에 리미터를 걸지 않는다", "각 단계에 어느 플러그인을 여는지 안다"], "quiz": [{"q": "리버브를 트랙 인서트가 아니라 센드로 보내는 이유는?", "a": ["자동이라서", "CPU 절약", "컴프가 잔향을 누르는 것을 막기 위해", "음질이 좋아서"], "c": 2, "e": "인서트로 걸면 뒤에 오는 처리가 잔향까지 건드린다. 센드는 트랙 사슬 밖이다."}, {"q": "믹싱 중 마스터에 리미터를 걸면?", "a": ["저역이 준다", "문제가 해결된다", "마스터링에서 라우드니스를 올릴 여지가 없어진다", "위상이 틀어진다"], "c": 2, "e": "피크가 안 넘쳐 해결된 것처럼 보이지만 그 리미터는 곡 내내 눌리고 있다."}, {"q": "트랙 이펙트 슬롯의 맨 위에 오는 것은?", "a": ["EQ", "리버브", "Gain", "컴프레서"], "c": 2, "e": "뒤에 붙는 플러그인이 설계 레벨에서 동작하도록 레벨을 먼저 정한다."}, {"q": "마스터에 Linear Phase EQ를 쓰는 이유는?", "a": ["가벼워서", "위상을 틀지 않기 때문", "더 정확해서", "자동이라서"], "c": 1, "e": "대신 지연이 생기므로 트랙에 쓰면 작업이 불편해진다. 트랙에는 Channel EQ다."}, {"q": "보컬에 어울리는 컴프 모델은?", "a": ["Studio FET", "Studio VCA", "Vintage Opto", "Platinum"], "c": 0, "e": "잡아주는 느낌이 확실하다. 드럼과 버스는 Studio VCA, 부드럽게는 Vintage Opto다."}], "s": 10, "d": 75}, {"t": "클립 게인", "goal": "리전 단위로 음량을 고르게 만들어 뒤 단계의 부담을 줄인다.", "con": ["이펙트를 걸기 전에 리전 자체의 음량을 정리한다. 이것이 클립 게인이고 신호 흐름에서 가장 앞이다.", "첫 단계인 클립 게인은 리전 자체의 음량이다. 한 곡 안에서 구간마다 크기가 들쭉날쭉할 때 여기서 먼저 고르게 만든다. 벌스는 여리게 부르고 코러스는 크게 부른 보컬이 대표적이다. 이것을 컴프로만 잡으려 하면 컴프가 코러스에서 계속 크게 눌려 소리가 납작해진다. 클립 게인으로 미리 평평하게 만들어 두면 컴프는 표정을 다듬는 일만 하게 된다.", "로직에서 클립 게인은 <b>게인 도구</b>로 조절한다. 프로툴스처럼 리전 위에 컨트롤이 떠 있지 않아서, 도구를 바꾸지 않고 마우스만 올려서는 아무것도 나타나지 않는다. <k>T</k>로 도구 팝업을 열어 게인 도구를 고른 뒤 리전 위를 위아래로 드래그하면 숫자 값이 표시되면서 파형 그림도 함께 커지거나 작아진다. 파형이 실제로 변하는 것이 페이더와의 차이다.", "얼마나 올리고 내릴지 묻는 사람이 많은데 정해진 값이 없다. 클립 게인은 절대값이 아니라 보정량이기 때문이다. 목표는 평균 <v>-18</v>dBFS에 닿는 것이지 몇 dB를 움직이는 것이 아니라서, 같은 악기라도 녹음이 크게 됐으면 내리고 작게 됐으면 올린다.", "대신 폭에는 기준이 있다. 조정은 대개 <v>±6</v>dB 안에서 끝난다. 그보다 크게 올려야 한다면 녹음이 너무 작았던 것이고 잡음까지 함께 커지므로 다시 녹음하는 편이 낫다. 크게 내려야 한다면 녹음 게인이 과했던 것이고 이미 클리핑이 났을 수도 있으니 파형을 확인한다.", "구간 편차는 절반쯤만 좁힌다. 벌스와 코러스가 <v>8</v>dB 차이 난다면 <v>4</v>dB 정도로 줄여 놓고 나머지는 컴프에 맡긴다. 완전히 평평하게 만들면 곡의 다이내믹이 사라져서 코러스가 열리는 느낌이 안 난다. 컴프가 할 일까지 여기서 다 해버리는 셈이다.", "얼마나 평평하게 만들지는 장르가 정한다. EDM과 팝은 거의 평평하게 간다. 곡 내내 에너지가 유지되어야 하기 때문이다. 알앤비와 재즈는 편차를 상당히 남긴다. 여린 부분과 강한 부분의 대비가 그 장르의 표현이다. 클래식과 어쿠스틱은 거의 손대지 않는다. 연주자가 만든 강약이 곡 자체이므로 고르게 만들면 연주를 지우는 것이 된다.", "클립 게인을 크게 올리면 녹음에 섞인 잡음도 함께 커진다. 원본이 너무 작게 녹음됐다면 끌어올리는 데 한계가 있고 다시 녹음하는 쪽이 낫다. 반대로 <v>32</v>비트 부동소수점으로 녹음했다면 녹음 중 클리핑이 났더라도 클립 게인을 내려 되살릴 수 있다.", "클립 게인은 리전 전체에 한 값이지만, 리전 안에서 시간에 따라 바꿀 수도 있다. 리전 오토메이션이다. 트랙 오토메이션과 비슷해 보이지만 다른 점이 하나 있다. 트랙 오토메이션은 페이더에 걸려 이펙트를 다 지난 소리를 조절하고, 리전 오토메이션은 이펙트에 들어가기 전 소리 자체를 조절한다. 그래서 컴프가 눌리는 양이 달라진다.", "쓰는 자리는 이렇다. 보컬 한 구절만 유난히 커서 컴프가 그 자리에서 과하게 반응할 때, 그 구절만 리전 오토메이션으로 미리 <v>3</v>dB쯤 내려 두면 컴프는 평소처럼 동작한다. 트랙 오토메이션으로 내리면 이미 과하게 눌린 뒤라 소용이 없다. 앞에서 본 순서, 클립 게인이 이펙트보다 앞이라는 원칙이 여기서도 작동한다."], "path": [{"n": "클립 게인 조절", "s": ["<k>T</k> → 도구 팝업에서 <b>게인 도구</b> 선택", "리전 위를 위아래로 드래그. 숫자 값과 파형이 함께 변함", "일부 구간만: <b>마키 도구</b>로 구간 선택 후 게인 도구로 조절. 변경분이 새 리전으로 분리됨", "숫자로 입력: 리전 선택 → <k>I</k> 인스펙터 → <b>리전</b> 영역을 펼쳐 <b>게인</b> 값 입력", "<k>T</k> 두 번 → 포인터로 복귀"]}, {"n": "리전 게인 곡선", "s": ["<k>A</k> 오토메이션 → 트랙 헤더의 모드 버튼을 <b>트랙</b>에서 <b>리전</b>으로", "리전 안에서 <b>볼륨</b> 레인 선택", "큰 구절 앞뒤에 포인트 찍고 그 사이를 <v>-3</v>dB로", "리전을 옮기면 곡선도 함께 따라오는지 확인"]}], "drill": ["구간마다 음량이 다른 보컬 리전을 게인 도구로 평평하게 만든 뒤 컴프를 걸어, 클립 게인 없이 컴프만 건 것과 비교한다.", "벌스와 코러스의 평균 레벨 차이를 재고 절반만 좁힌 뒤, 완전히 평평하게 만든 것과 비교한다.", "같은 보컬을 클립 게인으로 정리한 것과 안 한 것에 각각 같은 컴프를 걸어 비교한다."], "keys": [["T", "도구 팝업"], ["I", "인스펙터"], ["X", "믹서"]], "chk": ["클립 게인을 게인 도구로 조절할 수 있다", "장르에 따라 평평하게 만드는 정도를 조절한다", "조정 폭 기준을 안다"], "quiz": [{"q": "로직에서 클립 게인을 조절하는 방법은?", "a": ["페이더를 올린다", "리전 위에 마우스를 올리면 나오는 컨트롤", "T로 게인 도구를 골라 리전 위를 드래그", "오토메이션을 그린다"], "c": 2, "e": "로직은 리전 상단에 컨트롤이 없다. 도구를 게인 도구로 바꿔야 한다."}, {"q": "클립 게인이 Gain 플러그인보다 먼저인 이유는?", "a": ["더 쉬워서", "리전들이 고르게 정리된 뒤라야 트랙 평균이 의미가 있어서", "음질이 좋아서", "자동이라서"], "c": 1, "e": "구간별 편차는 클립 게인, 트랙 전체 기준 맞추기는 Gain 플러그인이다."}, {"q": "클립 게인을 몇 dB 올릴지 정해진 값이 없는 이유는?", "a": ["장르마다 달라서", "템포 때문에", "절대값이 아니라 평균 -18dBFS에 닿기 위한 보정량이라서", "플러그인마다 달라서"], "c": 2, "e": "같은 악기라도 녹음이 크게 됐으면 내리고 작게 됐으면 올린다."}, {"q": "클래식과 어쿠스틱 녹음에 클립 게인을 거의 안 쓰는 이유는?", "a": ["연주자가 만든 강약이 곡 자체라서", "템포가 자유로워서", "소리가 작아서", "녹음이 정확해서"], "c": 0, "e": "고르게 만들면 연주를 지우는 것이 된다. EDM과 팝은 반대로 거의 평평하게 간다."}], "s": 10, "d": 76}, {"d": 77, "s": 10, "t": "게인 스테이징과 밸런스", "goal": "페이더만으로 트랙 밸런스를 잡는다.", "con": ["믹싱의 첫 단계는 이펙트가 아니라 균형이다. 페이더만 움직여서 좋게 들리지 않으면 어떤 플러그인도 해결해주지 못한다.", "게인 스테이징은 각 트랙의 레벨을 적정 범위에 두는 일이다. 여기서 두 가지 숫자를 나눠 봐야 한다. 평균은 소리가 대체로 머무는 높이이고, 피크는 순간적으로 튀는 꼭대기다. 기준은 평균 <v>-18</v>dBFS이고, 그러면 피크는 자연히 <v>-12</v>에서 <v>-6</v>dBFS 사이에 온다. 마스터 출력은 <v>-6</v>dBFS를 넘지 않게 한다.", "둘의 간격이 그 소리의 다이내믹 폭이다. 킥처럼 순간에만 튀는 소리는 평균이 <v>-20</v>인데 피크가 <v>-8</v>일 수 있고, 패드처럼 고르게 이어지는 소리는 평균 <v>-18</v>에 피크가 <v>-14</v>에 머문다. 같은 -18을 봐도 평균으로 보느냐 피크로 보느냐에 따라 전혀 다른 소리다. 로직의 채널 미터는 피크를 보여주므로, 평균이 궁금하면 <b>Level Meter</b>를 걸어 RMS 표시로 확인한다.", "작업 순서는 네 단계다. 클립 게인 → Gain 플러그인 → 나머지 이펙트 → 페이더. 앞 단계가 정해지지 않은 채 뒤로 넘어가면 나중에 처음부터 다시 잡게 된다.", "두 번째 단계인 Gain 플러그인은 트랙 전체에 한 값으로 걸린다. 리전들이 고르게 정리된 뒤라야 트랙 평균이 의미가 있으므로 클립 게인 다음이다. 이펙트 슬롯 맨 위에 두어 평균 <v>-18</v>dBFS 부근에 맞추면 뒤에 붙는 플러그인이 설계된 레벨에서 동작한다.", "게인을 먼저 잡는 이유는 컴프 때문이기도 하다. 컴프의 스레숄드는 절대 레벨이라, 게인을 나중에 만지면 컴프가 누르는 양이 통째로 바뀐다. 게인부터 정해두면 그 뒤로 흔들리지 않는다. 마지막 페이더는 레벨을 잡는 도구가 아니라 트랙 사이의 균형을 잡는 도구다.", "순서는 아래에서 위로 쌓는다. 킥 → 베이스 → 스네어 → 나머지 드럼 → 코드 악기 → 리드나 보컬. 킥을 <v>-12</v>dBFS 정도로 기준 삼고 나머지를 맞춘다. 이 값에서 시작하는 이유는 여유다. 킥이 곡에서 가장 큰 소리인 경우가 많은데, 여기를 <v>-12</v>에 두면 나머지를 다 올려도 마스터가 넘치지 않는다. <v>-6</v>에서 시작하면 악기 몇 개만 더해도 자리가 없어져 전부 다시 내리게 된다.", "이 단계에서 팬도 대략 정해 둔다. 좌우 자리가 정해져 있어야 어느 악기가 서로 부딪히는지 판단할 수 있기 때문이다. 가운데에 킥과 베이스와 스네어와 리드 보컬을 두고 나머지를 좌우로 벌리는 정도면 충분하다. 세밀한 폭과 깊이는 뒤의 팬 일차에서 다듬는다.", "솔로로 듣지 말고 전체로 듣는다. 솔로에서 좋은 소리가 합쳤을 때 좋다는 보장이 없다. 인터넷에 도는 악기별 권장 피크 표는 그대로 쓰지 않는다. 두 가지 이유가 있다. 첫째, 킥과 베이스와 보컬을 각각 -6dBFS에 맞추면 합쳤을 때 마스터가 반드시 넘친다. 같은 크기 두 개만 합쳐도 6dB가 오른다. 둘째, 균형은 피크가 아니라 체감 크기로 잡는 것이다. 킥은 피크가 높고 지속이 짧지만 패드는 피크가 낮아도 계속 울려서, 피크가 같아도 패드가 훨씬 크게 들린다. 여러 트랙을 한꺼번에 껐다 켜며 비교할 때는 트랙을 다중 선택하고 <k>⌥⇧M</k>을 쓴다. 드럼 전체를 빼고 나머지만 들어보는 식의 확인이 한 번에 된다.", "작게 듣는 것이 밸런스 판단에 유리하다. 작게 듣는 이유는 귀의 감도가 음량에 따라 변하기 때문으로, 앞의 레퍼런스 일차에서 본 그대로다. 작게 틀면 착시가 걷혀 중역의 진짜 균형이 드러난다. 크게 들으면 다 좋게 들린다. 아주 작게 틀었을 때 곡의 뼈대가 들리면 균형이 맞은 것이다.", "절대값 대신 상대 순서를 기억한다. 앞에서부터 킥, 베이스, 리드 보컬. 그다음 스네어와 클랩. 중간에 피아노와 기타와 신스 리드. 뒤에 하이햇, 심벌, 패드, 스트링, 백보컬. 가장 뒤에 효과음과 라이저. 이 순서대로 들리면 균형이 맞은 것이고, 숫자는 곡마다 다르다."], "path": [{"n": "믹서에서 밸런스", "s": ["<k>X</k>로 믹서 열기", "모든 트랙 페이더를 <v>-∞</v>로 내림", "킥부터 하나씩 올리며 균형", "마스터 채널 미터가 <v>-6</v>dBFS를 넘지 않는지 확인"]}, {"n": "게인 조정", "s": ["트랙 이펙트 첫 슬롯에 <b>Gain</b> 플러그인", "입력 레벨을 조정해 피크를 <v>-14</v>dBFS 부근으로", "페이더는 0dB 근처에 두고 작업"]}, {"n": "평균 레벨 확인", "s": ["트랙 이펙트 슬롯 → <b>Metering → Level Meter</b>", "표시를 <b>RMS</b>로 전환", "가장 자주 나오는 구간을 재생하며 평균이 <v>-18</v>dBFS 부근인지 확인", "벗어나면 첫 슬롯의 <b>Gain</b>으로 조정. 페이더는 건드리지 않음"]}], "drill": ["모든 페이더를 내리고 킥부터 순서대로 올려 밸런스를 다시 잡는다. 시간을 재본다.", "완성된 밸런스를 아주 작은 음량으로 들어보고 무엇이 안 들리는지 적는다.", "마스터 피크가 -6dBFS를 넘지 않게 전체를 조정한다."], "keys": [["X", "믹서"], ["S", "솔로"], ["M", "뮤트"], ["⌥클릭", "페이더 초기화"], ["⌥⇧M", "선택 트랙 일괄 뮤트"], ["T", "도구 팝업"], ["I", "인스펙터"]], "chk": ["페이더만으로 균형을 만들 수 있다", "마스터 여유를 남긴다", "작게 듣고 판단한다", "악기 앞뒤 순서를 외웠다", "평균과 피크를 구분해서 본다", "네 단계 순서를 지킨다", "밸런스 단계에서 팬을 대략 정한다"], "quiz": [{"q": "믹스 중 마스터 출력 피크는 대략 어디를 넘지 않는 것이 좋은가?", "a": ["-6dBFS", "-20dBFS", "0dBFS", "-40dBFS"], "c": 0, "e": "-6dBFS 정도 여유를 남겨야 마스터링에서 처리할 공간이 생긴다."}, {"q": "악기별 권장 피크 표를 그대로 따르면 안 되는 이유는?", "a": ["플러그인이 달라서", "각각 맞추면 합쳤을 때 마스터가 넘치고, 균형은 체감 크기로 잡기 때문", "템포가 달라서", "샘플레이트 때문"], "c": 1, "e": "같은 크기 두 개만 합쳐도 6dB가 오른다. 그리고 피크가 같아도 지속이 긴 소리가 훨씬 크게 들린다."}, {"q": "평균 -20dBFS인데 피크가 -8dBFS인 소리는?", "a": ["계속 큰 소리", "순간에만 크게 튀는 소리", "잘못 녹음된 것", "무음"], "c": 1, "e": "둘의 간격이 다이내믹 폭이다. 킥처럼 타격이 순간에 몰린 소리가 이렇게 나온다."}]}, {"t": "헤드룸 관리", "goal": "마스터가 넘칠 때 여유를 되찾는 순서를 안다.", "con": ["곡을 만들다 보면 마스터가 넘치는 순간이 온다. 악기를 더할 때마다 조금씩 커지기 때문에 어느 시점에는 반드시 온다. 이때 여유를 되찾는 방법이 몇 가지 있고, 어느 것을 쓰느냐에 따라 결과가 달라진다.", "가장 나쁜 방법이 마스터 페이더를 내리는 것이다. 소리는 안 깨지지만 각 트랙은 여전히 뜨거운 채로 남는다. 플러그인들은 설계 레벨 밖에서 계속 일하고, 나중에 트랙을 하나 더 추가하면 같은 문제가 또 온다. 증상만 가리는 셈이다.", "가장 좋은 방법은 트랙 쪽에서 줄이는 것이다. 다만 하나씩 내리면 애써 잡은 균형이 무너진다. 전부 함께 내려야 관계가 유지된다. 방법은 두 가지다. 믹서에서 모든 트랙을 선택하고 <k>⌥</k>를 누른 채 페이더 하나를 내리면 나머지가 상대 차이를 지킨 채 같이 내려간다. 또는 앞에서 본 트랙 그룹으로 묶어 두었다면 그룹 페이더 하나만 움직이면 된다.", "몇 dB를 내릴지는 미터가 알려준다. 마스터 피크가 <v>-2</v>dBFS라면 <v>-6</v>까지 확보하기 위해 <v>4</v>dB를 내린다. 넉넉하게는 <v>6</v>dB를 한 번에 내려 두고 작업하는 편이 편하다. 나중에 악기를 더 넣을 자리까지 남기는 것이다.", "줄이는
