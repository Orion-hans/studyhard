C"], "c": 1, "e": "압축하지 않은 WAV 24비트로 넘기면 서비스가 각자 포맷으로 변환한다."}, {"q": "스템을 넘길 때 모든 파일을 같은 시작점에서 뽑는 이유는?", "a": ["받는 쪽이 끌어다 놓기만 하면 맞기 때문", "템포가 유지되어서", "용량이 줄어서", "음질이 좋아서"], "c": 0, "e": "시작점이 제각각이면 상대가 하나씩 위치를 맞춰야 한다."}, {"q": "바운스했더니 악기 하나가 빠져 있다면 먼저 볼 것은?", "a": ["그 트랙이 메인 출력으로 가는지와 뮤트 여부", "샘플레이트", "디더 설정", "파일 형식"], "c": 0, "e": "다른 버스로 빠져 있거나 뮤트된 트랙은 바운스에 포함되지 않는다."}]}, {"t": "로직에서 뽑을 수 있는 모든 것", "goal": "바운스와 내보내기의 전체 목록을 알고 목적에 맞는 것을 고른다.", "con": ["로직에서 밖으로 꺼내는 길은 크게 둘이다. <b>바운스</b>는 모든 트랙을 합쳐 파일 하나로 만들고, <b>내보내기</b>는 트랙이나 리전이나 프로젝트를 따로따로 꺼낸다. 둘 다 <b>파일</b> 메뉴에 있고, 목적에 따라 어느 쪽을 쓸지가 정해진다. 이 절은 뽑을 수 있는 모든 것을 한 번에 훑고, 그다음 목적별로 무엇을 고를지 정리한다.", "바운스 창의 <b>대상</b>에는 세 줄이 있고 여러 개를 동시에 체크할 수 있다. <b>PCM</b>은 압축 없는 원본이다. 형식은 <b>AIFF</b>, <b>WAVE</b>(정확히는 Broadcast Wave), <b>CAF</b> 셋이다. AIFF와 WAVE는 같은 품질이고 로직 기본은 AIFF지만 다른 프로그램과 주고받을 때는 WAVE가 안전하다. CAF는 애플 형식으로 파일 크기 제한이 없어 <v>13</v>시간이 넘는 긴 녹음에 쓴다. 보통은 열 일이 없다.", "PCM의 <b>해상도</b>는 <v>8</v>, <v>16</v>, <v>24</v>비트다. 8은 아주 작은 파일이 필요한 특수한 경우, 16은 CD, 24는 나머지 전부다. <b>샘플률</b>은 <v>11.025</v>에서 <v>192</v>kHz까지 고를 수 있는데 실제로 쓰는 것은 44.1, 48, 96 셋이다. <b>파일 유형</b>은 인터리브와 분할이 있다. 인터리브는 좌우가 한 파일에 들어간 것이고, 분할은 좌우가 따로 두 파일이다. 분할은 프로 툴스에 넘길 때만 쓴다.", "<b>MP3</b>는 압축 형식이다. 비트레이트를 <v>32</v>에서 <v>320</v>kbps까지 고르고, 발매용이 아니라 들려주기용이면 <v>320</v>으로 둔다. <b>M4A</b>는 인코딩을 둘 중 고른다. <b>AAC</b>는 MP3보다 같은 용량에서 음질이 좋은 압축이고, <b>Apple Lossless</b>는 압축이지만 원본이 그대로 복원되는 무손실이다. 용량을 줄이면서 품질을 지키려면 이쪽이다. M4A는 <v>48</v>kHz를 넘지 못하므로 96kHz 프로젝트에서 뽑으면 로직이 48로 자동 변환한다.", "바운스의 나머지 항목은 앞 절에서 봤다. 모드는 오프라인, 노멀라이즈는 끔, 디더는 비트를 줄일 때만. 사이클 구간을 켜면 그 구간만, 끄면 곡 전체다. 하나 더 있다. <b>프로젝트에 추가</b>를 체크하면 뽑은 파일이 곧바로 프로젝트 오디오 브라우저에 들어온다. 뽑은 걸 다시 트랙에 놓고 확인할 때 편하다.", "내보내기는 <b>파일 → 보내기</b>에 있고 종류가 여덟이다. 오디오 셋, 미디 하나, 악보 하나, 프로젝트 셋이다.", "오디오 내보내기 셋은 범위가 다르다. <b>리전을 오디오 파일로</b>는 선택한 리전만, <b>트랙을 오디오 파일로</b>는 선택한 트랙 전체, <b>모든 트랙을 오디오 파일로</b>는 프로젝트의 트랙 전부를 각각 파일로 만든다. 마지막 것이 스템이다. 셋 다 형식과 비트를 고르고, <b>이펙트 플러그인 우회</b>와 <b>볼륨·팬 오토메이션 포함</b>을 정한다. 다른 사람이 믹스할 거면 이펙트는 우회하고 오토메이션은 빼서 마른 상태로 준다. 리전 내보내기는 페이드가 함께 들어간다.", "여기에도 <b>노멀라이즈</b> 옵션이 있는데 셋 중 고른다. 끔, 오버로드 보호만, 켬이다. 오버로드 보호만은 0dB를 넘는 것만 내리고 작은 것은 안 건드린다. 스템을 뽑을 때 이걸로 두면 넘친 트랙만 안전하게 잡힌다.", "<b>선택 항목을 MIDI 파일로</b>는 미디 리전을 스탠더드 미디 파일로 만든다. 소리 없이 연주 정보만 들어가고 템포와 박자 정보가 함께 담긴다. 다른 프로그램에서 열거나 악보 프로그램에 넘길 때 쓴다. <b>스코어를 MusicXML로</b>는 악보 편집기의 내용을 악보 프로그램 형식으로 내보낸다. 앞의 악보 절에서 봤다.", "프로젝트 단위 내보내기는 셋이다. <b>프로젝트를 AAF 파일로</b>는 프로 툴스나 다른 DAW로 넘길 때 쓴다. 리전 위치와 볼륨 오토메이션이 함께 가지만 미디 트랙과 플러그인은 안 간다. 미디 트랙은 먼저 오디오로 바운스한 뒤 내보낸다. <b>프로젝트를 Final Cut Pro XML로</b>는 영상 편집 프로그램에 오디오와 위치 정보를 함께 넘긴다. <b>리전을 루프 라이브러리로</b>는 만든 소재를 Apple Loops로 등록해 다른 프로젝트에서 루프 브라우저로 찾게 한다.", "프로젝트 자체를 통째로 넘기는 것은 내보내기가 아니라 저장이다. <b>파일 → 프로젝트 정리 → 다른 이름으로 저장</b>에서 <b>에셋 복사</b>를 켜면 오디오와 샘플이 프로젝트 폴더 안에 들어가 다른 컴퓨터에서 열어도 빠지는 것이 없다. 이걸 안 켜면 받은 쪽에서 파일 없음 경고가 뜬다."], "path": [{"n": "바운스 대상 세 줄", "s": ["<k>⌘B</k> 바운스", "<b>PCM</b> 체크 → WAVE · <v>24</v> · <v>48</v> · 인터리브", "<b>MP3</b> 함께 체크 → <v>320</v>kbps", "<b>M4A</b> 함께 체크 → AAC <v>256</v> 또는 Apple Lossless", "<b>바운스</b>. 파일이 셋 나온다"]}, {"n": "스템 내보내기", "s": ["<b>파일 → 보내기 → 모든 트랙을 오디오 파일로</b>", "WAVE · <v>24</v>비트", "<b>이펙트 플러그인 우회</b> 체크 · <b>오토메이션 포함</b> 해제", "<b>노멀라이즈</b> → 오버로드 보호만", "파일명 패턴에 트랙 번호와 이름"]}], "drill": ["같은 곡을 PCM·MP3·M4A 세 줄을 동시에 체크해 뽑고 파일 크기를 비교한다.", "모든 트랙을 이펙트 우회로 내보내고, 우회 없이 내보낸 것과 한 트랙을 비교해 듣는다."], "keys": [["⌘B", "바운스"], ["⌘⇧S", "다른 이름으로 저장"]], "chk": ["바운스 대상 세 줄의 차이를 안다", "내보내기 여덟 가지를 안다"], "quiz": [{"q": "바운스와 내보내기의 차이는?", "a": ["바운스는 합쳐서 하나, 내보내기는 따로따로", "바운스가 더 고품질", "내보내기는 미디만", "같은 것이다"], "c": 0, "e": "둘 다 파일 메뉴에 있고 목적에 따라 고른다."}, {"q": "용량을 줄이면서 원본 품질을 지키려면?", "a": ["AIFF", "M4A Apple Lossless", "MP3 320", "M4A AAC"], "c": 1, "e": "압축이지만 원본이 그대로 복원되는 무손실. 용량은 절반."}, {"q": "믹스 엔지니어에게 스템을 줄 때 노멀라이즈는?", "a": ["끔", "상관없다", "켬", "오버로드 보호만"], "c": 3, "e": "0dB를 넘는 것만 내리고 작은 것은 안 건드린다."}], "s": 15, "d": 105}, {"t": "목적별 선택표", "goal": "어디에 쓸 것인지에 따라 형식과 설정을 바로 고른다.", "con": ["앞 절의 목록을 목적별로 다시 배열한다. 받는 쪽이 무슨 프로그램을 쓰는지, 어디에 올릴지가 정해지면 답은 하나로 좁혀진다. <b>발매용 마스터</b>는 바운스 PCM WAVE, <v>24</v>비트, <v>48</v>kHz, 인터리브다. 일부 배급사가 44.1을 요구하므로 업로드 전에 확인하고, 요구하면 프로젝트를 바꾸지 말고 바운스 창에서 샘플률만 바꾼다. <b>CD용</b>은 PCM WAVE, <v>16</v>비트, <v>44.1</v>kHz, 디더 켬이다. 규격이 그렇게 정해져 있다. <b>영상용</b>은 PCM WAVE, <v>24</v>비트, <v>48</v>kHz이고 음량이 <v>-23~-24</v>LUFS로 발매용보다 훨씬 작으니 편집자에게 미리 묻는다.", "<b>들려주기용</b>은 MP3 <v>320</v>이나 M4A AAC <v>256</v>이다. 마스터를 뽑을 때 PCM과 함께 체크하면 한 번에 나온다. 이 파일로 발매하지 않는다. <b>보관용</b>은 M4A Apple Lossless다. 원본 품질에 용량은 절반이다.", "<b>믹스 엔지니어에게 넘길 스템</b>은 내보내기 → 모든 트랙을 오디오 파일로, WAVE, <v>24</v>비트, 이펙트 우회, 오토메이션 제외, 노멀라이즈는 오버로드 보호만이다. 모노 소스는 모노로 뽑히므로 보컬 파일이 스테레오로 나왔다면 설정을 확인한다. <b>마스터링 의뢰</b>는 바운스 PCM WAVE, <v>24</v>비트 또는 <v>32</v>비트 부동소수점, 리미터 뺌, 피크 <v>-6</v>dBFS 부근이다.", "<b>다른 DAW로 프로젝트 이관</b>은 AAF, <b>영상 편집으로</b>는 Final Cut Pro XML, <b>악보 프로그램으로</b>는 MusicXML, <b>다른 로직 사용자에게</b>는 에셋 복사한 프로젝트 폴더다. 형식 이름을 외우기보다 받는 쪽이 무슨 프로그램을 쓰는지 먼저 묻는 것이 빠르다."], "path": [{"n": "CD용", "s": ["PCM → WAVE · <v>16</v>비트 · <v>44.1</v>kHz", "<b>디더</b> 켜기", "노멀라이즈 끄기"]}, {"n": "마스터링 의뢰", "s": ["Stereo Out의 리미터 우회", "PCM → WAVE · <v>32</v>비트 부동소수점 · 프로젝트 샘플률", "피크가 <v>-6</v>dBFS 부근인지 확인"]}, {"n": "미디·악보·프로젝트", "s": ["미디 → 리전 선택 → <b>파일 → 보내기 → 선택 항목을 MIDI 파일로</b>", "악보 → <b>스코어를 MusicXML로</b>", "다른 DAW → <b>프로젝트를 AAF로</b> (미디는 먼저 바운스)", "영상 → <b>Final Cut Pro XML로</b>", "로직 사용자 → <b>프로젝트 정리 → 다른 이름으로 저장</b> + <b>에셋 복사</b>"]}], "drill": ["자기 곡을 발매용·CD용·들려주기용 셋으로 뽑아 파일 크기를 비교한다.", "다음 곡을 받을 사람이 무슨 프로그램을 쓰는지 먼저 묻고 형식을 정한다."], "keys": [["⌘B", "바운스"], ["⌘⇧S", "다른 이름으로 저장"]], "chk": ["목적 여섯 가지의 설정을 안다", "CD용에만 디더를 켠다", "마스터링 의뢰는 리미터를 뺀다"], "quiz": [{"q": "프로 툴스로 프로젝트를 넘길 때 미디 트랙은?", "a": ["AAF에 자동으로 들어간다", "MIDI 파일로 따로", "넘길 수 없다", "먼저 오디오로 바운스한다"], "c": 3, "e": "AAF에는 미디 트랙과 플러그인이 안 간다."}, {"q": "영상에 얹을 음원의 샘플레이트는?", "a": ["96kHz", "44.1kHz", "상관없다", "48kHz"], "c": 3, "e": "영상 편집 프로그램의 기본이 48이다."}, {"q": "디더를 켜는 경우는?", "a": ["항상", "비트 심도를 줄일 때만", "MP3로 뽑을 때", "스템을 뽑을 때"], "c": 1, "e": "24비트에서 16비트로 내릴 때. 24비트 그대로면 없음."}], "s": 15, "d": 106}, {"t": "악보 편집기: 미디를 악보로", "goal": "미디 리전을 읽을 수 있는 악보로 만들고 PDF로 뽑는다.", "con": ["미디 리전은 곧 악보다. 피아노 롤의 막대가 음이고 위치가 박이니, 로직은 이걸 오선보로 바꿔 보여줄 수 있다. 연주자에게 넘기거나 편곡을 확인하거나 수업 자료를 만들 때 쓴다. 미디 리전을 선택하고 <k>N</k>을 누르면 악보 편집기가 열린다.", "처음 열면 악보가 지저분해 보인다. 손으로 친 미디는 박이 정확하지 않아서 32분음표 쉼표가 곳곳에 끼고 잇단음이 생긴다. 이건 미디가 틀린 게 아니라 표시 방식의 문제다. 악보 편집기 인스펙터의 <b>퀀타이즈</b>가 표시 단위를 정한다. <v>1/16</v>으로 두면 16분음표보다 잘게 어긋난 것은 반올림해서 그린다. 실제 미디는 그대로이고 보이는 것만 정리된다. 이것을 디스플레이 퀀타이즈라고 한다.", "미디 자체를 퀀타이즈하는 것과 다르다. 앞에서 본 리전 퀀타이즈는 연주 타이밍을 바꾸지만, 디스플레이 퀀타이즈는 악보 모양만 바꾼다. 그래서 그루브를 살린 연주를 그대로 두고 악보만 깔끔하게 뽑을 수 있다. 8분음표 위주 곡은 <v>1/8</v>, 16분음표가 있으면 <v>1/16</v>, 셋잇단이 있으면 <v>1/12</v>나 <v>1/24</v>를 고른다.", "음자리표와 조표도 인스펙터에서 정한다. <b>스타일</b>에서 높은음자리표, 낮은음자리표, 피아노 큰보표를 고른다. 베이스나 첼로는 낮은음자리표, 피아노는 큰보표다. 조표는 프로젝트 조를 따라오므로 앞의 조표 절에서 정해 뒀으면 자동이다. 조표를 안 정하면 임시표가 잔뜩 붙어 읽기 어렵다.", "여러 트랙을 한 악보에 모으려면 스코어 세트를 만든다. 트랙 하나씩이 파트이고 여러 파트를 세로로 쌓은 것이 총보다. <b>레이아웃 → 스코어 세트</b>에서 넣을 트랙을 고르고 순서를 정한다. 총보를 뽑을 때는 높은 악기가 위, 낮은 악기가 아래로 가는 것이 관례다.", "코드 기호와 가사도 넣을 수 있다. 파트 박스에서 코드 기호를 골라 마디 위에 찍고, 가사는 텍스트 도구로 음 아래에 붙인다. 코드 트랙에 진행을 넣어 뒀으면 악보에도 자동으로 표시할 수 있다. 리드 시트 형태의 악보가 필요하면 멜로디 트랙 하나에 코드 기호만 얹으면 된다.", "뽑는 방법은 인쇄다. <b>파일 → 프린트</b>에서 프린터 대신 <b>PDF로 저장</b>을 고르면 파일이 된다. 인쇄 전에 <b>보기 → 페이지 보기</b>로 바꿔 실제 종이에 어떻게 나뉘는지 본다. 마디가 한 줄에 몇 개 들어가는지, 페이지가 어디서 넘어가는지가 여기서 정해진다.", "다른 프로그램으로 넘길 때는 MusicXML로 내보낸다. <b>파일 → 보내기 → 스코어를 MusicXML로</b>다. 피날레나 시벨리우스, 뮤즈스코어에서 열어 세부를 다듬을 수 있다. 로직의 악보 편집기는 확인용으로는 충분하지만 출판 수준의 조판은 전문 프로그램이 낫다.", "악보를 뽑기 전에 미디를 정리하면 결과가 좋아진다. 겹친 음을 정리하고, 너무 짧은 음을 지우고, 음 길이를 <b>기능 → 노트 이벤트 → 노트 길이 강제 레가토</b>로 이어 붙이면 쉼표가 줄어든다. 악보에서 이상해 보이는 것은 대개 미디에 실제로 있는 것이다."], "path": [{"n": "악보 보기와 정리", "s": ["미디 리전 선택 → <k>N</k>", "왼쪽 인스펙터 <b>퀀타이즈</b>를 <v>1/16</v>으로", "<b>스타일</b>에서 음자리표 선택", "조표가 맞는지 확인. 아니면 <k>G</k> 조표 트랙에서 수정"]}, {"n": "PDF로 뽑기", "s": ["<b>보기 → 페이지 보기</b>", "마디 나뉨과 페이지 확인", "<b>파일 → 프린트</b> → 왼쪽 아래 <b>PDF</b> → <b>PDF로 저장</b>"]}, {"n": "총보 만들기", "s": ["<b>레이아웃 → 스코어 세트</b> → 새 세트", "넣을 트랙을 위에서 아래로 높은 악기 순으로 추가", "세트를 선택한 상태로 페이지 보기"]}, {"n": "MusicXML 내보내기", "s": ["악보 편집기가 열린 상태에서", "<b>파일 → 보내기 → 스코어를 MusicXML로</b>", "다른 악보 프로그램에서 열기"]}], "drill": ["손으로 친 미디를 악보로 열어 디스플레이 퀀타이즈 1/8과 1/16의 차이를 본다.", "멜로디와 베이스 두 트랙으로 스코어 세트를 만들어 총보로 뽑는다.", "코드 기호를 얹은 리드 시트 한 장을 PDF로 저장한다."], "keys": [["N", "악보 편집기"], ["G", "글로벌 트랙"], ["⌘P", "프린트"]], "chk": ["디스플레이 퀀타이즈와 리전 퀀타이즈의 차이를 안다", "PDF로 저장할 수 있다", "스코어 세트로 총보를 만든다"], "quiz": [{"q": "악보에 32분음표 쉼표가 잔뜩 끼어 있다면?", "a": ["조표를 바꾼다", "템포를 바꾼다", "미디를 다시 친다", "디스플레이 퀀타이즈를 1/16으로 둔다"], "c": 3, "e": "실제 미디는 그대로이고 보이는 것만 정리된다. 그루브를 살린 채 악보만 깔끔하게 뽑는다."}, {"q": "디스플레이 퀀타이즈와 리전 퀀타이즈의 차이는?", "a": ["리전은 오디오용", "디스플레이가 더 정확하다", "같은 것이다", "디스플레이는 악보 모양만, 리전은 연주 타이밍을 바꾼다"], "c": 3, "e": "그래서 연주는 그대로 두고 악보만 정리할 수 있다."}, {"q": "여러 트랙을 한 악보에 모으려면?", "a": ["트랙을 합친다", "리전을 복사한다", "MusicXML", "스코어 세트"], "c": 3, "e": "높은 악기가 위, 낮은 악기가 아래로 가는 것이 관례다."}], "s": 15, "d": 107}, {"t": "악보 정리와 레이아웃", "goal": "인스펙터 설정과 스태프 스타일로 악보를 읽기 좋게 만들고 종이에 맞춘다.", "con": ["디스플레이 퀀타이즈만으로는 부족할 때가 있다. 쉼표가 여전히 끼고, 박을 넘어가는 음이 잇단 타이로 쪼개지고, 피아노 양손이 한 줄에 뭉친다. 악보 편집기 인스펙터에는 이걸 정리하는 항목이 더 있다. 위에서부터 순서대로 본다.", "<b>해석</b>을 켜면 음 길이를 다음 음까지 자동으로 이어 그린다. 손으로 친 미디는 음을 뗀 시점이 제각각이라 짧은 쉼표가 곳곳에 생기는데, 이걸 켜면 사라진다. 실제로 이어 치지 않았어도 악보는 이어진 것으로 그린다. 스타카토를 일부러 넣은 곡이 아니면 켜 두는 것이 기본이다.", "<b>싱코페이션</b>은 박을 넘어가는 음을 다룬다. 끄면 2박 반에서 시작해 4박까지 가는 음이 타이로 묶인 두 음표로 그려지고, 켜면 점4분음표 하나로 그려진다. 재즈나 팝처럼 당김음이 많은 곡은 켜야 읽기 쉽다.", "<b>오버랩 없음</b>은 겹친 음을 정리한다. 앞 음이 다음 음 시작 뒤까지 남아 있으면 악보에서 이상한 타이가 생기는데, 이걸 켜면 겹침을 무시하고 그린다. <b>최대 점</b>은 점음표를 몇 개까지 쓸지 정한다. <v>1</v>로 두면 겹점음표가 안 생겨 읽기 편하다.", "이 넷은 리전마다 따로 정할 수 있다. 멜로디 리전은 해석과 싱코페이션을 켜고, 반주 리전은 끄는 식이다. 리전을 선택하고 인스펙터에서 바꾼다.", "스태프 스타일은 오선의 모양을 정한다. 피아노처럼 양손이 갈리는 악기는 <b>피아노</b> 스타일을 고르고 <b>분할 점</b>을 정한다. 기본이 <v>C3</v>이고, 그 위는 위 보표, 아래는 아래 보표로 자동 배분된다. 왼손이 C3 위로 올라가는 곡이면 분할 점을 올린다. 드럼은 반드시 <b>드럼</b> 스타일로 바꿔야 오선이 아니라 타악기 기보로 나온다. 안 바꾸면 킥이 C1 음표로 그려져 아무도 못 읽는다.", "한 트랙에 두 성부가 있을 때는 보이스를 나눈다. 오른손이 멜로디와 화음을 동시에 치면 한 줄에 다 그려져 뭉치는데, 스태프 스타일에서 보이스를 둘로 두면 위 성부는 기둥이 위로, 아래 성부는 아래로 향해 구분된다. 어느 음이 어느 성부인지는 미디 채널이나 분할 점으로 정한다.", "미디 자체를 정리하면 악보가 더 깔끔해진다. 연주용 리전은 그대로 두고 복사본을 만들어 악보용으로 정리하는 방법이 안전하다. 복사본에서 <b>기능 → 노트 이벤트 → 겹침 삭제</b>로 겹친 음을 없애고, <b>노트 길이 강제 레가토</b>로 이어 붙이고, 너무 짧은 음은 지운다. 연주 리전과 악보 리전을 다른 트랙에 두면 재생은 원본, 악보는 정리본이 된다.", "종이에 맞추는 것이 마지막이다. <b>레이아웃 → 페이지 여백</b>에서 상하좌우를 정하고, <b>마디 간격</b>과 <b>한 줄 마디 수</b>를 조정한다. 한 줄에 <v>4</v>마디가 대중음악 악보의 관례이고, 빠른 곡은 <v>2</v>마디, 느린 곡은 <v>8</v>마디까지 간다. 제목, 작곡자, 파트 이름은 텍스트 도구로 위쪽 여백에 넣는다.", "인쇄 전에 페이지 보기로 전체를 훑는다. 페이지 넘김이 프레이즈 중간에 오면 연주자가 넘기다 놓친다. 마디 간격을 조금 조정해 프레이즈 끝에서 넘어가게 맞춘다."], "path": [{"n": "인스펙터 정리 넷", "s": ["악보 편집기에서 리전 선택", "인스펙터 <b>해석</b> 체크", "<b>싱코페이션</b> 체크 (당김음 곡)", "<b>오버랩 없음</b> 체크", "<b>최대 점</b> <v>1</v>"]}, {"n": "피아노 큰보표", "s": ["<b>스타일</b>을 <b>피아노</b>로", "<b>레이아웃 → 스태프 스타일</b>에서 분할 점 확인", "왼손이 위로 올라가는 곡이면 분할 점을 <v>D3</v>이나 <v>E3</v>으로"]}, {"n": "드럼 악보", "s": ["드럼 리전 선택", "<b>스타일</b>을 <b>드럼</b>으로", "킥·스네어·하이햇이 타악기 기보로 바뀌는지 확인"]}, {"n": "악보용 복사본", "s": ["미디 리전을 <k>⌘D</k> 복제해 새 트랙에", "복사본 선택 → <b>기능 → 노트 이벤트 → 겹침 삭제</b>", "<b>노트 길이 강제 레가토</b>", "원본 트랙은 재생, 복사본은 악보만"]}, {"n": "페이지 맞추기", "s": ["<b>보기 → 페이지 보기</b>", "<b>레이아웃 → 페이지 여백</b>", "한 줄 <v>4</v>마디가 되도록 마디 간격 조정", "페이지 넘김이 프레이즈 끝에 오는지 확인"]}], "drill": ["같은 미디를 해석 켜고 끄고 악보로 비교한다.", "피아노 미디를 분할 점 C3과 E3으로 바꿔 배분 차이를 본다.", "드럼 미디를 드럼 스타일로 바꿔 타악기 기보로 나오는지 확인한다."], "keys": [["N", "악보 편집기"], ["⌘D", "복제"], ["⌘P", "프린트"]], "chk": ["해석·싱코페이션을 리전마다 정한다", "드럼은 드럼 스타일로 바꾼다", "연주 리전과 악보 리전을 나눈다"], "quiz": [{"q": "손으로 친 미디의 악보에 짧은 쉼표가 곳곳에 있다면?", "a": ["템포를 바꾼다", "조표를 바꾼다", "다시 친다", "해석을 켠다"], "c": 3, "e": "음 길이를 다음 음까지 자동으로 이어 그린다. 실제 미디는 그대로다."}, {"q": "드럼 미디를 악보로 뽑았는데 킥이 C1 음표로 나온다면?", "a": ["정상이다", "퀀타이즈 문제", "스타일을 드럼으로 바꿔야 한다", "조표 문제"], "c": 2, "e": "드럼 스타일이어야 타악기 기보로 나온다."}, {"q": "연주는 그대로 두고 악보만 정리하려면?", "a": ["원본을 정리한다", "복사본을 만들어 정리하고 악보는 복사본으로", "악보 편집기에서 직접 고친다", "불가능하다"], "c": 1, "e": "원본 트랙은 재생, 복사본은 악보만. 다른 트랙에 둔다."}], "s": 15, "d": 108}, {"d": 109, "s": 15, "t": "메타데이터와 발매", "goal": "발매에 필요한 파일과 메타데이터를 준비한다.", "con": ["발매에 필요한 것은 음원, 커버 이미지, 메타데이터 세 가지다. 음악이 끝나도 이 셋이 준비되지 않으면 나갈 수 없다.", "커버 이미지는 정사각형이고 최소 <v>3000</v>×<v>3000</v> 픽셀, RGB, JPG나 PNG로 준비한다. 작게 만들면 나중에 다시 만들어야 한다.", "메타데이터에는 곡 제목, 아티스트명, 앨범명, 장르, 발매일, 작사가, 작곡가, 편곡자, 저작권 표기가 들어간다. 아티스트명은 한 번 정하면 바꾸기 번거로우니 신중히 정한다.", "ISRC는 녹음물 하나에 붙는 국제 표준 코드다. 같은 곡이라도 새로 녹음하면 새 코드가 붙는다. 발매물 전체에는 UPC라는 다른 코드가 붙는다. 싱글이든 EP든 앨범이든 하나씩 필요하다. 둘 다 배급 대행사가 발급해주는 경우가 대부분이라 직접 구할 일은 드물다. 정산 추적이 이 코드로 이루어지므로 발매 뒤에는 기록해 둔다.", "배급은 배급 대행사를 통한다. 음원을 올리면 여러 스트리밍 서비스에 동시에 등록해준다. 여기서 먼저 알아야 할 것이 국내 구조다. 멜론과 지니와 벅스로 직접 공급하는 대형 유통사는 대부분 기획사나 레이블과 계약하는 방식이라 개인이 직접 이용하기 어렵다. 그래서 개인은 두 갈래 중 하나를 고른다.", "하나는 국내 배급 대행사를 통하는 것이다. 인디 음악을 다루는 곳들이 있고, 대형 유통사로 넘겨주는 역할을 한다. 국내 서비스 등록이 확실하고 한국어로 소통하는 것이 장점이다. 대신 심사가 있고 단계가 하나 더 늘어나므로 수익 배분이 달라질 수 있다.", "다른 하나는 해외 셀프 서비스 플랫폼이다. 심사 없이 직접 올리고 전 세계에 뿌린다. <b>DistroKid</b>는 연 구독제로 발매 수 제한이 없어 자주 내는 사람에게 맞고, <b>TuneCore</b>는 발매 단위 요금이며, <b>CD Baby</b>는 발매마다 한 번만 내고 계속 유지되는 방식이다. <b>RouteNote</b>는 초기 비용 없이 수익을 나누는 방식과 유료 방식을 고를 수 있다. 요금 구조가 서로 다르므로 발매 빈도로 판단한다.", "고르는 기준은 셋이다. 첫째 국내 서비스에 확실히 들어가는가. 해외 플랫폼 중에는 멜론과 지니 등록이 누락되거나 늦어지는 경우가 있으므로 국내 서비스를 명시하는지 확인한다. 둘째 요금 구조가 내 발매 빈도에 맞는가. 일 년에 한두 곡이면 발매 단위 요금이, 자주 내면 구독제가 유리하다. 셋째 발매를 멈춰도 음원이 유지되는가. 구독형은 구독을 끊으면 음원이 내려가는 경우가 있다.", "숨은 비용도 본다. 구독료와 별개로 발매마다 처리비가 붙는지, 스트리밍 수익에서 몇 퍼센트를 떼는지, 유튜브 콘텐츠 아이디 수익은 따로 계산하는지를 가입 전에 확인한다. 월 요금만 보고 고르면 나중에 총액이 달라진다. 어느 쪽을 고르든 심사와 반영에 보통 <v>1~3</v>주가 걸린다. 촉박하게 올리면 발매일에 일부 서비스에만 뜨거나 아예 안 올라가고, 커버나 메타데이터에 문제가 있어 반려되면 다시 기다려야 한다.", "국내에서 저작권료를 받으려면 권리 종류에 따라 다른 단체에 등록한다. 작사와 작곡과 편곡은 <b>한국음악저작권협회</b>, 연주와 노래는 <b>한국음악실연자연합회</b>가 맡는다. 본인이 작곡하고 직접 연주하고 불렀다면 두 곳 모두에 등록해야 두 갈래의 수익을 받는다. 한쪽만 하면 나머지는 정산되지 않는다.", "등록에는 순서가 있다. 먼저 창작자로 회원 가입을 하고, 그다음 곡을 하나씩 등록한다. 예명으로 활동한다면 예명 등록 서류를 따로 내야 한다. 공동 작업이라면 지분 비율을 미리 문서로 합의한 뒤 등록한다. 처음 입력한 지분은 나중에 고치기 번거롭다.", "등록 시점이 정산 액수를 가른다. 발매 전에 등록을 마쳐 두면 발매 직후부터 집계가 시작된다. 발매 후에 등록해도 소급이 되긴 하지만 등록 이전에 발생한 몫은 회수하기 어렵다. 실연자 등록은 본인이 어느 곡에 참여했는지 직접 신고해야 반영된다는 점도 알아둔다.", "발매 전 마지막 점검. 다른 스피커와 이어폰에서 들어보고, 휴대폰 스피커로도 들어보고, 곡 시작과 끝의 무음 길이를 확인한다."], "path": [{"n": "파일 준비", "s": ["마스터 WAV 24비트 파일", "커버 이미지 <v>3000</v>×<v>3000</v> 이상 정사각형", "메타데이터 목록을 문서로 정리"]}, {"n": "최종 점검", "s": ["다른 재생 환경 3곳 이상에서 청취", "모노로 합쳐 들어보기: <b>Stereo Out</b>에 <b>Gain</b> 플러그인 → 모노 버튼", "곡 시작 무음 <v>0.2~0.5</v>초, 끝 잔향 여유 확인"]}], "drill": ["완성 곡의 메타데이터 목록을 전부 작성한다. 빈칸이 없어야 한다.", "모노로 합쳐 들었을 때 사라지는 소리가 있는지 확인한다.", "휴대폰 스피커, 이어폰, 스피커 세 환경에서 듣고 문제를 적는다."], "keys": [["⌘B", "바운스"], ["X", "믹서"]], "chk": ["필요한 세 가지를 준비했다", "모노 호환성을 확인했다", "발매 일정을 여유 있게 잡았다", "ISRC와 UPC의 차이를 안다", "권리 종류별로 등록 단체가 다름을 안다", "유통사 선택 기준 셋을 안다"], "quiz": [{"q": "커버 이미지의 권장 최소 크기는?", "a": ["3000×3000", "500×500", "1000×1000", "300×300"], "c": 0, "e": "3000×3000 픽셀 정사각형이면 대부분의 서비스 요구를 만족한다."}, {"q": "모노로 합쳐 들었을 때 소리가 사라진다면 원인은?", "a": ["리버브 부족", "위상 문제", "템포 오류", "비트 심도"], "c": 1, "e": "좌우 신호의 위상이 반대인 부분은 모노에서 상쇄된다."}, {"q": "작곡하고 직접 연주해 부른 곡의 저작권료를 다 받으려면?", "a": ["한 단체만 등록하면 된다", "등록이 필요 없다", "배급사가 알아서 한다", "저작권 단체와 실연자 단체 모두에 등록한다"], "c": 3, "e": "작사·작곡·편곡과 연주·노래는 관리하는 단체가 다르다. 한쪽만 하면 나머지는 정산되지 않는다."}, {"q": "ISRC와 UPC의 차이는?", "a": ["ISRC는 녹음물마다, UPC는 발매물마다 붙는다", "둘 다 직접 발급받아야 한다", "같은 것이다", "ISRC는 국내용, UPC는 해외용"], "c": 0, "e": "같은 곡이라도 새로 녹음하면 새 ISRC가 붙는다. 싱글·EP·앨범에는 각각 UPC가 하나씩 필요하다."}, {"q": "유통사를 고를 때 확인할 것이 아닌 것은?", "a": ["국내 서비스에 확실히 들어가는가", "요금 구조가 발매 빈도에 맞는가", "발매를 멈춰도 음원이 유지되는가", "회사 설립 연도"], "c": 3, "e": "숨은 비용도 함께 본다. 발매마다 처리비가 붙는지, 스트리밍 수익에서 몇 퍼센트를 떼는지."}]}, {"t": "스포티파이 발매 실무", "goal": "발매일을 역산해 준비하고 발매 후 확인할 것을 안다.", "con": ["배급사에 올리는 것만으로 끝나지 않는다. 특히 스포티파이는 발매 전에 해두면 결과가 달라지는 일이 몇 가지 있고, 그 대부분이 날짜에 걸려 있다.", "가장 먼저 할 일이 아티스트 프로필 확보다. 배급사에 아티스트 링크를 요청하면 <b>spotify.com/artist</b> 또는 <b>spotify:artist</b>로 시작하는 주소를 준다. 이 링크로 프로필 소유권을 신청한다. 이 절차를 건너뛰면 배급사가 새 아티스트를 만들어버려 이전 발매물과 분리되는 일이 생긴다. 첫 발매에서 가장 흔하게 놓치는 부분이다.", "플레이리스트 소개는 발매일까지 <b>최소 7일 전</b>에 넣는다. 에디터가 들을 시간이 필요하기 때문이다. 한 번에 한 곡만 소개할 수 있고, 소개한 곡이 발매된 뒤에야 다음 곡을 소개할 수 있다. 이미 발매된 곡은 소개할 수 없다. 소개했다고 플레이리스트에 들어간다는 보장은 없지만, 넣지 않으면 검토 대상이 되지 않는다.", "여기서 날짜 계산이 나온다. 소개하려면 곡이 이미 스포티파이에 전달되어 있어야 하는데, 배급사가 전달하는 데 시간이 걸린다. 배급사에 따라 발매 <v>3</v>주 전 업로드를 요구하기도 한다. 그래서 실제 일정은 발매일에서 역산한다. <v>4</v>주 전 마스터 완성, <v>3</v>주 전 배급사 업로드, <v>1</v>주 전 플레이리스트 소개, 발매일이다.", "메타데이터는 스포티파이가 받은 그대로 표시한다. 잘못 적으면 스포티파이에서 고쳐주지 않고 배급사가 다시 제출해야 한다. 참여한 아티스트는 각각 별도 항목에 넣고, 이름의 철자와 형식은 모든 발매물에서 똑같이 유지한다. 한 번은 영문, 한 번은 한글로 적으면 다른 아티스트로 잡힌다.", "발매일은 금요일이 관행이다. 주간 집계가 금요일 기준으로 돌아가기 때문에 한 주를 온전히 쓸 수 있다. 다만 개인 발매에서는 이 관행보다 준비가 끝났는지를 먼저 본다.", "발매 후에도 할 일이 남는다. 각 서비스에 실제로 올라갔는지, 아티스트 이름과 크레딧이 맞는지, 기존 프로필에 연결됐는지 확인한다. 잘못된 것이 있으면 배급사를 통해 수정 요청을 넣어야 하고 반영에 또 시간이 걸린다.", "발매일이 끝이 아니라는 것도 알아둔다. 발매 첫해 스트리밍의 상당 부분이 발매 한 달 이후에 일어난다. 발매 당일에 모든 것을 쏟기보다 이후 몇 달을 보고 움직이는 편이 낫다."], "path": [{"n": "발매 일정 역산", "s": ["발매일을 금요일로 정한다", "<v>4</v>주 전: 마스터와 커버, 메타데이터 완성", "<v>3</v>주 전: 배급사에 업로드", "<v>1</v>주 전: 스포티파이 플레이리스트 소개", "발매일: 각 서비스 등록 확인"]}, {"n": "아티스트 프로필 신청", "s": ["배급사에 아티스트 링크 또는 URI 요청", "<b>spotify.com/artist</b> 또는 <b>spotify:artist</b>로 시작하는지 확인", "Spotify for Artists에서 프로필 신청", "링크를 붙여넣고 소유권 확인 절차 진행"]}, {"n": "발매 후 점검", "s": ["각 스트리밍 서비스에서 곡 검색", "아티스트 이름 철자와 크레딧 확인", "기존 아티스트 프로필에 연결됐는지 확인", "틀린 것은 배급사에 수정 요청"]}], "drill": ["다음 곡의 발매일을 정하고 4주 전부터의 일정을 달력에 적는다.", "배급 대행사 두세 곳의 요금 구조와 국내 서비스 포함 여부를 비교한다.", "이미 발매한 곡이 있다면 각 서비스에서 아티스트 이름과 크레딧이 맞는지 확인한다."], "chk": ["발매일에서 역산한 일정을 세운다", "아티스트 프로필을 미리 확보한다", "발매 후 등록 상태를 확인한다"], "keys": [["⌘B", "바운스"], ["I", "인스펙터"]], "quiz": [{"q": "스포티파이 플레이리스트에 곡을 소개할 수 있는 시점은?", "a": ["제한 없음", "발매일 최소 7일 전까지", "발매 당일", "발매 후 아무 때나"], "c": 1, "e": "에디터가 들을 시간이 필요하다. 이미 발매된 곡은 소개할 수 없다."}, {"q": "아티스트 프로필을 미리 신청하지 않으면?", "a": ["배급사가 새 아티스트를 만들어 이전 발매물과 분리될 수 있다", "발매가 안 된다", "정산이 안 된다", "문제없다"], "c": 0, "e": "첫 발매에서 가장 흔하게 놓치는 부분이다. 배급사에 아티스트 링크를 요청해 미리 확보한다."}, {"q": "메타데이터가 잘못 표시됐다면?", "a": ["스포티파이에 직접 요청한다", "자동으로 고쳐진다", "수정 불가", "배급사가 수정된 정보를 다시 제출해야 한다"], "c": 3, "e": "스포티파이는 받은 정보를 그대로 표시한다. 반영에도 시간이 걸린다."}], "s": 15, "d": 110}, {"t": "AI 도구와 고지 기준", "goal": "AI 생성과 도구 사용의 경계를 알고 정확하게 표시한다.", "con": ["AI 고지 항목이 배급사 업로드 양식에 등장하기 시작했다. 여기서 헷갈리는 지점이 있어 기준을 세워 둔다. 나뉘는 지점은 <b>결과물을 누가 만들었는가</b>이지 소프트웨어를 썼는가가 아니다.", "생성에 해당하는 것은 학습된 모델이 오디오나 연주를 만들어 내고 그것을 그대로 쓰는 경우다. 문장을 넣으면 곡이 나오는 서비스로 만든 트랙, 모델이 부른 목소리, 생성된 반주를 손대지 않고 올리는 것이 여기 속한다. 사람은 지시만 했고 결과를 만든 것은 모델이다.", "도구에 해당하는 것은 사람이 정한 규칙과 판단으로 결과가 정해지는 경우다. 아르페지에이터로 코드를 펼치는 것, 드러머 트랙으로 드럼을 만드는 것, 세션 플레이어에게 코드 진행을 주고 연주시키는 것, 퀀타이즈와 플렉스로 타이밍을 고치는 것, 마스터링 어시스턴트로 체인을 잡는 것이 전부 여기 속한다. 직접 만든 프로그램으로 미디를 생성한 뒤 골라 쓰고 편곡하는 것도 마찬가지다. 어느 쪽도 AI 음악이 아니다.", "판단이 어려우면 세 가지를 물어본다. 결과물의 형태를 내가 정했는가. 나온 것을 듣고 고르고 고쳤는가. 최종 결과에 내 연주나 편곡이나 믹싱이 들어갔는가. 셋 다 그렇다면 도구를 쓴 것이다. 하나라도 아니라면 그 부분은 생성에 가깝다.", "표시할 때는 정직하게 하되 정확하게 한다. 양식이 <b>AI로 생성한 음원인가</b>를 묻는다면 도구를 쓴 작업은 아니오다. <b>제작 과정에 소프트웨어를 썼는가</b>를 묻는다면 예이고, 이것은 프로그램으로 음악을 만드는 모든 사람에게 해당한다. 두 질문을 구분하지 못하면 필요 없는 표시를 하게 되고, 표시된 트랙은 플랫폼에 따라 다르게 취급된다.", "권리 측면도 알아둔다. 전적으로 생성된 것은 저작권 보호 밖에 놓이고, 사람이 주도한 작업은 도구를 썼더라도 보호를 유지한다. 앞에서 본 저작권 등록도 후자에서만 의미가 있다. 그래서 어느 쪽인지가 표시의 문제로 끝나지 않는다."], "path": [{"n": "내 작업 판정하기", "s": ["결과물의 형태를 내가 정했는지 확인", "나온 것을 듣고 고르고 고쳤는지 확인", "최종 결과에 내 연주·편곡·믹싱이 들어갔는지 확인", "셋 다 그렇다면 도구를 쓴 것이다", "배급사 양식의 질문이 <b>생성</b>을 묻는지 <b>소프트웨어 사용</b>을 묻는지 구분해 답한다"]}], "drill": ["자신의 작업 과정을 단계별로 적고 각 단계가 생성인지 도구인지 표시해 본다.", "로직의 드러머·세션 플레이어·아르페지에이터로 만든 결과가 왜 도구에 해당하는지 설명해 본다."], "keys": [["I", "인스펙터"]], "chk": ["AI 생성과 도구 사용의 경계를 안다", "양식의 두 질문을 구분해 답한다", "권리 측면의 차이를 안다"], "quiz": [{"q": "AI 생성과 도구 사용을 나누는 기준은?", "a": ["소프트웨어를 썼는지", "결과물을 누가 만들었는지", "플러그인 개수", "작업 시간"], "c": 1, "e": "사람이 정한 규칙과 판단으로 결과가 정해지면 도구다. 모델이 만든 것을 그대로 쓰면 생성이다."}, {"q": "세션 플레이어에게 코드 진행을 주고 연주시킨 곡은?", "a": ["도구를 쓴 것이므로 AI 음악이 아니다", "AI 음악으로 표시해야 한다", "발매할 수 없다", "저작권이 없다"], "c": 0, "e": "사람이 진행을 정하고 결과를 고르고 편곡했다면 도구를 쓴 것이다."}], "s": 15, "d": 111}, {"t": "대안과 Varispeed", "goal": "여러 버전을 한 프로젝트 안에서 오가고 속도를 바꿔 연습·녹음한다.", "con": ["곡을 만들다 보면 비교하고 싶은 순간이 온다. 기타 솔로를 세 번 다르게 쳐 봤는데 어느 게 나은지, 편곡을 A안과 B안으로 갈라서 들어 보고 싶을 때다. 복사해서 뮤트하는 방식은 트랙이 늘어나 금방 지저분해진다. 로직에는 이럴 때 쓰라고 만든 기능이 둘 있다.", "<b>트랙 대안</b>은 한 트랙 안에 여러 버전을 두는 것이다. 트랙 하나에 대안 A, B, C를 만들면 겉으로는 트랙 하나인데 안에 세 벌이 들어 있다. 활성 대안 하나만 재생되고 나머지는 숨는다. 트랙 헤더의 대안 버튼을 누르면 목록이 나오고 골라서 바꾼다. 솔로 여러 테이크, 편곡 변주, 다른 악기로 바꿔 본 것을 비교할 때 트랙 수가 안 늘어난다.", "<b>프로젝트 대안</b>은 프로젝트 전체를 여러 버전으로 두는 것이다. 믹스를 크게 바꿔 보고 싶은데 되돌릴 걱정이 되면, 먼저 대안을 만들고 그 안에서 바꾼다. 마스터링 어시스턴트를 수동 체인과 비교할 때 앞에서 대안으로 나누라고 한 것이 이것이다. 오디오 파일은 공유하므로 용량이 두 배로 늘지 않는다.", "둘의 차이는 범위다. 트랙 대안은 그 트랙만, 프로젝트 대안은 전부다. 한 악기의 연주를 비교하면 트랙 대안, 믹스나 편곡 방향을 비교하면 프로젝트 대안이다.", "<b>Varispeed</b>는 곡 전체 속도를 바꿔 재생하는 기능이다. 원래 테이프 속도를 바꾸던 것에서 온 이름이다. 두 가지 모드가 있다. 속도만 바꾸고 음정을 유지하는 모드와, 테이프처럼 음정까지 함께 바뀌는 모드다.", "배우는 단계에서 가장 유용한 용도가 연습이다. 어려운 구간을 <v>70~80</v>퍼센트로 느리게 틀어 놓고 따라 치다가, 익으면 <v>100</v>으로 되돌린다. 녹음에도 쓴다. 빠른 프레이즈를 느리게 녹음한 뒤 <v>100</v>으로 되돌리면 원래 속도로 재생되는데, 음정 유지 모드로 하면 그대로 쓸 수 있다.", "Varispeed를 켜 둔 채 바운스하면 바뀐 속도로 뽑히므로 마스터 전에 반드시 끈다. 컨트롤 막대의 LCD에 주황색으로 표시되어 켜져 있는지 바로 보인다."], "path": [{"n": "트랙 대안 만들기", "s": ["트랙 헤더 우클릭 → <b>트랙 헤더 구성</b>에서 <b>트랙 대안</b> 켜기", "트랙 헤더의 대안 버튼 클릭 → <b>새 대안</b>", "새 대안에 다른 연주 녹음", "버튼으로 A와 B를 오가며 비교", "결정되면 나머지 대안 삭제"]}, {"n": "프로젝트 대안", "s": ["<b>파일 → 대안 → 새 대안</b>", "이름 지정", "대안 안에서 바꾸고 싶은 것 전부 변경", "<b>파일 → 대안</b> 목록에서 오가며 비교"]}, {"n": "Varispeed로 연습", "s": ["컨트롤 막대 우클릭 → <b>사용자화</b> → <b>Varispeed</b> 표시", "LCD의 Varispeed 클릭 → <b>속도만</b> 모드", "<v>75</v>퍼센트로 설정하고 연습", "끝나면 <v>100</v>으로 되돌리고 끄기"]}], "drill": ["같은 기타 프레이즈를 트랙 대안 셋으로 녹음하고 가장 나은 것을 고른다.", "믹스를 프로젝트 대안으로 나눠 한쪽은 밝게 한쪽은 어둡게 만들어 비교한다.", "어려운 구간을 Varispeed 75로 연습해 본다."], "keys": [["⌘S", "저장"], ["⌥⌘N", "새 트랙"]], "chk": ["트랙 대안과 프로젝트 대안의 범위 차이를 안다", "Varispeed를 켠 채 바운스하지 않는다"], "quiz": [{"q": "기타 솔로 세 버전을 비교하려면?", "a": ["트랙 대안", "트랙 세 개에 복사", "뮤트 오토메이션", "프로젝트 대안"], "c": 0, "e": "한 트랙 안에 여러 벌을 두고 오간다. 트랙 수가 안 늘어난다."}, {"q": "Varispeed를 켠 채 바운스하면?", "a": ["문제없다", "음질이 좋아진다", "바뀐 속도로 뽑힌다", "자동으로 꺼진다"], "c": 2, "e": "마스터 전에 반드시 끈다. LCD에 주황색으로 표시된다."}], "s": 16, "d": 112}, {"t": "숫자로 보는 창 세 가지", "goal": "이벤트 리스트, 오디오 파일 편집기, Environment가 무엇이고 언제 여는지 안다.", "con": ["지금까지 다룬 창은 전부 그림으로 보는 창이었다. 피아노 롤은 음을 막대로, 트랙 영역은 리전을 상자로 보여준다. 로직에는 같은 것을 숫자와 표로 보는 창이 따로 있다. 평소에는 열 일이 없지만 그림으로 안 잡히는 문제가 생기면 이쪽이 빠르다.", "<b>이벤트 리스트</b>는 미디를 숫자 표로 보는 창이다. 한 줄이 음 하나이고 위치, 음높이, 벨로시티, 길이가 열로 나온다. 피아노 롤에서 겹쳐 안 보이는 음, 길이가 0인 음, 벨로시티가 1인 유령 음을 찾을 때 연다. 소리가 나는데 화면에 음 때 작게, 믹스 때 크게 둔다.", "I/O Buffer"], ["INST 입력", "기타와 베이스를 직접 꽂기 위한 고임피던스 입력. 이걸 안 누르면 고음이 죽는다.", "Instrument (Hi-Z)"], ["ISRC", "녹음물마다 붙는 국제 표준 코드. 정산 추적에 쓰인다.", "ISRC"], ["Keyboard Player", "건반을 연주해 주는 세션 플레이어. Synth Player 스타일을 포함한다.", "Keyboard Player"], ["Klopfgeist", "로직의 메트로놈 소리를 내는 악기. 새 프로젝트마다 Click 채널에 자동으로 로드된다.", "Klopfgeist"], ["LFO", "너무 느려 음으로는 안 들리고 다른 값을 흔드는 데 쓰는 오실레이터.", "Low Frequency Oscillator"], ["LUFS", "사람이 느끼는 음량을 측정한 단위. 스트리밍 기준은 -14LUFS 부근.", "Loudness Units Full Scale"], ["MIDI 체이스", "재생 시작점 이전에 눌린 음을 로직이 찾아 소리 내주는 기능. 긴 음 작업에 필수.", "Chase Events"], ["MP3", "압축한 오디오 파일 형식. 용량이 작지만 정보가 줄어 있다.", "MP3"], ["Mid Only", "가운데 성분만 들려주는 Channel EQ 프로세싱 모드. 보컬과 베이스가 여기 있다.", "Mid Only"], ["MusicXML", "악보 정보를 다른 프로그램과 주고받는 표준 파일 형식.", "MusicXML"], ["NKI", "컨탁 인스트루먼트 파일. 여러 개를 묶은 것은 NKM이다.", "Kontakt Instrument"], ["Q", "EQ 밴드의 폭. 숫자가 클수록 좁다. 컷은 3~6, 부스트는 0.7~1.", "Q Factor"], ["Q-Couple", "게인을 바꿀 때 Q를 자동으로 조정해 체감 폭을 유지하는 기능.", "Q-Couple"], ["Q-강도", "퀀타이즈를 얼마나 적용할지의 비율. 80퍼센트 근처가 자연스럽다.", "Q-Strength"], ["Q-범위", "격자에서 이만큼 벗어난 음만 퀀타이즈. 대체로 맞는 연주에 쓴다.", "Q-Range"], ["Q-플램", "같은 자리에 겹친 음을 살짝 벌리는 퀀타이즈. 코드가 스트럼처럼 된다.", "Q-Flam"], ["Quick Sampler", "오디오 하나를 즉시 연주 가능한 악기로 만드는 로직 도구.", "Quick Sampler"], ["RMS", "일정 시간의 평균 레벨. 피크와 달리 체감 크기에 가깝다.", "RMS"], ["Sample Delay", "한쪽 채널을 샘플 단위로 늦추는 플러그인. 킥과 베이스의 시간차를 맞출 때 쓴다.", "Sample Delay"], ["Side Only", "좌우가 서로 다른 부분만 들려주는 모드. 리버브와 백보컬이 여기 있다.", "Side Only"], ["Size", "리버브에서 공간의 크기. 키우면 반사가 늦게 돌아온다.", "Size"], ["Spread", "Direction Mixer의 좌우 폭. 1.0이 원래, 0이 모노, 1.5가 넓힘.", "Spread"], ["Stereo Spread", "대역별로 나눠 높은 대역일수록 넓게 벌리는 플러그인.", "Stereo Spread"], ["TRS", "검은 줄 두 개짜리 밸런스드 케이블. 인터페이스와 모니터 연결의 표준.", "TRS"], ["TS", "줄 하나짜리 언밸런스드 케이블. 기타에서 인터페이스까지 짧은 구간에 쓴다.", "TS"], ["UPC", "발매물 하나에 붙는 코드. 싱글·EP·앨범마다 하나씩 필요하다.", "UPC"], ["VCA", "컴프 모델 중 하나. 반응이 빠르고 깔끔해 드럼과 버스에 맞는다.", "VCA"], ["VCA 페이더", "안쪽 페이더들을 상대적으로 함께 움직이는 페이더. 소리는 통과하지 않는다.", "VCA Fader"], ["Varispeed", "곡 전체 속도를 바꿔 재생하는 기능. 연습과 느린 녹음에 쓴다.", "Varispeed"], ["WAV", "압축하지 않은 오디오 파일 형식. 작업과 발매용 마스터에 쓴다.", "WAV"], ["XLR", "세 핀짜리 마이크 표준 케이블. 잡음에 강하고 팬텀 파워를 전달한다.", "XLR"], ["XY", "두 마이크의 머리를 한 점에 모아 90도로 벌리는 스테레오 방식. 위상에 안전하다.", "X/Y"], ["_bip", "바운스 인 플레이스로 만든 파일 이름 뒤에 자동으로 붙는 표시.", "_bip"], ["dB SPL", "공기 중 실제 음압을 재는 단위. 믹싱 청취 기준은 76~85dB SPL.", "dB SPL"], ["dBFS", "디지털 최대치를 0으로 놓은 레벨 단위. 0을 넘으면 클립.", "dB Full Scale"], ["가상악기", "미디 지시를 받아 실제 소리를 내주는 프로그램 안의 악기.", "Software Instrument"], ["간섭", "같은 소리 둘이 겹칠 때 높이마다 커지고 작아지는 현상. 위상 문제와 폭 만들기가 모두 여기서 나온다.", "Interference"], ["개방현", "손가락을 짚지 않은 현. 비브라토가 안 걸리고 소리가 다르다.", "Open String"], ["개방형 헤드폰", "뒤가 뚫려 울림이 자연스러운 헤드폰. 믹싱용.", "Open-back"], ["게이트", "설정한 레벨보다 작은 소리를 막는 도구. 잡음과 새어든 소리를 걷어낸다.", "Noise Gate"], ["게이트 리버브", "잔향이 도중에 끊기는 효과. 1980년대 스네어 소리.", "Gated Reverb"], ["게이트 타임", "음 길이를 비율로 바꾸는 리전 설정. 50이면 스타카토, 150이면 레가토.", "Gate Time"], ["게인", "들어오는 신호를 얼마나 증폭할지 정하는 값. 나가는 크기인 볼륨과 구분한다.", "Gain"], ["게인 도구", "리전 게인을 드래그로 조절하는 도구. T로 도구 팝업에서 고른다.", "Gain Tool"], ["게인 리덕션", "컴프레서가 실제로 누른 양. 3~6dB가 일반적.", "Gain Reduction"], ["게인 스테이징", "각 단계의 레벨을 적정 범위에 두는 작업. 개별 트랙 피크 -18~-10dBFS.", "Gain Staging"], ["격자", "리전과 음이 달라붙는 눈에 보이지 않는 눈금.", "Grid"], ["겹침 제거", "겹친 음의 앞 음을 다음 음 직전까지 줄이는 정리 명령. F1.", "Remove Overlaps"], ["고스트 노트", "줄을 살짝 눌러 음정 없이 툭 치는 소리. 벨로시티 20~40의 아주 짧은 음.", "Ghost Note"], ["고역", "높은 주파수 구간. 하이햇과 공기감이 사는 자리.", "High"], ["공명", "페달을 밟으면 안 친 줄도 함께 울리는 현상.", "Sympathetic Resonance"], ["관습", "이 자리에서 으레 하는 것. 규칙이 아니라 기대라서 깨면 효과, 모르고 빠뜨리면 결함이 된다.", "Convention"], ["그룹 버스", "같은 역할의 트랙을 하나로 모은 버스. 여기에 컴프를 걸면 한 덩어리로 움직인다.", "Group Bus"], ["극성 반전", "파형의 위아래를 뒤집는 처리. 다중 마이크 녹음의 위상 정렬에 쓴다.", "Phase Invert"], ["근접 효과", "마이크에 가까울수록 저역이 붇는 현상. 멀어지면 반대가 된다.", "Proximity Effect"], ["글루 컴프레서", "마스터에 살짝 걸어 곡을 하나로 묶는 컴프레서. 게인 리덕션 1~2dB.", "Glue Compressor"], ["글루 컴프레션", "묶인 트랙을 함께 살짝 눌러 한 덩어리로 들리게 하는 처리.", "Glue Compression"], ["기음", "함께 울리는 음들 중 가장 낮은 것. 우리가 듣는 음높이를 정한다.", "Fundamental"], ["나이퀴스트", "기록하려는 가장 높은 주파수의 두 배 넘게 샘플링해야 한다는 기준.", "Nyquist"], ["내보내기", "트랙·리전·프로젝트를 따로따로 꺼내는 것. 파일 → 보내기.", "Export"], ["노 트랜스포즈", "트랜스포즈에서 제외하는 트랙 설정. 드럼에 켠다.", "No Transpose"], ["노멀라이즈", "파일 전체를 최대치까지 자동으로 올리는 기능. 바운스할 때는 끈다.", "Normalize"], ["노이즈 스윕", "화이트 노이즈에 필터를 열고 닫아 만든 바람 소리. 어느 장르에나 붙는다.", "Noise Sweep"], ["노치", "한 주파수만 아주 좁고 깊게 도려내는 EQ 밴드 모양. 잡음 제거용.", "Notch"], ["누적 게인 리덕션", "트랙, 버스, 마스터에서 각각 누른 양의 합. 8dB를 넘지 않게 관리한다.", "Cumulative GR"], ["눈금자", "화면 위쪽의 마디 번호가 적힌 막대. 클릭하면 재생 헤드가 그 자리로 간다.", "Ruler"], ["니", "스레숄드를 넘는 순간 압축이 얼마나 급하게 시작되는지. 하드는 뚜렷, 소프트는 완만.", "Knee"], ["다운리프터", "떨어지며 힘을 빼는 전환 효과. 코러스가 끝나는 자리에 쓴다.", "Downlifter"], ["다운보", "활을 아래로 긋는 것. 팔 무게가 실려 강하다.", "Down-bow"], ["다이내믹", "벨로시티 편차를 비율로 늘리거나 줄이는 리전 설정.", "Dynamics"], ["다이내믹 EQ", "해당 대역이 설정 레벨을 넘을 때만 깎는 EQ. 가끔 생기는 문제에 쓴다.", "Dynamic EQ"], ["다이내믹 레인지", "가장 작은 소리와 가장 큰 소리 사이의 폭.", "Dynamic Range"], ["다이내믹 마이크", "코일과 자석으로 소리를 받는 마이크. 튼튼하고 큰 소리에 강하며 전원이 필요 없다.", "Dynamic Mic"], ["다이렉트 모니터링", "인터페이스가 입력 소리를 지연 없이 바로 헤드폰으로 들려주는 기능.", "Direct Monitoring"], ["더블", "리드와 같은 것을 한 번 더 부른 층. 복사가 아니라 다시 불러야 두께가 생긴다.", "Double"], ["더블 타임", "같은 곡을 두 배 빠른 템포로 표기하는 방식. 트랩의 140~160 표기가 여기 해당한다.", "Double Time"], ["덕킹", "특정 소리가 날 때 다른 소리를 잠깐 낮추는 처리.", "Ducking"], ["덕킹 리버브", "보컬을 소스로 리버브를 눌러 노래하는 동안 잔향이 물러나게 하는 기법.", "Ducking Reverb"], ["데시벨", "소리 크기를 재는 단위. 절대값이 아니라 무엇과 비교한 값이다.", "dB"], ["독립 오디오 파일로 변환", "리전을 별도 파일로 떼어내 다른 리전에 영향을 주지 않게 하는 명령. ⌥⌘F.", "Convert to New Audio Files"], ["드라이", "처리되지 않은 원음.", "Dry"], ["드러머", "로직이 연주해주는 가상 드러머 트랙. XY 패드로 복잡도와 세기를 조절한다.", "Drummer"], ["드로우바 오르간", "막대를 밀고 당겨 배음을 섞는 오르간. 어택 없이 크게 지속되어 두껍고 힘있게 들린다. 가스펠과 록의 표준 재료.", "Drawbar Organ"], ["디더", "비트 심도를 줄일 때 생기는 왜곡을 아주 작은 잡음으로 가리는 처리. 24비트로 낼 때는 쓰지 않는다.", "Dither"], ["디스토션", "확실히 일그러져 원래 음색이 바뀌는 왜곡.", "Distortion"], ["디스플레이 퀀타이즈", "악보에 그릴 때만 반올림하는 표시 단위. 미디 자체는 바뀌지 않는다.", "Display Quantize"], ["디에서", "치찰음 대역만 순간적으로 누르는 도구. 5~9kHz를 다룬다.", "De-esser"], ["디케이", "최대에 도달한 뒤 떨어지는 시간. 리버브에서는 잔향이 사라지는 시간을 뜻한다.", "Decay"], ["라우드니스 레인지", "곡의 다이내믹 폭. 5~9LU가 무난하다.", "Loudness Range"], ["라우드니스 보정", "마스터링 어시스턴트를 켜고 끌 때 음량을 맞춰 주는 기능. 바운스 전에는 끈다.", "Loudness Compensation"], ["라운드 로빈", "같은 음을 칠 때 샘플을 번갈아 쓰는 방식. 반복이 기계적으로 들리지 않게 한다.", "Round Robin"], ["라이브러리", "그 트랙에 얹을 소리를 고르는 목록.", "Library"], ["라이저", "구간 전환 직전의 상승 효과음.", "Riser"], ["래치", "건반에서 손을 떼도 아르페지오가 계속되게 하는 설정.", "Latch"], ["레가토 전환", "음을 겹쳐 두면 활이나 혀를 바꾸지 않고 이어지는 소리가 나는 것.", "Legato Transition"], ["레이시오", "컴프레서가 누르는 비율. 3:1이면 초과분이 3분의 1로 줄어든다.", "Ratio"], ["레이어링", "같은 역할의 샘플을 겹쳐 원하는 소리를 만드는 것. 위상 확인이 필수다.", "Layering"], ["레이턴시", "소리가 들어와 나가기까지의 지연. 버퍼와 플러그인 처리에서 생긴다.", "Latency"], ["레이트", "아르페지에이터에서 음이 나오는 간격. 1/16이 기본이다.", "Rate"], ["레인지", "게이트가 닫혔을 때 얼마나 막을지. 완전히 막지 않는 편이 자연스럽다.", "Range"], ["레조넌스", "필터 컷오프 지점을 강조하는 정도.", "Resonance"], ["레퍼런스 트랙", "목표로 삼는 완성 음원. 음량을 맞춰 비교해야 의미가 있다.", "Reference Track"], ["로열티 프리", "사서 쓰면 추가 비용 없이 상업적으로 쓸 수 있다는 뜻. 아무 소리나 써도 된다는 뜻이 아니다.", "Royalty Free"], ["로컬 오프", "신디사이저에서 건반과 자체 음원의 연결을 끊는 설정. 순수한 입력 장치가 된다.", "Local Off"], ["루프", "같은 구간을 반복해 재생하는 것.", "Loop"], ["루프 브라우저", "Apple Loops를 악기·장르·분위기로 걸러 찾는 창. O로 연다.", "Loop Browser"], ["룩어헤드", "신호를 미리 읽어 눌릴 준비를 하는 기능. 지연이 생긴다.", "Look-ahead"], ["룸 리버브", "작은 방을 흉내 낸 짧고 어두운 잔향. 드럼과 기타에 쓴다.", "Room"], ["리드", "선율을 맡는 전면의 신스 소리.", "Lead"], ["리드 시트", "멜로디 한 줄과 코드 기호만 있는 악보.", "Lead Sheet"], ["리미터", "설정한 실링을 절대 넘지 않게 막는 최종 단계 처리기.", "Limiter"], ["리버스 리버브", "잔향을 거꾸로 재생해 소리가 빨려 들어가는 느낌을 주는 효과.", "Reverse Reverb"], ["리버스 심벌", "심벌을 거꾸로 재생해 흡입되는 느낌을 주는 전환 효과.", "Reverse Cymbal"], ["리본 마이크", "얇은 금속 리본으로 소리를 받는 예민한 마이크. 팬텀 파워를 켜기 전에 설명서를 확인한다.", "Ribbon Mic"], ["리전", "트랙 위의 소리 덩어리. 미디 리전은 음표 정보를, 오디오 리전은 파형을 담는다.", "Region"], ["리전 딜레이", "리전 전체를 앞뒤로 미는 값. 미디를 안 고치고 느낌을 바꾼다.", "Region Delay"], ["리전 오토메이션", "리전 안에서 시간에 따라 값을 바꾸는 것. 이펙트 앞에서 작동한다.", "Region Automation"], ["리전 인스펙터", "선택한 리전의 숨은 설정. 뮤트·루프·트랜스포즈·딜레이·게인·퀀타이즈 항목이 있다.", "Region Inspector"], ["리플렉션 필터", "마이크 뒤에 두르는 반원형 흡음판. 방 울림을 줄인다.", "Reflection Filter"], ["릴리스 노이즈", "손을 뗄 때 나는 짧은 잡음. 없으면 소리가 너무 깨끗하다.", "Release Noise"], ["마디", "박이 몇 개 모인 한 덩어리. 눈금자의 숫자가 마디 번호다.", "Bar"], ["마르카토", "음을 또렷하게 강조해 연주하는 주법.", "Marcato"], ["마스킹", "같은 대역의 큰 소리가 작은 소리를 덮어 안 들리게 하는 현상.", "Masking"], ["마스터", "모든 신호가 마지막에 모이는 곳. 로직에서는 스테레오 아웃이라고 표시된다.", "Stereo Out"], ["마스터 키보드", "입력 전용으로 쓰는 건반. 신디사이저도 로컬 오프를 켜면 마스터 키보드가 된다.", "Master Keyboard"], ["마스터링 어시스턴트", "곡을 분석해 EQ와 다이내믹, 라우드니스를 자동으로 맞춰 주는 로직 도구.", "Mastering Assistant"], ["마키 도구", "리전 경계와 상관없이 시간 범위를 사각형으로 고르는 도구. 구간 삭제·복사·재생에 쓴다.", "Marquee Tool"], ["말렛", "마림바, 비브라폰, 글로켄처럼 채로 때리는 악기 계열.", "Mallet"], ["매핑", "어떤 건반과 어떤 벨로시티에 어떤 샘플을 배치할지 정한 표.", "Mapping"], ["멀티 아웃풋", "악기 안의 소리를 믹서에서 여러 채널로 나눠 뽑는 방식.", "Multi-Output"], ["멀티밴드 컴프레서", "주파수 구간별로 따로 누르는 컴프레서. 문제가 명확할 때만 쓴다.", "Multiband Compressor"], ["멀티탭 딜레이", "반복 지점을 여러 개 직접 찍는 딜레이. Delay Designer.", "Multi-tap Delay"], ["멀티트랙 세트", "함께 녹음된 여러 파일을 하나의 연주로 보고 스마트 템포로 분석하는 묶음.", "Multitrack Set"], ["멀티팀버", "악기 하나의 인스턴스 안에 여러 악기를 담는 방식. 컨탁은 16개까지.", "Multitimbral"], ["메이크업 게인", "컴프레서로 줄어든 음량을 보상하는 값.", "Make-up Gain"], ["메트로놈", "박에 맞춰 딸깍 소리를 내주는 기능. 녹음할 때 켠다. K로 켜고 끈다.", "Metronome"], ["멜로트론", "테이프를 재생하는 옛 건반 악기. 흔들리는 복고적 목소리와 플루트.", "Mellotron"], ["모노 호환성", "좌우를 합쳐 들었을 때 소리가 사라지지 않는지의 여부. 위상 문제를 확인한다.", "Mono Compatibility"], ["모노포닉", "한 번에 한 음만 나는 소리용 플렉스 모드. 마른 녹음이어야 한다.", "Monophonic"], ["모니터", "있는 그대로 들려주는 것이 목표인 작업용 스피커.", "Monitor"], ["모듈레이션", "어떤 값을 다른 것이 자동으로 움직이게 하는 것. 소스와 대상으로 이루어진다.", "Modulation"], ["모듈레이션 휠", "CC1을 보내는 휠. 음색의 세기와 떨림을 조절한다.", "Mod Wheel"], ["무음 제거", "설정한 레벨보다 작은 구간을 한 번에 잘라내는 기능. ⌃X.", "Strip Silence"], ["무지향성", "사방을 고르게 받는 지향성. 공간 전체를 담을 때 쓴다.", "Omni"], ["물리 모델링", "악기의 물리 과정을 계산해 소리를 만드는 방식. 로직의 Sculpture가 이쪽이다.", "Physical Modeling"], ["뮤트", "그 트랙을 잠시 꺼두는 기능.", "Mute"], ["뮤트 스트로크", "왼손으로 줄을 눌러 음정 없이 리듬만 내는 주법.", "Muted Stroke"], ["미드", "스테레오 양쪽에 공통으로 들어 있는 소리. 가운데에 놓인 것들.", "Mid"], ["미드사이드", "좌우를 더한 가운데 성분과 뺀 좌우 성분으로 나눠 따로 처리하는 방식.", "Mid-Side"], ["미디", "소리가 아니라 연주 지시서. 어떤 건반을 언제 얼마나 세게 눌렀는지의 기록이다.", "MIDI"], ["미디 이펙트", "악기에 도달하기 전의 음표 정보를 가공하는 플러그인. 아르페지에이터 등.", "MIDI FX"], ["미디 컨트롤러", "노브, 페이더, 패드 등으로 미디 신호를 보내는 장치. 무엇을 움직일지는 할당으로 정한다.", "MIDI Controller"], ["미디 키보드", "건반 모양의 입력 장치. 스스로 소리를 내지 않고 연주 정보만 컴퓨터로 보낸다.", "MIDI Keyboard"], ["미디 파일", "연주 정보만 담긴 파일. 소리는 없고 받는 쪽에서 악기를 붙인다.", "MIDI File"], ["믹서", "모든 트랙의 채널 스트립을 한 화면에 모아 보는 창.", "Mixer"], ["밀리초", "1000분의 1초. 소리의 시간을 다루는 값은 거의 전부 이 단위로 적는다.", "ms"], ["밀폐형 헤드폰", "귀를 감싸 소리가 새지 않는 헤드폰. 녹음용.", "Closed-back"], ["바레 코드", "한 손가락으로 여러 줄을 누르는 기타 코드 폼.", "Barre Chord"], ["바운스", "모든 트랙을 합쳐 파일 하나로 만드는 것. ⌘B.", "Bounce"], ["바운스 인 플레이스", "미디나 오디오 리전을 이펙트까지 구워 새 오디오로 만드는 것. ⌃B.", "Bounce in Place"], ["박", "발로 까딱거리는 시간의 한 단위.", "Beat"], ["박자", "한 마디에 어떤 음표가 몇 개 들어가는지를 두 숫자로 나타낸 것.", "Time Signature"], ["배급 대행사", "음원을 받아 여러 스트리밍 서비스에 등록해주는 회사. 개인은 대부분 이곳을 거친다.", "Distributor"], ["배음", "기음의 정수배로 함께 울리는 음들. 이 구성이 음색을 정한다.", "Harmonics"], ["밸런스드", "같은 신호를 정상과 반전 두 가닥으로 보내 잡음을 상쇄하는 방식. XLR과 TRS가 쓴다.", "Balanced"], ["버스", "여러 트랙이 함께 쓰는 옆길. 센드로 보낸 신호가 모이는 곳.", "Bus"], ["벤딩", "줄을 밀어 음정을 올리는 주법. 피치 벤드로 표현한다.", "Bending"], ["벨", "가운데 주파수를 중심으로 양옆이 함께 움직이는 EQ 밴드 모양. 가장 기본.", "Bell"], ["벨로시티", "건반을 누른 세기. 1~127. 대개 음량과 음색이 함께 바뀐다.", "Velocity"], ["벨로시티 레이어", "세기별로 따로 녹음해 쌓아둔 샘플 층. 많을수록 자연스럽고 용량이 크다.", "Velocity Layer"], ["병렬 컴프레션", "원음은 두고 복사본만 세게 눌러 섞는 방식. 타격과 밀도를 함께 얻는다.", "Parallel Compression"], ["보이스", "한 오선 안의 성부. 기둥 방향으로 위아래를 나눈다.", "Voice"], ["보이싱", "화음의 음을 어느 높이에 어떻게 배치할지.", "Voicing"], ["보컬 촙", "보컬 한 구절을 잘라 건반에 배정해 악기처럼 쓰는 기법.", "Vocal Chop"], ["보코더", "목소리의 발음 정보를 다른 소리에 씌우는 장치. 로직의 EVOC 20 PolySynth.", "Vocoder"], ["부스트 스윕", "좁은 폭으로 크게 올린 채 주파수를 옮겨 문제 대역을 찾는 방법.", "Boost Sweep"], ["분석기", "재생되는 소리의 주파수 분포를 EQ 그래프 위에 겹쳐 보여주는 기능.", "Analyzer"], ["분할 점", "피아노 큰보표에서 위 보표와 아래 보표를 나누는 음.", "Split Point"], ["분할 파일", "좌우가 따로 두 파일인 스테레오. 프로 툴스에 넘길 때만.", "Split Files"], ["붐뱁", "묵직한 킥과 스네어에 8분 하이햇 중심인 힙합 갈래.", "Boom Bap"], ["비트 리덕션", "디지털 해상도를 일부러 낮춰 자글자글한 잡음을 만드는 처리.", "Bit Reduction"], ["비트 심도", "한 조각의 크기를 몇 단계로 나눠 적을지 정하는 값. 작업 기본은 24비트.", "Bit Depth"], ["빗살 무늬 간섭", "같은 소리가 시간 차로 겹칠 때 어떤 높이는 커지고 어떤 높이는 작아지며 골이 규칙적으로 반복되는 현상. 속이 빈 소리가 난다.", "Comb Filtering"], ["사운드 라이브러리", "로직이 들고 있는 패치, Apple Loops, 샘플의 모음. 12부터 단일 번들 파일로 묶였다.", "Sound Library"], ["사이드", "스테레오 한쪽에만 있는 소리. 좌우로 벌린 것들.", "Side"], ["사이드체인", "다른 트랙의 소리를 듣고 반응하게 만드는 입력. 킥에 맞춰 베이스를 덕킹할 때 쓴다.", "Side Chain"], ["사이드체인 필터", "컴프의 사이드체인 입력에 거는 EQ. 컴프가 어느 대역에 반응할지 정한다. 소리는 바뀌지 않는다.", "Side Chain Filter"], ["상대값 스냅", "격자에서 어긋난 정도를 유지한 채 옮기는 스냅 방식.", "Relative Snap"], ["새추레이션", "소리를 살짝 일그러뜨려 배음을 더하는 처리. 두꺼워지고 앞으로 나온 것처럼 들린다.", "Saturation"], ["샘플레이트", "1초를 몇 조각으로 나눠 기록할지 정하는 값. 작업 기본은 48킬로헤르츠.", "Sample Rate"], ["서밍 스택", "여러 트랙의 출력을 하나로 모으는 트랙 스택. 그룹 버스를 만드는 방법.", "Summing Stack"], ["서스테인 페달", "밟는 동안 소리를 이어 주는 페달. 꽂으면 CC64로 잡힌다.", "Sustain Pedal"], ["선형 위상", "대역을 손볼 때 주변 주파수의 도착 시간을 어긋내지 않는 방식. 대신 지연이 생긴다.", "Linear Phase"], ["세션 플레이어", "로직이 대신 연주해 주는 가상 연주자. 드러머와 베이스 플레이어 등이 있다.", "Session Player"], ["센드", "신호를 복사해 옆길로 보내는 방식. 원래 소리는 그대로 간다. 리버브가 여기 속한다.", "Send"], ["센드 버스", "여러 트랙이 같은 이펙트를 공유하도록 신호를 보내는 경로.", "Send Bus"], ["센트", "반음을 100등분한 음정 단위. 7센트는 반음의 14분의 1이라 틀렸다고 느끼지 못하는 폭이다.", "Cent"], ["셀프 서비스 유통", "심사 없이 직접 업로드해 전 세계에 배급하는 방식. DistroKid, TuneCore 등.", "Self-Service Distribution"], ["셸프", "어느 지점부터 그 너머 전체를 올리거나 내리는 EQ 밴드 모양.", "Shelf"], ["소스테누토", "밟는 순간 눌려 있던 음만 유지하는 가운데 페달. CC66.", "Sostenuto"], ["소프트 페달", "해머가 현을 적게 때리게 하는 왼쪽 페달. CC67.", "Soft Pedal"], ["속도 모드", "길이와 음정이 함께 바뀌는 플렉스 모드. 테이프를 빨리 돌리는 효과.", "Speed"], ["솔로", "그 트랙만 남기고 나머지를 모두 끄는 기능.", "Solo"], ["솔로 스트링", "한 명의 현악. 가깝고 감정이 진한 선율용.", "Solo Strings"], ["쇼크 마운트", "마이크를 고무줄로 띄워 바닥 진동이 타고 오르는 것을 끊는 거치대.", "Shock Mount"], ["순간 라우드니스", "지금 이 순간의 라우드니스. 구간별 크기를 볼 때 쓴다.", "Momentary LUFS"], ["숨자리", "관악에서 숨을 쉬는 자리. 프레이즈 끝에 50~100ms 벌린다.", "Breath Mark"], ["스냅", "리전을 옮길 때 붙는 격자 단위. 마디, 비트, 디비전, 틱, 스마트 중에서 고른다.", "Snap"], ["스레숄드", "컴프레서가 누르기 시작하는 레벨.", "Threshold"], ["스마트 템포", "프로젝트와 오디오의 템포 관계를 처리하는 로직의 방식. 유지·조정·자동.", "Smart Tempo"], ["스윙", "짝수 번째 음을 뒤로 미는 비율. 50이 스트레이트, 58~67이 재즈 계열.", "Swing"], ["스케일 퀀타이즈", "스케일에 없는 음을 가장 가까운 스케일 음으로 옮기는 기능.", "Scale Quantize"], ["스코어 세트", "여러 트랙을 한 악보에 모은 묶음. 총보를 만들 때 쓴다.", "Score Set"], ["스크린셋", "창 배치를 숫자 키에 저장해 즉시 불러오는 기능.", "Screenset"], ["스태프 스타일", "오선의 모양. 피아노 큰보표, 드럼 기보 등을 정한다.", "Staff Style"], ["스탭", "짧게 끊어 치는 코드 타격 소리.", "Stab"], ["스템", "트랙별로 따로 뽑은 오디오 파일 묶음.", "Stem"], ["스템 스플리터", "섞인 오디오를 보컬, 드럼, 베이스, 기타, 피아노, 그 외 여섯 갈래로 분리하는 로직 도구. 애플 실리콘 필요.", "Stem Splitter"], ["스프링 리버브", "용수철로 만든 통통 튀는 잔향. 기타 앰프에 내장되어 있다.", "Spring"], ["스피카토", "활을 튕기듯 짧게 연주하는 현악 주법.", "Spiccato"], ["슬라이싱", "타격 지점에서 자른 뒤 조각을 옮기고 원래 속도로 재생하는 플렉스 모드. 드럼용.", "Slicing"], ["슬랩", "엄지로 때리는 섬과 검지로 당기는 팝이 번갈아 나오는 베이스 주법.", "Slap"], ["슬랩백", "60~120ms를 피드백 없이 한 번만 거는 딜레이. 두꺼워진 느낌만 난다.", "Slapback"], ["슬러", "혀를 쓰지 않고 이어 부는 것. 미디에서는 음을 겹친다.", "Slur"], ["슬로프", "하이패스와 로우패스가 얼마나 급하게 자르는지. dB/Oct로 적는다.", "Slope"], ["시김새", "음을 꾸미는 방식. 음원에 미리 들어 있으면 미디로 덜 넣어도 된다.", "Ornamentation"], ["시머 리버브", "잔향에 옥타브 위 음을 섞어 위로 번지게 만든 효과.", "Shimmer"], ["신스 플레이어", "로직 12에서 세션 플레이어에 추가된 가상 연주자. 코드와 신스 베이스 파트를 연주한다.", "Synth Player"], ["싱코페이션", "박을 넘어가는 음을 타이로 쪼개지 않고 한 음표로 그리는 악보 설정.", "Syncopation"], ["아르페지에이터", "누른 코드의 음을 순서대로 연주해주는 미디 이펙트.", "Arpeggiator"], ["아르프 음색", "아르페지오 반복에 맞게 만들어진 짧은 신스 소리.", "Arp"], ["아티스트 프로필", "스트리밍 서비스의 아티스트 페이지. 발매 전에 소유권을 확보해야 발매물이 한곳에 모인다.", "Artist Profile"], ["아티큘레이션", "연주 주법. 레가토, 스타카토, 피치카토, 트레몰로 등.", "Articulation"], ["아티큘레이션 세트", "주법 이름과 키스위치를 표로 묶어 관리하는 로직 기능.", "Articulation Set"], ["악보 편집기", "미디 리전을 오선보로 보여주는 창. N으로 연다.", "Score Editor"], ["알고리즘 리버브", "계산으로 잔향을 만드는 방식. ChromaVerb가 이쪽.", "Algorithmic Reverb"], ["알리아스", "미디 리전의 분신. 원본을 고치면 모두 바뀌지만 위치와 트랙은 따로 둘 수 있다.", "Alias"], ["앙상블 스트링", "여러 명이 함께 켜는 현악. 넓고 매끈한 배경용.", "Ensemble Strings"], ["애드리브", "선율 밖에서 즉흥으로 넣는 짧은 보컬. 코러스가 반복될수록 늘린다.", "Ad-lib"], ["어레인지먼트 마커", "곡 구간에 이름을 붙이는 글로벌 트랙 요소. 드래그하면 구간 전체가 이동한다.", "Arrangement Marker"], ["언밸런스드", "한 가닥으로 보내는 방식. 길게 끌수록 잡음이 는다. TS가 이쪽이다.", "Unbalanced"], ["업보", "활을 위로 긋는 것. 다운보보다 약하다.", "Up-bow"], ["에셋 복사", "프로젝트 저장 시 오디오와 샘플을 폴더 안에 함께 넣는 옵션.", "Copy Assets"], ["에일리어싱", "샘플레이트가 모자라 높은 음이 낮은 음으로 접혀 들어오는 왜곡.", "Aliasing"], ["에코", "반복이 또렷하게 분리되어 들리는 딜레이. 대략 100ms 이상에서 나타난다.", "Echo"], ["엔벨로프", "소리가 시간에 따라 커지고 작아지는 모양. 어택·디케이·서스테인·릴리스로 이루어진다.", "Envelope"], ["오디오", "소리 그 자체를 담은 데이터. 마이크로 녹음한 것과 음원 파일이 여기 속한다.", "Audio"], ["오디오 인터페이스", "컴퓨터와 소리를 주고받는 장치. 마이크를 넣고 스피커로 내보낸다.", "Audio Interface"], ["오디오 테일", "리버브나 딜레이의 꼬리. 포함을 켜야 리전 끝을 넘어 함께 담긴다.", "Audio Tail"], ["오디오 파일 편집기", "원본 파일 자체를 편집하는 창. 되돌릴 수 없다.", "Audio File Editor"], ["오버드라이브", "새추레이션보다 센 왜곡. 살짝 거칠고 두꺼워진다.", "Overdrive"], ["오버로드 보호", "내보내기 노멀라이즈 옵션. 0dB를 넘는 것만 내리고 작은 것은 안 건드린다.", "Overload Protection"], ["오버샘플링", "플러그인 내부에서만 샘플레이트를 올려 에일리어싱을 막는 기능.", "Oversampling"], ["오실레이터", "신스에서 원재료 파형을 만드는 부분. 톱니, 사각, 삼각, 사인, 노이즈.", "Oscillator"], ["오토 게인", "컴프가 누른 만큼 자동으로 음량을 다시 올려 주는 기능. 판단할 때는 끈다.", "Auto Gain"], ["오토메이션", "시간에 따라 값이 변하도록 기록하는 기능. Touch, Latch, Write 모드가 있다.", "Automation"], ["오프 액시스", "마이크의 정면 축에서 비켜난 방향. 살짝 틀어 세우면 파열음이 줄어든다.", "Off-Axis"], ["왕복 지연", "소리가 입력되어 출력되기까지의 전체 지연. 버퍼 설정 아래에 표시된다.", "Roundtrip Latency"], ["워킹 베이스", "4분음표로 걸어가는 재즈 베이스 문법. 근음과 코드 톤과 경과음.", "Walking Bass"], ["원샷", "한 번 울리고 끝나는 샘플. 킥, 클랩, 임팩트 등.", "One-Shot"], ["웨이브테이블", "파형 자체가 시간에 따라 변하는 합성 방식. 현대 일렉트로닉의 중심.", "Wavetable"], ["웻", "처리된 소리. 리버브에서는 잔향만을 뜻한다.", "Wet"], ["위상 잠금 오디오", "그룹 편집에서 한 트랙을 편집하면 나머지가 똑같이 따라오게 하는 설정.", "Phase-Locked Audio"], ["유사한 오브젝트 선택", "같은 음높이나 같은 성격의 이벤트를 한 번에 고르는 명령. 드럼 미디를 부위별로 쪼갤 때 쓴다.", "Select Similar Objects"], ["이벤트 리스트", "미디를 숫자 표로 보는 창. 유령 음을 찾을 때 연다.", "Event List"], ["인서트", "신호가 그 장치를 통과해 지나가는 방식. 원래 소리가 바뀐다. EQ와 컴프레서가 여기 속한다.", "Insert"], ["인스펙터", "지금 선택한 대상의 속성을 보여주는 왼쪽 패널. 선택이 바뀌면 내용이 바뀐다.", "Inspector"], ["일괄 페이더 조절", "여러 트랙을 선택하고 ⌥를 누른 채 하나를 움직여 상대 차이를 지킨 채 함께 조절하는 방법.", "Relative Fader Adjust"], ["임팩트", "한 번 크게 때려 구간 시작을 못 박는 소리. 첫 박에서 시작한다.", "Impact"], ["임펄스 응답", "실제 공간이 짧은 소리에 어떻게 되울리는지 녹음한 것. 컨볼루션의 재료.", "Impulse Response"], ["임피던스", "신호가 흐를 때 받는 저항. 안 맞으면 고역이 빠지고 소리가 얇아진다.", "Impedance"], ["자동 음량 조절", "스트리밍 서비스가 재생 시점에 곡의 라우드니스를 기준으로 맞추는 기능.", "Loudness Normalization"], ["재생 헤드", "지금 어디를 읽고 있는지 알려주는 세로줄.", "Playhead"], ["저역", "낮은 주파수 구간. 킥과 베이스가 사는 자리.", "Low"], ["저작인접권", "창작자가 아닌 실연자와 음반제작자에게 인정되는 권리. 저작권과 별개로 등록한다.", "Neighboring Rights"], ["저지연 모드", "지연이 큰 플러그인을 잠시 우회해 녹음을 편하게 하는 모드.", "Low Latency Mode"], ["정삼각형 배치", "두 스피커와 머리가 정삼각형을 이루는 배치. 좌우 소리가 같은 시간에 도착한다.", "Equilateral Setup"], ["존", "샘플 하나가 놓인 건반 범위와 벨로시티 범위.", "Zone"], ["주파수", "소리가 떨리는 빠르기. 헤르츠로 잰다. 높낮이를 결정한다.", "Frequency"], ["중역", "가운데 주파수 구간. 목소리와 대부분의 악기가 사는 자리.", "Mid"], ["지향성", "마이크가 어느 방향의 소리를 받는지. 카디오이드, 무지향성, 8자 등이 있다.", "Polar Pattern"], ["채널 스트립", "한 트랙의 신호 흐름 전체. 악기, 이펙트, 센드, 팬, 페이더로 이루어진다.", "Channel Strip"], ["챔버 리버브", "울림방을 본뜬 잔향. 룸보다 길고 홀보다 짧다.", "Chamber"], ["체감 속도", "숫자상 템포와 별개로 귀가 느끼는 빠르기. 단위 시간에 일어나는 사건의 수가 정한다.", "Perceived Tempo"], ["체임버 리버브", "실제 울림방에서 소리를 틀고 다시 녹음하던 방식.", "Chamber"], ["초기 반사", "소리가 벽에 부딪혀 처음 돌아오는 것. 이것이 있어야 방 안에 있는 느낌이 난다.", "Early Reflections"], ["최소 무음 길이", "얼마나 오래 조용해야 무음으로 칠지 정하는 값. 짧으면 리전이 잘게 쪼개진다.", "Minimum Time to accept as Silence"], ["카디오이드", "앞의 소리만 받고 뒤를 거의 안 받는 지향성. 홈 레코딩의 기본값.", "Cardioid"], ["카운트인", "녹음이 시작되기 전에 한두 마디를 미리 세어 주는 기능.", "Count-in"], ["캐포", "프렛에 걸어 전체 음을 올리는 도구. 개방현 폼으로 다른 조를 친다.", "Capo"], ["캡처 녹음", "녹음 버튼을 누르지 않고 친 연주를 나중에 가져오는 로직 기능. ⇧R.", "Capture Recording"], ["컨볼루션 리버브", "실제 공간에서 잰 소리를 쓰는 방식. Space Designer가 이쪽.", "Convolution Reverb"], ["컨탁", "샘플 라이브러리를 재생하는 대표적인 샘플러. 그릇이고 라이브러리가 내용물이다.", "Kontakt"], ["컨트롤러 할당", "기기의 노브나 페이더를 로직의 파라미터에 연결하는 것. 학습으로 가르친다.", "Controller Assignments"], ["컴핑", "여러 테이크에서 좋은 구간만 골라 하나로 조립하는 작업.", "Comping"], ["컷오프", "필터가 깎기 시작하는 주파수.", "Cutoff"], ["코드 ID", "오디오나 미디 리전을 코드 트랙으로 끌어 코드를 분석하게 하는 로직 12 기능.", "Chord ID"], ["코러스", "20~30ms 근처의 어긋남을 흔들어 여럿이 함께 연주하는 것처럼 만드는 효과. 두꺼워지고 퍼진다.", "Chorus"], ["코렐레이션 미터", "좌우 신호의 위상 관계를 보여주는 미터. +1은 모노, -1은 상쇄.", "Correlation Meter"], ["콘덴서 마이크", "얇은 막의 떨림으로 소리를 받는 마이크. 섬세하지만 팬텀 파워가 필요하다. 스튜디오 보컬의 기본.", "Condenser Mic"], ["콰이어", "다수의 목소리가 합쳐진 지속음이라 장엄하게 들린다. 큰 편성의 화성을 만들며 종교적·서사적 장면의 관습적 재료.", "Choir"], ["퀀타이즈", "음을 격자에 붙이는 기능. 강도 값으로 붙이는 정도를 조절한다.", "Quantize"], ["크로스페이드", "겹친 두 리전이 교차하며 이음매를 감추는 페이드.", "Crossfade"], ["클라비넷", "타악기 성격의 건반. 펑크 리듬의 재료.", "Clavinet"], ["클리퍼", "파형의 꼭대기를 잘라 내는 처리. 타격이 유지되면서 피크만 사라진다.", "Clipper"], ["클리핑", "소리가 최대치를 넘어 깨지는 현상. 되돌릴 수 없다.", "Clipping"], ["클릭 영역", "리전의 특정 위치에서 포인터가 자동으로 다른 도구로 바뀌는 설정.", "Click Zone"], ["클립 게인", "리전 자체의 음량. 게인 도구로 조절하며 파형 그림이 함께 변한다. 이펙트보다 앞이다.", "Clip Gain"], ["키 명령 세트", "단축키 설정 전체를 담은 파일. 동작 버튼의 별도 저장으로 내보내고 가져올 수 있다.", "Key Command Set"], ["키스위치", "연주에 쓰지 않는 낮은 건반으로 주법을 전환하는 방식.", "Key Switch"], ["킬로헤르츠", "헤르츠의 1000배. 2킬로헤르츠는 2000헤르츠다.", "kHz"], ["텅잉", "관악기에서 혀로 음을 끊어 내는 것. 이으면 슬러, 떼면 텅잉.", "Tonguing"], ["테이크 폴더", "사이클 녹음으로 쌓인 여러 테이크를 담은 리전.", "Take Folder"], ["템포", "1분에 박이 몇 개 지나가는지. 단위는 BPM.", "Tempo"], ["템포 동기", "LFO나 딜레이의 속도를 곡 템포의 음표 단위로 맞추는 것.", "Tempo Sync"], ["통합 라우드니스", "재생 시작 시점부터 누적해 평균 낸 값. 잴 때마다 초기화하고 곡 전체를 재생해야 정확하다.", "Integrated LUFS"], ["트랙", "화면의 가로줄 하나. 악기 하나가 한 줄을 쓴다.", "Track"], ["트랙 그룹", "여러 트랙의 조작을 함께 하는 묶음. 소리는 모으지 않는다.", "Track Group"], ["트랙 대안", "한 트랙 안에 여러 버전을 두고 오가는 기능.", "Track Alternatives"], ["트랙 비활성화", "트랙을 남겨 두되 재생과 자원 소모를 멈추는 것.", "Track Disable"], ["트랙 인스펙터", "트랙 전체에 적용되는 설정. 트랜스포즈·벨로시티·키 리밋·노 트랜스포즈.", "Track Inspector"], ["트랙 지연", "트랙 전체의 재생 시점을 앞뒤로 미는 값. 레가토 샘플 보정에 쓴다.", "Track Delay"], ["트랙 헤더", "트랙 왼쪽의 이름과 버튼이 모인 부분.", "Track Header"], ["트랜지언트 셰이퍼", "소리의 앞부분과 뒷부분을 레벨과 무관하게 따로 조절하는 도구. 로직의 Transient Designer.", "Transient Shaper"], ["트랩", "32분 하이햇 연타와 808 베이스가 특징인 힙합 갈래.", "Trap"], ["트루 피크", "디지털을 아날로그로 변환할 때 생기는 실제 최대값. -1dBTP로 여유를 둔다.", "True Peak"], ["틴 일렉트릭 피아노", "금속 막대를 때리는 건반. 어택이 둥글어 부드럽게 들린다. 알앤비와 발라드의 기본 재료.", "Tine EP"], ["파워 코드", "근음과 5음만 쓰는 코드. 3음이 없어 왜곡에서 뭉개지지 않는다.", "Power Chord"], ["팜뮤트", "오른손 손날로 줄을 눌러 짧고 답답하게 치는 주법.", "Palm Mute"], ["팝 필터", "입과 마이크 사이에 세우는 망. 파열음의 바람이 마이크를 때리는 것을 막는다.", "Pop Filter"], ["패드", "뒤에 깔리는 지속음 계열. 어택이 느리고 릴리스가 길다. 검색어는 Pad.", "Pad"], ["패치", "악기와 이펙트, 볼륨까지 포함한 채널 스트립 전체 설정. 라이브러리에서 고른다.", "Patch"], ["팬", "소리를 왼쪽이나 오른쪽으로 보내는 조절기.", "Pan"], ["팬 로우", "팬을 한쪽으로 돌릴 때 줄어드는 음량을 보정하는 규칙.", "Pan Law"], ["팬텀 파워", "콘덴서 마이크에 XLR 케이블로 공급하는 48V 전원.", "Phantom Power"], ["퍼지", "연주에 쓰이지 않는 샘플을 메모리에서 걷어내는 기능.", "Purge"], ["퍼커시브", "모노포닉의 하위 항목. 뜯는 악기에는 켜고 활로 긋는 악기에는 끈다.", "Percussive"], ["페이더", "소리 크기를 조절하는 세로 막대.", "Fader"], ["페이드", "리전 시작이나 끝에서 소리가 서서히 커지거나 작아지는 것. 클릭 제거와 연출 두 용도.", "Fade"], ["페이저", "지연 없이 특정 높이의 위상만 돌려 물결이 지나가는 듯한 움직임을 만드는 효과.", "Phaser"], ["평균 레벨", "소리가 대체로 머무는 높이. RMS로 표시한다. 기준은 -18dBFS.", "RMS"], ["포먼트", "목과 입이 만드는 공명의 모양. 음정과 따로 움직이면 목소리의 성격만 바뀐다.", "Formant"], ["포스 레가토", "각 음을 다음 음이 시작할 때까지 늘려 빈틈을 없애는 명령. F2.", "Force Legato"], ["포스트 릴리즈 타임", "리전의 뒤쪽을 늘려 잔향이 뚝 끊기는 것을 막는 값.", "Post Release-Time"], ["포스트 팬 센드", "페이더와 팬을 모두 지난 뒤 갈라지는 기본 센드 방식.", "Post Pan Send"], ["포스트 페이더 센드", "페이더는 지나되 팬 앞에서 갈라지는 센드. 음량만 반영되고 좌우는 반영되지 않는다.", "Post-Fader Send"], ["폴더 스택", "화면만 접는 스택. 소리는 합쳐지지 않고 메인 페이더는 VCA로 동작한다.", "Folder Stack"], ["폴리포닉", "위상 정보를 이용해 음정을 건드리지 않고 늘이는 플렉스 모드. 코드가 있는 소재용.", "Polyphonic"], ["풀오프", "손가락을 떼며 낮은 음을 내는 주법.", "Pull-off"], ["프레즌스", "10kHz 부근을 살짝 올려 소리가 앞으로 나오게 하는 처리.", "Presence"], ["프렛 노이즈", "손가락이 줄 위를 미끄러질 때 나는 소리.", "Fret Noise"], ["프로젝트 대안", "프로젝트 전체를 여러 버전으로 두는 기능. 오디오는 공유한다.", "Project Alternatives"], ["프리 딜레이", "원음이 울린 뒤 잔향이 시작되기까지의 시간. 20~40ms면 명료도가 유지된다.", "Pre-Delay"], ["프리 어택 타임", "무음 제거로 잘린 리전의 앞쪽을 늘려 주는 값. 보컬처럼 서서히 커지는 소리에 필요하다.", "Pre Attack-Time"], ["프리 페이더 센드", "페이더와 팬을 지나기 전에 갈라지는 센드. 페이더를 내려도 보내는 양이 그대로다.", "Pre-Fader Send"], ["프리로드 버퍼", "각 샘플의 앞부분을 미리 메모리에 올려두는 양. 디스크가 느리면 키운다.", "Preload Buffer"], ["프리셋", "플러그인 하나의 설정값. 채널 스트립 전체를 담는 패치와 구분한다.", "Preset"], ["프리앰프", "마이크의 작은 신호를 쓸 수 있는 크기로 키우는 증폭기. 인터페이스에 내장되어 있다.", "Preamp"], ["프리즈", "트랙을 임시로 오디오화해 자원을 아끼는 기능. 언제든 해제할 수 있다.", "Freeze"], ["플랜저", "1~10ms의 짧은 어긋남을 흔들어 비행기가 지나가는 듯한 쏴아 소리를 만드는 효과.", "Flanger"], ["플러그인", "DAW 안에 끼워 쓰는 작은 프로그램. 소리를 만드는 악기용과 소리를 바꾸는 이펙트용이 있다.", "Plug-in"], ["플러그인 검증", "로직이 새 플러그인을 검사해 쓸 수 있는지 판단하는 과정. 실패하면 목록에 안 뜬다.", "Plug-in Validation"], ["플러그인 지연 보상", "플러그인마다 다른 처리 지연을 로직이 계산해 트랙 간 어긋남을 맞추는 기능.", "Plug-in Latency Compensation"], ["플럭", "짧게 튕기는 신스 소리. 어택이 즉각적이고 꼬리가 짧다.", "Pluck"], ["플레이트 리버브", "금속판의 떨림으로 만든 매끈하고 밝은 잔향. 보컬과 스네어에 쓴다.", "Plate"], ["플렉스 마커", "플렉스에서 타격 지점을 잡아 끄는 표시. 하나만 끌어도 그 지점이 옮겨진다.", "Flex Marker"], ["플렉스 타임", "오디오의 타이밍을 늘이고 줄이는 기능. 모노포닉, 폴리포닉, 슬라이싱 모드.", "Flex Time"], ["플렉스 피치", "오디오의 음정을 고치는 기능.", "Flex Pitch"], ["피드백", "딜레이에서 나온 소리를 다시 입력으로 되돌려 반복을 잇는 양.", "Feedback"], ["피치 벤드", "음정을 위아래로 부드럽게 구부리는 휠. 건반 왼쪽에 있다.", "Pitch Bend"], ["피치 보정", "플렉스 피치에서 모든 음을 정확한 음에 가깝게 당기는 비율. 50~70이 자연스럽다.", "Pitch Correction"], ["피크 레벨", "순간적으로 튀는 꼭대기 값. 로직 채널 미터가 보여주는 것.", "Peak"], ["필터 스윕", "전체에 로우패스를 걸어 닫았다가 첫 박에 여는 연출. EDM과 팝에서 많이 쓴다.", "Filter Sweep"], ["필터 엔벨로프", "필터 컷오프를 시간에 따라 움직이는 엔벨로프. 뜯는 악기 느낌을 만든다.", "Filter Envelope"], ["필터 컷오프", "필터가 깎기 시작하는 주파수. 신스에서 음색의 밝기를 정한다.", "Filter Cutoff"], ["핑퐁 딜레이", "반복이 좌우를 번갈아 오가는 딜레이.", "Ping-Pong Delay"], ["하모나이저", "부른 음정을 읽어 화음을 자동 생성하는 처리. 사람 목소리 겹의 두께는 안 나온다.", "Harmonizer"], ["하모니", "리드와 다른 음을 부르는 화성 층. 3도 위가 기본.", "Harmony"], ["하모닉스", "줄을 살짝 대고 뜯어 맑은 고음을 내는 주법.", "Harmonics"], ["하스 효과", "한쪽을 10~30ms 늦춰 폭을 만드는 방법. 먼저 도착한 쪽에서 소리가 오는 것처럼 들린다. 모노에서는 빗살 무늬가 생긴다.", "Haas Effect"], ["하울링", "스피커 소리가 마이크로 되돌아 들어가며 커지는 삑 소리. 녹음은 헤드폰으로 모니터링한다.", "Feedback"], ["하이패스 필터", "지정 주파수 아래를 깎는 필터. 거의 모든 트랙에 건다.", "High-Pass Filter"], ["하프 페달", "서스테인을 반만 밟아 잔향을 짧게 하는 것. CC64 40~80.", "Half Pedal"], ["학습", "할당을 만드는 방법. 학습을 켜고 기기의 조작부 하나를 움직이면 연결된다.", "Learn"], ["한 박 비우기", "코러스 직전 한 박을 모든 악기에서 비워 코러스를 크게 만드는 연출.", "Drop-out"], ["한국음악실연자연합회", "연주와 노래에 대한 실연자 권리를 관리하는 단체.", "FKMP"], ["한국음악저작권협회", "작사·작곡·편곡의 저작권료를 관리하는 단체.", "KOMCA"], ["해머 터치", "피아노처럼 무게가 실린 건반 감촉. 가벼운 쪽은 신스 터치라고 부른다.", "Hammer Action"], ["해머온", "줄을 뜯지 않고 손가락으로 때려 높은 음을 내는 주법.", "Hammer-on"], ["해석", "음 길이를 다음 음까지 자동으로 이어 그리는 악보 설정. 쉼표가 사라진다.", "Interpretation"], ["헤드룸", "지금 소리와 최대치 사이에 남은 여유.", "Headroom"], ["헤드룸 확보", "마스터에 여유를 되찾는 일. 저역 정리 → 겹침 정리 → 전체 함께 내리기 순서로 한다.", "Headroom"], ["헤르츠", "소리의 높낮이를 재는 단위. 1초에 공기가 몇 번 떨리는지를 센 숫자다. 많이 떨리면 높은 소리.", "Hz"], ["홀 리버브", "콘서트홀을 흉내 낸 길고 넓은 잔향.", "Hall"], ["홀드", "게이트에서 문이 열린 뒤 최소한 유지하는 시간.", "Hold"], ["후기 잔향", "초기 반사 뒤에 이어지는 수많은 반사의 덩어리. 흔히 리버브라고 부르는 부분.", "Late Reverb"], ["휴머나이즈", "선택한 음의 벨로시티와 타이밍을 정한 폭 안에서 무작위로 흔드는 기능.", "Humanize"], ["히스테리시스", "게이트의 여는 기준과 닫는 기준의 차이. 덜덜거림을 막는다.", "Hysteresis"]];

만들되 곡을 흐리지 않는다.", "m": "70퍼센트를 넘기면 소리가 스스로 쌓여 무한히 늘어난다.", "d": [93]}, {"g": "레벨", "v": "-9~-6LUFS", "w": "클럽·EDM 관행", "f": "자동 음량 조절이 없는 환경에서 큰 에너지를 유지한다.", "m": "스트리밍에 올리면 기준까지 깎여 다이내믹만 잃는다.", "d": [103]}, {"g": "레벨", "v": "-23~-18LUFS", "w": "클래식·오케스트라 관행", "f": "여린 부분과 큰 부분의 차이가 그대로 살아 있다.", "m": "대중음악과 나란히 재생하면 상대적으로 작게 들린다.", "d": [103]}, {"g": "다이내믹", "v": "20~30%", "w": "병렬 컴프 혼합량", "f": "원음의 표정은 그대로고 여린 부분만 끌어올려져 밀도가 생긴다.", "m": "50퍼센트를 넘기면 눌린 소리가 주가 되어 다이내믹이 사라진다.", "d": [68]}, {"g": "주파수", "v": "±10~30도", "w": "좁은 패닝", "f": "중심을 도우면서 폭을 조금 넓힌다. 백보컬, 톰, 오버헤드의 자리.", "m": "더 벌리면 중심의 지지가 약해진다.", "d": [88]}, {"g": "주파수", "v": "±30~70도", "w": "넓은 패닝", "f": "배경을 채우는 층의 자리. 기타, 건반, 패드가 좌우를 메운다.", "m": "이 범위 안이면 모노에서도 대체로 버틴다.", "d": [88]}, {"g": "주파수", "v": "±70~100도", "w": "극단 패닝", "f": "사라져도 곡이 유지되는 요소만 여기 둔다. 효과음과 라이저.", "m": "중요한 소리를 두면 모노나 한쪽 스피커 환경에서 곡이 무너진다.", "d": [88]}, {"g": "레벨", "v": "컷 -4 · 부스트 +3", "w": "EQ 최종 조정 폭", "f": "깎기는 문제를 덜어내는 일이라 -4dB까지 자연스럽고, 올리기는 없던 것을 더하는 일이라 +3dB 안에서 끝낸다.", "m": "이 폭을 넘겨 남기면 악기가 다른 소리로 바뀐다. 찾을 때는 크게 올려도 된다.", "d": [95, 79]}, {"g": "주파수", "v": "400~800Hz", "w": "상자 속 소리", "f": "이 대역이 과하면 소리가 작은 상자 안에 갇힌 듯 갑갑해진다.", "m": "깎으면 뚫리지만 과하면 악기의 몸통까지 사라진다. 스네어에서는 이 자리가 몸통이다.", "d": [79]}, {"g": "주파수", "v": "1~2kHz", "w": "코맹맹이 소리", "f": "코를 막고 말하는 듯한 느낌. 여기가 튀면 소리가 앞으로 나오면서도 거슬린다.", "m": "보컬에서는 명료도를 담당하는 자리이기도 해서 무작정 깎으면 말이 흐려진다.", "d": [79]}, {"g": "주파수", "v": "10kHz 이상", "w": "히스 잡음", "f": "녹음에 섞인 지직거리는 잡음이 사는 자리. 로우패스로 정리한다.", "m": "과하게 깎으면 공기감이 함께 사라져 소리가 답답해진다.", "d": [79]}, {"g": "템포", "v": "80~95", "w": "힙합", "f": "느린 박 위에 16분 하이햇이 촘촘히 깔려 여유와 밀도가 동시에 생긴다.", "m": "표기를 두 배인 160~190으로 적기도 하는데 들리는 속도는 같다.", "d": [54]}, {"g": "템포", "v": "70~90", "w": "로파이", "f": "느긋하게 끌리는 속도. 재즈 화성과 잡음이 얹히면 배경 음악의 성격이 된다.", "m": "100을 넘으면 로파이 특유의 늘어짐이 사라진다.", "d": [54]}, {"g": "레벨", "v": "-3~-6dB", "w": "더블 음량", "f": "리드 아래에서 두께만 더한다. 따로 들리지 않고 리드가 굵어진 것처럼 느껴진다.", "m": "올리면 두 사람이 부르는 것으로 들려 리드의 초점이 흐려진다.", "d": [53]}, {"g": "레벨", "v": "-6~-10dB", "w": "하모니 음량", "f": "있는지 없는지 애매한 정도. 코러스가 넓어지되 선율은 리드가 끈다.", "m": "또렷하게 들리면 이미 과하다. 리드와 경쟁하기 시작한다.", "d": [53]}, {"g": "레벨", "v": "32비트 부동소수점", "w": "녹음 비트 심도 선택", "f": "녹음 중 클리핑이 나도 클립 게인을 내려 되살릴 수 있다. 작게 녹음한 것을 올려도 잡음이 함께 커지지 않는다.", "m": "파일 용량이 24비트보다 약 33퍼센트 커진다. 인터페이스가 지원해야 의미가 있다.", "d": [77]}, {"g": "다이내믹", "v": "6~12dB", "w": "하우스·EDM 사이드체인", "f": "패드와 코드 전체가 킥에 맞춰 크게 오르내린다. 그 출렁임이 곡의 리듬이 된다.", "m": "팝이나 발라드에 이 정도로 걸면 곡 전체가 멀미하듯 출렁인다.", "d": [87]}, {"g": "시간", "v": "50~120ms", "w": "트랩 808 릴리스", "f": "킥이 칠 때만 잠깐 비키고 808의 긴 울림은 그대로 남는다.", "m": "길면 808이 계속 눌려 저역의 두께가 사라진다.", "d": [87]}, {"g": "시간", "v": "200~400ms", "w": "보컬 덕킹 릴리스", "f": "노래하는 동안 배경이 물러나고 쉬는 자리에서 잔향이 살아난다.", "m": "짧으면 단어마다 출렁여서 오히려 산만해진다.", "d": [87]}, {"g": "주파수", "v": "100Hz", "w": "사이드체인 필터 하이패스", "f": "컴프가 킥의 저역 대신 타격의 중역에 반응한다. 눌리는 양이 일정해진다.", "m": "소리 자체는 바뀌지 않는다. 컴프가 무엇을 들을지만 정한다.", "d": [87]}, {"g": "다이내믹", "v": "+3~+8", "w": "트랜지언트 어택", "f": "타격이 앞으로 튀어나온다. 킥과 스네어의 존재감이 커진다.", "m": "극단으로 돌리면 소리가 부자연스럽게 찢어진다.", "d": [81]}, {"g": "주파수", "v": "120Hz", "w": "사이드 하이패스", "f": "저역만 가운데로 모인다. 위쪽 폭은 그대로 두고 저역만 단단해진다.", "m": "이 값을 높이면 넓이가 함께 사라져 믹스가 좁아진다.", "d": [95]}, {"g": "레벨", "v": "76~85dB SPL", "w": "믹싱 청취 음량", "f": "귀의 감도가 평평해 저역과 고역이 실제 비율로 들린다.", "m": "넘겨서 오래 들으면 청력에 무리가 가고 판단력이 먼저 흐려진다.", "d": [72]}, {"g": "시간", "v": "375ms", "w": "120BPM 점8분음표 딜레이", "f": "반복이 박과 어긋난 자리에 떨어져 원래 리듬과 겹치지 않고 사이를 메운다. 넓게 들린다.", "m": "4분음표(500ms)로 두면 박 위에 정확히 떨어져 리듬이 두꺼워진다.", "d": [93]}, {"g": "시간", "v": "2~4마디", "w": "라이저 길이", "f": "긴장이 차오를 시간이 생기면서 지루해지지는 않는다.", "m": "8마디를 넘기면 도착하기 전에 귀가 익숙해져 효과가 사라진다.", "d": [55]}, {"g": "레벨", "v": "가장 뒤", "w": "전환 효과 음량", "f": "있는 줄 모르게 깔려서 구간이 자연스럽게 이어진다.", "m": "크게 넣으면 그 순간만 튀어서 오히려 흐름이 끊긴다.", "d": [55]}, {"g": "레벨", "v": "-20~-12dB", "w": "리버브 센드 양", "f": "껐을 때 소리가 갑자기 마르는 정도. 잔향이 따로 들리지는 않는다.", "m": "올리면 잔향이 또렷해지면서 악기가 뒤로 물러나고 명료도가 떨어진다.", "d": [91]}, {"g": "레벨", "v": "코러스 -11LUFS", "w": "통합 -14인 곡의 코러스", "f": "통합은 전체 평균이라 조용한 구간이 값을 내린다. 코러스는 통합보다 3dB 정도 높게 나온다.", "m": "코러스만 재생해 -14가 나왔다면 그 곡의 통합은 -17 근처일 수 있다.", "d": [103]}, {"g": "레벨", "v": "게인 3dB → 1.5~2dB", "w": "리미터 게인 대비 상승폭", "f": "올린 만큼 리미터가 눌러 되돌리므로 라우드니스는 절반 정도만 오른다.", "m": "목표까지 2dB 남았다면 게인은 3~4dB 올려야 한다는 뜻이다.", "d": [103]}, {"g": "레벨", "v": "-45dB", "w": "무음 제거 스레숄드", "f": "방 소리보다 조금 위. 노래하지 않는 구간만 골라낸다.", "m": "높이면 여린 어미까지 잘리고, 낮추면 방 소리가 남는다.", "d": [68]}, {"g": "시간", "v": "0.2~0.5초", "w": "최소 무음 길이", "f": "숨 쉬는 사이는 넘어가고 진짜 빈 구간만 잘린다.", "m": "짧게 잡으면 리전이 수십 개로 쪼개진다.", "d": [68]}, {"g": "연주", "v": "1/16 · 80% · 50", "w": "퀀타이즈 기본 설정", "f": "대부분의 연주에 무난하다. Q를 눌렀을 때 이 값이 적용된다.", "m": "성긴 연주에 촘촘한 격자를 걸면 어긋난 음이 엉뚱한 박으로 끌려간다.", "d": [29]}, {"g": "연주", "v": "CC1 40~110", "w": "모듈레이션 실전 범위", "f": "음색이 닫힌 상태와 완전히 열린 상태 사이를 오간다. 양 끝을 남겨 두면 나중에 손볼 여지가 있다.", "m": "0은 소리가 사라지고 127은 더 올릴 곳이 없다.", "d": [31]}, {"g": "연주", "v": "CC11 60~110", "w": "익스프레션 실전 범위", "f": "연주 표현으로 쓸 수 있는 음량 폭. 아래로 내려가면 소리가 너무 작아진다.", "m": "믹스 음량은 페이더로 잡는다. CC11로 해결하려 들면 표현할 폭이 사라진다.", "d": [31]}, {"g": "연주", "v": "1/16 · 2옥타브 · 50%", "w": "아르페지에이터 기본값", "f": "대부분의 곡에 무난하다. 또박또박 끊기는 신스 시퀀스가 나온다.", "m": "Note Length를 90으로 올리면 이어져 흐르는 패드 아르페지오가 된다.", "d": [34]}, {"g": "시간", "v": "40~80ms", "w": "레가토 주법 지연", "f": "활을 긋기 시작해 소리가 자리 잡기까지의 시간. 그대로 두면 박보다 늦게 들린다.", "m": "스타카토는 거의 즉시 나오므로 같은 보정을 걸면 오히려 빨라진다.", "d": [32]}, {"g": "레벨", "v": "최대 8개", "w": "채널당 센드 수", "f": "한 트랙에서 여덟 곳까지 동시에 보낼 수 있다. 짧은 공간, 긴 공간, 딜레이를 함께 써도 여유가 있다.", "m": "많이 쓸수록 어디로 가는지 추적이 어려워진다. ⇧클릭으로 목적지를 확인한다.", "d": [91]}, {"g": "시간", "v": "10ms", "w": "체감 가능한 지연 경계", "f": "이 아래면 연주하면서 어긋남을 느끼지 않는다. 왕복 지연 표시로 확인한다.", "m": "넘으면 건반을 누른 뒤 소리가 늦게 오는 것이 느껴져 연주가 흐트러진다.", "d": [64]}, {"g": "주파수", "v": "300~3000Hz", "w": "전화기 대역", "f": "이 밖을 잘라내면 작은 스피커에서 나오는 소리가 된다. 인트로에 쓰고 코러스에서 풀면 대비가 커진다.", "m": "라디오 느낌은 200Hz에서 5kHz로 조금 넓게 잡는다.", "d": [98]}, {"g": "연주", "v": "±2", "w": "포먼트 이동량", "f": "같은 사람이 부른 것이 다른 사람처럼 들리기 시작하는 폭. 백보컬을 리드와 구분할 때 쓴다.", "m": "더 움직이면 목소리가 아니라 효과음으로 들린다.", "d": [98]}, {"g": "레벨", "v": "-3~-6dB", "w": "뒤로 보낼 때 음량", "f": "리버브와 고역 감소를 함께 하면 거리가 생긴다.", "m": "음량만 줄이면 그냥 작아질 뿐 뒤로 가지 않는다.", "d": [89]}, {"g": "시간", "v": "10~30ms", "w": "하스 효과 지연", "f": "두 소리로 들리지 않으면서 폭이 크게 열린다. 먼저 도착한 쪽에서 오는 것처럼 들린다.", "m": "모노로 합치면 속이 빈 소리가 된다. 곡의 뼈대에는 쓰지 않는다.", "d": [97]}, {"g": "연주", "v": "±5~10센트", "w": "미세 음정 차이", "f": "여러 사람이 같은 선율을 부를 때처럼 두꺼워지고 넓어진다. 티가 안 난다.", "m": "20센트를 넘기면 음정이 틀린 것으로 들린다.", "d": [97]}, {"g": "시간", "v": "1~10ms", "w": "플랜저 지연", "f": "비행기가 머리 위를 지나가는 듯한 쏴아 소리. 티가 확실히 나서 구간 표시에 쓴다.", "m": "20~30ms로 늘리면 훑는 느낌이 사라지고 여럿이 연주하는 코러스가 된다.", "d": [97]}, {"g": "주파수", "v": "L45 · R45", "w": "마스킹 회피 팬", "f": "같은 대역의 두 악기가 서로 덜 가린다. EQ를 손대지 않고도 둘 다 들린다.", "m": "이보다 크게 벌리면 한쪽에서만 듣는 환경에서 한 악기가 사라진다.", "d": [88]}, {"g": "레벨", "v": "-6dB 일괄", "w": "헤드룸 되찾기", "f": "모든 트랙을 함께 내리면 균형은 그대로고 마스터 여유만 생긴다. 악기를 더 넣을 자리까지 남는다.", "m": "마스터 페이더로 내리면 각 트랙이 뜨거운 채로 남아 플러그인이 설계 레벨 밖에서 동작한다.", "d": [78]}, {"g": "레벨", "v": "±6dB", "w": "클립 게인 조정 폭", "f": "이 안에서 끝나면 녹음이 적정했다는 뜻이다. 잡음이 드러나지 않고 여유도 남는다.", "m": "더 올려야 하면 녹음이 작았던 것이라 잡음까지 커지고, 더 내려야 하면 이미 클리핑이 났을 수 있다.", "d": [76]}, {"g": "레벨", "v": "편차 절반", "w": "구간 편차 정리량", "f": "8dB 차이를 4dB로 줄여 놓으면 컴프가 표정만 다듬는 일을 하게 된다.", "m": "완전히 평평하게 만들면 코러스가 열리는 느낌이 사라진다. 컴프가 할 일까지 여기서 해버리는 셈이다.", "d": [76]}, {"g": "주파수", "v": "12 · 24dB/Oct", "w": "하이패스 슬로프", "f": "12는 완만해 자른 자리가 티 나지 않고, 24는 급해 확실히 잘린다.", "m": "같은 100Hz라도 슬로프에 따라 결과가 다르다. 24는 자른 경계가 들리기도 한다.", "d": [79]}, {"g": "주파수", "v": "Q 3~6", "w": "컷 밴드 폭", "f": "거슬리는 지점만 정확히 덜어내고 주변은 건드리지 않는다.", "m": "넓게 깎으면 문제 대역과 함께 악기의 몸통까지 사라진다.", "d": [79]}, {"g": "주파수", "v": "Q 0.7~1", "w": "부스트 밴드 폭", "f": "넓게 올려야 원래 그런 소리였던 것처럼 자연스럽다.", "m": "좁게 올리면 그 지점만 튀어 부자연스럽고 귀에 거슬린다.", "d": [79]}, {"g": "시간", "v": "7일 · 3주", "w": "발매 전 일정", "f": "플레이리스트 소개는 발매 7일 전까지, 배급사 업로드는 3주 전까지. 역산해서 마스터 완성일을 정한다.", "m": "촉박하면 소개 기회를 놓치고 일부 서비스에만 뜨거나 발매가 밀린다.", "d": [110]}, {"g": "주파수", "v": "20~20000Hz", "w": "사람이 듣는 범위", "f": "아래는 몸으로만 느껴지고 위는 나이가 들수록 먼저 사라진다.", "m": "20Hz 아래는 스피커가 재생을 못 하고 헤드룸만 잡아먹는다.", "d": [1]}, {"g": "주파수", "v": "60Hz", "w": "킥 var SK="logicTrainer.v1";
function load(){try{if(HAS_LS){var r=localStorage.getItem(SK);return r?JSON.parse(r):null;}return MEM[SK]||null;}catch(e){return null;}}
function save(){try{if(HAS_LS)localStorage.setItem(SK,JSON.stringify(S));else MEM[SK]=JSON.parse(JSON.stringify(S));}catch(e){}}
var S=load()||{cur:1,chk:{},quiz:{},dates:{}};
if(!S.chk)S.chk={};if(!S.quiz)S.quiz={};if(!S.dates)S.dates={};if(!S.cur)S.cur=1;

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function stamp(){S.dates[today()]=1;save();}
function streak(){
  var n=0,d=new Date();
  function key(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
  if(!S.dates[key(d)]){d.setDate(d.getDate()-1);if(!S.dates[key(d)])return 0;}
  while(S.dates[key(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function dayDone(n){var day=DAYS[n-1];if(!day)return false;var c=S.chk[n]||[];
  for(var i=0;i<day.chk.length;i++)if(!c[i])return false;return true;}
function totalDone(){var n=0;for(var i=1;i<=DAYS.length;i++)if(dayDone(i))n++;return n;}
function firstOpen(){for(var i=1;i<=DAYS.length;i++)if(!dayDone(i))return i;return DAYS.length;}

/* ─── 용어 엔진 ─── */
var GMAP={},EMAP={};
for(var gi=0;gi<GLOSS.length;gi++){GMAP[GLOSS[gi][0]]=GLOSS[gi][1];if(GLOSS[gi][2])EMAP[GLOSS[gi][0]]=GLOSS[gi][2];}
function engTag(w){return EMAP[w]?'<span class="eng">'+EMAP[w]+'</span>':'';}
var TERMS=GLOSS.map(function(g){return g[0];}).filter(function(w){return w.length>=2;})
               .sort(function(a,b){return b.length-a.length;});
function dayText(d){
  var a=[d.t,d.goal].concat(d.con);
  for(var i=0;i<d.path.length;i++)a.push(d.path[i].n+" "+d.path[i].s.join(" "));
  return a.concat(d.drill).concat(d.chk).join(" ");
}
var NEWT=(function(){
  var seen={},out=[];
  for(var i=0;i<DAYS.length;i++){
    var t=dayText(DAYS[i]),list=[];
    for(var j=0;j<TERMS.length;j++){
      var w=TERMS[j],pos=t.indexOf(w);
      if(pos>=0&&!seen[w]){list.push([w,pos]);seen[w]=1;}
    }
    list.sort(function(a,b){return a[1]-b[1];});
    out.push(list.map(function(x){return x[0];}));
  }
  return out;
})();
/* 렌더된 카드 안에서 용어 첫 등장에 표시를 붙인다 */
function markTerms(root,used){
  var skip={K:1,V:1,T:1,BUTTON:1,INPUT:1};
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  var nodes=[],n;
  while((n=walker.nextNode()))if(!skip[n.parentNode.nodeName])nodes.push(n);
  for(var i=0;i<nodes.length;i++){
    var node=nodes[i];
    for(var j=0;j<TERMS.length;j++){
      var w=TERMS[j];if(used[w])continue;
      var txt=node.nodeValue,at=txt.indexOf(w);
      if(at<0)continue;
      used[w]=1;
      var after=node.splitText(at),rest=after.splitText(w.length);
      var el=document.createElement("t");el.dataset.w=w;el.textContent=w;
      after.parentNode.replaceChild(el,after);
      node=rest;
    }
  }
}
function openTerm(w){
  document.getElementById("sw").innerHTML=w+engTag(w);
  document.getElementById("sd").textContent=GMAP[w]||"";
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeTerm(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.getElementById("scrim").addEventListener("click",closeTerm);
document.getElementById("sx").addEventListener("click",closeTerm);
document.addEventListener("click",function(e){
  var t=e.target.closest("t");if(t&&t.dataset.w)openTerm(t.dataset.w);
});

/* ─── 글자 크기 ─── */
function applyFs(){
  document.body.className=S.fs?("fs"+S.fs):"";
  document.getElementById("fsb").textContent=["가","가+","가++"][S.fs||0];
}
document.getElementById("fsb").addEventListener("click",function(){
  S.fs=((S.fs||0)+1)%3;save();applyFs();
});

/* ─── 새로고침 ─── */
document.getElementById("rfb").addEventListener("click",function(){
  var b=this;
  b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");
  save();
  var fresh=load();
  if(fresh){S=fresh;if(!S.chk)S.chk={};if(!S.quiz)S.quiz={};if(!S.dates)S.dates={};if(!S.cur)S.cur=1;}
  applyFs();today_();course();keys();gloss();num();prog();header();
  window.scrollTo({top:0,behavior:"smooth"});
});

/* ─── 헤더 ─── */
function header(){
  var done=totalDone(),pct=Math.round(done/DAYS.length*100),day=DAYS[S.cur-1];
  document.getElementById("lDay").textContent=String(S.cur).padStart(2,"0");
  document.getElementById("lPct").textContent=pct+"%";
  document.getElementById("lStk").textContent=streak();
  document.getElementById("lStg").textContent=day.s+"/"+STAGES.length;
  document.getElementById("bar").style.width=pct+"%";
}

/* ─── 오늘 ─── */
function today_(){
  var d=DAYS[S.cur-1],st=STAGES[d.s-1],h="";
  h+='<div class="h1">'+d.d+'일차 · 스테이지 '+st.n+' '+st.t+'</div>';
  h+='<div class="h2">'+d.t+'</div>';
  h+='<div class="goal"><b>오늘의 목표</b><br>'+d.goal+'</div>';

  var nt=NEWT[d.d-1];
  if(nt.length){
    h+='<div class="card"><div class="ct">오늘의 용어</div>';
    for(var i=0;i<nt.length;i++)
      h+='<div class="tmi"><div class="tmw">'+nt[i]+engTag(nt[i])+'</div><div class="tmd">'+GMAP[nt[i]]+'</div></div>';
    h+='</div>';
  }

  h+='<div class="card"><div class="ct">개념</div>';
  for(var i=0;i<d.con.length;i++)h+='<p>'+d.con[i]+'</p>';
  h+='</div>';

  h+='<div class="card"><div class="ct">로직 조작 순서</div>';
  for(var i=0;i<d.path.length;i++){
    h+='<div class="step"><div class="sn">'+d.path[i].n+'</div><ol>';
    for(var j=0;j<d.path[i].s.length;j++)h+='<li>'+d.path[i].s[j]+'</li>';
    h+='</ol></div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="ct">실습</div><ul class="dot">';
  for(var i=0;i<d.drill.length;i++)h+='<li>'+d.drill[i]+'</li>';
  h+='</ul></div>';

  var nz=NUM.filter(function(x){return x.d.indexOf(d.d)>=0;});
  if(nz.length){
    h+='<div class="card"><div class="ct">기준 수치</div>';
    for(var i=0;i<nz.length;i++){
      h+='<div class="nitem"><span class="nv">'+nz[i].v+'</span><span class="nw">'+nz[i].w+'</span>';
      h+='<div class="nf">'+nz[i].f+'</div><div class="nm"><b>벗어나면</b> '+nz[i].m+'</div></div>';
    }
    h+='</div>';
  }

  h+='<div class="card"><div class="ct">오늘의 단축키</div><div class="krow">';
  for(var i=0;i<d.keys.length;i++)h+='<div class="kitem"><k>'+d.keys[i][0]+'</k>'+d.keys[i][1]+'</div>';
  h+='</div></div>';

  var c=S.chk[d.d]||[];
  h+='<div class="card"><div class="ct">체크</div>';
  for(var i=0;i<d.chk.length;i++)
    h+='<div class="chk'+(c[i]?' on':'')+'" data-c="'+i+'"><div class="box"></div><span>'+d.chk[i]+'</span></div>';
  h+='</div>';

  var qs=S.quiz[d.d]||{};
  h+='<div class="card"><div class="ct">확인 문제</div>';
  for(var i=0;i<d.quiz.length;i++){
    var q=d.quiz[i],picked=(qs[i]!==undefined)?qs[i]:-1;
    h+='<div class="q" data-q="'+i+'"><div class="qq">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.a.length;j++){
      var cls="opt";
      if(picked>=0){ if(j===q.c)cls+=" right"; else if(j===picked)cls+=" wrong"; }
      h+='<button class="'+cls+'" data-a="'+j+'">'+q.a[j]+'</button>';
    }
    h+='<div class="exp'+(picked>=0?' on':'')+'">'+q.e+'</div></div>';
  }
  h+='</div>';

  h+='<div class="nav">';
  h+='<button id="prev"'+(S.cur<=1?' disabled':'')+'>이전 일차</button>';
  h+='<button id="next" class="pri"'+(S.cur>=DAYS.length?' disabled':'')+'>다음 일차</button>';
  h+='</div>';

  var el=document.getElementById("p-today");
  el.innerHTML=h;
  var used={};
  el.querySelectorAll(".card").forEach(function(c){
    if(!c.querySelector(".tmi"))markTerms(c,used);
  });

  el.querySelectorAll(".chk").forEach(function(n){
    n.addEventListener("click",function(){
      var i=+n.dataset.c,a=S.chk[d.d]||[];
      a[i]=!a[i];S.chk[d.d]=a;stamp();save();
      n.classList.toggle("on",!!a[i]);header();course();prog();
    });
  });
  el.querySelectorAll(".q").forEach(function(n){
    n.addEventListener("click",function(e){
      var b=e.target.closest(".opt");if(!b)return;
      var qi=+n.dataset.q,ai=+b.dataset.a;
      if(!S.quiz[d.d])S.quiz[d.d]={};
      if(S.quiz[d.d][qi]!==undefined)return;
      S.quiz[d.d][qi]=ai;stamp();save();
      var q=d.quiz[qi];
      n.querySelectorAll(".opt").forEach(function(o,j){
        if(j===q.c)o.classList.add("right");else if(j===ai)o.classList.add("wrong");
      });
      n.querySelector(".exp").classList.add("on");
    });
  });
  document.getElementById("prev").addEventListener("click",function(){go(S.cur-1);});
  document.getElementById("next").addEventListener("click",function(){go(S.cur+1);});
}
function go(n){
  if(n<1||n>DAYS.length)return;
  S.cur=n;save();today_();header();course();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ─── 과정 ─── */
function course(){
  var h="";
  for(var s=0;s<STAGES.length;s++){
    var st=STAGES[s];
    h+='<div class="sg"><div class="sgh"><span class="sgn">'+String(st.n).padStart(2,"0")+'</span>';
    h+='<span class="sgt">'+st.t+'</span></div><div class="sgs">'+st.sub+'</div><div style="height:8px"></div>';
    for(var i=st.d[0];i<=st.d[1];i++){
      var d=DAYS[i-1],cls="di"+(dayDone(i)?" done":"")+(i===S.cur?" cur":"");
      h+='<div class="'+cls+'" data-d="'+i+'"><div class="dn">'+i+'</div><div class="dt">'+d.t+'</div></div>';
    }
    h+='</div>';
  }
  var el=document.getElementById("p-course");
  el.innerHTML=h;
  el.querySelectorAll(".di").forEach(function(n){
    n.addEventListener("click",function(){go(+n.dataset.d);tab("today");});
  });
}

/* ─── 단축키 ─── */
function keys(){
  var el=document.getElementById("p-keys");
  el.innerHTML='<input class="srch" id="ks" placeholder="단축키나 기능으로 검색" autocomplete="off"><div id="kl"></div>';
  function draw(q){
    q=(q||"").trim().toLowerCase();var h="";
    for(var i=0;i<KEYS.length;i++){
      var g=KEYS[i],rows=g.k.filter(function(r){
        return !q||r[0].toLowerCase().indexOf(q)>=0||r[1].toLowerCase().indexOf(q)>=0;});
      if(!rows.length)continue;
      h+='<div class="card"><div class="ct">'+g.g+'</div>';
      for(var j=0;j<rows.length;j++)h+='<div class="grow"><k>'+rows[j][0]+'</k><span>'+rows[j][1]+'</span></div>';
      h+='</div>';
    }
    document.getElementById("kl").innerHTML=h||'<div class="empty">일치하는 단축키가 없습니다.</div>';
  }
  draw("");
  document.getElementById("ks").addEventListener("input",function(e){draw(e.target.value);});
}

/* ─── 사전 ─── */
function gloss(){
  var el=document.getElementById("p-gloss");
  el.innerHTML='<input class="srch" id="gs" placeholder="용어 검색" autocomplete="off"><div id="gl"></div>';
  function draw(q){
    q=(q||"").trim().toLowerCase();
    var rows=GLOSS.filter(function(r){
      return !q||r[0].toLowerCase().indexOf(q)>=0||r[1].toLowerCase().indexOf(q)>=0||(r[2]&&r[2].toLowerCase().indexOf(q)>=0);});
    if(!rows.length){document.getElementById("gl").innerHTML='<div class="empty">일치하는 용어가 없습니다.</div>';return;}
    var h='<div class="card">';
    for(var i=0;i<rows.length;i++)
      h+='<div class="gitem"><div class="gl">'+rows[i][0]+(rows[i][2]?'<span class="eng">'+rows[i][2]+'</span>':'')+'</div><div class="gd">'+rows[i][1]+'</div></div>';
    h+='</div>';
    document.getElementById("gl").innerHTML=h;
  }
  draw("");
  document.getElementById("gs").addEventListener("input",function(e){draw(e.target.value);});
}

/* ─── 수치 감각 ─── */
var NG=["전체"].concat(NUM.map(function(n){return n.g;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
var ngCur="전체";
function num(){
  var el=document.getElementById("p-num");
  var t='<input class="srch" id="ns" placeholder="값이나 이름으로 검색 (예: 80Hz, 어택, 스윙)" autocomplete="off">';
  t+='<div class="tagr" id="ntag">';
  for(var i=0;i<NG.length;i++)t+='<button class="tag'+(NG[i]===ngCur?" on":"")+'" data-g="'+NG[i]+'">'+NG[i]+'</button>';
  t+='</div><div id="nl"></div>';
  el.innerHTML=t;
  function draw(){
    var q=(document.getElementById("ns").value||"").trim().toLowerCase();
    var rows=NUM.filter(function(n){
      if(ngCur!=="전체"&&n.g!==ngCur)return false;
      if(!q)return true;
      return (n.v+" "+n.w+" "+n.f+" "+n.m).toLowerCase().indexOf(q)>=0;
    });
    if(!rows.length){document.getElementById("nl").innerHTML='<div class="empty">일치하는 수치가 없습니다.</div>';return;}
    var h='<div class="card">';
    for(var i=0;i<rows.length;i++){
      h+='<div class="nitem"><span class="nv">'+rows[i].v+'</span><span class="nw">'+rows[i].w+'</span>';
      h+='<div class="nf">'+rows[i].f+'</div><div class="nm"><b>벗어나면</b> '+rows[i].m+'</div></div>';
    }
    h+='</div>';
    document.getElementById("nl").innerHTML=h;
  }
  draw();
  document.getElementById("ns").addEventListener("input",draw);
  document.getElementById("ntag").addEventListener("click",function(e){
    var b=e.target.closest(".tag");if(!b)return;
    ngCur=b.dataset.g;
    el.querySelectorAll(".tag").forEach(function(x){x.classList.toggle("on",x.dataset.g===ngCur);});
    draw();
  });
}

/* ─── 진도: 채널 스트립 랙 ─── */
function prog(){
  var h='<div class="stat">';
  h+='<div><div class="n">'+totalDone()+'</div><div class="l">완료 일차</div></div>';
  h+='<div><div class="n">'+(DAYS.length-totalDone())+'</div><div class="l">남은 일차</div></div>';
  h+='<div><div class="n">'+streak()+'</div><div class="l">연속 학습일</div></div>';
  h+='</div>';

  h+='<div class="rack">';
  for(var s=0;s<STAGES.length;s++){
    var st=STAGES[s],tot=st.d[1]-st.d[0]+1,dn=0;
    for(var i=st.d[0];i<=st.d[1];i++)if(dayDone(i))dn++;
    var p=Math.round(dn/tot*100),full=(p===100);
    h+='<div class="strip'+(full?" full":"")+'">';
    h+='<div class="pct">'+p+'</div>';
    h+='<div class="slot"><div class="fill" style="height:'+p+'%"></div>';
    h+='<div class="cap" style="bottom:calc('+p+'% - '+(p*0.13)+'px)"></div></div>';
    h+='<div class="sno">'+st.n+'</div>';
    h+='<div class="sl">'+st.t+'</div>';
    h+='</div>';
  }
  h+='</div>';

  var qt=0,qc=0;
  for(var i=1;i<=DAYS.length;i++){
    var qs=S.quiz[i]||{},d=DAYS[i-1];
    for(var j in qs){qt++;if(+qs[j]===d.quiz[j].c)qc++;}
  }
  h+='<div class="card"><div class="ct">확인 문제</div>';
  h+='<p>푼 문제 <v>'+qt+'</v> / 전체 <v>'+DAYS.reduce(function(a,d){return a+d.quiz.length;},0)+'</v></p>';
  h+='<p>정답 <v>'+qc+'</v>'+(qt?' · 정답률 <v>'+Math.round(qc/qt*100)+'%</v>':'')+'</p></div>';

  h+='<div class="mini">진도는 이 기기에만 저장됩니다.<br><button class="rst" id="rst">진도 초기화</button></div>';

  var el=document.getElementById("p-prog");
  el.innerHTML=h;
  document.getElementById("rst").addEventListener("click",function(){
    if(!confirm("모든 진도와 문제 기록을 지웁니다. 계속할까요?"))return;
    S={cur:1,chk:{},quiz:{},dates:{}};save();today_();course();prog();header();
  });
}

/* ─── 탭 ─── */
function tab(name){
  document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("on",p.id==="p-"+name);});
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.p===name);});
  if(name==="prog")prog();
  window.scrollTo({top:0,behavior:"instant"});
}
document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;tab(b.dataset.p);
});

/* ─── 시작 ─── */
if(!S.chk[S.cur]&&totalDone()>0)S.cur=firstOpen();
applyFs();today_();course();keys();gloss();num();prog();header();
</script>
</body>
</html>
